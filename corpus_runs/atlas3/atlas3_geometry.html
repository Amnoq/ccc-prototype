"}, {"id": "lemma-5-4-z-f-2-z-f-in-s-1-and-z-f-j-z-f-infty-w", "display": "Lemma 5.4: Z(f) = 2 Z^-(f) in S^1, and Z^-(f_j) -> Z^-(f_infty) when the f_j converge in C^n with preserved total order n", "status": "exact", "cluster": "geometry", "chunk": "chuliwang_p2", "kind": "result", "genre": "original", "note": "Lemma 5.4 stated and proved in the chunk: Z = 2 Z^- from 2 mu(I) = alpha^- + alpha^+, and continuity of Z^- via Lemma 5.3; the proof continues past line 1400 but the argument through 1400 is self-contained."}, {"id": "the-ricci-flow-equation-d-dt-g-ij-t-2r-ij-and-it", "display": "the Ricci flow equation d/dt g_ij(t) = −2R_ij and its short-time existence and maximum-principle properties", "status": "heuristic", "cluster": "geometry", "chunk": "perelman_p1", "kind": "claim", "genre": "reframed", "note": "Introduction restates Hamilton's [H 1] results: the Ricci flow equation has a unique short-time solution for any smooth metric on a closed manifold; scalar curvature satisfies R_t = ΔR + 2|Ric|², so its minimum is nondecreasing by the maximum principle."}, {"id": "breather-g-ij-t-1-and-g-ij-t-2-differ-only-by-a-", "display": "breather: α g_ij(t_1) and g_ij(t_2) differ only by a diffeomorphism for some t_1 < t_2, α > 0 (steady α=1, shrinking α<1, expanding α>1)", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "definition", "genre": "original", "note": "Definition in 2.1: a metric g_ij(t) is a breather if α g_ij(t_1) and g_ij(t_2) differ only by a diffeomorphism for some t_1 < t_2 and α > 0; α=1/α<1/α>1 give steady/shrinking/expanding breathers."}, {"id": "ricci-soliton-trivial-breather-gradient-ricci-so", "display": "Ricci soliton (trivial breather); gradient Ricci soliton R_ij + c g_ij + ∇_i∇_j a-type equation; the Gaussian soliton", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "definition", "genre": "original", "note": "Definition in 2.1: trivial breathers (diffeomorphism and scaling for every pair of times) are Ricci solitons; a soliton satisfies R_ij + c g_ij + ∇_i b_j + ∇_j b_i = 0, a gradient soliton when b_i = ½∇_i a; the Gaussian soliton (euclidean metric on R^n, c=1, a=−|x|²/2) is named as the example."}, {"id": "the-f-functional-f-m-r-f-2-e-f-dv-ricci-flow-as-", "display": "the F-functional F = ∫_M (R + |∇f|²)e^{−f}dV; Ricci flow as its gradient flow modified by a diffeomorphism", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "method", "genre": "original", "note": "1.1: F = ∫_M (R + |∇f|²)e^{−f}dV; the L²-gradient of F^m at fixed measure dm is −(R_ij + ∇_i∇_j f); the gradient flow is Ricci flow modified by a diffeomorphism (the DeTurck choice of gauge)."}, {"id": "proposition-1-2-monotonicity-f-m-t-2-r-ij-i-j-f-", "display": "Proposition 1.2: monotonicity F^m_t = 2∫|R_ij + ∇_i∇_j f|² dm and the bound F^m ≤ n/(2T) ∫dm", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "result", "genre": "original", "note": "Proposition 1.2 with equation (1.2): F^m_t = 2∫|R_ij + ∇_i∇_j f|² dm ≥ 0, proved via the chain of inequalities yielding F_t ≥ (2/n)F² and hence F^m ≤ n/(2T) ∫dm at t=0."}, {"id": "no-nontrivial-steady-or-expanding-breathers-on-c", "display": "no nontrivial steady or expanding breathers on closed M (No breathers theorem I)", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "claim", "genre": "original", "note": "2.2: λ(g_ij) = inf F over f with ∫e^{−f}dV = 1 (the lowest eigenvalue of −4Δ + R) is nondecreasing along the flow, so a steady breather is a steady soliton; 2.3 proves the scale-invariant λ̄ = λV^{2/n} is nondecreasing when nonpositive, ruling out nontrivial expanding breathers."}, {"id": "the-w-functional-w-g-ij-f-m-f-2-r-f-n-4-n-2-e-f-", "display": "the W-functional W(g_ij,f,τ) = ∫_M [τ(|∇f|² + R) + f − n] (4πτ)^{−n/2} e^{−f} dV", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "definition", "genre": "original", "note": "3.1, equation (3.1): W(g_ij,f,τ) = ∫_M [τ(|∇f|² + R) + f − n] (4πτ)^{−n/2} e^{−f} dV restricted to f satisfying (3.2); invariant under simultaneous scaling of τ and g_ij; evolves with τ_t = −1."}, {"id": "the-monotonicity-formula-3-4-for-w-no-shrinking-", "display": "the monotonicity formula (3.4) for W; no shrinking breathers other than gradient solitons (No breathers theorem II)", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "result", "genre": "original", "note": "3.1, formula (3.4): dW/dt = ∫ 2τ|R_ij + ∇_i∇_j f − (1/2τ)g_ij|² (4πτ)^{−n/2} e^{−f} dV, so ν(g_ij) = inf_τ μ is nondecreasing; combined with the Claim that μ(g,τ) is negative for small τ and → 0 as τ → 0 — argued via the conjugate heat equation from a δ-function and the Gaussian logarithmic Sobolev inequality of L. Gross (cited, proof details left to the reader) — this rules out shrinking breathers other than gradient solitons."}, {"id": "no-local-collapsing-theorem-i-on-closed-m-with-t", "display": "No local collapsing theorem I: on closed M with T < ∞, the solution is not locally collapsing at T", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "result", "genre": "original", "note": "Theorem in 4.1: if M is closed and T < ∞, the solution g_ij(t) is not locally collapsing at T; proved by showing local collapsing would force μ(g_ij(t_k), r_k²) → −∞ via test functions f_k, contradicting boundedness of t_k + r_k² through monotonicity formula (3.4)."}, {"id": "noncollapsed-on-the-scale-blow-up-limit-is-a-com", "display": "κ-noncollapsed on the scale ρ; blow-up limit is a complete ancient solution κ-noncollapsed on all scales (Corollary)", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "definition", "genre": "original", "note": "Definition in 4.2: g_ij is κ-noncollapsed on scale ρ if every ball B of radius r < ρ with |Rm| ≤ r^{−2} has volume ≥ κr^n; scaling/limit properties stated exactly; the corollary gives a complete ancient solution, κ-noncollapse ding Ricci solitons on closed M", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "result", "genre": "original", "note": "2.4: the argument also shows there are no nontrivial (non-constant Ricci curvature) steady or expanding Ricci solitons on closed M; the equality case forces f constant by the maximum principle."}, {"id": "the-conjugate-heat-operator-t-r-and-u-0-for-u-4-", "display": "the conjugate heat operator □* = −∂_t − Δ + R and □*u = 0 for u = (4πτ)^{−n/2}e^{−f}", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "definition", "genre": "original", "note": "3.1: u = (4πτ)^{−n/2}e^{−f} satisfies □*u = 0 with the conjugate heat operator □* = −∂_t − Δ + R; the f-evolution equation is written in this form."}, {"id": "hamilton-s-conjectures-on-3-dimensional-blow-up-", "display": "Hamilton's conjectures on 3-dimensional blow-up limits are confirmed; noncollapsing removes the stumbling block in Hamilton's geometrization approach", "status": "exact", "cluster": "geometry", "chunk": "perelman_p1", "kind": "claim", "genre": "reframed", "note": "Introduction: Hamilton's conjectures on the structure of the 3-dimensional blow-up limits (via the differential Harnack inequality and Ivey-Hamilton almost-nonnegative curvature) are confirmed by this work; the no-local-collapsing result 'removes the major stumbling block in Hamilton's approach to geometrization.'"}, {"id": "ricci-flow-as-gradient-like-rg-wilsonian-flow-wi", "display": "Ricci flow as gradient-like RG/Wilsonian flow with t as scale parameter", "status": "heuristic", "cluster": "geometry", "chunk": "perelman_p1", "kind": "conjecture", "genre": "reframed", "note": "Introduction §6 and remark 5.2: the Ricci flow is speculatively identified with the Wilsonian renormalization-group flow (t as scale parameter; regions far apart at large scale may become close at small scale), and the statistical analogy is said to be heuristically related to RG flow via averaging over h     nb.slice(0,24).forEach(e=>{ const o = e.a===n.id? e.b : e.a;
      const on = nodeById[o];
      h += `<div style="font-size:12px;margin:3px 0"><a href="#" data-n="${esc(o)}" style="color:#58a6ff">${esc(on?on.label:o)}</a> <span class="hint">— ${e.a===n.id? esc(e.rel)+' →' : '← '+esc(e.rel)} (×${e.w})</span></div>`; });
  }
  h += `<p class="hint" style="margin-top:10px">${n.facets.length} facet(s) · chunks: ${esc(n.chunks.join(', '))}</p>`;
  n.facets.forEach(f=>{
    h += `<div class="facet"><div class="lbl">${esc(f.label)}</div>`
      + `<div class="meta">${pill(f.status||'open')}<span class="hint">${esc(f.kind)}${f.genre?' · '+esc(f.genre):''} · ${esc(f.chunk)}${f.cid?' / '+esc(f.cid):''}</span></div>`
      + (f.note? `<div class="note">${esc(f.note)}</div>` : '') + `</div>`;
  });
  d.innerHTML = h;
  d.querySelectorAll('a[data-n]').forEach(a=>a.addEventListener('click', ev=>{
    ev.preventDefault(); const t=nodeById[a.getAttribute('data-n')]; if(t) select(t); }));
}
document.getElementById('legend').innerHTML =
  Object.keys(COLORS).map(k=>`<span class="li"><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}</span>`).join('')
  + `<span class="li hint">node size ∝ facet count</span>`;
(function(){
  const st = GRAPH.stats;
  const el = document.querySelector('#topbar .sub');
  el.textContent += ` · ${st.subjects} subjects · ${st.cross_edges} relations · ${GRAPH.loops.length} open loops · ${st.concepts} concepts`;
})();
document.getElementById('looplo').innerHTML = GRAPH.loops.map(l=>
  `<div class="loop"${l.node?` data-node="${esc(l.node)}" title="trace this constellation" style="cursor:pointer"`:''}><b>${esc(l.chunk)}</b> — ${esc(l.label)}</div>`).join('');
document.getElementById('looplo').addEventListener('click', e=>{
  const t = e.target.closest('[data-node]');
  if (t){ const n = nodeById[t.getAttribute('data-node')]; if (n) select(n); }
});
setInterval(tick, 30);
draw();
</script>
</body>
</html>
