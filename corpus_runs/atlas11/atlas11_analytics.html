integrals of automorphic forms that avoids truncation."}, {"id": "no-trace-formulas-used", "display": "no trace formulas used", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p1", "kind": "claim", "genre": "original", "note": "Methods outlined in ICM announcement [50]; no trace formulas of any kind are used."}, {"id": "conductor-dropping-causes-major-difficulties", "display": "conductor dropping causes major difficulties", "status": "heuristic", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p1", "kind": "claim", "genre": "original", "note": "Conductor dropping (e.g. t~lambda where the conductor drops) 'often leads to major difficulties, both in our methods and other treatments.' Stated qualitatively."}, {"id": "the-amplification-method", "display": "the amplification method", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p1", "kind": "method", "genre": "original", "note": "Amplification method is used; cited as one reason the exponent delta is respectable but not optimal."}, {"id": "remaining-open-questions-related-to-the-subconve", "display": "remaining open questions related to the subconvexity problem", "status": "heuristic", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p1", "kind": "question", "genre": "original", "note": "Chunk ends mid-sentence: 'There remain many interesting questions related to the subconvexity...'. Open problems stated but cut off by chunk boundary."}, {"id": "global-notations-section-4-1-1-4-1-5", "display": "global notations (section 4.1.1-4.1.5)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "definition", "genre": "original", "note": "Global setup: X_G = G(F)\\G(A); H = A(A), H(1) norm-one ideles, Y the H-orbit; Tamagawa relation dg = (disc F)^{-1} xi_F(2) d^tau g (4.1), vol(X) = 2 xi_F(2)(disc F)^{1/2}; Fourier expansion (4.2)-(4.3); canonical inner product on standard pi; regularized Euler products Lambda^*, prod^*."}, {"id": "eisenstein-series-eis-f-and-deformation-pi-s", "display": "Eisenstein series Eis(f) and deformation pi(s)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "definition", "genre": "original", "note": "Eis(f) = sum_{B(F)\\GL2(F)} f(gamma g) by analytic continuation; deformation pi(s) = I(chi_+|.|^s, chi_-|.|^{-s}) (4.4) with f_s|_K = f|_K."}, {"id": "fourier-coefficients-of-eisenstein-series", "display": "Fourier coefficients of Eisenstein series", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "claim", "genre": "original", "note": "Constant term Eis(f)_N(g) = f(g) + int f(w n(x) g) dx (4.5); pole at chi_+/chi_- = |.|_A with residue (4.6) involving xi_F^*(1); Whittaker functions factor as products of local W_{f,v}; canonical vs Eisenstein norms related by Lambda(pi,Ad,1) (simple-pole case)."}, {"id": "intertwining-operator-m-and-normalized-m-bar-v", "display": "intertwining operator M and normalized M-bar_v", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "definition", "genre": "original", "note": "Standard intertwiner M: f -> int_A f(w n(x) g) dx; isometry on the unitary axis. Normalized local version M-bar_v holomorphic in chi_v^pm, with global scattering factor Lambda(chi_+/chi_-,0)/Lambda(chi_+/chi_-,1) of absolute value 1."}, {"id": "local-bound-4-9-for-m-bar-v", "display": "local bound (4.9) for M-bar_v", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "result", "genre": "original", "note": "Local lemma (4.9): sup_{k in K} |M-bar_v(f_{v,s})(k)| and its L^2 norm bounded by S^{I_v}_{d delta_0}(f_v). Proved via (3.11), Prop 3.2.3, Laplacian lower bound by conductors, and interpolation as in Prop 3.2.4."}, {"id": "lemma-4-1-9-global-bound-4-10-for-m", "display": "Lemma 4.1.9 (global bound (4.10) for M)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "result", "genre": "original", "note": "Lemma 4.1.9 (global, (4.10)): sup_K |M f_s| << S^I_d(f) and L^2 bound. Proved by applying (S1d) to the local lemma, then interpolating from Re(s)=0 where ||M f_s|| = ||f||."}, {"id": "singular-eisenstein-series-eis", "display": "singular Eisenstein series Eis^*", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "definition", "genre": "original", "note": "Singular parameter chi_+=chi_-=1: Eis vanishes to first order; Eis^* defined via xi_F(1+2s)Eis(f_s)|_{s=0}. Constant term (4.11) with log|y| terms; bound (4.12) |phi_N(a(y)g)| << |y|^{1/2} log|y| S^pi(phi); growth (4.13) Eis^*(f_0)(x) << ht(x) log ht(x)."}, {"id": "hecke-jacquet-langlands-integral-l-chi-phi", "display": "Hecke-Jacquet-Langlands integral l_chi(phi)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "definition", "genre": "original", "note": "Hecke-Jacquet-Langlands integral l_chi(phi) = int_{A^x/F^x} (phi - phi_N)(a(y)) chi(y) d^xy (4.14); absolutely convergent if pi cuspidal, otherwise by analytic continuation in chi."}, {"id": "factorization-4-15-and-canonically-normalized-fo", "display": "factorization (4.15) and canonically normalized form (4.16)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "claim", "genre": "original", "note": "Factorization (4.15): l_chi(phi) = Lambda(pi otimes chi,1/2) prod_v^* l_{chi_v}(W_{phi,v})/L(pi_v otimes chi_v,1/2) by 'unfolding'; valid also for Eisenstein including singular. Canonically normalized form (4.16): |l_chi(phi)|^2 = 2 xi_F(2)(disc F)^{1/2} prod_v^* h_{chi_v}(phi_v)/<phi_v,phi_v> / xi_F^*(1); local factors ~ |L_v(pi otimes chi,1/2)|^2 zeta_v(1)^2/(L_v(pi,Ad,1) zeta_v(2))."}, {"id": "lemma-4-2-2-hecke-integral-of-translate-bound", "display": "Lemma 4.2.2 (Hecke integral of translate bound)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "result", "genre": "original", "note": "Lemma 4.2.2: |l_chi(g.phi)| <<_{pi,chi} disc(Yg)^{-(1-2theta)/32} S_d(phi) for unitary chi. Proved via (4.16), (2.8), and [21, Lemma 9.14] (not reproduced). Remark: exponent not optimal (see [15]); what matters is negativity."}, {"id": "discriminant-disc-yg-of-adelic-torus-orbit", "display": "discriminant disc(Yg) of adelic torus orbit", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p10", "kind": "definition", "genre": "reframed", "note": "Discriminant disc(Yg) of the adelic torus orbit, local and global, from [21, 4.1-4.2] (defined for anisotropic tori there; applies to split H). For g_0 = n(T): disc_v(Yg) ~ max(1,|T|_v^2), disc(Yg) >> |T|_A^2 (4.17). Imported, not proved here."}, {"id": "lemma-4-2-3-improved-chi-dependence", "display": "Lemma 4.2.3 (improved chi-dependence)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p11", "kind": "result", "genre": "original", "note": "Lemma 4.2.3: |l(g.phi)| <<_{pi,N} Cond(chi)^{-N} disc(Yg)^{-(1-2theta)/32} S^pi_d(phi) for any N. Proved by reducing to phi in pi[m] via (2.7) and integration by parts. Mild refinement of Lemma 4.2.2 improving chi-dependence at the cost of pi-dependence."}, {"id": "regularized-integral-toy-model-lemma-4-3-2", "display": "regularized integral (toy model, Lemma 4.3.2)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p11", "kind": "definition", "genre": "original", "note": "Lemma 4.3.2 (toy model on R_{>0}): unique multiplicative-translation-invariant functional extending integration on V_0, via (1) finite linear combinations killing the finite part, (2) truncation limit, or (3) Mellin F_+(0)+F_-(0). Regularized integral of admissible finite functions is zero. 'Well-known.'"}, {"id": "controlled-increase-and-exponents-s-phi", "display": "controlled increase and exponents S_Phi", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p11", "kind": "definition", "genre": "original", "note": "Phi of controlled increase: Phi - f rapidly decaying as |y_1|->infty (4.18) for f spanning a finite-dimensional GL2(A)-translate space. Phi^*_N uniquely determined; exponents S_Phi = generalized A^x/F^x-eigenvalues. Unitary axis = exponents of real part 1/2."}, {"id": "examples-of-exponents-4-3-4", "display": "examples of exponents (4.3.4)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p11", "kind": "claim", "genre": "original", "note": "Examples (4.3.4): Eis(I(chi_+,chi_-)) has exponents {chi_+|.|^{1/2}, chi_-|.|^{1/2}} (generalized if chi_+=chi_-); E_{s1}E_{s2}E_{s3} has exponents |.|^{3/2 +- s1 +- s2 +- s3}. Phi -> Phi^*_N multiplicative with exponents in S_1+S_2."}, {"id": "regularized-integral-and-inner-product-lemma", "display": "regularized integral and inner product lemma", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p11", "kind": "result", "genre": "original", "note": "Lemma: unique PGL2(A)-invariant functional on V (controlled increase, no exponent squaring to |.|^2) extending L^1 integration; Zagier's construction E = Eis(Phi^*_N) from exponents of real part > 1/2, int^{reg} Phi = int (Phi - E). Regularized inner product <Phi_1,Phi_2>_{reg} when 1 not in S_1+S_2."}, {"id": "regularization-via-convolution", "display": "regularization via convolution", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p11", "kind": "method", "genre": "original", "note": "Alternate definition via convolution: choose compactly supported mu_v with Phi*mu_v in L^1; Phi -> int(Phi*mu_v)/int mu_v is independent of v, mu_v and PGL2(A)-invariant. 'More suited for our purposes'; truncation alternatives obscure the invariance."}, {"id": "explicit-regularizing-measure-4-3-7", "display": "explicit regularizing measure (4.3.7)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p11", "kind": "method", "genre": "original", "note": "Explicit measure (4.3.7): for unramified Phi at v with exponents of real part 1, convolve (1 - T_v/lambda_v(chi)) over chi in S_Phi; kills the growth ('kill the growth whilst only wounding phi': eigenvalue > 1 - 2q_v^theta/(q_v+1)|lambda_v(chi)|), total mass <= 4|S_Phi| counting multiplicity."}, {"id": "regularized-plancherel-proposition-4-20", "display": "regularized Plancherel proposition (4.20)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p11", "kind": "result", "genre": "original", "note": "Proposition (regularized Plancherel, (4.20)): <Phi_1,Phi_2>_{reg} = int <Pi_pi Phi_1, Pi_pi Phi_2> dmu_P(pi) + degenerate contribution <Phi_1,E_2>_{reg}+<E_1,Phi_2>_{reg}, under exponent hypotheses (disjoint S_i, real parts > 1/2, no square |.|^2). Proved by subtracting the Eisenstein parts."}, {"id": "triple-product-formula-4-21", "display": "triple product formula (4.21)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p11", "kind": "result", "genre": "original", "note": "Triple product formula (4.21): int |phi_1 phi_2 phi_3|^2 / prod ||phi_i||_{can}^2 = (8 (disc F)^{1/2})^{-1} prod_v^* zeta_v(1)|L_v|^2/(zeta_v(2)^3 ||phi_{i,v}||^2) with L_v = L_v(1/2, pi_1 otimes pi_2 otimes pi_3)/prod L(1,Ad,pi_i); regularized if all Eisenstein. Compared with [32] (their zeta-factors absent). Singular case by continuity via L^*(1,Ad,pi_3(t)). Deduced: projection formula (4.22)."}, {"id": "upper-bounds-4-23-4-24-from-the-triple-product-f", "display": "upper bounds (4.23), (4.24) from the triple product formula", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p11", "kind": "claim", "genre": "original", "note": "The paper uses (4.21) 'only for upper bounds': (4.23) bounds ||Delta_A^{-d} Pi_{pi_1}(phi_2 phi_3)|| via local B_v estimates and uniqueness of trilinear functionals; (4.24) spectrally averaged Sobolev bound int S_d(Pi_pi(phi_2 phi_3)) dmu_P << S_{d_0}(phi_2)S_{d_0}(phi_3)."}, {"id": "sobolev-bound-4-25-for-pi-pi-phi-2-phi-3", "display": "Sobolev bound (4.25) for Pi_pi(phi_2 phi_3)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "claim", "genre": "original", "note": "Bound (4.25): S_d(Pi_pi(phi_2 phi_3)) << S_{d_0}(phi_2) S_{d_0}(phi_3), completed via (S1d) absorbing C(pi_1)^A C(pi_2)^A through (2.18) (Gan's lemma, cited not proved; flagged as unneeded for applications)."}, {"id": "rankin-selberg-integral-l-phi-1-phi-2-phi-3", "display": "Rankin-Selberg integral L(phi_1,phi_2,phi_3)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "definition", "genre": "original", "note": "Rankin-Selberg integral L(phi_1,phi_2,phi_3) = int_X phi_1 phi_2 phi_3(g) dg, absolutely convergent when pi_1 cuspidal; a linear functional on pi_1 otimes pi_2 otimes pi_3."}, {"id": "unfolding-factorization-4-26-and-unramified-valu", "display": "unfolding factorization (4.26) and unramified values (4.27)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "claim", "genre": "original", "note": "Unfolding factorization (4.26): int_X = prod_v^* L_{RS,v}(W_{1,v},W_{2,v},f_{3,v})/zeta_v(1)^{1/2}; unramified values (4.27) via L(pi1 otimes pi2 otimes chi_3^pm,1/2)/L(chi_3^+/chi_3^-,1). Standard Rankin-Selberg theory recalled."}, {"id": "proof-of-2-5-in-the-cuspidal-case", "display": "proof of (2.5) in the cuspidal case", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "result", "genre": "original", "note": "Taking residue at chi_3^+/chi_3^- = |.| with phi_2 = phi_1 and using (4.6) proves the canonical-norm identity (2.5) in the cuspidal case: <phi_1,phi_1>_X = 2(disc F)^{1/2} prod_v^* <W_{1,v},W_{1,v}>/xi_F^*(1)."}, {"id": "l-rs-norm-identity-4-28", "display": "L_RS norm identity (4.28)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "claim", "genre": "original", "note": "Identity (4.28): int_X |phi_1 phi_2 phi_3|^2/(||phi_1||_{can}^2 ...) = (disc F)^{-1} prod_v^* .../(4 zeta_v(2)^2 prod <W_{i,v},W_{i,v}>), from (4.26) plus the canonical norm; proves (4.21) when some pi_i is cuspidal (using L_RS = L_W from section 3.4.1)."}, {"id": "lemma-l-a-l-c-regularized-triple-product", "display": "Lemma: L_a = L_c (regularized triple product)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "result", "genre": "original", "note": "Lemma (all-Eisenstein regularized triple product): L_a (regularized integral (4.29)) = L_c (s=0 of meromorphically continued (4.30)/(4.31)); common value satisfies (4.32). Proved by analytic continuation in deformation parameters, subtracting Eisenstein parts E(s_1,s_2). Establishes (4.21) in the remaining case."}, {"id": "identity-4-36-for-f-q-at-full-level", "display": "identity (4.36) for F=Q at full level", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "result", "genre": "original", "note": "Identity (4.36) for F=Q full level: eta_psi(t_1,t_2)/||E^*_{t_1} E^*_{t_2}||^2 expanded over Maass forms and Eisenstein series. Derived from (4.21); constant terms match after contour shifting."}, {"id": "associativity-formula-kuznetsov-generalization", "display": "associativity formula (Kuznetsov generalization)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "result", "genre": "original", "note": "Associativity formula: Sigma(t_1..t_4) built from (4.36) is invariant under all coordinate permutations — a spectral identity generalizing Kuznetsov's. Derived from the multiplication-table associativity."}, {"id": "motohashi-formula-derivation", "display": "Motohashi formula derivation", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "claim", "genre": "original", "note": "Motohashi formula: split-torus period of (4.36) (regularized as in section 4.3.1) relates products of four xi-values to sums of Lambda(1/2+t_1+t_2,phi)Lambda(1/2+t_1-t_2,phi)Lambda(1/2+lambda,phi). Possibility noted in [50]; commuting regularized and Eisenstein integrals costs an explicit eta-ratio factor."}, {"id": "test-function-versions-of-spectral-identities", "display": "test-function versions of spectral identities", "status": "heuristic", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "question", "genre": "original", "note": "'It is a very interesting question to investigate more deeply the test function version of such formulas in a general setting' (ramified E^*_{t}, number fields, archimedean and p-adic integral transforms); would 'probably lead to, among other things, a good exponent in the subconvexity theorem.' Paper took a 'short cut'. Stated as open."}, {"id": "theorem-5-1-statement", "display": "Theorem 5.1 (statement)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p12", "kind": "result", "genre": "original", "note": "Theorem 5.1 (statement): absolute delta, A > 0 with L(pi x chi, 1/2) <<_{F,pi} C(chi)^{1/2-delta} for pi on GL2(A_F) and unitary Hecke character chi. Special case of Theorem 1.1 and needed in its proof; proof begins here."}, {"id": "prior-results-on-character-twists", "display": "prior results on character twists", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p13", "kind": "claim", "genre": "reframed", "note": "Prior character-twist results: Good [27] (t-aspect), Duke-Friedlander-Iwaniec [17] (conductor aspect) over Q; [67] (conductor) and Diaconu-Garrett [16] (t-aspect) over general fields. 'Closely linked' methods, all related to versions of the section 4.5.3 identity. Cited, not proved here."}, {"id": "signed-measure-mu-chi-and-its-translates", "display": "signed measure mu_chi and its translates", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p13", "kind": "definition", "genre": "original", "note": "Signed measure mu_chi(phi) = int_{F^x\\A^{(1)}} phi(a(y)) chi(y) d^xy (5.1) on the closed H(1)-orbit; translates mu^g_chi(phi) = mu_chi(g.phi). For F=Q, T=p: projects to residue/nonresidue lattice orbits with signs encoding quadratic residuosity."}, {"id": "three-step-proof-sketch-5-1-2", "display": "three-step proof sketch (5.1.2)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p13", "kind": "method", "genre": "original", "note": "Three-step sketch (F != Q, pi cuspidal): Step 1, Claim 1 reduces Theorem 5.1 to equidistribution of mu^g_chi; Step 2, Claim 2 is chi=1 equidistribution from section 4.2.2; Step 3, Claim 3 passes to general chi via the ergodic principle (section 1.3). Maps to (C)=>(B)=>(C) of section 1.2."}, {"id": "lemma-5-1-4-variant-of-claim-1", "display": "Lemma 5.1.4 (variant of Claim 1)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p13", "kind": "result", "genre": "original", "note": "Lemma 5.1.4: Q^{-1/2-eps}|L(pi otimes chi,1/2)| << ||mu_{chi,h}^{n(T)}(phi)|| + Q^{-kappa/2} (5.2), with T from Lemmas 3.3.2/3.3.3, h supported in [Q^{-1-kappa}, Q^{-1+kappa}], S^pi_d(phi) << 1. Proved via Mellin inversion and the bound (5.4) for F(s) at Re(s)=-1/2-eps (convexity + Ramanujan bounds)."}, {"id": "proposition-5-1-5-variant-of-claim-2", "display": "Proposition 5.1.5 (variant of Claim 2)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p13", "kind": "result", "genre": "original", "note": "Proposition 5.1.5: |mu^g(f)| << S^X_d(f)(||t||_A^{1/2-delta} + ||T||_A) (5.5) for g = a(t)n(T). Proved by splitting mu^g(f) = tilde mu^g(f_N) + tilde mu^g(f - f_N): constant term via (2.12), remainder by Mellin inversion with Lemma 4.2.3 and (4.17)."}, {"id": "amplifier-sigma-construction", "display": "amplifier sigma construction", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p13", "kind": "method", "genre": "original", "note": "Amplifier sigma: average of Dirac masses at a(varpi_{v1}^{-1})a(varpi_{v2}) over prime pairs with q_v, q_{v0} in [K,2K] (K a small power of Q); ||sigma||_d << K^{2d}, ||sigma*sigma^vee||_{-beta} << (log K)(K^{-2}+K^{-1-2theta}+K^{-4theta}). Gives (5.7)-(5.8); F != Q used for many same-norm prime pairs (Q needs 'near' H(1) support)."}, {"id": "eisenstein-case-via-arthur-truncation", "display": "Eisenstein case via Arthur truncation", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p13", "kind": "method", "genre": "original", "note": "Eisenstein case (5.1.7): split phi = phi_1 + phi_2 via Arthur truncation /\\_X at height X (power of Q); phi_1 rapidly decaying in cusp, phi_2 supported high in cusp. Terms A,B,C,D bounded via (4.12), (4.13), Prop 5.1.5, (5.5); concludes with (5.9) and parameter choice."}, {"id": "theorem-5-1-proved", "display": "Theorem 5.1 proved", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p13", "kind": "result", "genre": "original", "note": "Theorem 5.1 proved: L(pi x chi, 1/2) <<_{F,pi} C(chi)^{1/2-delta} for GL2 automorphic pi and unitary Hecke chi, via the cuspidal (5.1.6) and Eisenstein (5.1.7) cases. The proof 'generalizes [67]' and can be redone closer to Theorem 1.2's proof by replacing ergodic theory with explicit spectral expansions."}, {"id": "section-5-2-opening-parameter-z", "display": "section 5.2 opening parameter z", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p13", "kind": "definition", "genre": "original", "note": "Section 5.2 opens: proof of Theorem 1.2 for pi_1, pi_2 on GL2(A); fix z in iR of modulus a non-negative power of C(pi_1) (to be determined); result proved on slight deformations first."}, {"id": "reduction-to-constrained-case-5-2-1", "display": "reduction to constrained case (5.2.1)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p14", "kind": "claim", "genre": "original", "note": "Reduction (5.2.1): suffices to prove L(pi1 otimes pi2 otimes pi3,1/2) << C(pi1 otimes pi2)^{1/2-delta} ||z||^{-8} under constraints (pi_2 = 1|.|^z or cuspidal, chi_3 not |.|^{2it} for |t|<|z|/3). Theorem 1.2 follows by taking |z| = C(pi_1)^{-delta/9} and convexity to move off the deformation. Exponent 8 not optimal."}, {"id": "test-vector-choice-5-2-2", "display": "test vector choice (5.2.2)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p14", "kind": "method", "genre": "original", "note": "Test vectors phi_1, phi_2, E as tensor products of the Proposition 3.6.1 local vectors; canonical norms 1; S_d(phi_2) << 1. From (4.21): L(pi1 otimes pi2,1/2) << C(pi_1)^{1/2+eps} |z|^{-4} |<phi_1, phi_2 E>| (5.10)."}, {"id": "amplification-measure-sigma-5-2-3", "display": "amplification measure sigma (5.2.3)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p14", "kind": "method", "genre": "original", "note": "Amplification measure sigma on GL2(A_f): supp in ||u||<=K (K a small power of Q), commutes with ramified/archimedean places, (phi_2 E)*sigma^vee rapidly decaying, mass <= K^B, int ||Ad(u)||^d d||sigma||^{(2)} <= K^{-eta}, and phi_1*sigma = lambda_1 phi_1 with |lambda_1| >> Q^{-eps}. Construction from [67, section 4.1] plus section 4.3.7. Gives (5.11)-(5.12)."}, {"id": "proposition-5-2-4", "display": "Proposition 5.2.4", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p14", "kind": "claim", "genre": "original", "note": "Proposition 5.2.4: |<Phi_{2,u},Phi_{3,u}>_{reg}| << ||Ad(u)||^A Q^{-4gamma-delta} ||u||^{-delta} for gamma>1/2. The target estimate; proved by evaluating via the regularized Plancherel formula."}, {"id": "good-and-bad-places-r-s-t", "display": "good and bad places R/S/T", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p14", "kind": "definition", "genre": "original", "note": "R = finite places with phi_{2,v}, E_{3,v} spherical and u_v=1; S = places with u_v != 1 (finite, unramified data); T = rest. |S|+|T| = o(log C(pi_1)+log C(pi_2)), used to control products of local implicit constants."}, {"id": "deformation-5-2-6", "display": "deformation (5.2.6)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p14", "kind": "method", "genre": "original", "note": "Deformations pi_3(t) = |.|^t chi_3 |.|^{-t}, pi_2(s) (constant if cuspidal); E(t) = Eis(f_3(t)), phi_2(s) = Eis(f_2(s)); Whittaker factorizations W = c_{2,W}(s) prod W_{phi_2,v}(s) with unit local norms on S cup T; constant estimate (5.14) via Lambda^*(pi_2(s),Ad,1)."}, {"id": "regularized-plancherel-application-5-2-7", "display": "regularized Plancherel application (5.2.7)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p14", "kind": "method", "genre": "original", "note": "On N = {(s,t)=(t/2,t): 0<|t|<|z|/6} the regularized Plancherel formula (4.20) applies: <Phi_2(s),Phi_3(t)>_{reg} = degenerate terms + spectral integral over generic pi (5.16); finite-spectrum contribution vanishes. Lemma: the degenerate term extends continuously to closure(N)."}, {"id": "generic-term-bound-lemma-5-2-8", "display": "generic term bound lemma (5.2.8)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p14", "kind": "result", "genre": "original", "note": "Lemma (5.2.8): the generic spectral term is << Q^{-delta}. Proved via (4.23) with B_v from Corollary 3.7.1 (T) and the trivial bound (3.36) (S), plus Theorem 5.1 for L(pi_3 otimes pi_3 otimes pi,1/2), and the averaged bound (4.24)."}, {"id": "degenerate-term-bound-lemma-5-2-9", "display": "degenerate term bound lemma (5.2.9)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p14", "kind": "result", "genre": "original", "note": "Lemma (5.2.9): degenerate term << Q^{eps} |z|^{-4} ||Ad(u)||^{-gamma} (5.18), gamma>1/2. H_{s,t} expanded as sum of H^{+-}_{s,t} with local factors (5.19); J-terms analogous with intertwining operators."}, {"id": "local-bounds-for-h-and-j-terms", "display": "local bounds for H and J terms", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p14", "kind": "method", "genre": "original", "note": "Local bounds (5.2.10-5.2.11): H^{++}_v for v in R from Rankin-Selberg theory (5.20); v in S via Lemma 3.2.7 giving ||Ad(u_v)||^{-gamma}, gamma=1-theta>1/2 (5.21); v in T via (5.22); derivative bounds (5.23) via Lemma 3.2.8 and Prop 3.2.4 off the unitary axis."}, {"id": "j-term-local-bounds-5-24-5-25", "display": "J-term local bounds (5.24), (5.25)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p15", "kind": "method", "genre": "original", "note": "J^{--}_v bounds: ||J^{--}_v|| << ||Ad(u_v)||^{-gamma} (5.24), gamma = 1-theta > 1/2, for v in S via Lemma 3.2.8; <= 1 for v in T via Lemma 3.2.7. Derivative bounds (5.25) via Cauchy estimates off the unitary axis using Proposition 3.2.4 and the section 4.1.8 bounds for M-bar_v."}, {"id": "degenerate-term-assembly-5-2-12", "display": "degenerate term assembly (5.2.12)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p15", "kind": "result", "genre": "original", "note": "Assembly (5.2.12): the degenerate term is the sum of H^{+-}_{t/2,t}, J^{+-}_{t/2,t}; individually possibly singular at (0,0) but the sum is antiholomorphic near 0. Local factors at S cup T bounded by Q^eps ||Ad(u)||^{eps-gamma}; partial L-functions meromorphic in t with pole order <= 4 at t=0, bounded by C(pi_2)^eps C(pi_3)^eps ||z||^{-4} on iR. Yields the (5.18) bound."}, {"id": "theorem-1-2-proved", "display": "Theorem 1.2 proved", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p15", "kind": "result", "genre": "original", "note": "'This lemma together with the lemma of section 5.2.8 conclude the proof of Proposition 5.2.4, hence of Theorem 1.2.' The Rankin-Selberg subconvex bound L(pi1 otimes pi2,1/2) << C(pi1 otimes pi2)^{1/4-delta} is established; the paper's main result is proved."}, {"id": "outline-of-the-proof-of-theorem-1-2", "display": "outline of the proof of Theorem 1.2", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "method", "genre": "original", "note": "Proof strategy for Theorem 1.2: realize L(pi1 otimes pi2,1/2) as triple product period, regularize, spectral-expand, amplify, and reduce to the character-twist case (Theorem 5.1)."}, {"id": "triple-product-period-realization-of-rankin-selb", "display": "triple product period realization of Rankin-Selberg central value", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "definition", "genre": "original", "note": "Rankin-Selberg theory realizes the central value as the period int_{PGL2(Q)\\PGL2(A)} phi1 phi2 E(g) dg = <phi1, phi2 E> with E an Eisenstein series of type '1 chi'."}, {"id": "regularization-of-inner-products-ee-not-square-i", "display": "regularization of inner products (EE not square-integrable)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "method", "genre": "original", "note": "EE is not square-integrable, so a regularized inner product is needed; treated in sections 4.3-4.4. Regularization artifacts include a non-unitary Eisenstein series Phi."}, {"id": "spectral-expansion-1-3-with-plancherel-measure", "display": "spectral expansion (1.3) with Plancherel measure", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "claim", "genre": "original", "note": "Identity (1.3): regularized <phi2 phi2, EE> expands as <phi2 phi2, Phi>_reg plus spectral integral over the automorphic dual with Plancherel measure dmu_P. See section 4.3.8."}, {"id": "amplification-handling-of-the-phi-term", "display": "amplification handling of the Phi term", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "method", "genre": "original", "note": "The Phi-term <phi2 phi2, Phi>_reg is handled via the amplification method (section 5.18)."}, {"id": "theorem-5-1-subconvex-bound-for-character-twists", "display": "Theorem 5.1 (subconvex bound for character twists)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "result", "genre": "original", "note": "Theorem 5.1: subconvex bound for L-functions of character twists, uniform in the character aspect; proved in section 5.1 generalizing [67]. Enters the proof of the full theorem (phenomenon noted in [48])."}, {"id": "trilinear-functional-on-pi1-otimes-pi2-otimes-pi", "display": "trilinear functional on pi1 otimes pi2 otimes pi3 (at most one-dimensional)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "definition", "genre": "original", "note": "Local Rankin-Selberg integral is a linear functional l on pi1 otimes pi2 otimes pi3; the space of such functionals is at most one-dimensional, so ||l||^2 is proportional to an explicit Hermitian form."}, {"id": "waldspurger-s-observation-on-canonically-normali", "display": "Waldspurger's observation on canonically normalized local functionals", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "claim", "genre": "reframed", "note": "Waldspurger's observation (see also [33]): global period formulas become very simple when expressed via canonically normalized local functionals. Cited, not proved here."}, {"id": "spectral-identity-1-2-1-3-keystone-of-the-argume", "display": "spectral identity (1.2)/(1.3), keystone of the argument", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "claim", "genre": "original", "note": "Identity (1.2), 'although evident, is the keystone of our argument'; in L-function form (1.3) it equates weighted sums of triple-product central values with weighted sums of canonical square roots. Conversion discussed in section 4.5."}, {"id": "kuznetsov-s-identity-l-function-form", "display": "Kuznetsov's identity (L-function form)", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "claim", "genre": "reframed", "note": "In L-function guise the identity was discovered by Kuznetsov [43] (pi2, pi3 Eisenstein; see also [53]), with an application by Jutila [40]. Cited, not proved here."}, {"id": "strong-gelfand-configurations", "display": "strong Gelfand configurations", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "definition", "genre": "reframed", "note": "Reznikov's formalism [61]: strong Gelfand configurations (commutative diagrams with (F,Hi),(Hi,G) strong Gelfand pairs) systematically yield spectral identities between periods and L-functions. This paper is the configuration with G = GL2^4. Described, not proved here."}, {"id": "the-burgess-bound-1-4", "display": "the Burgess bound (1.4)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "result", "genre": "original", "note": "Bound (1.4): sum_{m<=M} chi(m) << M q^{-delta} for M ~ q^{1/2}; q^{1/2} is the threshold (Polya-Vinogradov handles M >> q^{1/2}); Burgess [12] proved it in a wider range. Substantively equivalent to q-aspect subconvexity for L(chi,1/2)."}, {"id": "burgess-bound-as-equidistribution-on-the-space-o", "display": "Burgess bound as equidistribution on the space of lattices", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "claim", "genre": "original", "note": "Identity F(Lambda_x)chi(x) = ... relates (1.4) to equidistribution of residue/nonresidue lattice sets (1.5) on X; shown by elementary computation. A special case of the L-function/automorphic-form connection."}, {"id": "space-of-lattices-x-sl2-z-sl2-r", "display": "space of lattices X = SL2(Z)\\SL2(R)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "definition", "genre": "original", "note": "X = SL2(Z)\\SL2(R), the space of unimodular lattices in R^2, with its SL2(R)-invariant probability measure; Lambda_x = Z(1,x)+Z(0,q) moves on a closed horocycle."}, {"id": "equidistribution-statements-a-b-c-c2", "display": "equidistribution statements (A), (B), (C)/(C2)", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "claim", "genre": "original", "note": "(A) closed horocycle equidistributes (Sarnak, cited); (B) integer points equidistribute; (C)/(C2) chi-weighted/residue sets equidistribute. (C) has 'substantively the same content' as the aimed subconvexity. Chain proved by refining large sets to smaller."}, {"id": "ergodic-principle-1-3", "display": "ergodic principle (1.3)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "method", "genre": "original", "note": "Principle 1.3: H ergodic on (X,mu), nu H-invariant and dominated by a multiple of mu => nu is a scalar multiple of mu. Proved in the text ('the principle is therefore trivial'); quantitative form deferred to section 2.5.3."}, {"id": "faster-algorithms-from-subconvexity-ideas", "display": "faster algorithms from subconvexity ideas", "status": "heuristic", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "question", "genre": "original", "note": "'An interesting question is whether some of the ideas that enter into the proof of subconvexity can be interpreted to give faster algorithms' (approximate functional equation computes L at central point in time C^{1/2+eps}). Stated as open."}, {"id": "approximate-functional-equation-computes-central", "display": "approximate functional equation computes central values in time C^{1/2+eps}", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p2", "kind": "claim", "genre": "reframed", "note": "Approximate functional equation numerically computes any L-function at the central point in time C^{1/2+eps}. Stated as standard background."}, {"id": "adelic-lift-acquires-invariance-hecke-operators-", "display": "adelic lift acquires invariance (Hecke operators as shadows)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "claim", "genre": "original", "note": "The measure nu of (C) has no apparent invariance on X, but lifts to an H-equivariant measure on the adelic inverse limit; applying the ergodic principle on X-tilde gives (B)=>(C). Hecke operators are 'shadows' of the adelic actions."}, {"id": "inverse-limit-space-x-tilde-with-sl2-a-q-action", "display": "inverse limit space X-tilde with SL2(A_Q) action", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "definition", "genre": "original", "note": "X-tilde = lim<- Gamma(q)\\SL2(R) carries an SL2(A_Q)-action with projection to SL2(Z)\\SL2(R). Closed subgroup H^(1) surjects onto (Z/qZ)^x compatibly with the (B),(C) actions."}, {"id": "adeles-for-dynamicists-invertible-hecke-shift", "display": "adeles for dynamicists (invertible Hecke shift)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "method", "genre": "original", "note": "Intuitive picture: force the multi-valued Hecke operator T_p invertible via the sequence space X-tilde_p; the shift S is the right action of a diagonal matrix in SL2(Q_p). Doing this at all primes yields X-tilde."}, {"id": "burq-gerard-tzvetkov-geodesic-restriction-bound", "display": "Burq-Gerard-Tzvetkov geodesic restriction bound", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "result", "genre": "reframed", "note": "Burq-Gerard-Tzvetkov [11], generalizing Reznikov [60]: ||phi_lambda||_{L^2(G)} <= C(G,M) lambda^{1/4} ||phi_lambda||_{L^2(M)} for a closed geodesic G. Cited, not proved here."}, {"id": "fourier-coefficient-a-phi-lambda-omega-along-a-c", "display": "Fourier coefficient a(phi_lambda, omega) along a closed geodesic", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "definition", "genre": "original", "note": "a(phi_lambda,omega) = int_0^L phi_lambda(gamma(t)) e^{i omega t} dt, the omega-th Fourier coefficient along G; Cauchy-Schwarz gives |a| <= L^{1/2} C lambda^{1/4} ||phi||."}, {"id": "sharpness-example-on-s-2", "display": "sharpness example on S^2", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "claim", "genre": "original", "note": "On S^2, phi_n = (x+iy)^n restricts to a single Fourier mode on the equator with ||phi_n||_{L^2(G)} ~ n^{1/4}||phi_n||_{L^2(M)}: the lambda^{1/4} bound is sharp."}, {"id": "uniform-decay-1-6-for-hecke-laplace-eigenfunctio", "display": "uniform decay (1.6) for Hecke-Laplace eigenfunctions on arithmetic surfaces", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "result", "genre": "original", "note": "Corollary (1.6) of Theorem 1.2: for a Hecke-Laplace eigenbasis on an arithmetic surface, |a(phi_lambda,omega)| <= C lambda^{-delta} ||phi_lambda|| uniformly in omega, including omega~lambda; uniformity comes from the hybrid subconvex bound."}, {"id": "arithmetic-hyperbolic-manifold", "display": "arithmetic hyperbolic manifold", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "definition", "genre": "original", "note": "Arithmetic hyperbolic manifold = Gamma\\H^2 with Gamma from a quaternion algebra over Q (split at infinity); geodesics considered are projections of full adelic torus orbits (class number 1 assumed for exposition)."}, {"id": "waldspurger-proportionality-of-a-2-to-central-l-", "display": "Waldspurger proportionality of |a|^2 to central L-value", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "claim", "genre": "reframed", "note": "By a result of Waldspurger, |a(phi_lambda,omega)|^2 is proportional to the central value Lambda(pi x pi_omega, 1/2), with pi_omega from automorphic induction. Cited, not proved here."}, {"id": "quadrilinear-to-bilinear-identity-1-7", "display": "quadrilinear-to-bilinear identity (1.7)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "method", "genre": "original", "note": "Identity (1.7): |a(phi_lambda,omega1) a(phi_lambda,omega2)|^2 ~ triple integral of theta_{omega1-omega2} phi-tilde_lambda theta_{omega1+omega2} over an auxiliary arithmetic surface M-tilde; quadrilinear left vs bilinear right, constant a computable Gamma-ratio."}, {"id": "jacquet-langlands-number-theoretic-explanation-o", "display": "Jacquet-Langlands number-theoretic explanation of (1.7)", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "claim", "genre": "reframed", "note": "Number-theoretic explanation of (1.7) via [32]: M-tilde is a quotient of the quaternion algebra D_0 nonsplit where epsilon(pi x pi_{omega+} x pi_{omega-})=-1; left side vanishes if no such D_0 exists (Jacquet-Langlands transfer). Cited."}, {"id": "range-switch-from-omega-lambda-to-lambda-o-1", "display": "range switch from omega~lambda to lambda=O(1)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "method", "genre": "original", "note": "With omega1=omega2=omega, Cauchy-Schwarz on (1.7) plus applying (1.7) 'in reverse' reduces a(phi_lambda,omega) with omega~lambda to a(psi-check_mu, 2omega) with mu small relative to omega: the difficult range is outflanked."}, {"id": "horocycle-deformation-for-large-omega", "display": "horocycle deformation for large omega", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "method", "genre": "original", "note": "For omega >> lambda: deform gamma(t) to a horocycle-approximating path, gaining e^{pi|omega|/2}; polynomial decay of the deformed integral (1.9) follows from horocycle-flow mixing (cf. [67, 1.3.4])."}, {"id": "classical-sobolev-norms-s-2-k-sa-sd", "display": "classical Sobolev norms S_{2,k} (Sa-Sd)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "definition", "genre": "original", "note": "Classical Sobolev norms S_{2,k} on R/Z with (Sa) point-evaluation control, (Sb) diffeomorphism distortion, (Sc)/(Sc*) compact/trace-class embeddings, (Sd) Fourier characterization."}, {"id": "axiomatic-sobolev-norms-on-adelic-quotients", "display": "axiomatic Sobolev norms on adelic quotients", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "claim", "genre": "original", "note": "Program: a system of norms on adelic quotients satisfying axioms analogous to (Sa)-(Sd); presented via properties before definition (section 2.3). Reader advised to work with properties, not the definition."}, {"id": "vinogradov-notation-and-setup-conventions", "display": "Vinogradov notation and setup conventions", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "definition", "genre": "original", "note": "Vinogradov A << B conventions with parameter-dependent variants (A <<_delta B, A << B^?); in Parts IV-V some constants required polynomial (section 4.1.5). Complete zeta xi_F and reductive-group setup fixed."}, {"id": "uniform-decay-1-6-for-general-non-arithmetic-hyp", "display": "uniform decay (1.6) for general non-arithmetic hyperbolic surfaces", "status": "heuristic", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p3", "kind": "question", "genre": "original", "note": "'We do not know how to prove anything like (1.6) for a general hyperbolic surface M' — the identities used are extremely specific to the arithmetic case. Stated as open."}, {"id": "adelic-quotient-x-g-f-g-a", "display": "adelic quotient X = G(F)\\G(A)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "definition", "genre": "original", "note": "X := G(F)\\G(A); smooth functions factor through a quotient of a real Lie group by a discrete subgroup. Base space for the whole paper."}, {"id": "principal-congruence-subgroups-k-v-m-and-k-m", "display": "principal congruence subgroups K_v[m] and K[m]", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "definition", "genre": "original", "note": "K_v[m] = G(F_v) cap {g in GL_r(O_v): g = I mod p_v^m}; K[m] = product over finite v; K = product K_v. Index bound (2.1): [K_v:K_v[m_v]] ~ q_v^{m_v dim G}."}, {"id": "haar-measure-normalization", "display": "Haar measure normalization", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "definition", "genre": "original", "note": "Left-invariant Haar measures normalized: adelic = product of local; P(F)\\P(A)->M(F)\\M(A) measure-preserving; mass(K_v)=1; P(F)\\P(A) x K -> X measure-preserving. Exact choices 'never of importance' for upper bounds."}, {"id": "height-ht-g-and-the-kad-g-k-ht-x-lemma", "display": "height ht(g) and the kAd(g)k <= ht(x) lemma", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "definition", "genre": "original", "note": "ht(g)^{-1} = inf_{x} sup_{i,v} ||(Ad(g).x)_i||_v; descends to X, proper when center anisotropic. Lemma: for x_0 fixed, exists g with x_0 g = x and ||Ad(g)|| <= ht(x). Proof cited [20] fn.15."}, {"id": "smooth-vectors-v-infty", "display": "smooth vectors V^infty", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "definition", "genre": "original", "note": "V^infty: open-stabilizer vectors (nonarchimedean) or smooth orbit maps (archimedean); always dense. Global smooth subspace = tensor product of local ones."}, {"id": "plancherel-formula-langlands-theorem-for-l-2-x", "display": "Plancherel formula / Langlands theorem for L^2(X)", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "claim", "genre": "reframed", "note": "Langlands' theorem: integrating the Eisenstein intertwiner Eis gives an isometric isomorphism from int^oplus I(chi) dchi onto L^2(X). Standard automorphic representations = images Eis(chi); G^_Aut carries the Plancherel measure dmu_P. Recalled from [1], [51]; not proved here."}, {"id": "standard-automorphic-representations-and-planche", "display": "standard automorphic representations and Plancherel measure dmu_P", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "definition", "genre": "original", "note": "Standard automorphic representations (abstractly unitarizable; exactly those needed for unitary decomposition); dmu_P is the push-forward of dchi. Pointwise Plancherel expansion for compactly supported smooth phi follows from Muller [55]."}, {"id": "canonical-norm-for-gl2-2-5", "display": "canonical norm for GL2 (2.5)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "definition", "genre": "original", "note": "For generic pi on GL2: Whittaker model W_pi with regularized local inner products (2.2); global inner product (2.3) normalized by Lambda^*(pi,Ad,1); canonical norm (2.5) ||W_phi||_can^2 = ... via the intertwiner phi -> W_phi (4.2)."}, {"id": "regularized-adjoint-value-l-pi-ad-1-c-pi-o-1", "display": "regularized adjoint value L^*(pi,Ad,1) = C(pi)^{o(1)}", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "claim", "genre": "reframed", "note": "Regularized adjoint value satisfies L^*(pi,Ad,1) = C(pi)^{o(1)} as C(pi)->infty (2.4), from [24]. Cited, not proved here."}, {"id": "lemma-2-2-3-canonical-norm-vs-l-2-eisenstein-nor", "display": "Lemma 2.2.3 (canonical norm vs L^2/Eisenstein norm)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "result", "genre": "original", "note": "Lemma 2.2.3: for generic standard pi, ||phi||_can^2 = ||phi||_{L^2(X)}^2 if cuspidal, and = 2 xi_F(2) ||phi||_Eis^2 if Eisenstein nonsingular. Cuspidal case via Rankin-Selberg (section 4.4.2); Eisenstein case in section 4.1.7. Caveat: canonical norm need not be continuous in families (pole order of adjoint L can jump)."}, {"id": "sobolev-norms-s-v-d-and-s-x-d", "display": "Sobolev norms S^V_d and S^X_d", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "definition", "genre": "original", "note": "Two families for d in R: Sobolev norms S^V_d on unitary representations via ||Delta^d f||_V, and finer S^X_d on C^infty(X) via ||H^d Delta_A^d f||_2 with H = multiplication by 1+ht. Norms may take value infinity; S^V_d finite on V^infty."}, {"id": "properties-s1a-s1c-of-the-unitary-sobolev-norms", "display": "properties S1a-S1c of the unitary Sobolev norms", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "claim", "genre": "original", "note": "Enunciated properties: (S1a) Sobolev inequality ||f(1)|| << S^V_d(f.omega); (S1b) distortion S^V_d(gf) << ||Ad(g)||^{kappa d} S^V_d(f); (S1c) embedding with finite trace. Proofs deferred to section 2.6."}, {"id": "generalized-laplacian-delta", "display": "generalized Laplacian Delta", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "definition", "genre": "original", "note": "Generalized Laplacian: local Delta_v = sum_m q_v^m e_v[m] with V[m] the K_v[m]-new (finite place) or Casimir-eigenspace (archimedean) piece; global Delta_A = sum_m ||m|| e[m]. Delta invertible with trace-class inverse power."}, {"id": "reliance-on-bernstein-uniform-admissibility-and-", "display": "reliance on Bernstein uniform admissibility and Muller", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p4", "kind": "claim", "genre": "original", "note": "Paper's own methodological warning: subtler norm features rely on Bernstein's uniform admissibility and Muller's theorem [3,55]; one property established only for GL_n; 'for the purpose of the present paper, none of these deep results are important.'"}, {"id": "property-s1d-functionals-bounded-place-by-place", "display": "property S1d (functionals bounded place-by-place)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "claim", "genre": "original", "note": "(S1d) Factorizable functionals bounded place-by-place: local bounds ||l_v|| <= A S^{pi_v}_d imply global ||l|| <= A' S^pi_{d'}. Proved in section 2.6.3 via Bernstein uniform admissibility (PGL2 case illustrated)."}, {"id": "properties-s2a-s2c-of-x-sobolev-norms", "display": "properties S2a-S2c of X-Sobolev norms", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "claim", "genre": "original", "note": "(S2a) S^X_{d_0} majorizes L^infty; (S2b) distortion S^X_d(gf) << ||Ad(g)||^{kappa_2 d} S^X_d(f); (S2c) finite-trace embeddings. S2a proved in 2.6.1 from S1a; S2b/S2c proofs omitted as elementary."}, {"id": "properties-s3a-s3c-unitary-vs-x-sobolev-norms", "display": "properties S3a-S3c (unitary vs X Sobolev norms)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "claim", "genre": "original", "note": "(S3a) S^{L^2(X)}_d majorized by S^X_d; (S3b) S^X_d(f) << S^{L^2(X)}_{d_0}(f) on the cuspidal subspace; (S3c) functionals bounded on each standard pi (Eisenstein norm) transfer to S^X_{d_0}. S3b proved in 2.6.2 via reduction theory; S3a/S3c stated."}, {"id": "properties-s4a-s4e-log-convexity-duality-multipl", "display": "properties S4a-S4e (log-convexity, duality, multiplicativity)", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "claim", "genre": "original", "note": "(S4a) log-convexity of operator norms in d; (S4b) common eigenbases with polynomial comparison; (S4c) self-duality S^V_d vs S^V_{-d}; (S4d) eigenfunction estimate (2.7); (S4e) multiplicativity S^X_d(fg) << S^X_d(f)S^X_d(g). Proofs of S4a-S4d omitted; stated for use."}, {"id": "harish-chandra-spherical-function-xi-v", "display": "Harish-Chandra spherical function Xi_v", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "definition", "genre": "original", "note": "Xi_v(g) = <g v_0, v_0>, v_0 the K_v-invariant vector in the representation unitarily induced from the trivial character of a minimal parabolic. The basic decay majorant for matrix coefficients."}, {"id": "local-matrix-coefficient-bounds-tempered-and-2-8", "display": "local matrix coefficient bounds (tempered and (2.8))", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "claim", "genre": "reframed", "note": "Tempered pi_v: |<g x1,x2>| <= A_v S(x1) S(x2) Xi_v(g), from [13] extended in [56]. Non-tempered GL2 local constituents: (2.8) with Xi_v(g)^{1-2theta} for theta > 3/26. Cited, not proved here."}, {"id": "theta-convention-theta-in-3-26-1-4", "display": "theta convention (theta in (3/26,1/4))", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "definition", "genre": "original", "note": "Notational convention: theta denotes any number in (3/26, 1/4); every theta-statement holds for all such choices. Reader may substitute 3/26+eps throughout."}, {"id": "global-matrix-coefficient-bound-2-10-via-propert", "display": "global matrix coefficient bound (2.10) via property (tau)", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "claim", "genre": "reframed", "note": "Global bound (2.10): |<g.f1,f2> - <g.Pf1,Pf2>| << ||Ad(g)||^{-beta} S^X_d(f1) S^X_d(f2). From property (tau) via Clozel [14], quantified in [28]; for GL2, (2.8) gives admissible beta = 1/2 - theta. Cited."}, {"id": "period-functionals-via-matrix-coefficients-2-11", "display": "period functionals via matrix coefficients (2.11)", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "claim", "genre": "reframed", "note": "Waldspurger [69], extended by Ichino-Ikeda [32,33]: period functionals expressed by integrating matrix coefficients (2.11); local factors match L-function factors, suggesting regularization by special L-values. Used in [15],[21] and in section 4.2.1 here; 'not universally applicable'. Cited."}, {"id": "quantitative-ergodic-principle-lemma", "display": "quantitative ergodic principle lemma", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "result", "genre": "original", "note": "Lemma (quantitative ergodic principle): for chi-equivariant signed measure nu dominated via S^X_d and any probability sigma on H, |nu(f) - delta_{chi=1} mu(f)| bounded by ||sigma||_2 and ||sigma*sigma^vee||_{-beta} terms. Proved in the text from (S2b),(S4e) and matrix-coefficient bounds."}, {"id": "quantitative-ergodic-principle-as-amplification", "display": "quantitative ergodic principle as amplification", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "claim", "genre": "original", "note": "Remark: in the subconvexity context the lemma 'amounts to the amplification method ([36])' with sigma playing the role of the amplifier. Paper's own interpretation."}, {"id": "adelized-horocycle-equidistribution-2-12", "display": "adelized horocycle equidistribution (2.12)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "result", "genre": "original", "note": "Adelized Sarnak horocycle theorem: constant-term bound (2.12) |f_N(b)| << delta_B(b)^{1/2} S^X(f) for f in L^2(X) cap C^infty(X). Proved via (S3c), reducing to standard representations."}, {"id": "proofs-of-sobolev-norm-properties-section-2-6", "display": "proofs of Sobolev norm properties (section 2.6)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p5", "kind": "method", "genre": "original", "note": "Section 2.6 proofs: (S1a) from the manifold Sobolev inequality on G(A)/K[m] components; (S3b) by Fourier expansion along a unipotent central series with reduction-theory height control; (S1d) from Bernstein's uniform admissibility (dimension bound A_1 q_v^{A_2 m}). Distortion proofs omitted as elementary."}, {"id": "bernstein-uniform-admissibility-proof-for-pgl2", "display": "Bernstein uniform admissibility proof for PGL2", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "method", "genre": "original", "note": "Bernstein's uniform admissibility for PGL2 illustrated: C[G].<C>.C[G] acts irreducibly on pi^{K[m_v]}, so dim pi^{K[m_v]} <= |G|^2/dim pi^{K[m_v]}, giving the e_v[m] dimension bound A_1 q_v^{A_2 m}. Proved in the text."}, {"id": "completion-of-the-s1d-proof", "display": "completion of the (S1d) proof", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "method", "genre": "original", "note": "(S1d) completed: decompose X in V[m] into at most prod (A_1 q_v^{A_2 m_v}) pure tensors; Cauchy-Schwarz plus (2.7) yields the global bound. Proved in the text."}, {"id": "multilinear-extension-of-s1d", "display": "multilinear extension of (S1d)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "claim", "genre": "original", "note": "Remark: (S1d) applies formally to multilinear functionals; e.g. factorizable bilinear B with local bounds gives B(x1,x2) << S_{d'}(x1) S_{d'}(x2). Paper's own formal deduction."}, {"id": "proof-of-s2c", "display": "proof of (S2c)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "method", "genre": "original", "note": "(S2c) proved following [4]: point-evaluation forms l_x(f) = ht(x)^r Delta_A^r f(x) are S^X_d-bounded uniformly in x; finiteness of trace of ||l_x||^2 integrated over X."}, {"id": "sobolev-conductor-csob-pi", "display": "Sobolev-conductor CSob(pi)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "definition", "genre": "original", "note": "CSob(pi) = inf_{f in pi, ||f||_2=1} ||Delta^d f||, the 'Sobolev-conductor' of pi; shown below to be comparable to the analytic conductor for GL_n."}, {"id": "polynomial-count-2-15-of-cuspidal-representation", "display": "polynomial count (2.15) of cuspidal representations", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "result", "genre": "original", "note": "(2.15): number of cuspidal pi with CSob(pi) <= X is at most polynomial in X. Proved via trace-class inclusion (S3a)+(S2c) forcing sum_pi CSob(pi)^{-d_0} < infty."}, {"id": "integrability-2-16-over-the-eisenstein-parameter", "display": "integrability (2.16) over the Eisenstein parameter", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "claim", "genre": "original", "note": "(2.16): int_{chi} CSob(I(chi))^{-d_1} dchi < infty for some d_1>1; for GL_n reduced to (2.15) via discrete-spectrum classification [51]. General case 'believed routine' via Muller [55] but not verified here."}, {"id": "corollary-power-bound-for-cuspidal-count-by-cond", "display": "corollary: power bound for cuspidal count by conductor", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "result", "genre": "original", "note": "Corollary: number of cuspidal representations of GL_n(F) with fixed central character and conductor <= X is bounded by a power of X. Follows from (2.15) plus Gan's lemma."}, {"id": "lemma-2-6-6-gan-log-c-pi-comparable-to-log-csob-", "display": "Lemma 2.6.6 (Gan): log C(pi) comparable to log CSob(pi)", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "result", "genre": "reframed", "note": "Lemma 2.6.6 (W.T. Gan): log C(pi)/log CSob(pi) is bounded above and below as pi varies over cuspidal representations of GL_n(A). Derived from a result sketched by Gan to an author; not proved here."}, {"id": "asymptotics-of-n-x", "display": "asymptotics of N(X)", "status": "heuristic", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "question", "genre": "original", "note": "Question: determine the asymptotic of N(X) = #{cuspidal on GL_n(Q): C(pi) <= X}; e.g. is log N(X)/log X -> n+1? Motivated by Selberg-class growth and converse theorems. Stated as open."}, {"id": "local-field-notations-and-measure-normalizations", "display": "local field notations and measure normalizations (section 3.1)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "definition", "genre": "original", "note": "Local setup: k = F_v with normalized absolute values; additive character psi from e_F; conductor d_psi; subgroups Z,N,B,A with z(t),n(x),a(y); K[m] congruence subgroups; self-dual Haar measures; measure-comparison constant iota_k = q^{-d_psi/2} zeta_k(1)/zeta_k(2) computed in three cases."}, {"id": "kim-shahidi-no-complementary-series-with-paramet", "display": "Kim-Shahidi: no complementary series with parameter > theta", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "claim", "genre": "reframed", "note": "Convention (3.1.7): representations occurring are local constituents of unitary automorphic representations of GL2(A); by Kim-Shahidi [41] never complementary series with parameter > theta (cf. (2.8)). Cited."}, {"id": "local-analytic-conductor-c-pi", "display": "local analytic conductor C(pi)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "definition", "genre": "original", "note": "Local analytic conductor: non-archimedean C(pi) = q^{f(pi)}; archimedean C(pi) = prod_i (2+|mu_{pi,i}|)^{deg(k)} from L(pi,s) = prod Gamma_k(s+mu_{pi,i}). Vinogradov A <<_pi B means polynomial in C(pi)."}, {"id": "principal-series-i-omega-omega-0", "display": "principal series I(omega,omega_0)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "definition", "genre": "original", "note": "Principal series I(omega,omega_0) unitarily induced from B; unitary when omega,omega_0 unitary, with L^2 norm (3.2) kfk^2 = iota_k^{-1} int |f(w n(x))|^2 dx. Non-unitary cases unitarizable with omega^{-1} = omega_0."}, {"id": "deformation-pi-s-of-induced-representations", "display": "deformation pi_s of induced representations", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "definition", "genre": "original", "note": "Deformation: pi = I(omega,omega_0) deforms to pi_s = omega|.|^s, omega_0|.|^{-s} realized in the induced space I_s; f -> f_s is K-equivariant but not G-equivariant in general."}, {"id": "gamma-factor-gamma-pi-psi-s", "display": "gamma-factor gamma(pi,psi,s)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p6", "kind": "definition", "genre": "original", "note": "gamma(pi,psi,s) = epsilon(pi,psi,s) L(tilde pi,1-s)/L(pi,s); unramified epsilon = q^{-f_pi(s-1/2)} (3.3); Tate's functional equation Z(Phi^hat, chi^{-1},1-s) = gamma(chi,psi,s) Z(Phi,chi,s) (3.4). Standard material recalled."}, {"id": "gamma-factor-estimates-3-5-3-6", "display": "gamma-factor estimates (3.5), (3.6)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p7", "kind": "claim", "genre": "original", "note": "Estimates (3.5) for GL1 and (3.6) for GL2: |gamma(.,psi,sigma)| << q^{-(sigma-1/2)d_psi} Cond(.); non-archimedean from epsilon-factor dependence on psi plus uniform L-bounds; archimedean by direct computation [38, Ch.1, sections 5-6]."}, {"id": "stationary-phase-and-gauss-sum-analysis", "display": "stationary phase and Gauss sum analysis", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p7", "kind": "method", "genre": "original", "note": "Stationary phase: G(lambda,t) = int f(x)|x|^{i lambda} e^{itx} dx is small unless lambda ~ t, of size ~ lambda^{-1/2} when lambda ~ t; non-archimedean analogue (3.7): Gauss-sum integrals vanish unless |u| = CD/|t| with size eta C^{-1/2}."}, {"id": "lemma-3-1-14-oscillatory-integral-bounds", "display": "Lemma 3.1.14 (oscillatory integral bounds)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p7", "kind": "result", "genre": "original", "note": "Lemma 3.1.14: for G_phi(chi,t) = int phi(x) psi(tx) chi(x) dx, rapid decay ((1+|t|)/C)^{-N} off the critical range plus the C^{-1/2+eps} bound; part (2) (existence of t with large value) from Plancherel. Proved in the text."}, {"id": "whittaker-model-w-pi-psi-and-kirillov-model-k-pi", "display": "Whittaker model W(pi,psi) and Kirillov model K(pi,psi)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p7", "kind": "definition", "genre": "original", "note": "W(pi,psi) the unique Whittaker realization, K(pi,psi) the Kirillov model with inner product (3.8) <W,W> = int |W(y)|^2 d^xy. For unitary pi the intertwiner pi -> K(pi,psi) is fixed up to a unit scalar and pi is identified with its Kirillov model."}, {"id": "intertwiner-3-10-from-induced-to-whittaker-model", "display": "intertwiner (3.10) from induced to Whittaker model", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p7", "kind": "method", "genre": "original", "note": "Explicit intertwiner (3.10): f -> W^f, W^f(g) = eta_k^{-1/2} int f(w n(x) g) psi(x) dx; isometric for unitary principal series by (3.2). Mellin identity (3.11) with pole analysis: poles at chi omega^{+-1} = alpha^{-1/2} cancelled by gamma-factor zeros."}, {"id": "jacquet-langlands-local-functional-equation-3-13", "display": "Jacquet-Langlands local functional equation (3.13)", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p7", "kind": "claim", "genre": "reframed", "note": "Local functional equation (3.13): Xi^+_chi(W) = gamma(pi otimes chi,psi,1/2)^{-1} Xi^+_{omega^{-1} chi^{-1}}(W-check), from Hecke-Tate meromorphic continuation with ratio Xi^+_chi(W)/L(pi otimes chi,1/2) holomorphic. Standard theory recalled, not proved here."}, {"id": "proposition-3-2-3-pointwise-whittaker-bounds", "display": "Proposition 3.2.3 (pointwise Whittaker bounds)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p7", "kind": "result", "genre": "original", "note": "Proposition 3.2.3: |W(y)| <<_N |y|^{1/2-theta} S^K_d(W) for |y|<=1 and rapid decay for |y|>1. Proved by Mellin inversion shifting to sigma_0 in (3/26-1/2,0), using (3.13), (3.6), (S4d), and nonvanishing of the local integral beyond the conductor."}, {"id": "proposition-3-2-4-deformed-whittaker-bounds-3-15", "display": "Proposition 3.2.4 (deformed Whittaker bounds (3.15))", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p7", "kind": "result", "genre": "original", "note": "Proposition 3.2.4: for deformations pi_s with |Re(s)| <= delta <= 1/20, int |W_s(a(y))|^2 max(|y|,|y|^{-1})^delta d^xy << S^pi_{d delta}(f)^2 (3.15). Proved by Mellin inversion, (3.11), (3.6), and Hadamard three-lines interpolation in s."}, {"id": "kirillov-model-lie-algebra-bounds", "display": "Kirillov model Lie-algebra bounds", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p7", "kind": "claim", "genre": "reframed", "note": "Archimedean Kirillov computations: ||Z_1...Z_m W|| << C(pi)^{m/deg(k)} S^{k^x}_{2m}(W); improves [67, Lemma 8.4]'s exponent 2m/deg to m/deg by direct computation with Casimir/diagonal generators. Mean-value estimate (3.19) for exp(delta Z).W - W."}, {"id": "norms-related-to-whittaker-models-section-3-2-6", "display": "norms related to Whittaker models (section 3.2.6)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p7", "kind": "definition", "genre": "original", "note": "Setup (3.2.6): L^2(N\\G; chi_2 chi_3) of N-equivariant functions transforming by chi_2 chi_3 under the center, for pi_2, pi_3 generic with pi_3 a unitary principal series. Chunk cuts off at the start of Lemma 3.2.7."}, {"id": "lemma-3-2-7-isometry-j-into-l-2-n-g", "display": "Lemma 3.2.7 (isometry J into L^2(N\\G))", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "result", "genre": "original", "note": "Lemma 3.2.7: J_{pi2,pi3}(W,f) = W.f is an isometry pi2 otimes pi3 -> L^2(N\\G; chi_2 chi_3). Proved by checking pure tensors via the Iwasawa decomposition (3.20)."}, {"id": "lemma-3-2-8-deformed-spherical-bound-3-21", "display": "Lemma 3.2.8 (deformed spherical bound (3.21))", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "result", "genre": "original", "note": "Lemma 3.2.8 (non-archimedean): for deformed spherical vectors with |s|,|t| <= delta/2, |<u.J(W otimes f), J_{s,t}(W_s otimes f_t)>| << ||W||^2 ||f||^2 ||Ad(u)||^{theta+delta-1}. Proved by comparison with complementary series (3.22) and the explicit estimate (3.23)."}, {"id": "normalized-hecke-functional-l-chi", "display": "normalized Hecke functional l_chi", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "definition", "genre": "original", "note": "Normalized Hecke functional l_chi on pi via (3.12) on the Kirillov model (meromorphic continuation); satisfies the equivariance (3.24); the space of such functionals is at most one-dimensional. Matrix-coefficient form (3.25): h_chi(v) = int <a(y)v,v> chi(y) d^xy."}, {"id": "lemma-3-3-2-non-archimedean-new-vector-values", "display": "Lemma 3.3.2 (non-archimedean new-vector values)", "status": "conjectural", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "result", "genre": "reframed", "note": "Lemma 3.3.2 ([67], Lemma 11.7): non-archimedean, v the new vector, r = conductor of chi: l_chi(n(varpi^{-r}) v) = eta_r (1-q^{-1}) L(pi otimes chi,1/2) if r=0, with |eta_r| = q^{-r/2-1}. Cited from [67], not proved here."}, {"id": "lemma-3-3-3-archimedean-test-vector", "display": "Lemma 3.3.3 (archimedean test vector)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "result", "genre": "original", "note": "Lemma 3.3.3 (archimedean): exists v in pi with S^pi_d(v) << C(pi)^{2d} and T with log|T| ~ log C(chi) such that |l_chi(n(T)v)| >> C(chi)^{-1/2-eps}, uniformly for Re(s) in compacts. Proved with a bump function via Lemma 3.1.14."}, {"id": "normalized-trilinear-functionals-l-w-and-l-rs", "display": "normalized trilinear functionals L_W and L_RS", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "definition", "genre": "original", "note": "Two normalizations of the trilinear functional: L_W via integrated matrix coefficients (3.26), and L_RS via Rankin-Selberg integral (3.28). Space of invariant trilinear functionals at most one-dimensional [59],[57],[45]. Unramified values (3.27),(3.29) in terms of L(pi1 otimes pi2 otimes pi3,1/2)/prod L(pi_i,Ad,1)."}, {"id": "lemma-3-4-2-plancherel-identity-3-30", "display": "Lemma 3.4.2 (Plancherel identity (3.30))", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "result", "genre": "original", "note": "Lemma 3.4.2: Plancherel identity (3.30) ||x1||^2||x3||^2 = int dmu_P(pi2) sum |L(x1,x2,x3)|^2 for L = L_RS or L_W. Proved from Lemma 3.2.7 plus the Whittaker-Plancherel theorem (3.31); |L_RS|^2 = |L_W|^2 extended beyond tempered by analytic continuation."}, {"id": "intertwiner-i-pi2", "display": "intertwiner I_{pi2}", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "definition", "genre": "original", "note": "Intertwiner I_{pi2}: pi1 otimes pi3 -> pi2 dual to the trilinear functional, L(x1 otimes x2 otimes x3) = <I_{pi2}(x1 otimes x3), x2>, with norm identity (3.32). Bernstein-Reznikov cited as extensive users of such local trilinear study."}, {"id": "u-norm", "display": "U-norm", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "definition", "genre": "original", "note": "U-norm (3.5.1): ||x||_U = (int_K |<kx,x>|^2 dk)^{1/4}, a norm (Gowers-U^4-like for compact abelian K); comparable to Sobolev norms: S^V_d << ||.||_U << S^V_{d_0} (proof of comparison omitted as unused). Distortion ||gx||_U <= C(g)||x||_U."}, {"id": "lemma-3-5-2-sobolev-bound-3-35", "display": "Lemma 3.5.2 (Sobolev bound (3.35))", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "result", "genre": "original", "note": "Lemma 3.5.2: for tempered pi_i, S^{pi_3}_d(I_{pi3}(x1 otimes x2)) << S^{pi_1}_{d_0}(x1) S^{pi_2}_{d_0}(x2) (3.35). Proved from (3.36) plus equivariance (xi in pi_i[m] => image in pi_3[m]) and (2.7)."}, {"id": "lemma-3-5-3-main-soft-bound", "display": "Lemma 3.5.3 (main soft bound)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p8", "kind": "result", "genre": "original", "note": "Lemma 3.5.3 (main soft bound): for tempered pi_i and any eta>0, S^{pi_3}_{-d_0}(I_{pi3}(x1 otimes x2)) <<_eps (vol B_eta)^eps ||x1||_U ||x2||_U + eta^{1-eps} S(x1)S(x2); i.e. bounded 'up to eps' by the U-norms. Proved via matrix-coefficient bounds. Section marked not strictly necessary (brute-force reproof later; under Ramanujan this suffices)."}, {"id": "non-tempered-variant-3-37-of-the-soft-bound", "display": "non-tempered variant (3.37) of the soft bound", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p9", "kind": "claim", "genre": "original", "note": "Remark: when pi_3 is not tempered, Lemma 3.5.3's bound becomes (3.37) with extra [K:U_i] factors and q^{(theta-1/2)(m+1)} decay. Paper's own variant."}, {"id": "proposition-3-6-1-test-vectors-with-lower-bound", "display": "Proposition 3.6.1 (test vectors with lower bound)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p9", "kind": "result", "genre": "original", "note": "Proposition 3.6.1: for generic unitary pi_1, pi_2 and pi_3 = 1 box chi_3, exist unit vectors x_i with S^{pi_i}_d(x_i) << 1 (i=1,2), S^{pi_3}_d(x_3) << 1, ||x_3||_U << C_1^{-1/4+eps}, |L(x_1,x_2,x_3)| >> C_1^{-1/2-eps}. Unramified case: new vectors with exact value zeta_k(2)^{-1} 2L(pi1 otimes pi2 otimes pi3,1/2)/prod L(pi_i,Ad,1)."}, {"id": "non-archimedean-test-vector-construction-3-38", "display": "non-archimedean test vector construction (3.38)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p9", "kind": "method", "genre": "original", "note": "Non-archimedean: x_1, x_2 new vectors; x_3 from f_3|_K = vol(K_0[f])^{-1/2} chi_3(d) 1_{K_0[f]} (3.38), f = max conductor valuation. Gives ||x_3||_U = vol(K_0[f])^{1/4} and the lower bound via (3.28)."}, {"id": "archimedean-test-vector-construction-3-39-3-45", "display": "archimedean test vector construction (3.39)-(3.45)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p9", "kind": "method", "genre": "original", "note": "Archimedean tempered: x_1, x_2 from bump phi in Kirillov model; x_3 from f_3 bump around K cap B supported in K_C (3.40) with C = C_2^{M(1+delta)} max(C_1,C_2). Main term l(W_1,W_2) >= 0.9 dominates K-translate errors via (3.19) and Prop 3.2.3, giving |L| >> C_1^{-1/2-delta/2}."}, {"id": "construction-of-x-3-definition-3-6-4", "display": "construction of x_3 (Definition 3.6.4)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p9", "kind": "definition", "genre": "original", "note": "Definition 3.6.4: Psi_3(x,y) = phi_1(x) phi_2(y) with phi_1(x)=phi(C|x|), phi_2(y)=chi_3(y)phi(|y|-1); f(g) = |det g|^{1/2} int Psi_3((0,t)g) chi(t)|t| d^xt; f_3 = f/||f||_{L^2(K)} with ||f|| ~ C^{-1/2}. Non-archimedean specialization (3.44) recovers (3.38)."}, {"id": "non-tempered-test-vector-choice-section-3-6-5", "display": "non-tempered test vector choice (section 3.6.5)", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p9", "kind": "method", "genre": "original", "note": "Non-tempered pi_2 = pi_2^0 |.|^{it} with C(pi_2^0) <= 9: choose phi from a finite set F of bump functions with int phi_i(y) W_2^0(a(y))|y|^{-1/2} d^xy >> 1; x_1, x_2 adjusted by |.|^{+-it} twists. Same lower bound follows."}, {"id": "proposition-3-7-1-computational-bound-3-46", "display": "Proposition 3.7.1 (computational bound (3.46))", "status": "exact", "cluster": "analytics", "chunk": "a2_michelvenkatesh_p9", "kind": "result", "genre": "original", "note": "Proposition 3.7.1: for the 3.6.1 test vectors, unramified case gives exact |L(x,x_3,x-tilde_3)|^2/||x||^2 = zeta_k(2)^{-1} 2L(pi otimes pi_3 otimes tilde pi_3,1/2)/(||x_3||^2||x-tilde_3||^2 prod L(Ad,1)); in general |L|^2 << C_1^{theta-1/2} C(chi_3)^{-1/2} S^pi_{d_0}(x) (3.46). Replaces section 3.5 under Ramanujan; 'ugly computations' the reader may skip."}, {"id": "c
