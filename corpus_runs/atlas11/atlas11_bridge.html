const GRAPH = /*__GRAPH__*/{"subjects": {"spherical-hecke-algebra-and-hecke-eigenvalues-as": {"display": "spherical Hecke algebra and Hecke eigenvalues as conjugacy classes", "status": "exact", "cluster": "bridge", "facets": [{"chunk": "b1_frenkel_p4", "cid": "c5", "label": "spherical Hecke algebra and Hecke eigenvalues", "kind": "definition", "status": "exact", "genre": "original", "note": "Spherical Hecke algebra H_p = polynomial algebra in H_1,p, H_2,p (double cosets M_1, M_2); unramified v_p is eigenvector; h_1,p the Hecke eigenvalue; H_2 v_p = v_p for chi = 1."}, {"chunk": "b1_frenkel_p6", "cid": "c2", "label": "spherical Hecke algebra and Hecke eigenvalues as conjugacy classes", "kind": "result", "status": "exact", "genre": "original", "note": "pi = tensor'_x pi_x; spherical Hecke algebra H_x freely generated by H_1..H_{n-1}, H_n^{+-1} (2.5); eigenvalues packaged as (z_1..z_n) with H_i,x = q_x^{i(n-i)/2} s_i(z) (2.7); H_x ~= C[z_i^{+-1}]^{S_n} (2.8); strong multiplicity one (Piatetski-Shapiro)."}], "status_note": null, "chunks": ["b1_frenkel_p4", "b1_frenkel_p6"], "killed_facets": 0}}, "standalone": [{"id": "langlands-duality-and-qft-string-dualities-as-no", "display": "Langlands duality and QFT/string dualities as non-abelian Fourier transforms", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "claim", "genre": "original", "note": "Survey framing: Langlands duality and QFT/string dualities both 'emerged as some sort of non-abelian Fourier transforms'; stated as long-standing suspicion, not derived."}, {"id": "langlands-dual-group-lg-also-of-goddard-nuyts-ol", "display": "Langlands dual group LG, also of Goddard-Nuyts-Olive", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "definition", "genre": "identification", "note": "Langlands dual group introduced by R. Langlands [1]; independently introduced by Goddard, Nuyts, Olive in 4d gauge theory [2]; cited as established fact."}, {"id": "witten-s-s-duality-to-langlands-duality-scenario", "display": "Witten's S-duality to Langlands duality scenario via dimensional reduction", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "claim", "genre": "original", "note": "Witten's scenario [3]: dimensional reduction of 4d gauge theory to 2d; 't Hooft operators (Kapustin [4]) become Hecke operators; eigenbrane becomes Hecke eigensheaf. Presented as outlined scenario."}, {"id": "kapustin-witten-relation-of-langlands-duality-to", "display": "Kapustin-Witten relation of Langlands duality to S-duality", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "result", "genre": "reframed", "note": "Cited result of Kapustin and Witten: Langlands duality closely related to S-duality of QFT [4]; paper reports it, does not prove it here."}, {"id": "geometric-langlands-correspondence-bundles-with-", "display": "geometric Langlands correspondence (bundles with connection to Hecke eigensheaves)", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "conjecture", "genre": "original", "note": "Geometric Langlands correspondence as formulated in survey: rank-n bundle E with holomorphic connection on X -> Hecke eigensheaf on Bun_n; general G: LG-bundle with connection -> Hecke eigensheaf on Bun_G. Stated as prediction."}, {"id": "hecke-eigensheaf-as-d-module-on-bun-g", "display": "Hecke eigensheaf as D-module on Bun_G", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "definition", "genre": "original", "note": "Hecke eigensheaf defined as a D-module on Bun_G satisfying a property determined by E; precise definitions deferred to Part II."}, {"id": "conformal-blocks-as-sections-with-projectively-f", "display": "conformal blocks as sections with projectively flat connection on moduli spaces", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "claim", "genre": "reframed", "note": "Conformal blocks of rational CFT as sections of holomorphic bundle with projectively flat connection on moduli of curves [6,7], Segal axioms [8]; WZW/affine symmetry gives bundle on moduli of G-bundles [9,10]. Survey restatement of established results."}, {"id": "flat-bundles-as-holonomic-twisted-d-modules", "display": "flat bundles as holonomic (twisted) D-modules", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "claim", "genre": "original", "note": "Derived in text: sheaf of holomorphic sections of (E, flat nabla) carries action of holomorphic differential operators -> holonomic D-module; projectively flat -> twisted D-module."}, {"id": "beilinson-drinfeld-construction-of-hecke-eigensh", "display": "Beilinson-Drinfeld construction of Hecke eigensheaves at critical level", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "result", "genre": "reframed", "note": "Beilinson-Drinfeld [15]: D-module of conformal blocks for LG-oper E is the Hecke eigensheaf with eigenvalue E, for opers (other flat bundles similar). Cited theorem, Part III to explain."}, {"id": "beilinson-drinfeld-chiral-hecke-algebra-conjectu", "display": "Beilinson-Drinfeld chiral Hecke algebra conjecture", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "conjecture", "genre": "original", "note": "Beilinson-Drinfeld conjecture: chiral Hecke algebra (integral level k < -h^vee) twisted by LG-bundle E gives CFT whose conformal blocks are Hecke eigensheaf with eigenvalue E; abelian case in [18]. Stated as conjecture."}, {"id": "affine-lie-algebra-at-critical-level-k-h-vee", "display": "affine Lie algebra at critical level k = -h^vee", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "definition", "genre": "original", "note": "Critical level k = -h^vee: Segal-Sugawara current becomes commutative, no stress tensor/Virasoro; affine symmetry remains so conformal-block construction still yields D-module on Bun_G depending on projective connection."}, {"id": "center-of-chiral-algebra-as-classical-w-algebra-", "display": "center of chiral algebra as classical W-algebra of LG; LG-opers", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p1", "kind": "result", "genre": "reframed", "note": "Center of chiral algebra canonically isomorphic to classical W-algebra of LG (Drinfeld-Sokolov [13], limit of W-algebra isomorphism [11,12]); recast as LG-opers by Beilinson-Drinfeld [14]. Cited results."}, {"id": "lang-rosenlicht-reciprocity-and-sheaves-vs-funct", "display": "Lang-Rosenlicht reciprocity and sheaves vs functions", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p10", "kind": "result", "genre": "reframed", "note": "Reciprocity identity for divisors proved by Lang-Rosenlicht [64] in abelian class field theory; contrast: sheaves see the simply-connected Abel-Jacobi fibers, invisible at function level — motivation for geometrization."}, {"id": "complex-curve-construction-of-aut-e-via-abeliani", "display": "complex-curve construction of Aut_E via abelianization", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p10", "kind": "result", "genre": "original", "note": "Over C: rank-one local system E = pi_1(X) -> C^x factors through H_1(X,Z) ~= pi_1(Jac); gives E_Jac = Aut^0_E; map j: X -> Jac induces H_1 isomorphism, explaining descent of E^{(d)} along Abel-Jacobi fibers."}, {"id": "loc-1-as-twisted-cotangent-bundle-of-the-jacobia", "display": "Loc_1 as twisted cotangent bundle of the Jacobian", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p10", "kind": "definition", "genre": "original", "note": "Loc_1 (moduli of flat line bundles) fibers over Jac = Pic^0 with affine-space fibers over H^0(X,Omega); Loc_1 is the twisted cotangent bundle T^*Jac via Serre duality; also moduli of flat line bundles on Jac."}, {"id": "laumon-rothstein-fourier-mukai-equivalence", "display": "Laumon-Rothstein Fourier-Mukai equivalence", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p10", "kind": "result", "genre": "reframed", "note": "Laumon [65], Rothstein [66]: functors F, G via universal bundle P (4.5) give equivalence D^b(O_{Loc_1}) <-> D^b(D_Jac-mod) (4.6); skyscraper S_E <-> Aut^0_E. Generalization of Fourier-Mukai (A^vee -> A^natural)."}, {"id": "hecke-eigensheaves-as-spectral-basis", "display": "Hecke eigensheaves as spectral basis", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p10", "kind": "claim", "genre": "original", "note": "Hecke eigensheaves as 'good basis' of derived category (Fourier-integral picture); classical analogue: Hecke eigenfunctions form a basis of cuspidal functions. Presented as interpretation."}, {"id": "explicit-d-module-aut-0-e-omega-and-restricted-t", "display": "explicit D-module Aut^0_{E_omega} and restricted transform", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p10", "kind": "result", "genre": "original", "note": "Explicit: Aut^0_{E_omega} = D/Ker lambda_omega (4.7) for flat bundle (F_0, d+omega); D_Jac commutative = Fun H^0(X,Omega); restricted transform M -> D tensor_{D_Jac} M (4.9); O-module i_*(O_{p^{-1}(F_0)}) <-> D."}, {"id": "spherical-hecke-algebra-for-reductive-groups", "display": "spherical Hecke algebra for reductive groups", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p11", "kind": "definition", "genre": "original", "note": "Spherical Hecke algebra H(G(F),G(O)) for split reductive G; character/cocharacter lattices P, Pˇ, roots/coroots; torus case: H(T(F),T(O)) ~= C[Pˇ] = Rep Tˇ via lambdaˇ(t) -> e^{lambdaˇ}."}, {"id": "satake-isomorphism", "display": "Satake isomorphism", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p11", "kind": "result", "genre": "reframed", "note": "Satake isomorphism (Theorem 4, [67]): H -> C[Pˇ] injective with image C[Pˇ]^W (Weyl invariants); via integration over unipotent N(F) with rho-shift; naive restriction not an algebra map."}, {"id": "langlands-dual-group-and-spec-h-as-conjugacy-cla", "display": "Langlands dual group and Spec H as conjugacy classes", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p11", "kind": "definition", "genre": "original", "note": "Langlands dual group LG(C): characters/cocharacters and roots/coroots interchanged; GL_n self-dual, SL_n <-> PGL_n, SO_{2n+1} <-> Sp_n, SO_{2n} self-dual. Theorem 5: H ~= Rep LG(C); Spec H <-> semisimple conjugacy classes in LG(C)."}, {"id": "langlands-correspondence-for-general-reductive-g", "display": "Langlands correspondence for general reductive groups", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p11", "kind": "conjecture", "genre": "original", "note": "Proposed correspondence: automorphic reps of G(A) <-> homomorphisms sigma: Gal(Fbar/F) -> LG(Q_l), matching Hecke and Frobenius LG-conjugacy classes; complications: L-packets/A-packets, multiplicities > 1 [63]; precise statement subtle."}, {"id": "langlands-functoriality-principle", "display": "Langlands functoriality principle", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p11", "kind": "claim", "genre": "original", "note": "Functoriality principle (footnote): relationship between automorphic reps of H(A) and G(A) for homomorphisms ^L H -> ^L G; the Langlands correspondence is the H = {1} case."}, {"id": "categorification-via-affine-grassmannian", "display": "categorification via affine Grassmannian", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p11", "kind": "claim", "genre": "original", "note": "Categorification: Satake bases mismatch via (5.2); G(F)/G(O) = points of affine Grassmannian Gr; G(O)-equivariant perverse sheaves on Gr; orbits Gr_lambda stratified by mu <= lambda. Program in progress."}, {"id": "ic-sheaves-categorify-the-satake-isomorphism", "display": "IC sheaves categorify the Satake isomorphism", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p12", "kind": "result", "genre": "original", "note": "IC_lambda: Goresky-MacPherson extension of constant sheaf on Gr_lambda; K_0(P_{G(O)}) identified with H via trace of Frobenius; (5.2) coefficients a_{lambda mu} = stalk cohomology dimensions of IC_lambda; H_lambda = q^{-<rho,lambda>} c_lambda iff lambda miniscule (all fundamental weights for GL_n)."}, {"id": "affine-grassmannian-of-pgl-2", "display": "affine Grassmannian of PGL_2", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p12", "kind": "result", "genre": "original", "note": "PGL_2 affine Grassmannian: two components Gr^{(0)}, Gr^{(1)}; orbits Gr_n (dim 2n) indexed by Z_+; IC_n is constant sheaf; N((t))-orbit description of intersections."}, {"id": "geometric-satake-equivalence-p-g-o-rep-lg", "display": "geometric Satake equivalence P_{G(O)} = Rep LG", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p12", "kind": "result", "genre": "reframed", "note": "Theorem 6 (Drinfeld conjectured; Mirkovic-Vilonen [69] proved; Ginzburg [70], Lusztig [71] earlier): P_{G(O)} equivalent to Rep LG as tensor categories (convolution via Beilinson-Drinfeld Grassmannian); fiber functor = cohomology; Tannakian reconstruction of LG."}, {"id": "hecke-functors-and-eigensheaves-for-general-redu", "display": "Hecke functors and eigensheaves for general reductive G", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p12", "kind": "definition", "genre": "original", "note": "Hecke stack for general G; H_lambda(F) = h->_*(h<-^*(F) tensor IC_lambda) (6.1); Hecke eigensheaf: isomorphisms i_lambda: H_lambda(F) -> V^E_lambda boxtimes F compatible with tensor structure (6.2); reduces to (3.9) for GL_n."}, {"id": "conjecture-1-geometric-langlands-for-general-g", "display": "Conjecture 1: geometric Langlands for general G", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p12", "kind": "conjecture", "genre": "original", "note": "Conjecture 1: irreducible LG-local system E (provisionally: not reducible to proper parabolic; no consensus noted) -> nonzero Hecke eigensheaf Aut_E on Bun_G, irreducible per component; D-module version over C via Riemann-Hilbert."}, {"id": "categories-aut-e-and-eisenstein-series", "display": "categories Aut_E and Eisenstein series", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p12", "kind": "claim", "genre": "original", "note": "Categories Aut_E; reducible E -> geometric Eisenstein series [61] (complexes, not perverse); Aut(E) action (center acts by characters of pi_1(G)); constant sheaf on Bun_G has 'eigenvalue' a complex of local systems."}, {"id": "non-abelian-fourier-mukai-transform", "display": "non-abelian Fourier-Mukai transform", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p13", "kind": "conjecture", "genre": "original", "note": "Naive non-abelian Fourier-Mukai (6.3): equivalence D^b(O_{Loc_LG}) <-> D^b(D-mod on Bun^circ_G); skyscraper at E -> Aut_E; Hecke eigensheaves as 'basis'. Stated as naive expectation."}, {"id": "difficulties-stack-structure-and-unbounded-compl", "display": "difficulties: stack structure and unbounded complexes", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p13", "kind": "claim", "genre": "original", "note": "Difficulties: Loc_LG is a complicated stack (automorphism groups vary: generic none, trivial local system has LG); unbounded complexes; categories unclear [62]; universal kernel extension to all of Loc_LG x Bun_G is the main problem."}, {"id": "beilinson-drinfeld-oper-special-case", "display": "Beilinson-Drinfeld oper special case", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p13", "kind": "result", "genre": "reframed", "note": "Beilinson-Drinfeld special case: functor from O-modules supported on opers Op_{Lg}(X) -> Loc_LG to D-modules on Bun_G; sends i_*(O_{Op}) to the sheaf D itself (details in Sect. 9). Cited as constructed."}, {"id": "two-parameter-deformation-of-fourier-mukai", "display": "two-parameter deformation of Fourier-Mukai", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p13", "kind": "conjecture", "genre": "original", "note": "Two-parameter family D_{k,lambda} of algebras on Bun^circ_G interpolating differential operators, twisted operators, and symbols; lambda-connections; Loc^lambda_G; conjectured symmetric equivalence (6.4) D_{k,lambda} <-> D^vee_{k^vee,lambda^vee} with k = (k^vee)^{-1}; quantum correction: shift by dual Coxeter numbers (Sect. 8.6)."}, {"id": "hitchin-fibration-and-fiberwise-transform", "display": "Hitchin fibration and fiberwise transform", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p13", "kind": "claim", "genre": "original", "note": "Hitchin fibration T^*Bun^circ_G -> H_G with abelian-variety generic fibers; hoped fiberwise Fourier-Mukai equivalence; singular fibers obstruct; results near lambda = 0 in [78]."}, {"id": "d-modules-as-d-branes", "display": "D-modules as D-branes", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p13", "kind": "question", "genre": "original", "note": "Speculative question opening Sect. 6.4: could D-modules be interpreted as D-branes (cf. Kontsevich homological mirror symmetry)? No answer given in chunk."}, {"id": "non-abelian-hodge-diffeomorphism-and-langlands", "display": "non-abelian Hodge diffeomorphism and Langlands", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p14", "kind": "claim", "genre": "original", "note": "Non-abelian Hodge diffeomorphism [80]: T^*Bun and Loc underlying real manifolds diffeomorphic, hyperkaehler with two complex structures; what this has to do with Langlands is presently unknown."}, {"id": "cft-as-factory-for-d-modules-on-bun-g", "display": "CFT as factory for D-modules on Bun_G", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p14", "kind": "claim", "genre": "original", "note": "Programmatic claim: CFTs with affine Kac-Moody symmetry are a 'factory' for (twisted) D-modules on Bun_G; Hecke eigensheaves may be obtained this way."}, {"id": "affine-kac-moody-algebra-and-wzw-hilbert-space", "display": "affine Kac-Moody algebra and WZW Hilbert space", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p14", "kind": "definition", "genre": "original", "note": "Affine Kac-Moody algebra as central extension (7.1) with kappa_0 normalized (maximal root)^2 = 2 [100]; level k; WZW Hilbert space H_k = direct sum L_lambda tensor Lbar_lambda [81]."}, {"id": "conformal-blocks-and-coinvariants-via-ward-ident", "display": "conformal blocks and coinvariants via Ward identities", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p14", "kind": "definition", "genre": "original", "note": "Conformal blocks: g^out = g tensor C[X minus points]-invariant functionals (7.3); coinvariants = tensor product / g^out action (7.4); chiral Ward identities; correlators as |phi|^2 with hermitean metric."}, {"id": "projectively-flat-connection-and-conformal-anoma", "display": "projectively flat connection and conformal anomaly", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p14", "kind": "result", "genre": "original", "note": "Projectively flat connection on conformal-block bundles over M_{g,n} via stress-tensor insertion (7.5); Virasoro uniformization (7.6); projective (not flat) due to Schwarzian/central charge = conformal anomaly [7,85-89]."}, {"id": "rational-vs-non-rational-cft-and-twisted-d-modul", "display": "rational vs non-rational CFT and twisted D-modules", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p14", "kind": "claim", "genre": "original", "note": "Rational CFT: finite-dimensional blocks, modular functor [8]; general CFT: work with coinvariants (discrete topology); sheaves of coinvariants as twisted D-modules [20]."}, {"id": "p-twisted-conformal-blocks-on-bun-g", "display": "P-twisted conformal blocks on Bun_G", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p14", "kind": "definition", "genre": "original", "note": "P-twisted conformal blocks: g^P_out = Gamma(X minus points, g_P) (7.7) for G-bundle P; embedding into loop algebras lifts via residue theorem; start of Bun_G construction [9,91,93,94,95,83,20]."}, {"id": "kac-moody-uniformization-of-bun-g", "display": "Kac-Moody uniformization of Bun_G", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p15", "kind": "result", "genre": "original", "note": "Global Kac-Moody uniformization Bun_G ~= G^out\\G((t))/G[[t]] (7.8) [96,97] (Harder: trivial on X minus point); tangent space g^out\\g((t))/g[[t]]; variation formula (7.9) via current insertions J^a(t); Ward identity makes it well-defined."}, {"id": "twisted-d-modules-from-nonzero-level", "display": "twisted D-modules from nonzero level", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p15", "kind": "claim", "genre": "original", "note": "Connection is projectively flat, not flat, for nonzero level k: twisted D-modules; analogue of conformal anomaly; gauged WZW picture [82,83,84] as alternative derivation."}, {"id": "localization-functor-for-harish-chandra-pairs", "display": "localization functor for Harish-Chandra pairs", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p15", "kind": "definition", "genre": "original", "note": "Localization functor for Harish-Chandra pair (g,K): Delta(V) = coinvariants (V tensor O)/Ker a on H\\G/K; projective reps (central extension bg) give twisted differential operators D'_k; Delta: (bg,K)-mod_k -> D'_k-mod."}, {"id": "coinvariants-as-d-modules-on-bun-g-via-localizat", "display": "coinvariants as D-modules on Bun_G via localization", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p15", "kind": "result", "genre": "original", "note": "For G((t)), G^out, G[[t]]: Delta(V) on Bun_G is the CFT sheaf of coinvariants, fiber V/g^P_out . V; line bundle L (non-abelian theta) from universal central extension; D'_k exists for arbitrary complex k [15,98,99]."}, {"id": "wzw-d-module-and-kzb-equations", "display": "WZW D-module and KZB equations", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p16", "kind": "result", "genre": "original", "note": "WZW D-module Delta(L_{0,k}): integrable vacuum rep gives vector bundle with projectively flat connection; conformal blocks = Gamma(Bun_G, L^{tensor k}); chiral partition function; KZB equations [9,93]; combined curve+bundle moduli."}, {"id": "beilinson-bernstein-analogy-for-loop-groups", "display": "Beilinson-Bernstein analogy for loop groups", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p16", "kind": "claim", "genre": "original", "note": "Beilinson-Bernstein analogy: non-integrable bg representations (not exponentiating to G_b) yield more sophisticated D-modules than line bundles; line bundles do not tell the whole story."}, {"id": "critical-level-from-commuting-differential-opera", "display": "critical level from commuting differential operators", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p16", "kind": "claim", "genre": "original", "note": "Heuristic: commuting global differential operators expected where L^{tensor k} ~= K^{1/2}; since K ~= L^{tensor -2h^vee}, expect k = -h^vee; Segal-Sugawara becomes commutative and central there."}, {"id": "chiral-algebra-and-segal-sugawara-current", "display": "chiral algebra and Segal-Sugawara current", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p16", "kind": "definition", "genre": "original", "note": "Chiral algebra V_k(g) = vacuum Verma Ind U(bg) tensor C_k; state-field correspondence; Segal-Sugawara vector S = (1/2) J_{a,-1} J^a_{-1} v_k (8.2) with field S(z)."}, {"id": "virasoro-from-segal-sugawara-centrality-at-criti", "display": "Virasoro from Segal-Sugawara; centrality at critical level", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p16", "kind": "result", "genre": "original", "note": "OPEs give Virasoro L_n = (k+h^vee)^{-1} S_n with central charge c_k for k != -h^vee; at k = -h^vee the S_n commute with bg (central): no internal Virasoro, hence 'critical level'."}, {"id": "theorem-7-center-of-sl-2-chiral-algebra", "display": "Theorem 7: center of sl_2 chiral algebra", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p16", "kind": "result", "genre": "reframed", "note": "Theorem 7 (sl_2): center z_k trivial for k != -2; z_{-2} = C[S_n]_{n<=-2} generated by Segal-Sugawara current and derivatives. Cited theorem."}, {"id": "center-as-functions-on-projective-connections", "display": "center as functions on projective connections", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p17", "kind": "result", "genre": "original", "note": "At k = -2, S(z) transforms as a projective connection (operator d_z^2 - v(z): Omega^{-1/2} -> Omega^{3/2}); (8.5) z_{-2}(sl_2) ~= Fun Proj(D), coordinate-independent isomorphism."}, {"id": "theorem-8-feigin-frenkel-description-of-the-cent", "display": "Theorem 8: Feigin-Frenkel description of the center", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p17", "kind": "result", "genre": "reframed", "note": "Theorem 8 (Feigin-Frenkel [11,12]): z(g) ~= C[d^n S_i], deg S_i = d_i + 1, S_1 the Segal-Sugawara element; normal-ordering distortion makes explicit formulas unknown in general."}, {"id": "g-opers-and-the-oper-moduli-space", "display": "g-opers and the oper moduli space", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p17", "kind": "definition", "genre": "original", "note": "g-oper: gauge class of operators d_t + sum psi_i f_i + v(t) (8.9) under N_+-gauge; canonical form d_t + p_{-1} + sum v_j p_j (8.10) via principal sl_2 triple; coordinate-free as (F, nabla, F_{B+}); Op_g(X) ~= Proj(X) x prod H^0(Omega^{tensor(d_j+1)}); oper G-bundle (most unstable)."}, {"id": "theorem-9-center-as-functions-on-lg-opers", "display": "Theorem 9: center as functions on Lg-opers", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p17", "kind": "result", "genre": "reframed", "note": "Theorem 9 (Feigin-Frenkel [11,12]): z(g) canonically ~= Fun Op_{Lg}(D); Z(bg) ~= Fun Op_{Lg}(D^x) (8.14) as Poisson algebras; classical W-algebra of Lg via Drinfeld-Sokolov reduction; Adler-Gelfand-Dickey for sl_n."}, {"id": "dual-lie-algebra-appearance-links-to-langlands", "display": "dual Lie algebra appearance links to Langlands", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p17", "kind": "claim", "genre": "original", "note": "The appearance of the Langlands dual Lie algebra Lg in the center is what ultimately makes contact with the geometric Langlands correspondence. Interpretive claim."}, {"id": "free-field-realization-at-critical-level", "display": "free field realization at critical level", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p18", "kind": "result", "genre": "original", "note": "Free field (Wakimoto [103], Feigin-Frenkel [104]) realization V_k(sl_2) -> F tensor pi_0 (8.16); at k = -2 rescale to injective V_{-2} -> F tensor pi~_0 with z(sl_2) embedded in commutative pi~_0."}, {"id": "miura-transformation", "display": "Miura transformation", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p18", "kind": "result", "genre": "original", "note": "Miura transformation (8.17): S(z) -> (1/4)b~(z)^2 - (1/2)d_z b~(z); map Conn(D) -> Proj(D) sending d_z + u(z) to d_z^2 - v(z)."}, {"id": "center-as-kernel-of-screening-operators", "display": "center as kernel of screening operators", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p18", "kind": "result", "genre": "original", "note": "z(sl_2) = kernel of regularized screening operator V~ on pi~_0 [11]; screening operators of Dotsenko-Fateev [108]; image of V_k in F tensor pi_0 = kernel of G = int beta V_{-1/nu}."}, {"id": "t-duality-origin-of-the-center-identification", "display": "T-duality origin of the center identification", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p18", "kind": "claim", "genre": "original", "note": "T-duality interpretation: electric (8.21) and magnetic (8.22) vertex operators interchanged under radius inversion; kernel coincidence = deformed T-dual theories agree; limit nu -> 0 gives z(sl_2) ~= Fun Proj(D)."}, {"id": "w-algebra-duality-and-theorem-9-as-limit", "display": "W-algebra duality and Theorem 9 as limit", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p18", "kind": "result", "genre": "reframed", "note": "W-algebra duality W_k(g) ~= W_{k^vee}(^Lg) (8.26) with r^vee(k+h^vee) = (k^vee+h^{veevee})^{-1} (r^vee = lacing number); limit k -> -h^vee recovers Theorem 9. From [11,12]."}, {"id": "t-duality-behind-the-dual-group-correction-to-6-", "display": "T-duality behind the dual group; correction to (6.4)", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p19", "kind": "claim", "genre": "original", "note": "T-duality ultimately responsible for the Langlands dual Lie algebra in the center; W-algebra duality (8.26) forces adjusting (6.4): replace k = k^vee^{-1} by the (8.26) relation (footnote 78)."}, {"id": "delta-of-vacuum-module-as-twisted-differential-o", "display": "Delta of vacuum module as twisted differential operators", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p19", "kind": "result", "genre": "original", "note": "Delta(V_k(g)) = D'_k, the sheaf of twisted differential operators on Bun_G; via quantized Hamiltonian (BRST) reduction of D on G^out\\G((t)); symbols reduce by ordinary Hamiltonian reduction."}, {"id": "v-chi-modules-parameterized-by-opers", "display": "V_chi modules parameterized by opers", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p19", "kind": "definition", "genre": "original", "note": "z(g) = End_{bg}(V_{-h^vee}(g)) (9.1); V_chi = V_{-h^vee}(g)/Ker chi~ . V_{-h^vee}(g) (9.2) for oper chi in Op_{Lg}(D); sl_2 example: S_n set to v_n; V_{-h^vee} as vector bundle over Op_{Lg}(D), V_chi its fiber."}, {"id": "no-canonical-zero-oper-aut-o-mixes-fibers", "display": "no canonical zero oper; Aut O mixes fibers", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p19", "kind": "claim", "genre": "original", "note": "No intrinsic zero projective connection (v(t) = 0 not coordinate-invariant); Aut O (formal diffeomorphisms) does not preserve fibers V_chi; Der O/Virasoro not internal at critical level — key difference from non-critical reps."}, {"id": "coordinate-independent-localization-at-x", "display": "coordinate-independent localization at x", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p19", "kind": "definition", "genre": "original", "note": "Coordinate-independent localization Delta_x: Bun_G = G^out\\G(F_x)/G(O_x) (9.4); z(g)_x ~= Fun Op_{Lg}(D_x) (9.5) canonically; V_{chi_x} defined without choosing a coordinate."}, {"id": "delta-x-v-chi-as-hecke-eigensheaves-preview", "display": "Delta_x(V_chi) as Hecke eigensheaves (preview)", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p19", "kind": "claim", "genre": "original", "note": "Preview: the D-modules Delta_x(V_{chi_x}) turn out to be the sought-after Hecke eigensheaves (Beilinson-Drinfeld theorem, stated next); K^{1/2} ~= L^{tensor -h^vee} makes D'_{-h^vee}-modules ordinary after tensoring."}, {"id": "number-field-and-galois-group-gal-k-f", "display": "number field and Galois group Gal(K/F)", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p2", "kind": "definition", "genre": "original", "note": "Expository definitions: number field as finite extension of Q; Gal(K/F) as F-automorphisms; restriction homomorphism Gal(K'/F) -> Gal(K/F) with kernel Gal(K'/K)."}, {"id": "gal-q-zeta-n-q-isomorphic-to-z-nz-x", "display": "Gal(Q(zeta_N)/Q) isomorphic to (Z/NZ)^x", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p2", "kind": "result", "genre": "original", "note": "Gal(Q(zeta_N)/Q) identified with (Z/NZ)^x via [n]: zeta_N -> zeta_N^n; restriction matches reduction mod M. Derived in text."}, {"id": "kronecker-weber-theorem-on-q-ab", "display": "Kronecker-Weber theorem on Q^ab", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p2", "kind": "result", "genre": "reframed", "note": "Classical Kronecker-Weber theorem: Q^ab is the union of cyclotomic fields Q(zeta_N); hence Gal(Q^ab/Q) = lim<- (Z/NZ)^x (1.1). Cited as known."}, {"id": "p-adic-numbers-p-adic-norm-ostrowski-s-theorem", "display": "p-adic numbers, p-adic norm, Ostrowski's theorem", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p2", "kind": "definition", "genre": "original", "note": "p-adic numbers Q_p as series (1.2), p-adic norm, completion of Q; Ostrowski's theorem: completions of Q are Q_p or R. Expository, standard."}, {"id": "gal-q-ab-q-as-zhat-x-product-of-z-p-x", "display": "Gal(Q^ab/Q) as Zhat^x = product of Z_p^x", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p2", "kind": "result", "genre": "original", "note": "Derived: Zhat = lim<- Z/NZ ~= product_p Z_p (1.3)-(1.4); Gal(Q^ab/Q) ~= Zhat^x ~= product_p Z_p^x. Computation in text from Kronecker-Weber."}, {"id": "adeles-and-ideles-as-restricted-product", "display": "adeles and ideles as restricted product", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p2", "kind": "definition", "genre": "original", "note": "Adeles A_F as restricted product of completions F_v (integral at almost all non-archimedean v); ideles A_F^x; diagonal embeddings; A_Q ~= (Zhat tensor Q) x R, Q\\A_Q compact."}, {"id": "abelian-class-field-theory-isomorphism", "display": "abelian class field theory isomorphism", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p2", "kind": "result", "genre": "reframed", "note": "Abelian class field theory (1.5): Gal(F^ab/F) ~= group of connected components of F^x\\A_F^x. Stated as classical theorem; rigidifying property deferred to Frobenius subsection."}, {"id": "frobenius-automorphism-of-finite-fields", "display": "Frobenius automorphism of finite fields", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p2", "kind": "definition", "genre": "original", "note": "Frobenius automorphism x -> x^p generates Gal(F_q/F_p) ~= Z/nZ; Gal(Fbar_q/F_q) ~= Zhat with preferred topological generator projecting to 1 mod n."}, {"id": "theorem-10-beilinson-drinfeld-hecke-eigensheaves", "display": "Theorem 10: Beilinson-Drinfeld Hecke eigensheaves", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p20", "kind": "result", "genre": "reframed", "note": "Theorem 10 (Beilinson-Drinfeld [15]): (1) Delta_x(V_{chi_x}) != 0 iff chi_x extends to a global Lg-oper chi on X; (2) independent of x; (3) Delta_x(V_{chi_x}) tensor K^{-1/2} is holonomic and a Hecke eigensheaf with eigenvalue E_chi. Gives Conjecture 1 for opers."}, {"id": "ward-identities-force-global-extension-of-opers", "display": "Ward identities force global extension of opers", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p20", "kind": "result", "genre": "original", "note": "Ward identities (9.6)-(9.7) + residue theorem: one-point functions <J^a(z)> extend holomorphically from D_x to X; S(z) central => projective connection d_z^2 - <S(z)> extends globally; hence coinvariants vanish unless chi_x extends. The 'only if' direction."}, {"id": "adelic-localization-and-x-independence", "display": "adelic localization and x-independence", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p20", "kind": "result", "genre": "original", "note": "Adelic localization Delta_X; inserting vacuum modules at extra points does not change coinvariants (9.8); two-point realization gives Delta_x(V_{chi_x}) ~= Delta_{x,y}(V_{chi_x}, V_{-h^vee}(g)_y); proves x-independence."}, {"id": "w-lambda-isomorphism-and-hecke-as-vertex-inserti", "display": "W_lambda isomorphism and Hecke as vertex insertions", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p20", "kind": "result", "genre": "reframed", "note": "Key isomorphism W_lambda = Gamma(Gr, IC_lambda tensor L~^{tensor -h^vee}) ~= V_lambda tensor V_{-h^vee}(g) (9.12), vanishing (9.13) [15]; Hecke functors = insertion of vertex operators from W_lambda; proof via renormalized enveloping algebra U^natural."}, {"id": "aut-e-from-opers-realizes-conjecture-1", "display": "Aut_E from opers realizes Conjecture 1", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p20", "kind": "claim", "genre": "original", "note": "Interpretation: Aut_E = Delta_x(V_{chi_x}) tensor K^{-1/2} realizes Conjecture 1 for LG-local systems admitting an oper structure. Stated as consequence."}, {"id": "quantization-of-the-hitchin-system", "display": "quantization of the Hitchin system", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p21", "kind": "result", "genre": "original", "note": "Beilinson-Drinfeld: Fun Op_{Lg}(X) ~= D'_{-h^vee} (9.15), algebra of global twisted differential operators on K^{1/2}; proof via filtrations reducing to the Hitchin isomorphism on associated graded."}, {"id": "hitchin-map-and-integrable-system", "display": "Hitchin map and integrable system", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p21", "kind": "definition", "genre": "original", "note": "Hitchin map p: T^*Bun_G -> H_G = prod H^0(Omega^{tensor(d_i+1)}); Fun T^*Bun_G ~= Fun H_G (9.16) [113,88]; commuting Hamiltonians = algebraic completely integrable system."}, {"id": "hecke-eigensheaf-as-system-of-differential-equat", "display": "Hecke eigensheaf as system of differential equations", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p21", "kind": "result", "genre": "original", "note": "Delta_{chi~} = D'_{-h^vee}/Ker chi~ . D'_{-h^vee} represents D_i f = chi~(D_i) f (9.17); holonomic (dim Bun_G = N); singular support = global nilpotent cone p^{-1}(0); very stable bundles (Drinfeld [114]); monodromies around singular locus."}, {"id": "critical-level-vs-wzw-coinvariant-behavior", "display": "critical-level vs WZW coinvariant behavior", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p21", "kind": "claim", "genre": "original", "note": "Critical-level vs WZW: coinvariant dimensions vary over Bun_G (drop along singular locus) because bg-modules are not integrable to G_b; horizontal sections multivalued/transcendental — hence work with the D-module, not the functions."}, {"id": "opers-with-singularities-for-general-local-syste", "display": "opers with singularities for general local systems", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p21", "kind": "result", "genre": "original", "note": "Generalization (Beilinson-Drinfeld, unpublished): opers with degeneration type lambda^vee; z(g)_{lambda^vee,x} ~= Op_{Lg}(D_x)_{lambda^vee} (9.20); multi-point localization Delta_S gives Hecke eigensheaf for arbitrary LG-local systems; caveat: must check independence of Borel reduction choice."}, {"id": "borel-reduction-independence-unproved", "display": "Borel-reduction independence unproved", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p22", "kind": "claim", "genre": "original", "note": "Expectation (unproved): for generic (F, nabla) the D-modules from different Borel reductions are isomorphic. Stated as not proved so far."}, {"id": "ramified-representations-and-affine-hecke-algebr", "display": "ramified representations and affine Hecke algebra", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p22", "kind": "definition", "genre": "original", "note": "Ramified classical picture: Iwahori I_y, affine Hecke algebra H(G(F_y), I_y) non-commutative; automorphic functions live on G(F)\\G(A)/I_y x prod G(O_x) (9.22), a finite-dimensional space, not a single function."}, {"id": "categorical-ramified-geometric-langlands", "display": "categorical ramified geometric Langlands", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p22", "kind": "claim", "genre": "original", "note": "Geometric ramified correspondence: categories Aut_E of Hecke eigensheaves on Bun_{G,y} (parabolic structures); categorifies affine Hecke representations; derived category P_{I_y} of I_y-equivariant perverse sheaves acts on Aut_E."}, {"id": "unique-eigensheaf-for-regular-unipotent-monodrom", "display": "unique eigensheaf for regular unipotent monodromy", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p22", "kind": "conjecture", "genre": "original", "note": "Regular unipotent monodromy case: unique irreducible Hecke eigensheaf expected [44] (with nontrivial self-extensions); constructed for GL_n in [117,118]."}, {"id": "iwahori-localization-for-ramified-local-systems", "display": "Iwahori localization for ramified local systems", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p22", "kind": "result", "genre": "original", "note": "Iwahori localization Delta^{I_y}: (bg_y, I_y)-modules -> D-modules on Bun_{G,y}; category C_{I_y,chi_y} with nilpotent opers nOp_{Lg}; expected equivalence with Aut_E [44]; Gaudin examples [28,119]."}, {"id": "categorical-lessons-and-local-global-link", "display": "categorical lessons and local-global link", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p22", "kind": "claim", "genre": "original", "note": "Lessons: correspondence inherently categorical; local categories C_{G(O_y)}, C_{I_y} linked to global via localization (new vs classical); a G(F)-representation is replaced by a category of bg-representations (V_chi as spherical vector)."}, {"id": "loop-group-replaces-g-f-critical-level-bg-as-cat", "display": "loop group replaces G(F); critical-level bg as categorical tool", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p23", "kind": "claim", "genre": "original", "note": "Closing claim: the loop group G((t)) replaces G(F) in the geometric context; the affine Kac-Moody algebra bg at critical level is the tool for building categories with G((t))-action; developed in [44]. Remainder of chunk is index and references [1]-[119], no extractable content."}, {"id": "decomposition-and-inertia-groups-unramified-exte", "display": "decomposition and inertia groups; unramified extension", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p3", "kind": "definition", "genre": "original", "note": "Decomposition group D_w (stabilizer of w), inertia group I_w (kernel of D_w -> Gal(residue fields)); K/F unramified at v iff I_w = {1}; then D_w ~= Z/nZ."}, {"id": "frobenius-conjugacy-class-fr-v", "display": "Frobenius conjugacy class Fr(v)", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p3", "kind": "definition", "genre": "original", "note": "Frobenius conjugacy class Fr(v) in Gal(K/F): well-defined class from Fr[w] when unramified; depends only on v."}, {"id": "splitting-of-primes-from-order-of-frobenius", "display": "splitting of primes from order of Frobenius", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p3", "kind": "result", "genre": "original", "note": "Order f of Fr(v) gives splitting: fg = deg_F K. For Q(zeta_N): unramified iff p not | N; Fr(p): zeta_N -> zeta_N^p, i.e. p mod N; residue degree = order of p mod N."}, {"id": "reciprocity-law-sum-of-two-squares-iff-p-1-mod-4", "display": "reciprocity law: sum of two squares iff p = 1 mod 4", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p3", "kind": "result", "genre": "reframed", "note": "Reciprocity law example: odd p = a^2+b^2 iff p == 1 mod 4 (Fermat's theorem, [25]); 5 yes, 7 no. Arithmetic property expressed as congruence condition."}, {"id": "rigidified-acft-via-geometric-frobenius-and-cheb", "display": "rigidified ACFT via geometric Frobenius and Chebotarev", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p3", "kind": "result", "genre": "original", "note": "Rigidified ACFT: geometric Frobenius Fr_p maps to double coset of idele (1,...,p,...) in (Q^x\\A_Q^x/Z_p^x)_c.c. (1.7); Chebotarev: Frobenius classes dense, so the isomorphism is unique. Deligne normalization noted."}, {"id": "langlands-correspondence-for-n-dimensional-galoi", "display": "Langlands correspondence for n-dimensional Galois representations", "status": "conjectural", "cluster": "bridge", "chunk": "b1_frenkel_p3", "kind": "conjecture", "genre": "original", "note": "Langlands' conjecture (letter to Weil [31], [1]): n-dimensional representations of Gal(Fbar/F) related to automorphic (irreducible, discrete spectrum) representations of GL_n(A_F) in functions on GL_n(F)\\GL_n(A_F). Stated as conjecture."}, {"id": "tannakian-philosophy-of-reconstructing-groups", "display": "Tannakian philosophy of reconstructing groups", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p3", "kind": "claim", "genre": "original", "note": "Tannakian philosophy invoked as motivation: a group can be reconstructed from its finite-dimensional representations with tensor structure."}, {"id": "matching-of-frobenius-classes-with-hecke-eigenva", "display": "matching of Frobenius classes with Hecke eigenvalues", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p3", "kind": "definition", "genre": "original", "note": "Matching condition: under sigma -> pi, Frobenius conjugacy classes for sigma coincide with Hecke eigenvalues for pi at almost all v (both unramified); for n=1 this is the rigidity condition (1.7)."}, {"id": "cuspidal-automorphic-representations-of-gl-2-a-q", "display": "cuspidal automorphic representations of GL_2(A_Q)", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p3", "kind": "definition", "genre": "original", "note": "Cuspidal automorphic representations of GL_2(A_Q): irreducible representations in discrete spectrum of functions on GL_2(Q)\\GL_2(A_Q); K = product GL_2(Z_p) x O_2; Casimir operator C given explicitly."}, {"id": "cuspidal-automorphic-representations-via-c-chi-r", "display": "cuspidal automorphic representations via C_chi,rho", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p4", "kind": "definition", "genre": "original", "note": "C_{chi,rho}(GL_2(Q)\\GL_2(A)): smooth functions with K-finiteness, central character (1.8), boundedness, cuspidality; direct sum of irreducibles with multiplicity one."}, {"id": "restricted-tensor-product-decomposition-of-pi", "display": "restricted tensor product decomposition of pi", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p4", "kind": "result", "genre": "original", "note": "pi = tensor'_p pi_p tensor pi_infty (1.9); unramified pi_p has unique GL_2(Z_p)-invariant vector v_p; K'_p-invariants at ramified p (level N = product p^{n_p})."}, {"id": "strong-approximation-and-reduction-to-gamma-0-n", "display": "strong approximation and reduction to Gamma_0(N)", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p4", "kind": "result", "genre": "original", "note": "Strong approximation [32]: GL_2(Q)\\GL_2(A)/K' ~= Gamma_0(N)\\GL_2^+(R); K'-invariants pi^e_infty determine pi; reduce to functions on Gamma_0(N)\\SL_2(R)."}, {"id": "discrete-series-to-modular-cusp-forms", "display": "discrete series to modular cusp forms", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p4", "kind": "result", "genre": "original", "note": "Discrete series pi_infty (rho = k(k-2)/4): highest-weight condition X_+ v_infty = 0 equivalent to holomorphicity; attaches modular cusp form f_pi of weight k, level N."}, {"id": "hecke-eigenvalues-as-fourier-coefficients-a-p", "display": "Hecke eigenvalues as Fourier coefficients a_p", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p4", "kind": "result", "genre": "original", "note": "Explicit calculation: H_1,p become classical Hecke operators on the upper half-plane; with a_1 = 1 normalization, h_1,p = a_p, the pth Fourier coefficient."}, {"id": "galois-representation-from-etale-cohomology-of-e", "display": "Galois representation from etale cohomology of elliptic curve", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p4", "kind": "definition", "genre": "original", "note": "sigma_{E,l}: Gal(Qbar/Q) -> GL_2(Q_l) from H^1_et(E_Qbar, Q_l), dual of Tate module; continuous in Krull/l-adic topologies."}, {"id": "frobenius-trace-as-point-count-p-1-e-f-p", "display": "Frobenius trace as point count p+1-#E(F_p)", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p4", "kind": "result", "genre": "reframed", "note": "Tr sigma_E(Fr_p) = p + 1 - #E(F_p) for good reduction p (cited [33,35]); independent of l. The Galois-side invariant."}, {"id": "taniyama-shimura-conjecture-and-fermat-s-last-th", "display": "Taniyama-Shimura conjecture and Fermat's last theorem", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p4", "kind": "result", "genre": "reframed", "note": "Taniyama-Shimura (1.13): a_p = p + 1 - #E(F_p) for newform f_E; proved by Wiles and others [38]; implies Fermat's last theorem [35]; bijection isogeny classes <-> newforms of weight 2, level N_E [37]."}, {"id": "drinfeld-lafforgue-theorem-for-function-fields", "display": "Drinfeld-Lafforgue theorem for function fields", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p4", "kind": "result", "genre": "reframed", "note": "Function-field Langlands is a theorem: Drinfeld proved GL_2 case [39,40], Lafforgue GL_n [41]; completions all non-archimedean so theory more uniform."}, {"id": "function-field-and-its-points-as-maximal-ideals", "display": "function field and its points as maximal ideals", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p5", "kind": "definition", "genre": "original", "note": "Function field F_q(X) of smooth projective curve; points as maximal ideals with residue fields (F_{q^n}-points); A^1 example: maximal ideals = monic irreducible polynomials."}, {"id": "completions-of-function-fields-and-analogy-with-", "display": "completions of function fields and analogy with Q_p", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p5", "kind": "result", "genre": "original", "note": "Completions labeled by points: F_{q^n}((t_x)); F_q((t)) vs Q_p: termwise without carry (char p) vs with carry (char 0); all completions non-archimedean, unlike number fields."}, {"id": "langlands-correspondence-in-dimension-greater-th", "display": "Langlands correspondence in dimension greater than one", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p5", "kind": "question", "genre": "original", "note": "Open problem stated: no known Langlands formulation for function fields of varieties of dimension > 1 (abelian ACFT exists [42]); hoped connection to higher-dimensional QFT [43]."}, {"id": "galois-group-as-deck-transformations-and-fundame", "display": "Galois group as deck transformations and fundamental group", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p5", "kind": "claim", "genre": "original", "note": "Analogy: Gal(Fbar/F) as deck transformations of maximal cover of X; unramified covers give quotients of fundamental group. Presented as intuition."}, {"id": "decomposition-inertia-geometric-frobenius-for-fu", "display": "decomposition, inertia, geometric Frobenius for function fields", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p5", "kind": "definition", "genre": "original", "note": "Decomposition D_x, inertia I_x subgroups of Gal(Fbar/F); geometric Frobenius Fr_x inverse to y -> y^{q_x}; unramified sigma gives conjugacy class sigma(Fr_x)."}, {"id": "complex-representations-factor-through-finite-qu", "display": "complex representations factor through finite quotients; l-adic remedy", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p5", "kind": "result", "genre": "original", "note": "Continuous finite-dim complex reps of profinite Gal factor through finite quotient; Z_p toy model: continuous sigma: Z_p -> C^x forces roots of unity, but over Q_l (mu - 1 in lZ_l) gives genuinely infinite families."}, {"id": "n-dimensional-l-adic-galois-representation", "display": "n-dimensional l-adic Galois representation", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p5", "kind": "definition", "genre": "original", "note": "n-dimensional l-adic representation: continuous sigma: Gal(Fbar/F) -> GL_n(Q_l) factoring through GL_n(E) for finite E/Q_l, unramified almost everywhere; G_n = irreducibles with finite det image."}, {"id": "chebotarev-density-determines-l-adic-representat", "display": "Chebotarev density determines l-adic representations", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p5", "kind": "result", "genre": "reframed", "note": "Chebotarev density theorem: two l-adic representations agreeing on Frobenius conjugacy classes at almost all x are equivalent. Cited as known theorem."}, {"id": "adeles-of-a-function-field", "display": "adeles of a function field", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p5", "kind": "definition", "genre": "original", "note": "Adeles A of F: restricted product of completions F_x (integral at almost all x); F embeds diagonally via expansions of rational functions."}, {"id": "cuspidal-automorphic-representations-for-functio", "display": "cuspidal automorphic representations for function fields", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p6", "kind": "definition", "genre": "original", "note": "C_chi(GL_n(F)\\GL_n(A)): locally constant functions with K-finiteness, central character of finite order, cuspidality via unipotent radicals; multiplicity one (Piatetski-Shapiro/Shalika); set A_n."}, {"id": "theorem-1-drinfeld-lafforgue-bijection-g-n-a-n", "display": "Theorem 1: Drinfeld-Lafforgue bijection G_n <-> A_n", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p6", "kind": "result", "genre": "reframed", "note": "Theorem 1 (Drinfeld [39,40] for n=2, Lafforgue [41] for n>2): bijection G_n <-> A_n with (z_i(sigma_x)) = (z_i(pi_x)) up to permutation at unramified x. Cited as proved."}, {"id": "algebraicity-of-hecke-eigenvalues-ramanujan-pete", "display": "algebraicity of Hecke eigenvalues; Ramanujan-Petersson", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p6", "kind": "result", "genre": "reframed", "note": "Drinfeld-Lafforgue: Hecke eigenvalues are algebraic numbers of absolute value 1 (Ramanujan-Petersson, Deligne purity); resolves the Q_l vs C identification issue without choosing an isomorphism."}, {"id": "function-field-correspondence-cleaner-than-numbe", "display": "function-field correspondence cleaner than number-field", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p6", "kind": "claim", "genre": "original", "note": "Function-field correspondence 'cleaner': no archimedean completions; e.g. GL_2(A) principal-series/Maass automorphic reps have no Galois counterpart, so no bijection is expected over number fields."}, {"id": "local-systems-as-sheaves-pi-1-representations-fl", "display": "local systems as sheaves, pi_1 representations, flat connections", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p6", "kind": "definition", "genre": "original", "note": "Local system on complex curve: locally constant sheaf <-> homomorphism pi_1(X,x_0) -> GL_n(C) <-> vector bundle with flat connection (Leibniz (3.1), flatness (3.2)); on curves one operator nabla = d/dz + A(z), automatically flat."}, {"id": "galois-representations-as-local-systems-geometri", "display": "Galois representations as local systems; geometric motive", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p6", "kind": "claim", "genre": "original", "note": "Galois representations unramified away from S viewed as local systems; motivates geometric reformulation for curves over arbitrary fields (Part II program)."}, {"id": "riemann-hilbert-correspondence", "display": "Riemann-Hilbert correspondence", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p7", "kind": "result", "genre": "original", "note": "Riemann-Hilbert correspondence: equivalence of local systems with holomorphic bundles carrying flat connections (compact X); ramified case needs regular singularities (pole order <= 1); irregular deferred to Sect. 9.8 [44]."}, {"id": "weil-s-lemma-adeles-double-quotient-as-vector-bu", "display": "Weil's lemma: adeles double quotient as vector bundles", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p7", "kind": "result", "genre": "original", "note": "Lemma 2 (A. Weil): bijection GL_n(F)\\GL_n(A)/GL_n(O) <-> iso classes of rank-n vector bundles; proof via n meromorphic sections, trivializations over X minus points and discs, transition functions g_i, passage to formal discs."}, {"id": "fonctions-faisceaux-dictionary-geometrizing-auto", "display": "fonctions-faisceaux dictionary geometrizing automorphic functions", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p7", "kind": "claim", "genre": "original", "note": "Grothendieck fonctions-faisceaux dictionary: function f_F(x) = Tr(Fr_x, F_x) on V(F_q) from l-adic sheaf; 'leap of faith' that automorphic functions geometrize as sheaves. Presented as programmatic claim."}, {"id": "perverse-sheaves", "display": "perverse sheaves", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p7", "kind": "definition", "genre": "original", "note": "Perverse sheaf: complex with restricted stalk-cohomology degrees [48-51]; abelian subcategory of derived category; irreducible one determined by restriction to open dense subset; local systems shifted by -dim V as examples."}, {"id": "moduli-stack-bun-n-of-rank-n-bundles", "display": "moduli stack Bun_n of rank-n bundles", "status": "heuristic", "cluster": "bridge", "chunk": "b1_frenkel_p7", "kind": "claim", "genre": "original", "note": "No variety parametrizes all rank-n bundles (automorphism groups vary); need moduli stack Bun_n (Artin stack); sheaves on stacks via [53,15]; cuspidal functions vanish on some unstable bundles [55] Lemma 6.11."}, {"id": "d-modules-on-complex-varieties", "display": "D-modules on complex varieties", "status": "exact", "cluster": "bridge", "chunk": "b1_frenkel_p7", "kind": "definition", "genre": "original", "note": "D-module: sheaf of modules over D_V (Weyl algebra on C^n); examples: holomorphic bundle with flat connection   `<div class="loop"${l.node?` data-node="${esc(l.node)}" title="trace this constellation" style="cursor:pointer"`:''}><b>${esc(l.chunk)}</b> — ${esc(l.label)}</div>`).join('');
document.getElementById('looplo').addEventListener('click', e=>{
  const t = e.target.closest('[data-node]');
  if (t){ const n = nodeById[t.getAttribute('data-node')]; if (n) select(n); }
});
setInterval(tick, 30);
draw();
</script>
</body>
</html>
