 "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p1", "kind": "definition", "genre": "original", "note": "Definition given in introduction: holomorphic symplectic (X,omega) dim 2N with H: X -> g* whose general fiber is an N-dim abelian variety and whose components Poisson-commute; cites [28]."}, {"id": "hitchin-identification-of-character-variety-with", "display": "Hitchin identification of character variety with G-Higgs moduli", "status": "conjectural", "cluster": "geometry", "chunk": "g1_mulase_p1", "kind": "claim", "genre": "original", "note": "Cited from Hitchin [8,9]: character variety identified with moduli of stable G-Higgs bundles, carrying the integrable-system structure; paper uses it without proof."}, {"id": "character-variety-functor-sends-langlands-dualit", "display": "character variety functor sends Langlands duality to SYZ mirror symmetry", "status": "conjectural", "cluster": "geometry", "chunk": "g1_mulase_p1", "kind": "claim", "genre": "original", "note": "Cited from Hausel-Thaddeus [7] and [4,12]: Hom character-variety functor sends Langlands duality in GC to SYZ mirror symmetry of Calabi-Yau spaces; paper invokes it as motivation."}, {"id": "restriction-and-symplectic-quotient-give-syz-mir", "display": "restriction and symplectic quotient give SYZ-mirror pairs", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p1", "kind": "claim", "genre": "original", "note": "Introduction result (5), announced as established: restriction to a g2-fibration and symplectic quotient by a g1-action give dual abelian fibrations, an SYZ-mirror pair; proved in Section 4."}, {"id": "sl-pgl-and-sp2m-so2m-1-dualities-as-restriction-", "display": "SL-PGL and Sp2m-SO2m+1 dualities as restriction vs quotient", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p1", "kind": "claim", "genre": "original", "note": "Introduction result (5): the SL-PGL and Sp2m-SO2m+1 dualities are interpreted as the restriction-vs-quotient constructions; proved in Section 4."}, {"id": "sp-hitchin-system-as-serre-duality-fixed-point-s", "display": "Sp-Hitchin system as Serre-duality fixed-point set; KP reduction not BKP/CKP", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p1", "kind": "claim", "genre": "identification", "note": "Introduction result (4), announced as established: Sp-Hitchin system is the fixed-point set of Serre duality on the GL-Hitchin system; its equations are a KP reduction, NOT BKP or CKP; proved in Sections 6-7."}, {"id": "sp-reduction-1-1-2m-component-kp-preserving-l-a-", "display": "Sp reduction (1.1): 2m-component KP preserving L* = A.L.A", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p1", "kind": "result", "genre": "original", "note": "Equation (1.1): the Sp reduction is the 2m-component KP preserving L* = A.L.A for a 2m x 2m Lax operator with leading term I_2m.d/dx, A=[[0,Im],[Im,0]]; announced in introduction, proved in Section 7."}, {"id": "integrable-systems-study-of-reduction-1-1-and-re", "display": "integrable-systems study of reduction (1.1) and relation to other Sp systems", "status": "heuristic", "cluster": "geometry", "chunk": "g1_mulase_p1", "kind": "question", "genre": "original", "note": "Introduction states it would be interesting to study reduction (1.1) from the integrable-systems viewpoint and its relation to other Sp-symmetric systems [27]; left open."}, {"id": "jacobian-prym-linear-flows-as-kp-restrictions-vi", "display": "Jacobian/Prym linear flows as KP restrictions via Krichever", "status": "conjectural", "cluster": "geometry", "chunk": "g1_mulase_p1", "kind": "claim", "genre": "original", "note": "Cited from [14,15,17]: linear integrable evolutions on Jacobians/Pryms are restrictions of KP-type equations on Sato Grassmannians via generalized Krichever construction; paper relies on it without proof."}, {"id": "higgs-bundle-stability-moduli-hc-n-d", "display": "Higgs bundle, stability, moduli HC(n,d)", "status": "exact", "cluster": "geometry", geometry", "chunk": "g1_mulase_p2", "kind": "result", "genre": "original", "note": "Attributed to Hitchin [9] as Theorem 2.2: Hamiltonian vector fields of the Hitchin map are linear Jacobian flows on generic fibers; cited without proof."}, {"id": "proposition-2-3-serre-dual-spectral-data-via-eps", "display": "Proposition 2.3: Serre-dual spectral data via epsilon", "status": "conjectural", "cluster": "geometry", "chunk": "g1_mulase_p2", "kind": "result", "genre": "original", "note": "Attributed to Hitchin [10] as Proposition 2.3: Serre-dual spectral data (epsilon*(L*_E) x K_Cs, epsilon(Cs)) via involution epsilon(p,x)=(p,-x); cited without proof."}, {"id": "proposition-2-4-sp2m-hitchin-as-serre-duality-fi", "display": "Proposition 2.4: Sp2m-Hitchin as Serre-duality fixed-point set", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p2", "kind": "result", "genre": "original", "note": "Proposition 2.4 proved in chunk: fixed-point set of (E,phi) -> (E* x KC, -phi*) on HC(2m,2m(g-1)) is the Sp2m-Higgs moduli; s in V*_Sp = direct sum_i H0(C,K^{2i}); Cs carries involution epsilon; L0 with L0* ~= epsilon*L0."}, {"id": "serre-duality-involution-on-higgs-moduli", "display": "Serre duality involution on Higgs moduli", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p2", "kind": "definition", "genre": "original", "note": "Involution (2.4): (E,phi) -> (E* x KC, -phi*) in HC(n,-d+2n(g-1)); induces Serre duality on moduli."}, {"id": "holomorphic-extension-of-eta-and-omega-to-hc-n-d", "display": "holomorphic extension of eta and omega to HC(n,d)", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p2", "kind": "claim", "genre": "original", "note": "Proved in chunk: eta and omega=-d eta extend holomorphically to all of HC(n,d) since the complement (unstable E, singular Cs) has codimension >= 2."}, {"id": "degree-delta-covering-jac-cs-uc-n-d", "display": "degree-delta covering Jac(Cs) -> UC(n,d)", "status": "conjectural", "cluster": "geometry", "chunk": "g1_mulase_p2", "kind": "result", "genre": "original", "note": "Cited from [3]: generic fiber meets T*_E UC(n,d) in delta = product_i (2i-1)(g-1) points; p: Jac(Cs) -> UC(n,d) is a degree-delta cover; cited without proof."}, {"id": "cayley-hamilton-construction-of-le", "display": "Cayley-Hamilton construction of LE", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p2", "kind": "method", "genre": "original", "note": "Method carried out: phi gives algebra map Sym(K^{-1}_C) -> End(E); Cayley-Hamilton factors it through Sym/Is, making E a rank-1 module = line bundle LE on Cs."}, {"id": "c-scaling-gives-trivial-spectral-deformations-qu", "display": "C*-scaling gives trivial spectral deformations; quotient it out", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "claim", "genre": "original", "note": "Proved: scalar multiplication phi -> lambda.phi preserves spectral curves; Hitchin fibration is C*-equivariant; quotienting it out is needed for an effective family."}, {"id": "jac-c-action-is-hamiltonian-with-moment-map-tr-p", "display": "Jac(C)-action is Hamiltonian with moment map tr(phi)", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "claim", "genre": "original", "note": "Proved: Jac(C)-action (E,phi) -> (E x L,phi) preserves spectral curves and is Hamiltonian with moment map H1=tr(phi) in H0(C,KC); symplectic quotient HC(n,d)//Jac(C) constructed in Section 4."}, {"id": "effective-family-v-sl-and-partial-projective-hig", "display": "effective family: V*_SL and partial projective Higgs moduli", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "definition", "genre": "original", "note": "Definitions (3.4)-(3.6): V*_SL = direct sum_{i>=2} H0(C,K^i) of dim (n^2-1)(g-1); partial projective space P(HSL_C(n,d)) with induced fibration PH over weighted projective space."}, {"id": "theorem-3-1-effective-jacobian-fibration", "display": "Theorem 3.1: effective Jacobian fibration", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "result", "genre": "original", "note": "Theorem 3.1 proved in chunk: the Jacobian fibration PH over Pw(V*_SL) is generically effective; equivalent to injectivity of the Kodaira-Spencer map for spectral-curve deformations."}, {"id": "proposition-3-2-cohomology-of-t-c", "display": "Proposition 3.2: cohomology of T*C", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "result", "genre": "original", "note": "Proposition 3.2 proved: H0(T*C,Lambda_0)=C, H0(T*C,Lambda_1)=H0(C,KC) + C.tau, H0(T*C,Lambda_2)=C; every holomorphic 1-form on T*C is a pullback plus tau."}, {"id": "lemma-3-3-restriction-isomorphism-for-cs", "display": "Lemma 3.3: restriction isomorphism for Cs", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "result", "genre": "original", "note": "Lemma 3.3 proved: H0(Cs,T T*C) ~= H0(Cs,Lambda_1(T*C)) ~= H0(T*C,Lambda_1(T*C)) for nonsingular Cs, n>=2."}, {"id": "kodaira-spencer-computation-for-spectral-curves", "display": "Kodaira-Spencer computation for spectral curves", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "method", "genre": "original", "note": "Computation (3.13)-(3.14): normal sheaf Ns ~= K_Cs; image of iota identified; tau maps to a diagonal ray via the C*-action vector field v=x.d/dx; yields injective Kodaira-Spencer map."}, {"id": "prym-and-dual-prym-varieties", "display": "Prym and dual Prym varieties", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "definition", "genre": "original", "note": "Definitions (4.1)-(4.2): Prym(Cs/C)=Ker(Nm_pi), Prym*(Cs/C)=Jac(Cs)/pi*Jac(C); abelian varieties of dim g(Cs)-g(C), dual to each other."}, {"id": "symplectic-quotient-phc-n-d-and-hpgl-fibration", "display": "symplectic quotient PHC(n,d) and HPGL fibration", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "definition", "genre": "original", "note": "Definition (4.3)-(4.4): PHC(n,d)=H^{-1}(0)/Jac(C), dim 2(n^2-1)(g-1), modeled on PGLn-bundle moduli; induced Lagrangian fibration HPGL over V*_SL."}, {"id": "theorem-4-1-hpgl-is-lagrangian-dual-prym-fibrati", "display": "Theorem 4.1: HPGL is Lagrangian dual Prym fibration", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "result", "genre": "original", "note": "Theorem 4.1 established in chunk following [9,10]: HPGL is a Lagrangian dual Prym fibration; generic fiber HPGL^{-1}(s) ~= Prym*(Cs/C); uses UC/Jac(C) ~= SUC/Jn(C)."}, {"id": "injectivity-of-pi-jac-c-jac-cs", "display": "injectivity of pi*: Jac(C) -> Jac(Cs)", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p3", "kind": "claim", "genre": "original", "note": "Proved: pi*: Jac(C) -> Jac(Cs) injective via projection formula; Jac(C)-action on fibers factors through this subgroup."}, {"id": "theorem-4-3-hsl-is-lagrangian-prym-fibration", "display": "Theorem 4.3: HSL is Lagrangian Prym fibration", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "result", "genre": "original", "note": "Theorem 4.3 established in chunk following [9,10]: HSL: SHC(n,d) -> V*_SL (fixed determinant, traceless Higgs fields) is a Lagrangian Prym fibration; SHC/Jn(C) ~= PHC(n,d)."}, {"id": "theorem-4-4-shc-phc-are-syz-mirror-symmetric", "display": "Theorem 4.4: SHC/PHC are SYZ-mirror symmetric", "status": "conjectural", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "result", "genre": "original", "note": "Cited from Hausel-Thaddeus [7] as Theorem 4.4: the SHC and PHC fibrations are mirror symmetric in the SYZ sense [25]; paper invokes it without proof."}, {"id": "theorem-4-5-prym-fibrations-generically-effectiv", "display": "Theorem 4.5: Prym fibrations generically effective", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "result", "genre": "original", "note": "Theorem 4.5 proved: the Prym and dual Prym fibrations over Pw(V*_SL) are generically effective, by the Section 3 method."}, {"id": "sp-case-lie-decomposition-and-quotient-curve-c-s", "display": "Sp-case Lie decomposition and quotient curve C'_s", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "definition", "genre": "original", "note": "Definitions (4.14)-(4.16): V_GL2m = g + V_Sp with g, V_Sp from even/odd powers of K; quotient curve C'_s = Cs/<epsilon>, genus m(2m-1)(g-1)+1 = dim g via Riemann-Hurwitz."}, {"id": "sp-prym-fibration-and-its-dual-via-quotient-by-g", "display": "Sp Prym fibration and its dual via quotient by g", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "claim", "genre": "original", "note": "Proved in chunk: along the Serre-duality fixed set, V_Sp generates the Prym fibration {Prym(Cs/C'_s)}; dual Prym*(Cs/C'_s)=Jac(Cs)/Jac(C'_s) from symplectic quotient by g."}, {"id": "sato-grassmannian-over-a-scheme", "display": "Sato Grassmannian over a scheme", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "definition", "genre": "original", "note": "Definition 5.1 following Quandt [20]: Gr_n(S) = quasi-coherent submodules W of O_S((z))^{n} with Fredholm condition (kernel and cokernel coherent); index in K(S)."}, {"id": "quotient-grassmannian-kp-flows-lax-operators", "display": "quotient Grassmannian, KP flows, Lax operators", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "definition", "genre": "original", "note": "Reviewed from [14,15,17,20,21,22]: quotient Z_n = Gr_n/Gamma_n; n-component KP flow KP(a); big cell identified with monic 0th-order pseudo-differential operators; Lax operators <-> big cell of Z_n."}, {"id": "theorem-5-5-effective-family-embeds-in-quotient-", "display": "Theorem 5.5: effective family embeds in quotient Grassmannian", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "result", "genre": "identification", "note": "Theorem 5.5 proved: rational map mu: P(HSL_C(n,d)) -> Z_n^{d-n(g-1)}, generically injective via W=beta(H0(Cs\\pi^{-1}(p),L)); n-component KP flows tangent to the PH fibration."}, {"id": "theorem-5-6-hitchin-system-is-pullback-of-n-comp", "display": "Theorem 5.6: Hitchin system is pullback of n-component KP", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "result", "genre": "identification", "note": "Theorem 5.6 proved for d=n(g-1): birational map HC(n,n(g-1)) -> n-component KP orbit in Z_n^0(Up) (relative Grassmannian over Up); the Hitchin integrable system is the pullback of the n-component KP equations."}, {"id": "resultant-and-the-open-set-up", "display": "resultant and the open set Up", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "claim", "genre": "original", "note": "Proved: ramification of pi: Cs -> C from resultant Res(s) in H0(C,K^{n(n-1)}); Up = {s: Cs nonsingular, pi unramified at p} is Zariski open."}, {"id": "singular-spectral-curves-and-heisenberg-kp-flows", "display": "singular spectral curves and Heisenberg KP flows", "status": "heuristic", "cluster": "geometry", "chunk": "g1_mulase_p4", "kind": "claim", "genre": "original", "note": "Remark 5.7: singular Cs allowed if p avoids the singular locus; Heisenberg KP flows [1,14] handle ramification points; desirable to work over all of V*_GL with the moduli stack."}, {"id": "serre-dual-of-geometric-data", "display": "Serre dual of geometric data", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p5", "kind": "definition", "genre": "original", "note": "Definition 6.1: Serre dual of (C,p,z,F,beta) is (C,p,z,F* x KC,beta*); canonical trivialization beta* via the pairing diagram (6.3)."}, {"id": "lemma-6-2-orthogonal-complement-in-the-grassmann", "display": "Lemma 6.2: orthogonal complement in the Grassmannian", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p5", "kind": "result", "genre": "original", "note": "Lemma 6.2 proved: W^perp = {f: <f,W>_n=0} has index -d; Ker(gamma_W)* ~= Coker(gamma_{W^perp}) and Coker(gamma_W)* ~= Ker(gamma_{W^perp})."}, {"id": "theorem-6-4-serre-dual-corresponds-to-w-perp", "display": "Theorem 6.4: Serre dual corresponds to W^perp", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p5", "kind": "result", "genre": "identification", "note": "Theorem 6.4 proved: the Grassmannian point of the Serre dual is W^perp; uses Abel's theorem (sum of residues of g.f is 0) to get W' subset W^perp, then index match."}, {"id": "pseudo-differential-operators-and-e-module-struc", "display": "pseudo-differential operators and E-module structure", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p5", "kind": "definition", "genre": "original", "note": "Definitions: ring E of pseudo-differential operators, E/Ex = C((d^{-1})); C((z)) as E-module via z <-> d^{-1}; action formula P.f(z)=rho(P.f(d^{-1})d^{-1})."}, {"id": "proposition-6-7-adjoint-formula-for-the-pairing", "display": "Proposition 6.7: adjoint formula for the pairing", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p5", "kind": "result", "genre": "original", "note": "Proposition 6.7 proved by matrix-entry computation: <f(z), P.g(z)>_n = <P*.f(z), g(z)>_n for P in gl_n(E)."}, {"id": "theorem-6-8-serre-duality-as-adjoint-action", "display": "Theorem 6.8: Serre duality as adjoint action", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p5", "kind": "result", "genre": "identification", "note": "Theorem 6.8 proved: big-cell W <-> S in G implies W^perp <-> (S*)^{-1}; hence Serre duality is the adjoint action on pseudo-differential operators."}, {"id": "lax-operator-and-serre-duality-on-lax-operators", "display": "Lax operator and Serre duality on Lax operators", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p5", "kind": "definition", "genre": "original", "note": "Lax operator L = S.I_n.d.S^{-1} bijects with the big cell of Z_n(C); W <-> L implies W^perp <-> L*; Serre duality acts as the adjoint on Lax operators."}, {"id": "residue-pairing-and-recursive-coefficient-soluti", "display": "residue pairing and recursive coefficient solution", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p5", "kind": "method", "genre": "original", "note": "Method in Theorem 6.4 proof: residue pairing <a,b> = -Res a(z)b(z); coefficients of f solved recursively from <f,g^i_j> equations (6.8)."}, {"id": "w-perp-is-an-involution", "display": "W^perp is an involution", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p5", "kind": "claim", "genre": "original", "note": "Remark 6.3: W^{perp perp} = W, from the Ker/Coker duality (6.6); the orthogonal complement is an involution."}, {"id": "sp-fixed-point-spectral-data-with-involution-mat", "display": "Sp fixed-point spectral data with involution matrix A", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p6", "kind": "claim", "genre": "original", "note": "Setup in Section 7: fixed point (E,phi)=(E* x KC,-phi*); s=s* so epsilon permutes pi^{-1}(p)={p1..p2m}; numbering chosen with epsilon(p)=p.A, A=[[0,Im],[Im,0]] as in (7.1)."}, {"id": "twisted-self-adjointness-s-a-s-1-a", "display": "twisted self-adjointness S = A.(S*)^{-1}.A", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p6", "kind": "result", "genre": "original", "note": "Derived (7.2)-(7.3): W = A.W^perp gives twisted self-adjointness S = A.(S*)^{-1}.A for the monic 0th-order operator S (away from the theta divisor)."}, {"id": "lax-condition-l-a-l-a", "display": "Lax condition L* = A.L.A", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p6", "kind": "result", "genre": "original", "note": "Derived (7.4): Lax operator satisfies L* = A.L.A with block components L1*=L4, L2*=L2, L3*=L3."}, {"id": "generalized-birkhoff-decomposition-for-time-evol", "display": "generalized Birkhoff decomposition for time evolution", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p6", "kind": "method", "genre": "original", "note": "Method from [14,16]: time evolution S(t) from generalized Birkhoff decomposition exp diag(D1,D2).Y(t) = S(t).S(0)^{-1} as in (7.5)."}, {"id": "theorem-7-1-sp-hitchin-equations-as-twisted-self", "display": "Theorem 7.1: Sp-Hitchin equations as twisted-self-adjoint KP reduction", "status": "exact", "cluster": "geometry", "chunk": "g1_mulase_p6", "kind": "result", "genre": "identification", "note": "Theorem 7.1 proved: the KP-type equations of the Sp2m-Hitchin system are the reduction of the 2m-component KP equations preserving the twisted self-adjointness (7.3)/(7.4); evolution (7.6) with D2=-D1."}, {"id": "finite-dimensional-orbits-are-prym-varieties", "display": "finite-dimensional orbits are Prym varieties", "status": "heuristic", "cluster": "geometry", "chunk": "g1_mulase_p6", "kind": "claim", "genre": "original", "note": "Remark 7.2: the evolution (7.6) uses traceless diag(D,-D), so every finite-dimensional orbit is a Prym variety by [14]; stated as expected, not proved here."}, {"id": "m-g-n-the-deligne-mumford-stack-of-stable-genus-", "display": "M_{g,n}, the Deligne-Mumford stack of stable genus g curves with n marked points", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "definition", "genre": "original", "note": "Paper defines M_{g,n} as the Deligne-Mumford stack of stable genus g curves with n marked points; singularities are double points, genus-0 components carry >=3 marked/singular points."}, {"id": "the-sequence-of-s-n-representations-n-h-i-m-g-n-", "display": "the sequence of S_n representations n -> H_i(M_{g,n}, Q) via relabeling marked points", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "definition", "genre": "original", "note": "S_n acts on M_{g,n} by relabeling marked points; fixing i,g gives the sequence of S_n representations n -> H_i(M_{g,n},Q) whose n>>0 asymptotics the paper studies."}, {"id": "theorem-1-1-rational-generating-function-for-dim", "display": "Theorem 1.1: rational generating function for dim H_i(M_{g,n}); bounded-length S_n irreps; polynomially bounded multiplicities", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "result", "genre": "original", "note": "Theorem 1.1 proved: generating function SUM dim H_i(M_{g,n}) t^n = f(t)/PROD_j (1-jt)^{d_j}; dim = SUM_j f_j(n) j^n for n>>0; S_n irreps occurring have length <= C; multiplicities dim Hom_{S_{n+k}}(M_{lambda+n}, H_i(M_{g,n+k})) polynomially bounded of degree C-1."}, {"id": "fsop-module-contravariant-functor-from-finite-se", "display": "FSop module: contravariant functor from finite sets and surjections to vector spaces", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "definition", "genre": "original", "note": "FSop is the opposite of the category of finite sets and surjections; an FSop module is a contravariant functor FS^op -> Vect, i.e. a sequence V_n with maps f^*: V_m -> V_n for surjections f:[n]->[m]."}, {"id": "fsop-action-on-n-h-m-g-n-via-gluing-maps-f-for-s", "display": "FSop action on n -> H_.(M_{g,n}) via gluing maps F^* for surjections (permute points; glue marked P^1)", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "method", "genre": "original", "note": "For surjection f:[n]->[m], f^*: H_.(M_{g,n}) <- H_.(M_{g,m}) is induced by a gluing map F^*: bijections permute marked points; the surjection [n+1]->[n] glues a marked P^1 at the n-th point, marking two new points on it."}, {"id": "theorem-1-2-the-fsop-module-n-h-i-m-g-n-q-is-fin", "display": "Theorem 1.2: the FSop module n -> H_i(M_{g,n}, Q) is finitely generated in degree <= p(g,i) of order O(g^2 i^2)", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "result", "genre": "original", "note": "Theorem 1.2 proved: n -> H_i(M_{g,n},Q) is a subquotient of an FSop module finitely generated in degree <= p(g,i), p of order O(g^2 i^2). Proof sketched via dual-graph stratification, pure Borel-Moore homology, and graph combinatorics."}, {"id": "remark-1-3-classes-in-h-i-m-g-n-are-tautological", "display": "Remark 1.3: classes in H_i(M_{g,n}) are tautological 'relative' to a finite list, using only 2-marked-P^1 gluings", "status": "heuristic", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "claim", "genre": "original", "note": "Remark 1.3 interprets Theorem 1.2: for fixed i,g, every class in H_i(M_{g,n}) is tautological 'relative' to a finite list of classes, using only P^1-with-2-marked-points gluing maps - a small part of the full operadic gluing structure."}, {"id": "theorem-1-4-stability-ind-n-res-n-h-i-m-g-h-i-m-", "display": "Theorem 1.4: stability - Ind_N Res_N H_i(M_{g,-}) -> H_i(M_{g,-}) is an isomorphism; finite algebraic data determines H_i(M_{g,n})", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "result", "genre": "original", "note": "Theorem 1.4 proved: some N exists with Ind_N Res_N H_i(M_{g,-}) -> H_i(M_{g,-}) an isomorphism of FSop modules; hence H_i(M_{g,n}) is computable from the finite data {H_i(M_{g,m})}_{m<=N} plus surjection structure."}, {"id": "fi-modules-cannot-control-h-m-g-n-because-the-ho", "display": "FI modules cannot control H_.(M_{g,n}) because the homology grows exponentially; a larger category is needed", "status": "heuristic", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "claim", "genre": "original", "note": "Paper argues FI modules (Church-Ellenberg-Farb) cannot control H_.(M_{g,n}) because the homology grows exponentially, so a larger category than FI is needed; cites Rolland and Duque-Rolland applications of FI to M_{g,n} and the real locus of M_{0,n}."}, {"id": "bt-the-category-of-binary-trees-forests-with-bto", "display": "BT, the category of binary trees/forests, with BTop acting on M_{g,n} by gluing trees of marked P^1s", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "method", "genre": "original", "note": "BT has objects N and morphisms rooted binary forests with leaves labeled [m], roots [n]; F -> h_F gives a functor BT -> FS realizing FS as a quotient. BTop acts on M_{g,n} by gluing on trees of marked projective lines (variety L_F)."}, {"id": "the-btop-action-on-homology-factors-through-fs-o", "display": "the BTop action on homology factors through FS^op (same surjection => same map on homology)", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "claim", "genre": "original", "note": "Two forests F1,F2 inducing the same surjection h give the same map on homology: both are evaluations on boundary strata of a connected second factor (product over i of M_{0,#h^{-1}(i)+1}), so the BTop action on H_. factors through FS^op."}, {"id": "proof-sketch-of-theorem-1-2-dual-graph-stratific", "display": "proof sketch of Theorem 1.2: dual-graph stratification, pure Borel-Moore vanishing, external Y, cross ratio relation", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "method", "genre": "original", "note": "Sketch of Theorem 1.2: stratify M_{g,n} by dual graphs; pure Borel-Moore homology vanishes for n>i+3 so only bounded strata contribute; a graph with an 'external Y' (trivalent genus-0 vertex with two external edges) pushes forward from lower degree; cross ratio relation handles adjacent trivalent genus-0 vertices; chi(G)<=g bounds the rest."}, {"id": "stable-graph-the-poset-stab-g-n-the-stratum-m-g-", "display": "stable graph; the poset Stab(g,n); the stratum M_G of curves with dual graph G", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "definition", "genre": "original", "note": "A stable graph has internal vertices with genera g(v), external edges for marked points, dim H_1(G)+SUM g(v)=g; Stab(g,n) is the poset of isomorphism classes under edge-quotient; the stratum M_G is the locus of curves with dual graph isomorphic to G."}, {"id": "proposition-3-1-unique-quotient-gbar-with-no-edg", "display": "Proposition 3.1: unique quotient Gbar with no edges between distinct genus-0 vertices", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "result", "genre": "original", "note": "Proposition 3.1 proved: every stable graph G has a unique stable quotient Gbar >= G with no two distinct genus-0 vertices joined by an edge, obtained by collapsing minimal spanning trees of the genus-0 subgraph."}, {"id": "fsop-does-not-act-on-the-borel-moore-spectral-se", "display": "FSop does not act on the Borel-Moore spectral sequence and BTop is not known noetherian", "status": "heuristic", "cluster": "geometry", "chunk": "g2_tosteson_p1", "kind": "question", "genre": "original", "note": "Formal difficulty stated in section 2.3: FSop does not act on the Borel-Moore homology spectral sequence of the stable graph stratification, and BTop (which does act) is not known to be noetherian - motivating the coarsened stratification of section 3."}, {"id": "proposition-3-1-proof-quotient-by-minimal-spanni", "display": "Proposition 3.1 proof: quotient by minimal spanning trees of the genus-0 subgraph", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "method", "genre": "original", "note": "Proof of Proposition 3.1: take minimal spanning trees T_i of each connected component of the genus-0 subgraph; collapsing each T_i to a point gives Hbar; any other admissible quotient collapses a minimal spanning tree and all such quotients are isomorphic."}, {"id": "q-g-n-stable-graphs-with-no-edges-between-distin", "display": "Q(g,n): stable graphs with no edges between distinct genus-0 vertices", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "definition", "genre": "original", "note": "Q(g,n) is the set of stable graphs with no edges between distinct genus-0 vertices; Gbar denotes the Proposition 3.1 quotient of G."}, {"id": "proposition-3-2-poset-q-g-n-surjection-stab-g-n-", "display": "Proposition 3.2: poset Q(g,n), surjection Stab(g,n)->Q(g,n), stratification S(G) and closed subsets Z(G)", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "result", "genre": "original", "note": "Proposition 3.2 proved: poset structure <=_Q on Q(g,n) via sequences mixing edge-collapse and genus-0-edge-collapse (antisymmetry via the reverse-lexicographic vector s(J)); surjection Stab(g,n)->Q(g,n); stratum S(G)=UNION_{Hbar=G} M_H; closed subsets Z(G)."}, {"id": "s-e-g-product-cover-of-the-stratum-s-g-via-m-e-v", "display": "S^e(G): product cover of the stratum S(G) via M_{e(v),n(v),0} and M_{g(v),n(v)} with gluing map", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "definition", "genre": "original", "note": "Definition 3.3: S^e(G) = PROD_{g(v)=0} M_{e(v),n(v),0} x PROD_{g(v)>=1} M_{g(v),n(v)} (M_{e,n,0} = genus-e curves with all components genus 0), with canonical gluing map S^e(G) -> S(G) along graph edges; group A_G of half-edge relabelings acts on S^e(G)."}, {"id": "proposition-3-4-s-e-g-a-g-is-isomorphic-to-s-g", "display": "Proposition 3.4: S^e(G)/A_G is isomorphic to S(G)", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "result", "genre": "original", "note": "Proposition 3.4 proved: S^e(G)/A_G ~= S(G). Shown on C-points (groupoid quotient: every curve in S(G) glues from S^e(G), isomorphisms factor through A_G) and on formal neighborhoods via deformation theory (Ext^1(Omega_C, O_C) identifications indexed by spanning forests)."}, {"id": "btop-action-extends-to-the-disjoint-unions-of-s-", "display": "BTop action extends to the disjoint unions of S(G) and S^e(G) over Q(g,n)", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "claim", "genre": "original", "note": "The BTop action extends to the disjoint unions over G in Q(g,n) of S(G) and S^e(G): gluing acts on the poset Q(g,n) by gluing trees of stable graphs, inducing S(G)->S(f_*G) and S^e(G)->S^e(f_*G)."}, {"id": "proposition-3-5-fsop-module-structure-on-borel-m", "display": "Proposition 3.5: FSop module structure on Borel-Moore homology; BM spectral sequence of FSop modules", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "result", "genre": "original", "note": "Proposition 3.5 proved: BTop actions induce an FSop module structure on Borel-Moore homology with a map of FSop modules (+)H^BM_.(S(G)) -> (+)H^BM_.(S^e(G)), and the BM spectral sequence (+)H^BM_.(S(G)) ==> H_.(M_{g,n}) is a spectral sequence of FSop modules. Key: M_{0,n} smooth and proper with H^BM_.(M_{0,n})=Q, so every tree induces the same BM map."}, {"id": "proposition-4-1-w-i-h-bm-i-m-g-n-0-for-n-i-1-via", "display": "Proposition 4.1: W_{-i}H^BM_i(M_{g,n})=0 for n>i+1 via fibering over M_{g,1}", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "result", "genre": "original", "note": "Proposition 4.1 proved: for g>=1, W_{-i}H^BM_i(M_{g,n})=0 for n>i+1. Fibers M_{g,n}->M_{g,1} over (C,p) are Conf_{n-1}(C-p); pure classes of the fiber sit in degrees >= n-1 (Props 4.3, 4.4), forcing vanishing for i<n-1."}, {"id": "poincare-serre-polynomial-p-x-q-t-and-the-pure-o", "display": "Poincare-Serre polynomial P_X(q,t) and the pure ordering <=_pure", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "definition", "genre": "original", "note": "Definition 4.2: Poincare-Serre polynomial P_X(q,t)=SUM_{i,j} dim W^i H^c_j(X,Q) q^i t^j; f <=_pure g means coefficient-wise inequality on q^j t^j coefficients."}, {"id": "proposition-4-3-p-conf-n-c-p-q-t-pure-2gqt-q-2t-", "display": "Proposition 4.3: P_{Conf_n(C-p)}(q,t) <=_pure (2gqt+q^2t^2)^n (Getzler, cited)", "status": "conjectural", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "claim", "genre": "original", "note": "Proposition 4.3: P_{Conf_n(C-p)}(q,t) <=_pure (2g q t + q^2 t^2)^n, from Getzler's spectral sequence for compactly supported cohomology of configuration space [10]; pure classes on the E_1 page are (H^._c(C-p)^{tensor n}) in the stated bidegrees. Cited, not proved here."}, {"id": "proposition-4-4-pure-class-concentration-in-fibe", "display": "Proposition 4.4: pure-class concentration in fibers implies concentration in total space for smooth maps to smooth proper Y", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "result", "genre": "original", "note": "Proposition 4.4 proved: for f:X->Y smooth with Y smooth and proper over C, if pure classes of H^._c(X_y) sit in degrees >= k then pure classes of H^._c(X) sit in degrees >= k. Proof via the Verdier dual statement and weights of R^q f_* Q."}, {"id": "lemma-5-1-explicit-polynomial-bound-n-g-9g-2i-2-", "display": "Lemma 5.1: explicit polynomial bound n(G) <= 9g^2i^2+25g^2i+16g^2+11gi^2+7gi-4g for controlled stable graphs", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "result", "genre": "original", "note": "Lemma 5.1 proved: a stable genus-g graph with no genus-0/genus-0 edges, genus>=1 vertices of valence <= i+1, and genus-0 vertices obeying the (11i+7e+9a-5) external-edge bound has n(G) <= 9g^2 i^2 + 25g^2 i + 16g^2 + 11g i^2 + 7g i - 4g."}, {"id": "lemma-5-2-external-y-adjacent-trivalent-dichotom", "display": "Lemma 5.2: external-Y / adjacent-trivalent dichotomy for graphs with many external edges", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "result", "genre": "original", "note": "Lemma 5.2 proved: for J a single genus-0 vertex with e self-edges and [n-e]=[a]sqcup[b] external edges, if b > 11i+7e+9a-5 then every H with Hbar=J satisfies (1) SUM_v (n(v)-3) > i, or (2) a trivalent vertex adjacent to 2 external edges in [b], or (3) two adjacent trivalent vertices each adjacent to an external edge in [b]. Proved contrapositively via Euler characteristic counting."}, {"id": "theorem-1-2-proof-setup-p-i-g-bm-spectral-sequen", "display": "Theorem 1.2 proof setup: p(i,g); BM spectral sequence of FSop modules with A_G-invariant identification", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p2", "kind": "claim", "genre": "original", "note": "Section 6 setup: p(i,g)=9g^2 i^2+25g^2 i+16g^2+11g i^2+7g i-4g; the BM spectral sequence for the Q(g,n) stratification is a spectral sequence of FSop modules (Prop 3.5); the S(G)-side is identified with A_G-invariants of the S^e(G)-side (Prop 3.4). Goal: show (+)W_{-i}H^BM_i(S^e(G)) is finitely generated."}, {"id": "pushforward-reduction-pure-classes-as-f-d-for-su", "display": "pushforward reduction: pure classes as f^*(d) for surjections f:[n]->[n-1], via vertex tensor decomposition", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p3", "kind": "method", "genre": "original", "note": "Reduction strategy: for a pure class c in H^BM_i(S^e(G)) with G violating the bounds, show c is a linear combination of f^*(d) for surjections f:[n]->[n-1]; uses the tensor decomposition of W_{-i}H^BM_i(S^e(G)) over vertices v with SUM j(v)=i."}, {"id": "genus-1-vertex-of-valence-i-1-kills-the-pure-bor", "display": "genus>=1 vertex of valence > i+1 kills the pure Borel-Moore homology (Proposition 4.1)", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p3", "kind": "claim", "genre": "original", "note": "If G has a genus>=1 vertex of valence > i+1, Proposition 4.1 gives W_{-j}H_j(M_{g(v),n(v)})=0 for all j<=i, so H^BM_i(S^e(G))=0 and the pushforward claim holds vacuously."}, {"id": "pure-bm-homology-of-m-e-v-n-v-0-spanned-by-strat", "display": "pure BM homology of M_{e(v),n(v),0} spanned by strata fundamental classes [M_H]", "status": "exact", "cluster": "geometry", "chunk": "g2_tosteson_p3", "kind": "claim", "genre": "original", "note": "The BM spectral sequence for the stable-graph stratification of M_{e(v),n(v),0} shows its pure BM homology is spanned by strata fundamental classes [M_H] with Hbar=J and dim M_H <= i; hence it suffices to write [M_H] otimes c' = f^*(d)."}, {"id": "lemma-5-2-case-2-explicit-surjection-merging-two", "display": "Lemma 5.2 case (2): explic     nb.slice(0,24).forEach(e=>{ const o = e.a===n.id? e.b : e.a;
      const on = nodeById[o];
      h += `<div style="font-size:12px;margin:3px 0"><a href="#" data-n="${esc(o)}" style="color:#58a6ff">${esc(on?on.label:o)}</a> <span class="hint">— ${e.a===n.id? esc(e.rel)+' →' : '← '+esc(e.rel)} (×${e.w})</span></div>`; });
  }
  h += `<p class="hint" style="margin-top:10px">${n.facets.length} facet(s) · chunks: ${esc(n.chunks.join(', '))}</p>`;
  n.facets.forEach(f=>{
    h += `<div class="facet"><div class="lbl">${esc(f.label)}</div>`
      + `<div class="meta">${pill(f.status||'open')}<span class="hint">${esc(f.kind)}${f.genre?' · '+esc(f.genre):''} · ${esc(f.chunk)}${f.cid?' / '+esc(f.cid):''}</span></div>`
      + (f.note? `<div class="note">${esc(f.note)}</div>` : '') + `</div>`;
  });
  d.innerHTML = h;
  d.querySelectorAll('a[data-n]').forEach(a=>a.addEventListener('click', ev=>{
    ev.preventDefault(); const t=nodeById[a.getAttribute('data-n')]; if(t) select(t); }));
}
document.getElementById('legend').innerHTML =
  Object.keys(COLORS).map(k=>`<span class="li"><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}</span>`).join('')
  + `<span class="li hint">node size ∝ facet count</span>`;
(function(){
  const st = GRAPH.stats;
  const el = document.querySelector('#topbar .sub');
  el.textContent += ` · ${st.subjects} subjects · ${st.cross_edges} relations · ${GRAPH.loops.length} open loops · ${st.concepts} concepts`;
})();
document.getElementById('looplo').innerHTML = GRAPH.loops.map(l=>
  `<div class="loop"${l.node?` data-node="${esc(l.node)}" title="trace this constellation" style="cursor:pointer"`:''}><b>${esc(l.chunk)}</b> — ${esc(l.label)}</div>`).join('');
document.getElementById('looplo').addEventListener('click', e=>{
  const t = e.target.closest('[data-node]');
  if (t){ const n = nodeById[t.getAttribute('data-node')]; if (n) select(n); }
});
setInterval(tick, 30);
draw();
</script>
</body>
</html>
