probes:
- id: P1
  probe: "What is the Node 11 question, and why does the R1-R6 checklist exist — what does each requirement demand of a Frobenius-like operator?"
  answer_prose: "The question is what a Frobenius-like operator for the sieve/number-field setting would have to satisfy, and whether any candidate — on the Mobius-band stage M, on the face-complex, or in the literature — satisfies it. The checklist gives the template: R1 spectrum = zeros; R2 trace formula = explicit formula; R3 positivity/self-adjointness equivalent to RH; R4 positivity is counting-born (a degree>=0 analogue); R5 a finite exact formula; R6 a stage where the s~1-sbar symmetry is geometric. The FF Jacobian satisfies all six and is the template itself."
- id: P2
  probe: "Why is the 11a Berry-Keating xp verdict 'shape-only' — what does xp give, and what exactly does it fail to give?"
  answer_prose: "The semiclassical BK prediction N(T)~(T/2pi)(log(T/2pi)-1)+7/8 was verified against 400 zeros (|S(T)|<=1.164, mean 0.502, drift slope 5.5e-6, no drift). That gives R1's shape — reality of the spectrum is conjectured — and the smooth part of R2. But the fluctuation S(T), i.e. the actual zero positions, is exactly what xp does not give; it belongs to the periodic-orbit/prime side. There is also no rigorous operator (domain issues) and no R4. So it is the sharpest spectral candidate but remains a candidate."
- id: P3
  probe: "Why was the correction of the Mobius-band zero-orbit collapse from 4->1 to 4->2 necessary, and what is the content of that correction?"
  answer_prose: "M is the strip quotiented by s~1-sbar with (0,t)~(1,-t) gluing. Zero orbits collapse 4->2 on M (pairs {rho,(1-rho)bar}), with images lying on the central line sigma=1/2 — verified to 3.8e-16 via |xi(1-sbar)|^2=|xi(s)|^2 descending to M. The earlier 4->1 claim was wrong because s~sbar is a separate involution; the band uses only s~1-sbar. So RH on M becomes: all zero-images lie on the central line."
- id: P4
  probe: "Why is the Mobius band called a genuine 'stage' but not an operator — what does R6 being exact buy, and why does R1-R5 stay open?"
  answer_prose: "M satisfies R6 exactly: |xi|^2 descends to the band (exact theorem, numerically confirmed), so the functional equation becomes topological — the quotient forbids separating sigma<1/2 from sigma>1/2, and the flip binds them, which is the functional equation as inseparability. But no operator lives on it yet: 11d showed bare geometric operators on M (the Mobius Laplacian with exact spectrum lam=(pi*m)^2+(n*pi/2T)^2, m+n odd) have sqrt-spectra bearing no relation to zeta zeros, and the position observable |sigma-1/2| has continuous spectrum [0,1/2]. So the stage geometry alone does not see zeros; R1-R5 stay open."
- id: P5
  probe: "Why does the 11c audit conclude that the consistently missing piece is R1+R4 *together* — how do the three live fragments fail to combine?"
  answer_prose: "Auditing across candidates: BK xp has R1 shape-only, R2 smooth-only, R3 conjectural, R4 absent; the Mobius band has R6 exact but R1-R5 absent (stage, not operator); Connes' adele-class space has R2 full (trace formula = Weil explicit formula) and R3 as Weil-positivity but R4 not counting-born in the deg>=0 sense; the face-complex Delta operators have R4 present (Lambda>=0 counting; PD forms) but R1-R3 absent, with R5 only windowed. So the three live fragments are: positivity without operator (face-complex), operator-shape without counting (xp), and trace formula without geometric positivity (Connes). None closes R1^R4: an operator with zeros as spectrum whose positivity is counting-born."
- id: P6
  probe: "Why is the Connes-Consani-Moscovici zeta spectral triple (arXiv:2511.22755) the one LIVE candidate from the operator audit — what does it get right, and what stays honest about it?"
  answer_prose: "D_log^{(lam,N)} is self-adjoint by construction (Caratheodory-Fejer/Toeplitz extension), built ONLY from Euler products over p<=lam^2, and spectra numerically coincide with low zeros with 'striking accuracy' even at small x; independently reproduced (Rust/MPFR, 999 digits, June 2026). The authors are honest that proof of convergence = proof of RH. It is the closest any literature candidate comes to the program's filtration language (x->infty is a sieve-limit; the Weil form on support<=S is a finite face-sum object). It stays a computational target: reimplement from prime Euler products alone, verify spectral coincidence, audit perturbation for zero-fitting, quantify convergence error bars (D2), and map the failure mode — what the spectra do if RH is false."
- id: P7
  probe: "Why were Bost-Connes, Ruelle transfer, Sierra xp-variants, Bender-Brody-Mueller, and Wu-Sprung killed in the 11e audit — what was each one's fatal defect?"
  answer_prose: "Bost-Connes: no zeros in the machine — it gets the pole, not the zeros. Ruelle transfer: reduces to Deninger — no dynamics, no operator. Sierra xp-variants: smooth-count ceiling, same as 11a. Bender-Brody-Mueller: the answer inserted by hand, not self-adjoint. Wu-Sprung: inverse tautology; the 'fractal' was approximation error. All failed the D1-D13 filter on the 8-point checklist; the remaining conjectural-only ones (Connes 1999, Deninger program) fail only on what is missing (Weil positivity IS RH at the highest level; the missing space is the whole problem)."
- id: P8
  probe: "Why does the Mobius-band cut experiment matter, and what did the twist-count verification establish?"
  answer_prose: "Cutting a Mobius band along its center line does NOT give two bands: it gives ONE band, 2x length, with 4 half-twists (2 full twists), orientable — the one-sidedness is destroyed. The twist count was verified numerically via the Gauss linking integral of the two boundary circles (|lk|=1.9999 -> k=4, with the integrator calibrated: k=0->0, k=2->1). Cutting at 1/3 from the edge gives TWO linked bands (thin Mobius + long 2-twist band), the classical result. The classical topology is exact; the twist count is computationally verified. It tests the geometric intuition about the stage before operator candidates are placed on it."
- id: P9
  probe: "Why is the 11d spectral verdict on the bare stage exact and negative — what was derived, and what is the forced conclusion?"
  answer_prose: "The truncated (|t|<=50) Mobius-band Laplacian has exact spectrum lam=(pi*m)^2+(n*pi/2T)^2 with m+n odd (derived from the orientable double cover plus deck involution, not cited). Its sqrt-spectrum (0.031, 0.094, 0.157, ...) bears no relation to zeta zeros (14.13, 21.02, 25.01, ...), and the position observable |sigma-1/2| has continuous spectrum [0,1/2]. The verdict is negative and exact: bare geometric operators on M do not see zeros. The forced conclusion is that the operator, if it exists, must see the arithmetic (prime/weight) data, not just the stage geometry."
- id: P10
  probe: "Why is the next fork queued to probe the WEIGHTED face filtration for operator-like structure — where does that priority come from?"
  answer_prose: "Because the weighted face filtration is the one place in the ledger where counting-born positivity actually lives: the face-complex Delta operators satisfy R4 (Lambda>=0 counting; 10c PD forms), even though R1-R3 are absent there and there is no natural operator in view (Delta_infty contractible, D4; R5 windowed only per the 10e wall). Given 11c's verdict that the missing piece is consistently R1+R4 together, and 11d's verdict that bare stage geometry cannot see zeros, the place that already has R4 — the weighted face filtration — is the sharpest remaining seat for the operator hunt. Node 11 stays OPEN pending an operator candidate that can be scored."
