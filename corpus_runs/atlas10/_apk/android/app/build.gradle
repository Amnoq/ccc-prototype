plugins {
    id 'com.android.application'
}

android {
    namespace 'org.atlas10.app'
    compileSdk 34

    defaultConfig {
        applicationId "org.atlas10.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
