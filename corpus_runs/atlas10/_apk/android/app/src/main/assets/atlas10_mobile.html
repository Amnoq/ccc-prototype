, "label": "the two opening principles restated", "kind": "claim", "status": "exact", "genre": "principle", "note": "'1st, quick development of pieces and avoidance of lost moves; 2nd, the maintenance of a pawn centre, hampering the development of the opposing forces, and the avoidance of pawn moves that do not contribute to the development of pieces'.", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c49:the-end-game-is-the-king-s-active-part": {"display": "the end-game is the King's active part", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c49", "label": "the end-game is the King's active part", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'One of the main characteristics of end-games is the active part taken by the King. Clearly the King cannot venture out into the field of operations until there has been an exchange of the majority of the pieces'.", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c50:exchange-into-typical-elementary-won-positions": {"display": "exchange into typical elementary won positions", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c50", "label": "exchange into typical elementary won positions", "kind": "claim", "status": "exact", "genre": "principle", "note": "'as soon as a player has attained some advantage in material which ensures the victory in the end-game, he will try to bring about the end-game by exchanging pieces... It is first necessary to know what surplus of forces is the minimum required in order to force a mate'.", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c53:queen-wins-vs-any-piece-vs-rook-transfer-the-move": {"display": "Queen wins vs any piece; vs Rook transfer the move", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c53", "label": "Queen wins vs any piece; vs Rook transfer the move", "kind": "result", "status": "exact", "genre": "endgame-claim", "note": "'The Queen wins against any other piece; the Rook alone may give trouble... White must try to transfer to the other side the onus of having to move' (Diag 45: 1.Q-K5ch, K-R1; 2.Q-R1ch, K-Kt1; 3.Q-R5, and wins).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c54:r-vs-b-drawn-in-the-opposite-colour-corner": {"display": "R vs B drawn in the opposite-colour corner", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c54", "label": "R vs B drawn in the opposite-colour corner", "kind": "result", "status": "exact", "genre": "endgame-claim", "note": "'In endings of ROOK AGAINST BISHOP the weaker King must take refuge in a corner square of different colour from that of his Bishop' (Diag 46 stalemate); shifted toward the centre White wins (Diag 47).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c55:r-vs-kt-lost-if-the-knight-is-cut-off-from-its-king": {"display": "R vs Kt: lost if the Knight is cut off from its King", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c55", "label": "R vs Kt: lost if the Knight is cut off from its King", "kind": "result", "status": "exact", "genre": "endgame-claim", "note": "'In endings of ROOK AGAINST KNIGHT, the weaker side loses, where the Knight is cut off from his King' ('oblique opposition', Diag 48); 'As soon as the Knight can obtain the King's support the game is drawn even when the King is already forced on to the edge'.", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c56:k-p-vs-k-draw-needs-queening-square-command-plus-fir": {"display": "K+P vs K: draw needs queening-square command plus first-rank opposition at the sixth", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c56", "label": "K+P vs K: draw needs queening-square command plus first-rank opposition at the sixth", "kind": "result", "status": "exact", "genre": "endgame-claim", "note": "'The King draws against King and pawn if he commands the queening square, and if he can retain the opposition on the first rank as soon as the pawn moves into his sixth' (Diag 50: 3...K-Q1!! draws); 'It is of the utmost importance that the pawn should be at his sixth'; 'If the King is more than one rank ahead of his pawn... the end-game can always be won' (Diag 54).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c57:the-rook-s-pawn-exception-the-lone-king-draws-from-t": {"display": "the rook's-pawn exception: the lone King draws from the queening corner", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c57", "label": "the rook's-pawn exception: the lone King draws from the queening corner", "kind": "result", "status": "exact", "genre": "endgame-claim", "note": "'when a ROOK'S PAWN is concerned... the isolated King always succeeds in drawing if he can reach the corner where the pawn has to queen, for he cannot be driven out again' (Diag 55: 7.P-R7, K-B1 \u2014 White stalemated).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c58:the-passed-pawn-s-mere-threat-ties-the-king": {"display": "the passed pawn's mere threat ties the King", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c58", "label": "the passed pawn's mere threat ties the King", "kind": "method", "status": "exact", "genre": "method", "note": "'White does not even need to Queen his passed pawn. The mere threat forces the win. For the pawn at Kt4 reduces the mobility of the Black King, in so far as the latter must at all times be ready to reach the queening square' (Diag 56).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c59:same-wing-majorities-win-only-via-opposition-before-": {"display": "same-wing majorities win only via opposition before the last pawn", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c59", "label": "same-wing majorities win only via opposition before the last pawn", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'exchanges are of no use unless the King can assume the opposition in front of the last remaining pawn' (Diag 57: 1.P-B3 forces Black to relinquish the opposition).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c60:count-each-side-s-queening-moves-separately": {"display": "count each side's queening moves separately", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c60", "label": "count each side's queening moves separately", "kind": "method", "status": "exact", "genre": "method", "note": "'By simply enumerating the moves necessary for either player to queen his pawn \u2014 SEPARATELY for White and Black \u2014 we can see the result... It is necessary to make it a rule to examine positions in which each side has a passed pawn, by counting the moves in the way first shown' (Diag 59: White queens in ten; Black's pawn only to B6).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c61:the-distant-passed-pawn-wins": {"display": "the distant passed pawn wins", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c61", "label": "the distant passed pawn wins", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'the most important type is the end-game with the distant passed pawn... Black wins' (Diag 58) \u2014 'the Black King is two files nearer the battle-field (the Queen's side), so that the White pawns must fall'.", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c62:no-pawn-moves-left-whoever-moves-takes-the-oppositio": {"display": "no pawn moves left: whoever moves takes the opposition and wins", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c62", "label": "no pawn moves left: whoever moves takes the opposition and wins", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'there are no more pawn moves. Whoever has the move wins by assuming the opposition' (Diag 60); 'White with the move wins by 1.K-K2, thus assuming distant opposition (squares of the same colour!!)' (Diag 62).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c63:pawns-behind-the-advanced-king-usually-wins-unless-a": {"display": "pawns behind: the advanced King usually wins, unless a weak pawn counterbalances", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c63", "label": "pawns behind: the advanced King usually wins, unless a weak pawn counterbalances", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'If the pawns are still standing behind, the King who has the most advanced position has always the advantage' (Diag 63); 'We see here how the King's position can be counterbalanced by the weakness of a pawn, and lead to a draw... If the White QBP was not isolated but standing, for instance, at QKt2, Black would be lost'.", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c64:the-isolated-pawn-is-weaker-its-defence-fetters-mobi": {"display": "the isolated pawn is weaker; its defence fetters mobility", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c64", "label": "the isolated pawn is weaker; its defence fetters mobility", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'A pawn, when isolated, is naturally weaker than when it is or can be protected by another... the mobility of the King or a piece is reduced by having to protect the pawn'.", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c65:doubled-pawns-are-weak-only-when-isolated-or-passive": {"display": "doubled pawns are weak only when isolated or passively held", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c65", "label": "doubled pawns are weak only when isolated or passively held", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'It is frequently and erroneously thought that DOUBLED pawns as such are a weakness. Doubled pawns are weak when ISOLATED, for they cannot support each other' (Diag 64); 'a drawback, even when not isolated, should there be no way of obtaining a passed pawn by exchanging them' (Diag 66); 'The proper formation for the Black pawns would be at B3, Kt2, R3'.", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c66:extra-pawn-won-only-by-its-sacrifice-the-counterpart": {"display": "extra pawn won only by its sacrifice; the counterpart draws", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c66", "label": "extra pawn won only by its sacrifice; the counterpart draws", "kind": "result", "status": "exact", "genre": "endgame-claim", "note": "'White can only win in the following manner: 1.P-Kt4ch, PxPch; 2.K-Kt3... Any other way would allow Black to assume the opposition and to force the draw' (Diag 68); counterpart: 'one of the few cases in which the possession of an extra pawn does not force a win... 1...P-B4ch! and after 2.PxPch, K-B3 followed by KxP ensure the draw' (Diag 69).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c67:piece-endings-opposition-of-little-use-pawn-strength": {"display": "piece endings: opposition of little use; pawn strength, King squares, mobility decide", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c67", "label": "piece endings: opposition of little use; pawn strength, King squares, mobility decide", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'in nearly all end-games with pieces the King's manoeuvres used in pawn endings are of no avail, as far as opposition is concerned... However, the strength of the pawn position is of the same importance... A third and very important factor is again the mobility of pieces' (Diag 70: weaker pawns, less mobile Bishop, tied King decide).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c68:2b-2kt-rook-beats-minor-piece-even-vs-1-2-extra-pawn": {"display": "2B > 2Kt; Rook beats minor piece even vs 1-2 extra pawns; tear up the pawn front first", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c68", "label": "2B > 2Kt; Rook beats minor piece even vs 1-2 extra pawns; tear up the pawn front first", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'two Bishops are superior to two Knights because the limitation of the colour of squares ceases. A Rook generally wins against a Bishop or a Knight, sometimes even against a majority of one or two pawns, provided... there are still pawns on the Rook's side, and that their exchange cannot be forced... The Black pawn position must first be torn up' (Diag 71: 6.P-B4!).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c69:wrong-colour-bishop-draws-win-by-gaining-a-tempo-a-k": {"display": "wrong-colour Bishop draws; win by gaining a tempo; a Knight can never gain a tempo", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c69", "label": "wrong-colour Bishop draws; win by gaining a tempo; a Knight can never gain a tempo", "kind": "result", "status": "exact", "genre": "endgame-claim", "note": "'an end-game with a Rook's pawn and a Bishop of the wrong colour' draws (Diag 72); even the 'right colour' Bishop draws unless the pawn is kept \u2014 'it is possible to win by gaining a move with the Bishop' (Diag 73); 'it is impossible to gain a move with a Knight, as a square which is accessible to him in an odd number of moves cannot be reached by him in an even number' (Diag 74).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c71:r-vs-r-extra-pawn-rarely-enough-without-the-more-mob": {"display": "R vs R: extra pawn rarely enough without the more mobile Rook; stalemate trick", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c71", "label": "R vs R: extra pawn rarely enough without the more mobile Rook; stalemate trick", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'End-games with Rook against Rook are the most frequent, as well as the most difficult. Here the possession of an extra pawn is seldom sufficient for a win, unless the stronger side has also an advantage in the greater mobility of the Rook' (Diag 78); 'By placing his Rook behind the passed pawn he condemns the opposing Rook to inactivity'; one pawn drawn if the King commands the queening square (Diag 79: 1...R-B2; 2.R-KKt2, R-Q2ch; 3.PxR stalemate).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c72:q-vs-q-drawish-queen-beats-a-king-backed-passer-exce": {"display": "Q vs Q drawish; Queen beats a King-backed passer except R/B pawn on seventh", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c72", "label": "Q vs Q drawish; Queen beats a King-backed passer except R/B pawn on seventh", "kind": "claim", "status": "exact", "genre": "endgame-claim", "note": "'The chances of a draw are even greater in endings of Q against Q, as the King on the stronger side can seldom evade perpetual check'; 'The Queen wins against an advanced pawn, even when the latter is supported by the King; only the R or B pawn can draw sometimes, when the pawn is on the seventh supported by the King' (cases A-C); 'Two passed pawns win, even when the King is away from them, if they have reached their sixth square' (Diag 81); supported Kt7 pawn draws vs Rook (Diag 80).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c73:masters-exchange-at-the-slightest-pawn-advantage-end": {"display": "masters exchange at the slightest pawn advantage; end-games are calculable", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c73", "label": "masters exchange at the slightest pawn advantage; end-games are calculable", "kind": "claim", "status": "exact", "genre": "principle", "note": "'we note in contemporary master play a tendency to simplify the middle-game by exchanging pieces, as soon as there is an infinitesimal advantage in the pawn position... it is just because end-games can be calculated to a nicety, there being no moves of which the consequences cannot be foreseen'.", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c74:the-middle-game-starts-from-the-pawn-skeleton-s-tran": {"display": "the middle game starts from the pawn skeleton's TRANSFORMATION", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c74", "label": "the middle game starts from the pawn skeleton's TRANSFORMATION", "kind": "method", "status": "exact", "genre": "method", "note": "'I will start from the TRANSFORMATION which the pawn skeleton has to undergo in the course of further operations... We must throughout maintain a favourable pawn formation, in view of the end-game which might be forced on us by exchanges'.", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c76:attack-only-objects-that-cannot-move-away": {"display": "attack only objects that cannot move away", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c76", "label": "attack only objects that cannot move away", "kind": "claim", "status": "exact", "genre": "principle", "note": "'it is of no possible use to direct an attack on anything that can move away' (recap point 1).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c77:no-chasing-well-posted-pieces-at-the-cost-of-the-paw": {"display": "no chasing well-posted pieces at the cost of the pawn skeleton", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c77", "label": "no chasing well-posted pieces at the cost of the pawn skeleton", "kind": "claim", "status": "exact", "genre": "principle", "note": "Attacks to drive off a well-posted piece are unwise 'if it involves the weakening the pawn position, or if pieces have to take up inferior positions in order to effect their purpose' (recap point 2).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c78:pawn-moves-always-create-weaknesses-above-all-before": {"display": "pawn moves always create weaknesses, above all before the castled King", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c78", "label": "pawn moves always create weaknesses, above all before the castled King", "kind": "claim", "status": "exact", "genre": "principle", "note": "'Pawn moves always create weaknesses, either by leaving other unsupported pawns behind, or by giving opposing pieces access to squares formerly guarded by them, and this more specially so in front of the castled King' (recap point 3).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c79:pawn-attacks-need-overwhelming-concentrated-force": {"display": "pawn attacks need overwhelming concentrated force", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c79", "label": "pawn attacks need overwhelming concentrated force", "kind": "claim", "status": "exact", "genre": "principle", "note": "'Attacks which depend on pawn moves are only justified if overwhelming forces can be accumulated in support, as the advanced pawns might become the object of a counter attack' (recap point 4).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c80:the-middle-game-is-the-pieces-hunting-ground-never-r": {"display": "the middle game is the pieces' hunting ground; never reduce mobility", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c80", "label": "the middle game is the pieces' hunting ground; never reduce mobility", "kind": "claim", "status": "exact", "genre": "principle", "note": "'the middle game is the pieces' own hunting ground. As in the opening, the first consideration of sound play in the middle game is to make only such moves as do not reduce the mobility of the pieces' (recap point 5).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c81:fix-a-pawn-by-blockade-or-superior-control-fix-a-pie": {"display": "fix a pawn by blockade or superior control; fix a piece only by a pin; then pile on", "status": "exact", "facets": [{"chunk": "theory_lasker", "cid": "c81", "label": "fix a pawn by blockade or superior control; fix a piece only by a pin; then pile on", "kind": "method", "status": "exact", "genre": "method", "note": "'Should it... be desired to prevent a PIECE from being moved, that can only be effected by means of a pin. A PAWN, however, can be held in place either by occupying the square immediately in front of it, or by controlling the latter with more forces than the opponent can bring to bear upon it'; then 'double his Rooks, and bring the Q and QB to bear in a concentrated attack on Q6' (Diag 91-92).", "subjects": []}], "status_note": null, "chunks": ["theory_lasker"], "killed_facets": 0}, "theory:theory_lasker:c82:backward-pawn-play-runs-on-fixed-lines-easier-with-n": {"display": "backward-pawn play runs on fixed li     cam.x+=dx; cam.y+=dy; drag.x=p.x; drag.y=p.y;
  } else if (e.touches.length===2 && pinch){
    const a=e.touches[0], b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (d>0) cam.z = Math.max(.3, Math.min(4, pinch.z * d/pinch.d));
  }
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchend', e=>{
  if (drag && !drag.moved && e.changedTouches.length){
    const t=e.changedTouches[0], r=cv.getBoundingClientRect();
    select(nodeAt(t.clientX-r.left, t.clientY-r.top));
  }
  drag=null; pinch=null;
});
function pill(st){ return `<span class="pill st-${st}">${NAMES[st]||st}</span>`; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function select(n){
  selected = n;
  const d = document.getElementById('detail');
  if (!n){ d.innerHTML = '<p class="hint">Select a node to inspect its facets, notes and provenance.</p>'; return; }
  let h = `<h2 style="word-break:break-word">${esc(n.label)}</h2>`;
  h += `<div style="margin-bottom:6px">${pill(n.status)} <span class="hint">${esc(n.id)}</span></div>`;
  if (n.note) h += `<p style="font-size:12px;color:#c9d1d9"><i>merge note:</i> ${esc(n.note)}</p>`;
  if (n.killedFacets) h += `<p style="font-size:12px;color:#f85149">${n.killedFacets} killed facet(s) — see below</p>`;
  const nb = edges.filter(e=>e.a===n.id||e.b===n.id);
  if (nb.length){ h += `<p class="hint">${nb.length} relation(s):</p>`;
    nb.slice(0,24).forEach(e=>{ const o = e.a===n.id? e.b : e.a;
      const on = nodeById[o];
      h += `<div style="font-size:12px;margin:3px 0"><a href="#" data-n="${esc(o)}" style="color:#58a6ff">${esc(on?on.label:o)}</a> <span class="hint">— ${e.a===n.id? esc(e.rel)+' →' : '← '+esc(e.rel)} (×${e.w})</span></div>`; });
  }
  h += `<p class="hint" style="margin-top:10px">${n.facets.length} facet(s) · chunks: ${esc(n.chunks.join(', '))}</p>`;
  n.facets.forEach(f=>{
    h += `<div class="facet"><div class="lbl">${esc(f.label)}</div>`
      + `<div class="meta">${pill(f.status||'open')}<span class="hint">${esc(f.kind)}${f.genre?' · '+esc(f.genre):''} · ${esc(f.chunk)}${f.cid?' / '+esc(f.cid):''}</span></div>`
      + (f.note? `<div class="note">${esc(f.note)}</div>` : '') + `</div>`;
  });
  d.innerHTML = h;
  d.querySelectorAll('a[data-n]').forEach(a=>a.addEventListener('click', ev=>{
    ev.preventDefault(); const t=nodeById[a.getAttribute('data-n')]; if(t) select(t); }));
}
document.getElementById('legend').innerHTML =
  Object.keys(COLORS).map(k=>`<span class="li"><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}</span>`).join('')
  + `<span class="li"><span class="dot" style="background:#ffd700"></span>verified crack</span>`+ `<span class="li"><span class="dot" style="background:#8a7a2a"></span>split_link</span>`+ `<span class="li hint">node size ∝ facet count</span>`;
(function(){
  const st = GRAPH.stats;
  const el = document.querySelector('#topbar .sub');
  el.textContent += ` · ${st.subjects} subjects · ${st.cross_edges} gold cross-sky links · ${GRAPH.loops.length} open loops · ${st.concepts} concepts`;
})();
document.getElementById('looplo').innerHTML = GRAPH.loops.map(l=>
  `<div class="loop"><b>${esc(l.chunk)}</b> — ${esc(l.label)}</div>`).join('');
setInterval(tick, 30);
draw();
/* ---- mobile chrome: collapsible top + bottom sheet (hand adaptation, mobile copy only) ---- */
(function(){
  if (!(window.matchMedia && matchMedia('(max-width: 900px)').matches)) return;
  var app = document.getElementById('app');
  var topbar = document.getElementById('topbar');
  var q = document.getElementById('q');
  /* slim top grabber */
  var grab = document.createElement('div');
  grab.id = 'topgrab';
  grab.innerHTML = '<span class="chev">⌄</span><span>Atlas-10</span><span id="gsearch" title="search">🔍</span>';
  app.insertBefore(grab, document.getElementById('main'));
  /* close strip inside the drop-down */
  var tc = document.createElement('div');
  tc.id = 'topclose';
  tc.innerHTML = '<span class="chev" style="color:#58a6ff">⌃</span><span>tap to hide</span>';
  tc.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:8px;height:28px;color:#8b949e;font-size:12px;font-weight:600;cursor:pointer;touch-action:none;margin-bottom:6px;';
  topbar.insertBefore(tc, topbar.firstChild);
  function setTop(open){
    topbar.classList.toggle('open', open);
    document.body.classList.toggle('top-open', open);
  }
  var gSuppress = false;
  grab.addEventListener('click', function(){
    if (gSuppress){ gSuppress = false; return; }
    setTop(!topbar.classList.contains('open'));
  });
  document.getElementById('gsearch').addEventListener('click', function(e){
    e.stopPropagation();
    setTop(true);
    /* focus only once the panel is visible — focusing a translated-away
       input does not summon the keyboard */
    setTimeout(function(){ q.focus(); }, 340);
  });
  tc.addEventListener('click', function(){ setTop(false); });
  var gsy = null, gDrag = false;
  grab.addEventListener('touchstart', function(e){
    gsy = e.touches[0].clientY; gDrag = false;
    topbar.classList.add('dragging');
  }, {passive:true});
  grab.addEventListener('touchmove', function(e){
    if (gsy === null) return;
    var dy = e.changedTouches[0].clientY - gsy;
    if (Math.abs(dy) > 8) gDrag = true;
    if (gDrag){
      var base = topbar.classList.contains('open') ? 0 : -103;
      var px = (dy / window.innerHeight) * 100;
      var np = Math.max(-103, Math.min(0, base + px));
      topbar.style.transform = 'translateY(' + np + '%)';
    }
  }, {passive:true});
  grab.addEventListener('touchend', function(e){
    if (gsy === null) return;
    var dy = e.changedTouches[0].clientY - gsy;
    var wasDrag = gDrag;
    gsy = null; gDrag = false;
    topbar.classList.remove('dragging');
    topbar.style.transform = '';
    if (wasDrag){ gSuppress = true; setTop(dy > 40); }
  }, {passive:true});
  cv.addEventListener('touchend', function(){ if (topbar.classList.contains('open')) setTop(false); });
  /* bottom sheet */
  var side = document.getElementById('side');
  var hg = document.createElement('div');
  hg.id = 'sheetgrab';
  hg.innerHTML = '<span class="chev">⌃</span><span>Details</span><span class="chev">⌃</span>';
  side.insertBefore(hg, side.firstChild);
  var si = 0; /* 0 collapsed, 1 half, 2 full */
  function setSheet(i){
    si = Math.max(0, Math.min(2, i));
    side.classList.toggle('half', si === 1);
    side.classList.toggle('full', si === 2);
    var ch = hg.querySelectorAll('.chev');
    for (var k = 0; k < ch.length; k++) ch[k].textContent = si === 0 ? '⌃' : '⌄';
  }
  var hSuppress = false;
  hg.addEventListener('click', function(){
    if (hSuppress){ hSuppress = false; return; }
    setSheet(si === 0 ? 1 : 0);
  });
  var hsy = null, hcur = 0;
  hg.addEventListener('touchstart', function(e){ hsy = e.touches[0].clientY; hcur = si; }, {passive:true});
  hg.addEventListener('touchend', function(e){
    if (hsy === null) return;
    var dy = hsy - e.changedTouches[0].clientY; hsy = null; /* up positive */
    if (dy > 28){ hSuppress = true; setSheet(hcur + 1); }
    else if (dy < -28){ hSuppress = true; setSheet(hcur - 1); }
  }, {passive:true});
  /* tapping a node raises the sheet to half */
  var _select = select;
  select = function(n){ _select(n); if (n && si === 0) setSheet(1); };
})();
</script>
