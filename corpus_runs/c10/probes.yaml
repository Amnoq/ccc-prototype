  answer_prose: "Every ingredient already lives in the sieve's own materials, nothing is brought in from outside. Faces S of Delta_z are the fermionic Fock basis over primes <= z; each prime used at most once is the Pauli principle, which is the squarefree kernel; mu equals (-1)^F (fermion parity); and face adjacency is fermionic hopping. The construction was approved by the user as the weighted face-filtration fork and is labeled an exact identification."
- id: P6
  probe: "Why was H_2 killed 'by inspection' rather than by numerics, and what exactly did inspection reveal?"
  answer_prose: "H_2 = sum_p (log p / p)(a_p^dag + a_p) is one-body hopping with the prime terms of -zeta'/zeta, but its per-prime terms commute ([O_p, O_q]=0) and square to one (O_p^2=1), so the spectrum is EXACTLY {sum_p +/-(log p)/p} — an integrable system readable off the algebra. Numerics were only a sanity check: dense diagonalization at z=13 agreed to 2.4e-15, and the spacings were spiky and structured with <r>=0.503. The verdict is integrable by inspection, no numerics needed."
- id: P7
  probe: "Why did H_int come out Poisson, and why was that verdict 'unsurprising in hindsight'?"
  answer_prose: "H_int = H_2 + sum_{p<q} (log p log q)/(pq) n_p n_q is diagonalized at z<=29 (dim<=1024) and its bulk spacings track Poisson, not GUE: <r> = 0.459, 0.418, 0.400, 0.411, 0.419 (Poisson 0.386, GUE 0.536), with a monotone-decreasing histogram peaked at 0. In hindsight this was unsurprising because the interaction term is Fock-diagonal — it shifts energies but causes no transitions — so all the mixing comes from the integrable one-body hopping, which cannot produce chaos. The probe's lesson is that the next construction must be an off-diagonal two-body term (pair hopping a^dag a^dag a a with arithmetic weights)."
- id: P8
  probe: "What is the implementation subtlety in writing the 13d pair-hop sum, and why must the sum be restricted to canonical sectors?"
  answer_prose: "H(lam) = H_2 + H_diag + lam * sum_{p,q,r,s} w_p w_q w_r w_s a_p^dag a_q^dag a_r a_s is the number-conserving pair hop with w_p = (log p)/p. The subtlety: summing over ALL ordered quadruples with symmetric weights gives identically zero, because fermionic antisymmetry makes a_r a_s = -a_s a_r, so the contributions cancel pairwise. The sum must instead use the canonical p<q, r<s sectors. The coupling lam_0 is fixed by ||lam_0 H_pair||_F = ||H_2 + H_diag||_F and scanned from 0.25x to 4x."
- id: P9
  probe: "What is the precise claim of the 13d positive, and why do its three exact caveats bound it the way they do?"
  answer_prose: "The precise claim: the sieve's native Fock space with arithmetically-weighted hopping + interaction + pair-hopping is quantum-chaotic in the GUE class — bulk <r> -> 0.52-0.55 (GUE 0.536, Poisson 0.386) across all z>=17 and all couplings, with a spacing histogram showing level repulsion (dip at 0, peak ~0.5) tracking Wigner. Caveat (1): the shuffled-weight control ALSO gives GUE (0.524), so this is generic two-body quantum chaos (TBRE class) not created by the arithmetic — the non-trivial content is that the arithmetic weights are COMPATIBLE with chaos (they could have been too weak or too structured). Caveat (2): universality class != the zeros — the eigenvalues are not gamma_n, so there is no zero detection. Caveat (3): finite sizes, and the histogram is not pure Wigner yet. It is the first operator in the hunt pointing the right way, a universality-class result rather than a bridge to the zeros."
