probes:
- id: P1
  probe: "Why are the linkages L1–L3 dead 'by theorem, not difficulty' — what counting argument kills any fixed-dimension manifold Laplacian as a zeta-zero spectrum?"
  answer_prose: "Weyl's law N(Lambda) ~ C_d Vol Lambda^{d/2} gives a pure power law, but the zeros need (T/2pi) log T. At d=2 the growth is too slow by a log; at d>=3 it is too fast. The 12b probe enumerated 554,981 lattice points for the flat-T^3 Laplacian (exact spectrum 2pi*sqrt(m^2+n^2+k^2)) and found no relation between the first 300 eigenvalues and the first 300 zeros. The honest loophole recorded in the framework doc is that zeros-as-subset of a higher-dimensional spectrum is not closed by Weyl — only the claim that the zeros are the spectrum in counting is dead."
- id: P2
  probe: "Why is the Deninger-type linkage (L4) described as the surviving form of the user's original idea, and how does it link the two tori?"
  answer_prose: "The user's original idea was to link a 2-torus and a 3-torus by a self-adjoint operator; the Laplacian version of that died by Weyl. The surviving form recasts the link as dynamics instead of spectrum: a 3D foliated dynamical system with 2D leaves, where the flow generator (skew-adjoint) is the leaf-to-ambient link, closed orbits play the role of primes, the Ruelle zeta equals the Riemann zeta, and the explicit formula is a Lefschetz trace. Its status is conjectural and 'non-probable' per dead-end guardrail D8 (formulate, do not simulate shadows)."
