probes:
- id: P1
  probe: "What is the 'key orienting fact' from the literature that tells the program what the missing span must be made of, and why does it imply the source is geometric?"
  answer_prose: "Weil (1952) proved RH *is* a positivity — W(f∗f̃) ≥ 0 for all test f, where W is the explicit-formula distribution — and over function fields RH was proved *by* a positivity with a known geometric source (the intersection pairing on C×C). Together they fix the missing span's content: it must be a *source* of positivity, and such sources are known to be geometric. The program's candidate source is stratum energies; the rest of the bridge is connecting that geometric positivity to Weil's positivity."
- id: P2
  probe: "What is the circularity warning attached to option 10a, and why doesn't translating Weil's criterion into the energy language count as progress toward proving RH?"
  answer_prose: "Translating Weil is not proving RH — the positivity must come from the geometry *independently*. Re-expressing the criterion in native vocabulary (vertex towers for the prime-power sum, squares for the test functions) produces the same condition with new words, not a new source of it; unless the geometry itself independently yields the positivity, the result is a dictionary rather than a proof."
- id: P3
  probe: "How did 10a-step2 establish that the bridge is a genuine formula rather than a tautology? What does 'W(h) ≥ 0 exhibited with NO zeros used — pure prime-side' mean, and what was the derived structural finding?"
  answer_prose: "The symmetric Guinand–Weil formula was verified zero-side vs prime-side to machine precision (2e-16) for Gaussian squares h_a = |e^{-ar^2/2}|^2, a = 0.02/0.1/0.5, and the prime side alone exhibited W(h) ≥ 0 — positivity computed with no zeros used. The derived structural finding: prime-side positivity is cancellatory, not termwise (at a=0.5: pole 2.266297 + arch −1.196347 − prime drain 1.069950 ≈ 0); the bridge IS the formula equating termwise zero-side positivity with prime-side balance. Dictionary: h=|H|² ↔ P=|Q|²."
- id: P4
  probe: "What is the resonance mechanism of the 10a-step3 zero detector, and how do the T0=50 and T0=100 window results evidence it?"
  answer_prose: "The detector h_{T0,w} (sum of squares, exact Fourier pair) has W(h) computed from primes alone agreeing with the zero side to 4e-16, and it counts zeros in a window. The resonance mechanism: the oscillatory prime sum goes negative exactly when a zero is in the window — T0=50 (zero present): −0.59/−0.98; empty window T0=100: +0.36, W all leakage. For detectors the pole term is 0 and the archimedean contribution is a positive background. Tightest dictionary (exact algebra): detector prime side = 2Cg·Re[windowed E_1(1/2,T0)] — the D8 energy, the window buying convergence at σ=1/2."
- id: P5
  probe: "Why is 10a's optimization answer a 'Pareto frontier' with 'no finite optimum'?"
  answer_prose: "The figure of merit is concentration — leakage dropping 0.68 → 0.30 → 0.0007 — and the price is uncertainty: a 1e-12 envelope at n = e^{7.4/w} requires 41/1700/2.8e6 primes. Sharper concentration costs exponentially more primes, so the trade-off never saturates at a finite optimum; it is a Pareto frontier."
- id: P6
  probe: "Why did 10b close as 'Li is Dirichlet-native, not face-sum-native'? What were the two pieces of derived evidence?"
  answer_prose: "First, S_1 = 1 + γ/2 − (1/2)log(4π) is archimedean — the proof uses only the functional equation, so no convergent prime-sum presentation is possible. Second, the Λ-sums that want to be λ_n's coefficients diverge as k!/ε^{k+1} (verified 7.45 → 156 across k,ε) — λ_n needs their finite parts. The lesson: the face-sum carries smoothed/windowed positivity, not coefficient positivity; Li's criterion is the sharp-cutoff (inadmissible) limit of Weil-type positivity."
- id: P7
  probe: "What does 10c's exact theorem state, and why does the verdict call it 'template, not zero-detector'?"
  answer_prose: "On Δ_z, min_{λ_∅=1} Σ_{S,T} λ_S λ_T/∏(S∪T) = δ(z), uniquely attained at λ* = μ (proved via (1−1)^{|S|}; verified to 12 digits, z ≤ 19). M is PD (sum-of-squares, Weil-shaped); the optimal quadratic form IS inclusion-exclusion, and the minimum recovers the Mertens product exactly. But it is an upper-bound machine — PD by construction, with no continuation and no zeros; the parity barrier stays intact. So it is the canonical template of an optimized face-quadratic form, not an independent zero-detecting source."
- id: P8
  probe: "In 10d, what exactly was exhibited on concrete elliptic curves over F_5 and F_7, and how does the five-part template map RH onto positivity?"
  answer_prose: "The finite exact explicit formula #E(F_{p^n}) = p^n + 1 − π^n − π̄^n was verified by direct counting. RH = Hasse = discriminant ≤ 0 of the degree form Q(m,n) = pm² + a_p mn + n², PSD *because degree counts* (deg(1±φ) exhibited as point counts). The template: (i) Jacobian torus, (ii) Frobenius operator, (iii) counting-born PSD form, (iv) zeros as eigenvalues, (v) finite exact formula. The ledger: we HAVE counting positivity (Λ ≥ 0), finite PD face forms (10c), and a windowed explicit formula (10a); we MISS the Jacobian-role space (Δ∞ is contractible), a Frobenius-like operator, and the pairing tying zeros to counting positivity — so the missing object is operator-theoretic, not another inequality. The toroidal question is answered: plane for zeta's domain, torus (Jacobian) for the geometric explainer."
- id: P9
  probe: "What is the 'uncertainty wall' quantified in 10e, and why is its verdict 'analytic amplifiers, not independent positivity sources'?"
  answer_prose: "The uncertainty cost curve: w=0.5 → 2.9e6 primes, w=0.25 → 8.2e12 primes (infeasible) — the prime-side detector's fundamental wall. Verified tools: Montgomery–Vaughan mean value (1/2H)∫|P|²/S2 → 1 (0.995 → 1.007) and the large sieve (ratios 0.004, 0.008). Zero-density was audited as the unconditional-izer, with the plug-in point precise and estimates cited. These are analytic amplifiers — they sharpen, not independently source positivity — so the 10d ledger is unchanged."
- id: P10
  probe: "What is the Node 10 program's final standing: which three positivity kinds are verified on the face-sum, what does none of them do, and what is the sharpest open question?"
  answer_prose: "The face-sum carries three verified positivity kinds — primitive counting (Λ ≥ 0), Weil-type windowed, Selberg-type optimized — but none detects zeros independently. The sharpest open question is the Frobenius-like operator (refining D4's): per the 10d ledger, the missing object is operator-theoretic — a Jacobian-role space, a Frobenius-like operator, and the pairing tying zeros to counting positivity."
