probes:
- id: P1
  probe: "How does the D1 simplicial-sieve reframing work — what are faces, what is phi(x,a) in that language, and what is primality?"
  answer_prose: "The sieve IS the simplicial complex Delta_z: finite subsets of primes <= z are faces, which correspond to squarefree products. The counting function phi(x,a) becomes face-sum Mobius inversion over that complex. Primality is redefined relationally: n is prime iff it has no shared-boundary relation with any earlier prime territory; composites are exactly the overlaps. Label: exact theorem; the underlying math is classical inclusion-exclusion, the framing appears new."
- id: P2
  probe: "Why must positive geometry live in the weights rather than in the bare complex itself (D4)?"
  answer_prose: "The bare complex Delta_infinity is the contractible infinite simplex — topologically trivial, so there is nothing geometric for a positive geometry to grab onto. The structure therefore has to live in the face-weights w(S)=(-1)^{|S|+1} log(prod S)/prod S, whose sum over prod S <= X tends to 1 (verified 0.999922 at 5*10^5): PNT reframed as 'the weighted infinite simplex has total weight 1,' with Dirichlet generating function -zeta'/zeta^2. No prior art was found for the 'total weight 1' framing."
- id: P3
  probe: "How does the D6 deformation produce the twin prime constant — what is the mechanism, step by step?"
  answer_prose: "The marking rule is deformed from R_p={0} to R_p={0,-2} for odd p. The survivors of this deformed sieve ARE the twin prime lowers (verified computationally up to 200000: 2160 of them). Face multiplicities become m(S)=prod|R_p|, and the renormalized total weight S(z)=prod (1-|R_p|/p)/(1-1/p)^2 converges to 2C_2=1.32032 (1.3228 at z=100). The derivation is labeled exact, but the twin conjecture itself remains UNPROVEN — the ratio pi_2(x) / (S x/(log x)^2) is 1.6091 at 2*10^5 with slow convergence. The constant is classical; the generative deformation move appears new."
- id: P4
  probe: "Why was 9c closed negative 'by theorem' — what does 'positivity is blind left of Re(s)=1' mean, and what division of labor follows?"
  answer_prose: "Positivity was located in three kinds of objects: primitive objects (9a: -zeta'/zeta = sum Lambda(n) n^{-s} with Lambda >= 0; delta(z) > 0; the 3-4-1 inequality), and the 3-4-1 bridge carrying traffic as nonnegative stratum energies (9b, computationally verified identity). But none of the three is zero-detecting. 9c was closed negative BY THEOREM: positivity cannot see left of Re(s)=1, where the zeros live. The resulting division of labor is: geometry owns positivity, analysis owns analytic continuation. This is why the missing object was identified as operator-theoretic."
- id: P5
  probe: "Why was Li's criterion closed as face-sum-incompatible while Weil's positivity is face-sum-native (D10b)?"
  answer_prose: "The D10 bridge program built the explicit formula in the program's own objects (10a: a prime-side zero detector, computationally verified). Against that grounding, Li's criterion was closed as incompatible with the face-sum formulation, while Weil's positivity was judged native to it — i.e., expressible in the same face-sum language. The verdict of the whole D10 program: the face-sum carries three verified positivity kinds, none of them zero-detecting, so the missing object must be operator-theoretic."
- id: P6
  probe: "What makes CCM (11f) the live operator candidate, why is it fragile, and what does the Lambda = mu * log bridge change?"
  answer_prose: "CCM was independently reimplemented from arXiv:2511.22755 and recovered zeros 1-8 from primes alone (zero 1 exact to float64 at c=13, N=20; at N=120, eps_even=3.48e-59 with separation 8771x, monotone 581->3744->8771). Controls show zeros AND positivity both require exact prime input (A/B/C all negative). It is fragile, not robust: an exact-arithmetic reporter — dropping p=2 or p=3 destroys the result, dropping p=5 survives, small primes dominate. The conceptual bridge is Lambda = mu * log (EXACT): CCM's fuel is one Dirichlet convolution away from face-sum-native mu — the machine is borrowed, the fuel refines to the program's own weights. Open: the full Frobenius-like operator question."
- id: P7
  probe: "Why doesn't the 13d GUE result count as a bridge plank — what is the difference between 'compatible with chaos' and 'hearing the primes'?"
  answer_prose: "Node 13 gives an EXACT identification: Delta_z faces are the fermionic Fock basis with mu=(-1)^F (but independent prior art exists — goldenphysicsproject — so the identification is shared, not unique). The spectral program: H_2 killed by inspection (integrable), H_int negative (Poisson bulk), 13d POSITIVE — pair hopping is GUE-like at all z>=17 and all lambda, strengthened to z=41 (dim 8192, <r>=0.528). But the caveat kills its bridge relevance: shuffled weights are also GUE — this is generic two-body chaos. So the content of 13d is that the arithmetic weights are COMPATIBLE with chaos, a universality result. The bridge-relevant question — an operator that HEARS the primes — was answered negatively by 13e (the operator is deaf to primes)."
- id: P8
  probe: "Why can no ordinary positive geometry carry the face-weights w(S) as stratum residues (14a), and what refined home replaced it?"
  answer_prose: "The obstruction is exact and numerical: |w({2})| = (log 2)/2 approx 0.347, which is not +-1 as an ordinary positive-geometry stratum residue would have to be — so no ORDINARY positive geometry can carry w(S) as residues. The replacements: 14b, the exact identity d/du [prod(1-p^{-u})] at u=1 = sum_S w(S); and 14c, the refined home — equivariant Chern roots -u log p, with face-weights as differentiated residues and Figueiredo's deformations as the mechanism. This closes the D4<->D6 loop."
- id: P9
  probe: "Why did Weyl's law kill the multi-torus attempts L1-L3 (Node 12), and what form survives?"
  answer_prose: "Node 12's multi-torus program tried Laplacian constructions L1-L3, but Weyl's law killed them — the eigenvalue asymptotics did not match what a zeta-zero model requires. The Heisenberg nilmanifold probe was also negative on three panels (65,401 eigenvalues). What survives is Deninger's foliated 3D dynamical system — labeled conjectural, formulated but not simulated. Node 12 is CLOSED with that as the only surviving form."
- id: P10
  probe: "Why does the novelty-boundary table distinguish 'appears new (framing / move / statement)' from 'shared' prior art, and what standing rule governs public novelty claims?"
  answer_prose: "The table separates the packaging from the content: the simplicial-sieve framing appears new (framing) but the math is classical; PNT as 'weighted simplex, total weight 1' appears new (statement); the deformation-to-2C_2 move appears new (move) but the constant is classical; the Fock-over-primes identification is SHARED because independent prior art exists, while the Fock spectral program (13d/13e) appears new; the CCM work is an independent verification of published work; Lambda=mu*log is an exact classical identity whose use as a bridge dictionary is ours. The standing rule: no public novelty claim without re-search — the planned paper is an expository/synthesis vehicle, not a breakthrough claim."
