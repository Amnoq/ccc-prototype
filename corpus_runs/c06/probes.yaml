probes:
- id: P1
  probe: "Why is the function-field explicit formula finite and exact, and how does this contrast with the number-field explicit formula from 10a?"
  answer_prose: "On the function-field side the prime side is a finite point count: #E(F_5)=6, #E(F_25)=36, #E(F_125)=126, each exactly p^n+1-pi^n-pibar^n (|pi|=sqrt(5) verified to 6 digits), and likewise #E(F_7)=12, #E(F_49)=48 exact, with zeta numerator roots |t|=1/sqrt(p). The number-field explicit formula is infinite and needs windowing (Pareto frontier n ~ e^{7.4/w}); the function-field formula needs no window at all."
- id: P2
  probe: "How does RH emerge as a discriminant condition from a counting-born PSD form, and what is the positivity source?"
  answer_prose: "With Frobenius eigenvalues pi, pibar = (a_p +/- sqrt(a_p^2-4p))/2, the degree form Q(m,n) = deg(m*phi+n) = p m^2 + a_p m n + n^2 is PSD because degree counts kernel points (deg >= 0). PSD is equivalent to the discriminant condition a_p^2-4p <= 0, i.e. |a_p| <= 2 sqrt(p), i.e. |pi|=sqrt(p) — that is Hasse = RH. The positivity source is counting itself, the same kind as Lambda >= 0 (D7/D9); deg(1-phi) = #E(F_p) = 6, 12 and deg(1+phi) = #twist(F_p) = 6, 4 were counted directly."
- id: P3
  probe: "What is the five-part template anatomy of an independent Weil-positivity source, and what does the ledger say is missing on the number-field/face-complex side?"
  answer_prose: "The anatomy: (i) a geometric space with a torus — the Jacobian J(C); (ii) a correspondence/operator — Frobenius, with eigenvalues pi_i; (iii) a counting-born PSD form — deg >= 0, yielding a discriminant condition; (iv) zeros as eigenvalues, RH as the discriminant inequality; (v) a finite exact explicit formula with no truncation. The ledger HAVE: counting positivity (Lambda >= 0), finite PD quadratic forms on faces (10c), an explicit formula (10a — infinite, windowed). MISSING: a space playing the Jacobian's role (Delta_infty is contractible per D4, so the object must live in weights/operators, not the bare space); a Frobenius-like operator with the zeros as eigenvalues; an intersection pairing tying zeros to the counting positivity."
- id: P4
  probe: "How does the template answer the toroidal question, and why does it reframe the hunt as operator-theoretic?"
  answer_prose: "The torus in the RH story is the Jacobian: plane for zeta's domain, torus for the geometric explainer. Since Delta_infty is contractible, the missing object cannot live in the bare space — it must live in weights/operators. Hence the gap is operator-theoretic, not another positivity inequality: the missing object is a 'Frobenius for Delta.' 10a-10c assembled positivity inputs (Weil-type smoothed, Selberg-type optimized, primitive counting); 10d shows what would have to use them — a space plus operator plus counting-PSD form with zeros as eigenvalues."
- id: P5
  probe: "Why is cleanly isolating single zeros on the prime-side detector fundamentally infeasible, and how does this sharpen the contrast with 10d?"
  answer_prose: "The uncertainty envelope says window width w needs prime data n = e^{7.433/w}: w=2 -> 41 primes, w=1 -> 1.7e3, w=0.5 -> 2.9e6, w=0.25 -> 8.2e12, w=0.1 -> 1.9e32. At T0=100 the mean zero spacing is 2.27, so w=0.25 (0.11 spacings, clean single-zero isolation) demands 8e12 primes — infeasible. This is the fundamental wall of the prime-side detector, and the sharp contrast with 10d: the function-field finite exact formula needs no window at all."
- id: P6
  probe: "Why are the 10e tools (mean value, large sieve, zero-density) classified as analytic amplifiers rather than independent positivity sources, and what do they change in the 10d ledger?"
  answer_prose: "The mean value (ratio converging to 1: 0.9948, 0.9789, 0.9596, 1.0073 across H=200..20000) converts pointwise window counts into L^2 bounds, and the large sieve (ratios 0.0041, 0.0080, holding with headroom) gives mean-square control — they strengthen what the bridge says but add no new positivity. The zero-density audit notes the detector bound N_+([T0-w,T0+w]) <= e^{1/2} W(h) used RH to read windows as critical-line counts; unconditionally, off-line zeros pollute windows, and zero-density estimates bound the strayers — the tool that would make the program unconditional. Nothing changes in the 10d ledger."
- id: P7
  probe: "Why can no ordinary positive geometry carry the face-weights w(S), what exactly is incompatible versus compatible, and what does this explain?"
  answer_prose: "Ordinary positive geometries (AHBL sense: canonical form with logarithmic poles, residues +-1 on boundary strata, +-1 at 0-dimensional strata) cannot carry w(S) = (-1)^{|S|+1} log(prod S)/(prod S) because residues of logarithmic forms are quantized: a 0-dimensional stratum residue is +-1 or 0, but |w({2})| = (log 2)/2 = 0.3466, which is not in {0,1}. The signs (-1)^{|S|+1} are compatible with residue alternation; the magnitudes log(prod S)/(prod S) are impossible. This explains D4's 'no positive region found' as a theorem rather than a mere observation — the literal question has a negative answer. The named loophole is weighted positive geometries, which allow general residues."
- id: P8
  probe: "State the Node 14 identity and explain why it matters computationally."
  answer_prose: "For F_z(u) = prod_{p<=z}(1 - p^{-u}), d/du F_z(u) at u=1 equals sum_{S subset P_z} w(S) equals delta(z) * sum_{p<=z} (log p)/(p-1), where delta(z) = prod_{p<=z}(1-1/p). Proof 1 expands F_z into the subset sum and differentiates termwise; Proof 2 uses F_z'/F_z = sum_p (p^{-u} log p)/(1-p^{-u}), giving F_z'(1) = delta(z) sum_p (log p)/(p-1). It matters computationally because the identity computes the 2^{pi(z)} subset sum in O(pi(z)) operations — verified numerically to 10 digits at z=2..29. Asymptotically W(z) -> e^{-gamma} = 0.56146 (Mertens), distinct from D4's sum_{prod S <= X} w(S) -> 1 because the regularization differs: all subsets of P_z here versus product-bounded there."
- id: P9
  probe: "What does 'differentiated residues' mean in the K-theoretic home, and how does it make the combinatorics computed rather than inserted?"
  answer_prose: "In H^*_{S^1}(pt; R) = R[u], take E_z = (+)L_p over p<=z with equivariant Chern roots -u*log p (real coefficients legitimate). Then ch(lambda_{-1}(E_z)) = prod_p (1 - e^{-u log p}) = prod_p (1 - p^{-u}) = F_z(u), the equivariant K-theoretic Euler class. The face-weights are F_z'(1): the u-derivative at u=1 of that Euler class — hence 'differentiated residues.' Only the primes are input (as Chern roots); the subset combinatorics, the signs, and the log magnitudes are all computed from the derivative, never inserted."
- id: P10
  probe: "How does the stringy deformation of the simplex produce the face-weights as generalized residues, and where does the arithmetic end up living?"
  answer_prose: "The positive region is the simplex Delta^{m-1} (m = pi(z)), the face complex's geometric home, with its ordinary canonical form Omega (residues +-1). The stringy deformation I(u) = int_{Delta} (prod_p x_p^{-u log p}) Omega is a Dirichlet integral whose exponents are the prime logs; differentiating at u=1 produces exactly sum_S w(S) as generalized residues. This is Figueiredo's deformations move (D6) as the mechanism: her deformations are what produce non-+-1 generalized residues; here the deformation parameter is u and the exponents are the prime logs. The bare simplex is contractible (D4), so the arithmetic lives in the deformation — i.e., in the weights — which is D4's conclusion, now with the obstruction explained and the refined object named."
