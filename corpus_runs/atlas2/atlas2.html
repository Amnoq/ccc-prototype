 "claim", "genre": "original", "note": "Dynamical analogue (9): 1 − Σ_ρ e^{tρ} + e^{αt} = Σ_γ l(γ) Σ_{k≥1} ±δ_{kl(γ)} in D'(R^{>0}), with Re ρ = α/2; a transversal index theorem for the R-action; the left side is the Euler characteristic Σ_i (−1)^i Tr(φ*|ker Δ^i_{F,(2)}); ker Δ^i_{F,(2)} is the maximal Hausdorff quotient of leafwise L²-cohomology."}, {"id": "fixed-points-and-the-extended-transverse-index-t", "display": "fixed points and the extended transverse index theory", "status": "exact", "cluster": "deninger", "chunk": "deninger_s36", "kind": "claim", "genre": "original", "note": "(9) has no term corresponding to (1−e^{−2t})^{−1} because no fixed points were assumed; with fixed points the distributional trace may not exist; the extension by Álvarez-Lopez, Leichtnam, Kordyukov [ALKL23], [ALKL21] gives formulas similar to the explicit formulas even as distributions on all of R."}, {"id": "0-is-forced-the-riemann-hypothesis-would-need-1", "display": "α = 0 is forced; the Riemann hypothesis would need α = 1", "status": "exact", "cluster": "deninger", "chunk": "deninger_s36", "kind": "claim", "genre": "original", "note": "The conformal factor e^{αt} must have α = 0 (so Re ρ = 0), whereas the Riemann hypothesis would want α = 1; smooth compact manifolds are too restrictive; α = 1 is achievable with local structure (totally disconnected) × (3-ball) [Lei07]."}, {"id": "no-functorial-real-structure-for-a-weil-type-coh", "display": "no functorial real structure for a Weil-type cohomology", "status": "exact", "cluster": "deninger", "chunk": "deninger_s36", "kind": "claim", "genre": "original", "note": "By [Den22b], a complex-valued Weil-type cohomology for arithmetic curves spec̄ o_K cannot have a functorial real structure; leafwise cohomology always has natural real structures; a fundamental 'twist' excluding real structures on cohomology is missing."}, {"id": "foliated-analogues-of-arakelov-theory", "display": "foliated analogues of Arakelov theory", "status": "exact", "cluster": "deninger", "chunk": "deninger_s36", "kind": "claim", "genre": "original", "note": "Analogies of Arakelov theory with foliated dynamical systems were obtained in [Kop11]."}, {"id": "rational-witt-vectors-w-rat-r", "display": "rational Witt vectors W_rat(R)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s37", "kind": "definition", "genre": "original", "note": "§4: W_rat(R) consists of rational functions f ∈ R[[t]] with f(0) = 1, f = P/Q; addition is multiplication of rational functions; Almkvist's K-theoretic description [Alm74] via det(1−tφ|V)/det(1−tψ|W); the product coincides with the big Witt ring W(R)."}, {"id": "rational-witt-spaces-w-rat-x", "display": "rational Witt spaces W_rat(X)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s37", "kind": "definition", "genre": "original", "note": "W_rat(X) = (X_top, W_rat(O_X)) with W_rat(O_X) the sheafification of U ↦ W_rat(O_X(U)); morphisms defined via condition (10); not locally ringed in general; X(S) ↪ W_rat(X)(S); faithful but not fully faithful functor from schemes; commuting Frobenius endomorphisms F_ν; the monoid N acts."}, {"id": "global-sections-as-c-valued-functions-on-w-rat-x", "display": "global sections as C-valued functions on W_rat(X)(C)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s37", "kind": "claim", "genre": "original", "note": "The multiplicative Teichmüller map [·]: R → W_rat(R), [r] = 1 − rt; evaluating [f] at P ∈ W_rat(X)(C) gives a multiplicative map Γ(X,O_X) → C-valued functions; for normal X with countable function field this gives [·]: Γ(X,O) → C^0(W_rat(X)(C),C) in (11) ([Den22a, section 7])."}, {"id": "theorem-4-1-w-rat-x-0-c-x-0-c", "display": "Theorem 4.1: W_rat(X_0)(C) ≅ X̲_0(C)", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s37", "kind": "result", "genre": "original", "note": "Theorem 4.1: for X_0 normal with function field K_0 and X its normalization in an algebraic closure K, there is a natural N-equivariant bijection W_rat(X_0)(C) ≅ X̲_0(C) := X̲(C)/G, where X̲(C) = {(x, P̄^×)}; proved in [Den22a], following [KS18, Lemma 4.9]; the extrinsic definition of the typical leaf became this theorem."}, {"id": "the-colimit-construction-and-the-dynamical-syste", "display": "the colimit construction and the dynamical system X_0", "status": "exact", "cluster": "deninger", "chunk": "deninger_s37", "kind": "method", "genre": "original", "note": "X̌_0(C) = colim_N X̲_0(C) inverts the injective F_ν to a Q^{>0}-action; X_0 = (X̌_0(C) × R^{>0})/Q^{>0} with diagonal action; φ^t[P,u] = [P,e^t u]; the 1-codimensional 'foliation' F has leaves the images of X̌_0(C) × {u}, everywhere transversal to the flow; the limit over Frobenii reminds of tilting."}, {"id": "admissible-conditions-e-to-control-periodic-orbi", "display": "admissible conditions E to control periodic orbits", "status": "exact", "cluster": "deninger", "chunk": "deninger_s37", "kind": "claim", "genre": "original", "note": "(X_0,φ^t) has too many periodic orbits since W_rat(X_0)(C) does not know enough about addition in O_{X_0}; an admissible condition E is imposed on the characters P̄^× (E_tors: finite kernels on μ(κ(x)); for char κ(x) > 0 the image must not be torsion unless κ(x)^× is); this gives (X_{0E},F,φ^t); see [Den22a, section 4]."}, {"id": "theorem-4-2-closed-points-correspond-to-packets-", "display": "Theorem 4.2: closed points correspond to packets of periodic orbits", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s38", "kind": "result", "genre": "original", "note": "Theorem 4.2: for X_0 normal of finite type over spec Z, the periodic points of X_{0E} are ∐_{x_0} Γ_{x_0} over the closed points x_0, compact packets of periodic orbits of length log N x_0 (log p for spec Z); Γ_{x_0} is a fibre space over Aut(F̄_p^×)/Aut(F̄_p); Frobenius elements in G give the orbits; the hard part (every periodic orbit comes from a closed point) is [Den22a, Theorems 5.2 and 6.1]."}, {"id": "theorem-4-3-x-0-and-x-0e-are-almost-pathwise-con", "display": "Theorem 4.3: X_0 and X_{0E} are (almost pathwise) connected", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s38", "kind": "result", "genre": "original", "note": "Theorem 4.3: for X_0 integral normal flat of finite type over spec Z, X_0 and X_{0E} are connected, in fact almost pathwise connected; the proof uses de Jong's alterations for dim X_0 ≥ 2 and approximation theorems from number theory ([Den22a])."}, {"id": "h-0-f-is-one-dimensional-the-closure-of-the-comp", "display": "H^0_F is one-dimensional; the closure of the compact orbits", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s38", "kind": "claim", "genre": "original", "note": "Stronger than connectedness: H^0_F(X_{0E}) is one-dimensional; the closure of the union of compact orbits is the subsystem with unitary characters P̄^×: κ(x)^× → S¹ ([Den22a, Theorem 8.2]); for dim X_0 ≥ 2 this is conditional on a Diophantine approximation result, known for dim 1 and X_0 flat over spec Z."}, {"id": "theorem-4-4-the-continuous-bijection-describing-", "display": "Theorem 4.4: the continuous bijection describing X_0", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s38", "kind": "result", "genre": "original", "note": "Theorem 4.4: the canonical φ^t-equivariant map X̲_0(C)_{Q,in} × R^{>0} ∐ ∐_p X̲_0(C)_{p,in} ×_{p^Z} R^{>0} → X_0 = X̌_0(C)_{E_tors} ×_{Q^{>0}} R^{>0} is a continuous bijection; by Theorem 4.3 it is not a homeomorphism since X_0 is connected but the left side is disconnected."}, {"id": "kucharczyk-scholze-galois-groups-as-fundamental-", "display": "Kucharczyk–Scholze: Galois groups as fundamental groups", "status": "exact", "cluster": "deninger", "chunk": "deninger_s38", "kind": "claim", "genre": "original", "note": "Kucharczyk–Scholze [KS18]: the connected components of W_rat(spec F)(C) are parametrized by embeddings μ(F) ↪ C^×; π^ét_1(X_F(C),x) ≅ the absolute Galois group of F; sheaf cohomology with Z/n is Galois cohomology (Rost–Voevodsky); with Q it is the Galois-fixed part of Λ^•(F̄^×⊗Q); the missing Steinberg relations show W_rat does not encode enough additive information."}, {"id": "pro-algebraic-fundamental-groups-and-motives-den", "display": "pro-algebraic fundamental groups and motives (Deninger–Wibmer)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s38", "kind": "claim", "genre": "original", "note": "[DW23]: a pro-algebraic fundamental group π_E(Z,z) for pointed connected topological spaces; for algebraically closed E of char 0, π_E(X_F(C),x) has commutative connected component, unipotent part related to extensions of Tate motives, no relation of the reductive part with the Serre group; the spaces are only first steps in the right direction."}, {"id": "the-p-adic-version-and-the-fargues-fontaine-curv", "display": "the p-adic version and the Fargues–Fontaine curve", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s38", "kind": "claim", "genre": "original", "note": "p-adic version: for X_0 normal of finite type over spec Z_p, W_rat(X_0)(o) = W_rat(X)(o)/G with o the valuation ring of C_p; the right modification requires the mod p reduction (12) of P_y to be additive; then Fontaine's A_inf-rings become ordinary o-valued functions (Judith Lutz proved faithfulness); for X_0 = spec Z_p a natural bijection with the points of the Fargues–Fontaine curve; the global analogue over Z is still unclear."}, {"id": "fatou-scheme-stalks-of-the-sheaf-w-rat-o-x", "display": "Fatou scheme; stalks of the sheaf W_rat(O_X)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s4", "kind": "definition", "genre": "original", "note": "Fatou scheme: every O_X(U) Fatou; integral locally Noetherian schemes are Fatou; stalk identity W_rat(O_X)_x = W_rat(O_X,x) since W_rat commutes with filtered colimits."}, {"id": "proposition-2-1-separatedness-and-the-fatou-desc", "display": "Proposition 2.1: separatedness and the Fatou description of sections", "status": "exact", "cluster": "deninger", "chunk": "deninger_s4", "kind": "result", "genre": "original", "note": "Prop 2.1: presheaf U↦W_rat(O_X(U)) is separated (sub-presheaf of W(O_X)); equality with sheaf for Fatou domains; for Fatou X, sections are W_rat(K)∩W(O_X(U))."}, {"id": "definition-2-2-the-rational-witt-space-w-rat-x", "display": "Definition 2.2: the rational Witt space W_rat(X)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s4", "kind": "definition", "genre": "original", "note": "Def 2.2: W_rat(X) := (X_top, W_rat(O_X)); not a locally ringed space; carries Frobenius/Verschiebung morphisms F_ν, V_ν and a Teichmüller map of sheaves."}, {"id": "definition-2-3-morphisms-of-rational-witt-spaces", "display": "Definition 2.3: morphisms of rational Witt spaces via locality", "status": "exact", "cluster": "deninger", "chunk": "deninger_s4", "kind": "definition", "genre": "original", "note": "Def 2.3: morphisms W_rat(Y)→W_rat(X) are ringed-space morphisms with a locality diagram (maps f̃^♯_y uniquely determined); F_ν are the identity on X_top."}, {"id": "proposition-2-4-faithfulness-of-the-functor-w-ra", "display": "Proposition 2.4: faithfulness of the functor W_rat", "status": "exact", "cluster": "deninger", "chunk": "deninger_s4", "kind": "result", "genre": "original", "note": "Prop 2.4: W_rat: Mor(Y,X)→Mor(W_rat(Y),W_rat(X)) is injective; proof via stalks, diagram (9), and injectivity of Teichmüller maps."}, {"id": "the-ind-space-w-rat-x-colim-n-w-rat-x", "display": "the ind-space W̌_rat(X) = colim_N W_rat(X)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s4", "kind": "definition", "genre": "original", "note": "Ind-space W̌_rat(X) := colim_N W_rat(X) over divisibility poset inverts the Frobenius endomorphisms (also for submonoids N_0)."}, {"id": "hoped-full-faithfulness-of-w-rat-on-anabelian-sc", "display": "hoped full faithfulness of W_rat on anabelian schemes", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s4", "kind": "conjecture", "genre": "original", "note": "Paper states the hope that W_rat is fully faithful on a suitable category of anabelian schemes — an expectation, not a result."}, {"id": "definition-2-5-s-valued-points-w-rat-x-s", "display": "Definition 2.5: S-valued points W_rat(X)(S)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s5", "kind": "definition", "genre": "original", "note": "Def 2.5: S-valued points as local ringed-space morphisms; composition maps; N-action by composition; colimit W̌_rat(X)(S) in sets."}, {"id": "example-2-6-the-canonical-morphism-x-w-rat-x", "display": "Example 2.6: the canonical morphism X → W_rat(X)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s5", "kind": "result", "genre": "original", "note": "Example 2.6: canonical surjections W_rat(O_X(U))→O_X(U) give X→W_rat(X) and inclusions X(S)↪W_rat(X)(S); for spec Z the left side is a point, the right side huge."}, {"id": "the-multiplicative-teichmuller-function-x-o-x-ma", "display": "the multiplicative Teichmüller function [ ]: Γ(X,O_X) → Map(W_rat(X)(R),R)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s5", "kind": "method", "genre": "original", "note": "Pairing (11) induces (12)–(17); Teichmüller gives multiplicative non-additive [ ]: Γ(X,O_X)→Map(W_rat(X)(R),R); for R=C a point is (x, f̃^♯_(0)) with f̃^♯_(0): W_rat(κ(x))→C."}, {"id": "div-1-div-zeroes-of-over-prime-divisors", "display": "div[α] = π^{−1}(div α); zeroes of [ν] over prime divisors", "status": "exact", "cluster": "deninger", "chunk": "deninger_s5", "kind": "result", "genre": "original", "note": "Proved: [α]=0 iff α(x)=0, hence div[α]=π^{−1}(div α); for spec Z, zero set of [ν] is the union of π^{−1}((p)) over p|ν."}, {"id": "fibres-over-closed-points-have-non-trivial-n-sta", "display": "fibres over closed points have non-trivial N-stabilizers, giving periodic orbits", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s5", "kind": "claim", "genre" isplay": "Lemma 4.6: N-th roots of multiplicative maps", "status": "exact", "cluster": "deninger", "chunk": "deninger_s7", "kind": "result", "genre": "original", "note": "Lemma 4.6: P=Q^N with Q unique iff P|_{μ_N(R)}=1 (N-th powers exist in R); for alg. closed K and finite P^{−1}(1), iff N′||P^{−1}(1)|."}, {"id": "the-q-0-0-sets-c-x-0-over-finite-residue-field-p", "display": "the Q^{>0}_0-sets C_{x_0} over finite-residue-field points", "status": "exact", "cluster": "deninger", "chunk": "deninger_s8", "kind": "definition", "genre": "original", "note": "C_{x_0}=pr^{−1}_0(x_0)Q^{>0}_0=∪_νF^{−1}_νpr^{−1}_0(x_0) for x_0 with finite residue field; fibres of pr_{X_0} are Q^{>0}_0-invariant."}, {"id": "the-explicit-orbit-description-35-39-isotropy-nx", "display": "the explicit orbit description (35)–(39); isotropy Nx_0^Z", "status": "exact", "cluster": "deninger", "chunk": "deninger_s8", "kind": "result", "genre": "original", "note": "Via fixed x over x_0 and ι: μ(K)↪μ(C): S/Nx_0^{Ẑ_0}≅pr^{−1}_0(x_0) (36); colimit gives (Ẑ^×_{(p)}/Nx_0^{Ẑ_0})×_{p^Z}Q^{>0}_0≅C_{x_0} (38); every point has isotropy Nx_0^Z."}, {"id": "fibration-of-c-x-0-over-aut-f-p-aut-f-p", "display": "fibration of C_{x_0} over Aut(F̅_p^×)/Aut(F̅_p)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s8", "kind": "result", "genre": "original", "note": "C_{x_0} fibres over the compact group Ẑ^×_{(p)}/p^{Ẑ}=Aut(F̅_p^×)/Aut(F̅_p) with fibres the Q^{>0}_0-orbits; projection (40) is canonical (kernel-size mod p^Z)."}, {"id": "the-canonical-map-from-torsion-kernel-size", "display": "the canonical map ρ from torsion kernel size", "status": "exact", "cluster": "deninger", "chunk": "deninger_s8", "kind": "definition", "genre": "original", "note": "ρ(x,P̄^×)=|(ker P̄^×)_tors| satisfies ρ(F_νP)=ν_xρ(P) (43); induces Q^{>0}_0-equivariant ρ on the char-p and char-0 parts (44)–(46)."}, {"id": "proposition-5-1-1-characterizes-injectivity-on-r", "display": "Proposition 5.1: ρ = 1 characterizes injectivity on roots of unity", "status": "exact", "cluster": "deninger", "chunk": "deninger_s8", "kind": "result", "genre": "original", "note": "Prop 5.1: ρ=1 iff the point lies in •X(C)_{E_tors} with P̄^× injective on μ(κ(x)); proved via Lemma 4.6 extracting ν_x-th roots."}, {"id": "theorem-5-2-decomposition-of-the-non-trivial-iso", "display": "Theorem 5.2: decomposition of the non-trivial isotropy locus", "status": "exact", "cluster": "deninger", "chunk": "deninger_s9", "kind": "result", "genre": "original", "note": "Thm 5.2: for E⊂E_max, points with non-trivial Q^{>0}_0-isotropy decompose as ⊔C^E_{x_0} over finite-residue-field points, isotropy Nx_0^Z; without finite residue fields all isotropy is trivial."}, {"id": "lemma-5-3-roots-of-unity-surjectivity-onto-x-h", "display": "Lemma 5.3: roots-of-unity surjectivity onto κ(x)^×/H", "status": "exact", "cluster": "deninger", "chunk": "deninger_s9", "kind": "result", "genre": "original", "note": "Lemma 5.3: for coprime ν≠ν′, μ_{(νν′)}(K)=∪_iμ_{ν^i−ν′^i}(K) surjects onto κ(x)^×/H; hence κ(x)^×/H is prime-to-νν′ torsion (used to force char p>0 and κ(x)=F̅_p)."}, {"id": "remark-5-4-tors-is-fundamental-but-insufficient-", "display": "Remark 5.4: (Tors) is fundamental but insufficient alone", "status": "exact", "cluster": "deninger", "chunk": "deninger_s9", "kind": "claim", "genre": "original", "note": "Remark 5.4: with E⊂E_fd0 the proof avoids Lemma 5.3; (Tors) is called fundamental for connectedness but alone lets stabilizers occur over all positive-char points — stronger than wanted."}, {"id": "theorem-5-5-sharpness-e-tors-allows-stabilizers-", "display": "Theorem 5.5: sharpness — E_tors allows stabilizers over all positive-characteristic points", "status": "exact", "cluster": "deninger", "chunk": "deninger_s9", "kind": "result", "genre": "original", "note": "Thm 5.5: under E_tors, non-trivial stabilizer forces char κ(x_0)>0 with stabilizer in N_{x_0}^Z; conversely every positive-char point carries points with non-trivial stabilizer (constructed via Frobenius lift σ and Lemma 5.3)."}, {"id": "the-zero-counting-functions-n-t-n-0-t-n-0-s-t-n-", "display": "the zero-counting functions N(T), N_0(T), N_0^s(T), N_s(T), N_d(T), N_{s∪0}(T)", "status": "exact", "cluster": "lamzouri", "chunk": "lamzouri_s1", "kind": "definition", "genre": "original", "note": "Sets the counting conventions of §1: multiplicity vs distinct elements, real vs simple zeros; all four Theorem 1.1 statements use them."}, {"id": "the-montgomery-taylor-constant-c-0-3-2-1-2-cot-1", "display": "the Montgomery–Taylor constant C_0 := 3/2 − (1/√2)cot(1/√2) = 0.6725007…", "status": "exact", "cluster": "lamzouri", "chunk": "lamzouri_s1", "kind": "definition", "genre": "original", "note": "Defined in (1.1) as the Montgomery–Taylor value 0.6725007…; it anchors the constants C_0, C_1 and C_2 in Theorem 1.1."}, {"id": "the-classical-lineage-of-proportion-results-hard", "display": "the classical lineage of proportion results: Hardy, Hardy–Littlewood, Selberg mollification, Levinson 1/3, Conrey 2/5, PRZZ 0.417293 and 0.407511", "status": "conjectural", "cluster": "lamzouri", "chunk": "lamzouri_s1", "kind": "claim", "genre": "original", "note": "Survey cited without proof: Hardy [15], Hardy–Littlewood [16], Selberg mollification [22], Levinson 1/3 [18], Conrey 2/5 [8], PRZZ 0.417293 and 0.407511 [21]; background lineage only."}, {"id": "montgomery-s-pair-correlation-theorem-giving-at-", "display": "Montgomery's pair correlation theorem giving at least 2/3 simple zeros under RH, extended by Montgomery–Taylor to C_0 and by Chirre–Gonçalves–de Laat to 0.6792", "status": "conjectural", "cluster": "lamzouri", "chunk": "lamzouri_s1", "kind": "claim", "genre": "original", "note": "Cited from Montgomery [19], Montgomery–Taylor [20] and Chirre–Gonçalves–de Laat [7]; the RH-conditional ≥2/3 simple-zeros bound and its improvements are stated as context."}, {"id": "theorem-1-1-the-four-unconditional-bounds-with-c", "display": "Theorem 1.1: the four unconditional bounds with C_0 = 0.67250…, C_1 = (C_0+1)/2 = 0.83625…, C_2 = (1+2√2+2C_0)/(3+2√2) = 0.88762…", "status": "exact", "cluster": "lamzouri", "chunk": "lamzouri_s1", "kind": "result", "genre": "original", "note": "Theorem 1.1: four unconditional liminf bounds — >67.25% simple on the line, ≥83.62% distinct, ≥88.76% simple or on the line, average ≥83.62%; proved in §3 from Proposition 2.1 plus Lemma 3.2."}, {"id": "the-remark-1-2-rigidity-reading-at-most-1-c-2-0-", "display": "the Remark 1.2 rigidity reading: at most 1−C_2 < 0.1124 of zeros are simultaneously off the critical line and non-simple; the C_0 lower bound forces the other proportion to 1", "status": "exact", "cluster": "lamzouri", "chunk": "lamzouri_s1", "kind": "claim", "genre": "original", "note": "Remark 1.2: at most 1−C_2 < 0.1124 of zeros can be simultaneously off-line and non-simple; if one of N_s/N or N_0/N tends to C_0 the other tends to 1; max(N_0,N_s) ≥ (C_1+o(1))N."}, {"id": "comparison-with-baluyot-goldston-suriajaya-turna", "display": "comparison with Baluyot–Goldston–Suriajaya–Turnage-Butterbaugh Theorem 3(ii)(iii): same C_1 average bound under b→0, but their simple-or-critical bound (2+C_0)/3 = 0.89083… exceeds the unconditional 0.88762…", "status": "conjectural", "cluster": "lamzouri", "chunk": "lamzouri_s1", "kind": "claim", "genre": "original", "note": "Compares with [4] Theorem 3 under a narrow-box hypothesis b/log T: same C_1 average bound as b→0, while their conditional simple-or-critical bound (2+C_0)/3 = 0.89083… slightly exceeds the unconditional 0.88762…; the cited results are not proved here."}, {"id": "the-claude-alpoge-furman-proof-1-finite-dimensio", "display": "the Claude/Alpöge–Furman proof [1]: finite-dimensional matrix form of Weil's Hermitian form with a rank–trace inequality and a second-moment calculation; same two main bounds, technically intricate", "status": "conjectural", "cluster": "lamzouri", "chunk": "lamzouri_s1", "kind": "claim", "genre": "original", "note": "Desc n (|x|,|p|<=Lambda) gives continuum with smooth zeros as missing spectral lines, cited [8]; paper's own reframing: Riemann's formula is a finite-size correction to the levels. Derived from Landau model in [9]."}, {"id": "classical-hamiltonian-h-cl-x-p-l-p-2-p-on-the-ha", "display": "classical Hamiltonian H_cl = x(p + l_p^2/p) on the half line x >= l_x", "status": "exact", "cluster": "sierra", "chunk": "sierra_s2", "kind": "definition", "genre": "original", "note": "Introduced as the paper's classical Hamiltonian (3), defined on half-line x>=l_x with arbitrary real p; extra term negligible for |p|>>l_p, forbidding escape at |p|<<l_p."}, {"id": "closed-periodic-orbits-with-turning-point-b-x-m-", "display": "closed periodic orbits with turning point B=(x_m(E), l_p) and energy-preserving momentum bounce at C", "status": "exact", "cluster": "sierra", "chunk": "sierra_s2", "kind": "result", "genre": "original", "note": "Derived from Hamilton equations (4), explicit solution (5); trajectory A->B->C closes via momentum bounce l_p^2/p_0 -> p_0 at C, preserving energy; period T_E=cosh^-1(E/2h)."}, {"id": "classical-energies-bounded-below-by-e-e-0-cl-2h", "display": "classical energies bounded below by |E| >= E_0^cl = 2h", "status": "exact", "cluster": "sierra", "chunk": "sierra_s2", "kind": "result", "genre": "original", "note": "Follows from the solution (5); minimum energy attained at static solutions x=l_x, p=+-l_p."}, {"id": "complex-periodic-orbits-instantons-with-period-p", "display": "complex periodic orbits (instantons) with period pi i", "status": "exact", "cluster": "sierra", "chunk": "sierra_s2", "kind": "result", "genre": "original", "note": "Read off eq. (5): after complex time Delta t = i pi, sign changes close the orbit, unlike Berry-Keating orbits which have wrong period 2 pi i."}, {"id": "semiclassical-number-of-states-n-e-e-2pi-hbar-co", "display": "semiclassical number of states N(E)=E/(2pi hbar)(cosh^-1(E/2h) - sqrt(1-(2h/E)^2))", "status": "exact", "clust  "mty2022_s9", "label": "improving Theorem 1.1's constant to 52.74 via 355 regions with no zeros in the gaps (10.1), at heights from t≈exp(40000) to t≈exp(5·10^7); raw computation and zero-density estimates are currently insufficient to exclude zeros there", "node": "improving-theorem-1-1-s-constant-to-52-74-via-35"}, {"chunk": "sierra_s5", "label": "quantum origin of the fluctuations of the Riemann zeros (Arnold's cat map discretization vs non-trivial Hamiltonian modification)", "node": "quantum-origin-of-the-fluctuations-of-the-rieman"}], "stats": {"subjects": 1, "cross_edges": 383, "concepts": 522}};
const COLORS = { exact:'#3fb950', computationally_verified:'#58a6ff',
  conjectural:'#d29922', heuristic:'#8b949e', killed:'#f85149', open:'#e6edf3' };
const NAMES = { exact:'exact', computationally_verified:'computationally verified',
  conjectural:'conjectural', heuristic:'heuristic', killed:'killed', open:'open (unanchored)' };

let nodes = [], nodeById = {};
for (const [sid, s] of Object.entries(GRAPH.subjects)) {
  const st = s.status || 'open';
  nodes.push({ id:sid, label:s.display, status:st, facets:s.facets,
    note:s.status_note, chunks:s.chunks, killedFacets:s.killed_facets,
    r: 7 + Math.min(13, Math.sqrt(s.facets.length) * 4), subject:true, cluster:s.cluster||'misc' });
}
for (const s of GRAPH.standalone) {
  const st = s.status || 'open';
  nodes.push({ id:s.id, label:s.display, status:st,
    facets:[{chunk:s.chunk, cid:'', label:s.display, kind:s.kind,
              status:s.status, genre:s.genre, note:s.note, subjects:[]}],
    note:null, chunks:[s.chunk], killedFacets:0, r:4.5, subject:false, cluster:s.cluster||'misc' });
}
nodes.forEach(n => nodeById[n.id] = n);
let edges = GRAPH.edges.map(e => ({ a:e.a, b:e.b, rel:e.rel, w:e.count }))
  .filter(e => nodeById[e.a] && nodeById[e.b]);

const stage = document.getElementById('stage');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W=0, H=0;
function resize(){
  const r = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
// deterministic circle init once we know the size
let inited = false;
const clusterC = {};
function maybeInit(){
  if (inited || W < 50 || H < 50) return;
  inited = true;
  const clusters = [...new Set(nodes.map(n => n.cluster||'misc'))].sort();
  const R = Math.min(W,H) * 0.30;
  clusters.forEach((c, ci) => {
    const a = (ci / clusters.length) * Math.PI * 2 - Math.PI/2;
    clusterC[c] = { x: Math.cos(a)*R, y: Math.sin(a)*R };
  });
  const per = {};
  nodes.forEach((n) => {
    const c = n.cluster || 'misc';
    const cc = clusterC[c];
    const k = (per[c] = (per[c]||0) + 1);
    const a = k * 2.39996, r = 16 * Math.sqrt(k);
    n.x = cc.x + Math.cos(a)*r; n.y = cc.y + Math.sin(a)*r;
    n.vx = 0; n.vy = 0;
  });
}
if (window.ResizeObserver) new ResizeObserver(()=>{ resize(); maybeInit(); }).observe(stage);
window.addEventListener('resize', ()=>{ resize(); maybeInit(); });
resize(); maybeInit();

let selected = null, hover = null;
let cam = { x:0, y:0, z:1 };
function tick(){
  if (W < 50) return;
  for (let i=0;i<nodes.length;i++){ const a=nodes[i];
    for (let j=i+1;j<nodes.length;j++){ const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+60, d=Math.sqrt(d2);
      const f = Math.min(8000/d2, 5);
      dx/=d; dy/=d; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
    a.vx += -a.x*0.004; a.vy += -a.y*0.004;
    const cc = clusterC[a.cluster||'misc'];
    if (cc){ a.vx += (cc.x-a.x)*0.03; a.vy += (cc.y-a.y)*0.03; }
  }
  for (const e of edges){ const a=nodeById[e.a], b=nodeById[e.b]; if(!a||!b) continue;
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const want = 80 + Math.min(70, a.r+b.r);
    const f = (d-want)*0.018*Math.min(3, e.w);
    dx/=d; dy/=d; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
  for (const n of nodes){ n.vx*=0.86; n.vy*=0.86;
    n.x+=Math.max(-9,Math.min(9,n.vx)); n.y+=Math.max(-9,Math.min(9,n.vy)); }
}
function visible(n){
  if (!n.subject && !document.getElementById('f-detail').checked) return false;
  if (n.status==='killed' && !document.getElementById('f-killed').checked) return false;
  if (n.status==='heuristic' && !document.getElementById('f-heur').checked) return false;
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (q && !(n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q))) return false;
  return true;
}
function draw(){
  if (W >= 50){
    ctx.clearRect(0,0,W,H);
    const cx = W/2 + cam.x, cy = H/2 + cam.y, z = cam.z;
    const showAll = document.getElementById('f-edges').checked;
    const vis = nodes.filter(visible);
    const visSet = new Set(vis.map(n=>n.id));
    document.getElementById('empty').hidden = vis.length > 0;
    for (const e of edges){
      if (!visSet.has(e.a) || !visSet.has(e.b)) continue;
      const sel = selected && (e.a===selected.id || e.b===selected.id);
      if (!showAll && !sel) continue;
      const a=nodeById[e.a], b=nodeById[e.b];
      ctx.strokeStyle = sel ? 'rgba(230,237,243,.5)' : (e.rel.indexOf('cross:')===0 ? 'rgba(255,215,0,.6)' : 'rgba(139,148,158,.16)');
      ctx.lineWidth = sel ? Math.min(3, .6+e.w*.5) : 1;
      ctx.beginPath(); ctx.moveTo(cx+a.x*z, cy+a.y*z); ctx.lineTo(cx+b.x*z, cy+b.y*z); ctx.stroke();
    }
    for (const n of vis){
      const x=cx+n.x*z, y=cy+n.y*z, r=n.r*Math.sqrt(z);
      if (x<-50||y<-50||x>W+50||y>H+50) continue;
      ctx.beginPath(); ctx.arc(x,y,Math.max(1.5,r),0,6.2832);
      ctx.globalAlpha = n.subject ? .92 : .5;
      ctx.fillStyle = COLORS[n.status] || '#8b949e';
      ctx.fill(); ctx.globalAlpha = 1;
      if (n===selected || n===hover){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
      if (n===hover || n.r>10 || z>1.7){
        ctx.fillStyle='#e6edf3'; ctx.font='11px sans-serif'; ctx.textAlign='center';
        const t = n.label.length>36 ? n.label.slice(0,35)+'…' : n.label;
        ctx.fillText(t, x, y - r - 6);
      }
    }
  }
  requestAnimationFrame(draw);
}
// pointer: mouse + touch
let drag=null, pinch=null;
function pos(e){ const r=cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x:t.clientX-r.left, y:t.clientY-r.top }; }
function nodeAt(mx,my){
  const cx=W/2+cam.x, cy=H/2+cam.y, z=cam.z;
  for (const n of nodes){ if(!visible(n)) continue;
    const x=cx+n.x*z, y=cy+n.y*z;
    if (Math.hypot(mx-x,my-y) < n.r*Math.sqrt(z)+6) return n; }
  return null;
}
cv.addEventListener('mousedown', e=>{ drag={x:e.clientX,y:e.clientY,moved:false}; });
window.addEventListener('mousemove', e=>{
  if (drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
    cam.x+=dx; cam.y+=dy; drag.x=e.clientX; drag.y=e.clientY; }
});
window.addEventListener('mouseup', e=>{
  if (drag && !drag.moved && e.target===cv){
    const p=pos(e); select(nodeAt(p.x,p.y));
  }
  drag=null;
});
cv.addEventListener('wheel', e=>{ e.preventDefault();
  cam.z = Math.max(.3, Math.min(4, cam.z * (e.deltaY<0? 1.12 : .9))); }, {passive:false});
cv.addEventListener('touchstart', e=>{
  if (e.touches.length===1){ const p=pos(e); drag={x:p.x,y:p.y,moved:false,id:e.touches[0].identifier}; }
  else if (e.touches.length===2){ const a=e.touches[0], b=e.touches[1];
    pinch={ d:Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z:cam.z }; drag=null; }
}, {passive:true});
cv.addEventListener('touchmove', e=>{
  if (e.touches.length===1 && drag){
    const p=pos(e); const dx=p.x-drag.x, dy=p.y-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>6) drag.moved=true;
    cam.x+=dx; cam.y+=dy; drag.x=p.x; drag.y=p.y;
  } else if (e.touches.length===2 && pinch){
    const a=e.touches[0], b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (d>0) cam.z = Math.max(.3, Math.min(4, pinch.z * d/pinch.d));
  }
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchend', e=>{
  if (drag && !drag.moved && e.changedTouches.length){
    const t=e.changedTouches[0], r=cv.getBoundingClientRect();
    select(nodeAt(t.clientX-r.left, t.clientY-r.top));
  }
  drag=null; pinch=null;
});
function pill(st){ return `<span class="pill st-${st}">${NAMES[st]||st}</span>`; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function select(n){
  selected = n;
  const d = document.getElementById('detail');
  if (!n){ d.innerHTML = '<p class="hint">Select a node to inspect its facets, notes and provenance.</p>'; return; }
  let h = `<h2 style="word-break:break-word">${esc(n.label)}</h2>`;
  h += `<div style="margin-bottom:6px">${pill(n.status)} <span class="hint">${esc(n.id)}</span></div>`;
  if (n.note) h += `<p style="font-size:12px;color:#c9d1d9"><i>merge note:</i> ${esc(n.note)}</p>`;
  if (n.killedFacets) h += `<p style="font-size:12px;color:#f85149">${n.killedFacets} killed facet(s) — see below</p>`;
  const nb = edges.filter(e=>e.a===n.id||e.b===n.id);
  if (nb.length){ h += `<p class="hint">${nb.length} relation(s):</p>`;
    nb.slice(0,24).forEach(e=>{ const o = e.a===n.id? e.b : e.a;
      const on = nodeById[o];
      h += `<div style="font-size:12px;margin:3px 0"><a href="#" data-n="${esc(o)}" style="color:#58a6ff">${esc(on?on.label:o)}</a> <span class="hint">— ${e.a===n.id? esc(e.rel)+' →' : '← '+esc(e.rel)} (×${e.w})</span></div>`; });
  }
  h += `<p class="hint" style="margin-top:10px">${n.facets.length} facet(s) · chunks: ${esc(n.chunks.join(', '))}</p>`;
  n.facets.forEach(f=>{
    h += `<div class="facet"><div class="lbl">${esc(f.label)}</div>`
      + `<div class="meta">${pill(f.status||'open')}<span class="hint">${esc(f.kind)}${f.genre?' · '+esc(f.genre):''} · ${esc(f.chunk)}${f.cid?' / '+esc(f.cid):''}</span></div>`
      + (f.note? `<div class="note">${esc(f.note)}</div>` : '') + `</div>`;
  });
  d.innerHTML = h;
  d.querySelectorAll('a[data-n]').forEach(a=>a.addEventListener('click', ev=>{
    ev.preventDefault(); const t=nodeById[a.getAttribute('data-n')]; if(t) select(t); }));
}
document.getElementById('legend').innerHTML =
  Object.keys(COLORS).map(k=>`<span class="li"><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}</span>`).join('')
  + `<span class="li hint">node size ∝ facet count</span>`;
(function(){
  const st = GRAPH.stats;
  const el = document.querySelector('#topbar .sub');
  el.textContent += ` · ${st.subjects} subjects · ${st.cross_edges} relations · ${GRAPH.loops.length} open loops · ${st.concepts} concepts`;
})();
document.getElementById('looplo').innerHTML = GRAPH.loops.map(l=>
  `<div class="loop"${l.node?` data-node="${esc(l.node)}" title="trace this constellation" style="cursor:pointer"`:''}><b>${esc(l.chunk)}</b> — ${esc(l.label)}</div>`).join('');
document.getElementById('looplo').addEventListener('click', e=>{
  const t = e.target.closest('[data-node]');
  if (t){ const n = nodeById[t.getAttribute('data-node')]; if (n) select(n); }
});
setInterval(tick, 30);
draw();
</script>
