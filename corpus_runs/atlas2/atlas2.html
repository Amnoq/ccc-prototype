<html lang="en">
<head>
<meta charset="utf-8">

<title>Atlas-2 — foreign literature corpus</title>
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; height:100%; }

  #err { display:none; background:#f85149; color:#fff; padding:10px 14px;
         font-size:13px; font-weight:600; }

  #topbar { background:#161b22; border-bottom:1px solid #30363d; padding:10px 14px; }

  #topbar .sub { font-size:12px; color:#8b949e; margin-bottom:8px; }
  #topbar .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  #topbar input[type=text] { flex:1 1 160px; min-width:120px; background:#0e1116; color:#e6edf3;
    border:1px solid #30363d; border-radius:6px; padding:7px 10px; font-size:14px; }
  #topbar label.tgl { display:inline-flex; align-items:center; gap:5px; font-size:12px;

    padding:5px 10px; cursor:pointer; white-space:nowrap; }
  #topbar label.tgl input { accent-color:#58a6ff; }
  #legend { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:8px; font-size:11px; color:#8b949e; }
  #legend .li { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  #main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; position:relative; min-width:0; min-height:0; touch-action:none; }
  canvas { display:block; width:100%; height:100%; }
  #side { width:360px; flex:none; background:#161b22; border-left:1px solid #30363d;
          overflow-y:auto; padding:14px; -webkit-overflow-scrolling:touch; }
  #side h2 { margin:0 0 4px; font-size:15px; }
  .facet { border:1px solid #30363d; border-radius:8px; padding:8px 10px; margin:8px 0; }
  .facet .lbl { font-weight:600; word-break:break-word; }
  .facet .meta { color:#8b949e; font-size:12px; margin-top:4px; }
  .facet .note { font-size:12px; margin-top:4px; color:#c9d1d9; word-break:break-word; }
  .pill { display:inline-block; font-size:11px; padding:1px 8px; border-radius:999px;
          margin-right:6px; color:#0e1116; font-weight:700; }
  .st-exact { background:#3fb950; } .st-computationally_verified { background:#58a6ff; }
  .st-conjectural { background:#d29922; } .st-heuristic { background:#8b949e; }
  .st-killed { background:#f85149; } .st-open { background:#e6edf3; }
  .hint { color:#8b949e; font-size:12px; }
  #loops .loop { font-size:12px; color:#c9d1d9; margin:5px 0; }
  #loops .loop b { color:#e6edf3; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
           color:#8b949e; font-size:14px; pointer-events:none; text-align:center; padding:20px; }
  @media (max-width: 900px) {
    #main { flex-direction:column; }
    #stage { min-height:52dvh; }
    #side { width:100%; border-left:none; border-top:1px solid #30363d; flex:1; min-height:0; }
  }
</style>
</head>
<body>
<div id="err"></div>
<div id="app">
  <header id="topbar">
    <div class="title">Atlas-2 — foreign literature corpus</div>
    <div class="sub">8 analytic-number-theory papers, extracted blind · tap a node for detail · drag to pan, pinch/scroll to zoom</div>
    <div class="row">
      <input type="text" id="q" placeholder="search nodes…" autocomplete="off">
      <label class="tgl"><input type="checkbox" id="f-detail"> detail nodes</label>
      <label class="tgl"><input type="checkbox" id="f-edges" checked> all edges</label>
      <label class="tgl"><input type="checkbox" id="f-killed" checked> killed</label>
      <label class="tgl"><input type="checkbox" id="f-heur" checked> heuristic</label>
    </div>
    <div id="legend"></div>
  </header>
  <div id="main">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="empty" hidden>no nodes match the current filters</div>
    </div>
    <aside id="side">
      <div id="detail"><p class="hint">Select a node to inspect its facets, notes and provenance.</p></div>
      <div id="loops"><h2 style="font-size:14px;margin-top:14px">Open loops</h2><div id="looplo"></div></div>
    </aside>
  </div>
</div>

l", "note": "Figure 1 plots the differences between the first 20 zeros of zeta(1/2 + is) and the eigenvalues of D_log^{(lambda,N)} for lambda = 3, N = 120."}, {"id": "the-table-of-upper-bounds-on-the-absolute-differ", "display": "The table of upper bounds on the absolute differences between the first 50 non-trivial zeros of zeta and the eigenvalues of D_log^{(lambda,N)}, for N = 120 and lambda = sqrt(12), sqrt(13), sqrt(14)", "status": "computationally_verified", "cluster": "ccm", "chunk": "ccm_s9", "kind": "result", "genre": "original", "note": "The Section 6 table for N = 120: zero 1 errors 3.41 x 10^{-50} (lambda = sqrt(12)), 2.44 x 10^{-55} (sqrt(13)), 1.07 x 10^{-60} (sqrt(14)); zero 50 errors 9.02 x 10^{-2}, 2.04 x 10^{-3}, 4.78 x 10^{-6}."}, {"id": "the-numerical-results-as-evidence-that-the-spect", "display": "The numerical results as evidence that the spectra of D_log^{(lambda,N)} tend, as N and lambda go to infinity, to the non-trivial zeros of zeta(1/2 + is)", "status": "heuristic", "cluster": "ccm", "chunk": "ccm_s9", "kind": "claim", "genre": "original", "note": "Section 6 interprets the table as evidence of convergence of the spectra to the nontrivial zeros; the paper notes that establishing this rigorously would prove RH (the program of Section 7)."}, {"id": "hypothetical-spaces-x-0-c-of-c-valued-points-of-", "display": "hypothetical spaces X_0[C] of C-valued points of an arithmetic scheme", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s1", "kind": "conjecture", "genre": "original", "note": "Paper motivates hypothetical analytic spaces X_0[C] (C = C, C_p, C_∞) carrying commuting Frobenius endomorphisms F_p; classical (spec Z)(C) is a point, too few for analysis."}, {"id": "expected-suspension-form-x-0-x-0-c-q-0-r-0-with-", "display": "expected suspension form X_0 = X̌_0[C] ×_{Q^{>0}} R^{>0} with foliation F", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s1", "kind": "conjecture", "genre": "reframed", "note": " n subspaces; the glued topology", "status": "exact", "cluster": "deninger", "chunk": "deninger_s11", "kind": "result", "genre": "original", "note": "Lemma 7.2: for open affine X'_0⊂X_0 the inclusion •X'(C)⊂•X(C) is open (r′=r/s argument); global topology glued from an affine cover; quotient topology on •X_0(C)."}, {"id": "lemma-7-3-g-acts-by-homeomorphisms-f-are-clopen-", "display": "Lemma 7.3: G acts by homeomorphisms; F_ν are clopen embeddings", "status": "exact", "cluster": "deninger", "chunk": "deninger_s11", "kind": "result", "genre": "original", "note": "Lemma 7.3: G acts by homeomorphisms; F_ν(•X(C))={P(μ_ν(K))=1} is clopen by Lemma 4.6; F_ν is continuous, closed, open, a homeomorphism onto its image."}, {"id": "proposition-7-5-continuity-of-the-g-action", "display": "Proposition 7.5: continuity of the G-action", "status": "exact", "cluster": "deninger", "chunk": "deninger_s12", "kind": "result", "genre": "original", "note": "Prop 7.5: the action map •X(C)×G→•X(C) is continuous; uses open stabilizers of r∈R and sequential argument on affines."}, {"id": "propositions-7-6-7-7-and-corollary-7-8-invariant", "display": "Propositions 7.6–7.7 and Corollary 7.8: invariant metric and metrizability", "status": "exact", "cluster": "deninger", "chunk": "deninger_s12", "kind": "result", "genre": "original", "note": "Prop 7.6: G-invariant metric d via orbit-weighted sums (finite G-orbits on countable R); separable C gives second countability. Prop 7.7: quotient metric δ on X/G induces quotient topology. Cor 7.8: affine case metrizable, separable, Hausdorff."}, {"id": "corollary-7-9-hausdorffness-with-an-ample-invert", "display": "Corollary 7.9: Hausdorffness with an ample invertible sheaf", "status": "exact", "cluster": "deninger", "chunk": "deninger_s12", "kind": "result", "genre": "original", "note": "Cor 7.9: with an ample invertible sheaf, •X(C), •X_0(C), X̌(C), X̌_0(C) are Hausdorff; any two points lie in a common affine ([dJ]); Frobenius homeomorphisms transport Hausdorffness to colimits."}, {"id": "hausdorffness-for-merely-separated-x-0", "display": "Hausdorffness for merely separated X_0", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s12", "kind": "question", "genre": "original", "note": "Remark: Hausdorffness unknown assuming only separated X_0, since W_rat(−)(C) does not commute with cartesian products."}, {"id": "theorem-7-10-the-structure-maps-are-continuous-b", "display": "Theorem 7.10: the structure maps are continuous bijections, not homeomorphisms", "status": "exact", "cluster": "deninger", "chunk": "deninger_s12", "kind": "result", "genre": "original", "note": "Thm 7.10: the maps •X(C)_{Q,in}×R^{>0} ⊔ ⊔_p •X(C)_{p,in}×_{p^Z}R^{>0} → X are continuous bijections (via Prop 5.1 unique representatives); not homeomorphisms — generic fibre of X is connected while the left side has uncountably many components parametrized by Hom_inj(μ(K),S^1)."}, {"id": "the-bost-connes-relation-via-r-x-c-a-f", "display": "the Bost-Connes relation via r: X̌(C) → A_f", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s12", "kind": "claim", "genre": "original", "note": "Maps r: •X(C)→Ẑ, r: X̌(C)→A_f (via ι: μ(K)≅μ(C) and cyclotomic character κ); continuous G- and Q^{>0}-equivariant; relation to Bost-Connes [BC95] suggested as a possible noncommutative viewpoint; Q^{>0}-action on Ȟ_{E_tors}×R^{>0} not properly discontinuous — 'works to our advantage' in §10."}, {"id": "y-0-the-closure-of-the-periodic-orbits-stays-inf", "display": "Y_0, the closure of the periodic orbits, stays infinite-dimensional", "status": "exact", "cluster": "deninger", "chunk": "deninger_s13", "kind": "claim", "genre": "original", "note": "Paper shows the hoped-for dimension reduction fails: the closure Y_0 of all periodic orbits is still infinite-dimensional; instead it equals X̌_0(S^1)×_{Q^{>0}}R^{>0}."}, {"id": "claim-8-1-on-maximal-ideals-with-prescribed-elem", "display": "Claim 8.1 on maximal ideals with prescribed element orders", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s13", "kind": "conjecture", "genre": "original", "note": "Claim 8.1: maximal ideals n with prescribed l-adic orders of reductions of given elements; known for number rings with positive Dirichlet density ([Per11] Thm 1), trivial in dim 0, conjectural in higher dimension."}, {"id": "theorem-8-2-the-periodic-locus-closes-to-x-s-1", "display": "Theorem 8.2: the periodic locus closes to X̌(S^1)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s13", "kind": "result", "genre": "original", "note": "Thm 8.2: closure of the periodic locus X̌(C)_per is X̌(S^1) (and quotient version); conditional on Claim 8.1 for dim≥2 or dim=1, char K_0>0."}, {"id": "lemma-8-3-approximating-characters-by-finite-fie", "display": "Lemma 8.3: approximating characters by finite-field characters", "status": "exact", "cluster": "deninger", "chunk": "deninger_s13", "kind": "result", "genre": "original", "note": "Lemma 8.3: any S^1-character ψ on finitely many elements is ε-approximated by a finite-field character χ with finite kernel; proof builds B=Σb_il^i with ((B/l^j)−θ_j)≤1/l via Claim 8.1 and extends χ from μ_{l^n}(k)."}, {"id": "the-subspace-x-c-of-n-0-primary-torsion-kernel", "display": "the subspace •X(C)′ of N_0-primary torsion kernel", "status": "exact", "cluster": "deninger", "chunk": "deninger_s14", "kind": "definition", "genre": "original", "note": "•X(C)′ defined by (ker P̄^×)_tors being N_0-primary; contains the E_tors locus; equals •X(C) when N_0=N."}, {"id": "proposition-9-1-x-c-is-the-closure-of-the-e-tors", "display": "Proposition 9.1: •X(C)′ is the closure of the E_tors locus", "status": "exact", "cluster": "deninger", "chunk": "deninger_s14", "kind": "result", "genre": "original", "note": "Prop 9.1: •X(C)′ is the topological closure of •X(C)_{E_tors}; closedness uses discreteness of μ_N(C); density via approximating characters ψ_n with |ker ψ_n|∈N_0 on the divisible group μ(κ(x))."}, {"id": "theorem-9-2-density-of-the-generic-fibre-of-the-", "display": "Theorem 9.2: density of the generic fibre of the E_f locus", "status": "exact", "cluster": "deninger", "chunk": "deninger_s14", "kind": "result", "genre": "original", "note": "Thm 9.2: fibres of X̌(C)_{E_f}, X̌_0(C)_{E_f} over generic points are dense in X̌(C)′, X̌_0(C)′; proof builds χ on K^× from χ_μ on μ(K) (handling the p^∞-part via ι(ζ^M)) plus an injective Q-linear χ′; the t∈T∩p case needs resolution of singularities (argument continues)."}, {"id": "theorem-9-2-density-of-the-fibres-proved-by-cons", "display": "Theorem 9.2: density of the fibres, proved by constructing characters χ approximating P", "status": "exact", "cluster": "deninger", "chunk": "deninger_s15", "kind": "result", "genre": "original", "note": "Theorem 9.2 asserts characters χ ∈ Hom_{E_f}(K^×, C^×) satisfying the approximation estimate (80) |χ(r) − P(r)| < ε for all r ∈ T; the proof ends with χ constructed to meet (80)."}, {"id": "de-jong-alteration-to-reach-a-regular-local-ring", "display": "de Jong alteration to reach a regular local ring with understood multiplicative structure", "status": "exact", "cluster": "deninger", "chunk": "deninger_s15", "kind": "method", "genre": "original", "note": "Uses an alteration f: Z → X_1 = spec R_1 from a regular integral scheme (de Jong, [dJ96]) so that O_z is regular local; the elements t ∈ T ∩ p are the problematic ones with P(t) = 0."}, {"id": "multiplicative-monoid-decomposition-o-z-0-o-z-1-", "display": "multiplicative monoid decomposition O_z\\{0} = O_z^× ⊕ π_1^{N_0} ⊕ π_2^{N_0} ⊕ ...", "status": "exact", "cluster": "deninger", "chunk": "deninger_s15", "kind": "claim", "genre": "original", "note": "By Auslander–Buchsbaum, the regular Noetherian local ring O_z is a UFD; decomposition (84) into units times powers of pairwise non-associated prime elements π_j."}, {"id": "construction-of-x-x-exp-x-with-re-j-close-to-so-", "display": "construction of χ(x) = χ_μ(α(x)) exp χ'(x̄) with Re χ'(π̄_j) close to −∞ so |χ(s_i)| is arbitrarily small", "status": "exact", "cluster": "deninger", "chunk": "deninger_s15", "kind": "method", "genre": "original", "note": "χ_μ on μ(K) has finite kernel with |ker χ_μ| ∈ N_0 and agrees with P on μ(K) ∩ T by (82); χ' : (L^×/μ(L)) ⊗ Q ↪ C' is injective Q-linear; on π̄_j with all ν_ij ≥ 0 the values Re χ'(π̄_j) near −∞ force |χ(s_i)| = exp Re χ'(s̄_i) arbitrarily small, so χ(s_i) ≈ P(s_i) = 0."}, {"id": "theorem-9-3-the-fibres-of-x-c-and-x-0-c-over-res", "display": "Theorem 9.3: the fibres of X̌(C) and X̌_0(C) over η resp. η_0 are dense", "status": "exact", "cluster": "deninger", "chunk": "deninger_s15", "kind": "result", "genre": "original", "note": "Theorem 9.3 states the fibre density for X̌(C) and X̌_0(C); proved by the same proof with simplifications (e.g. χ_μ = P|_{μ(K)} in all cases)."}, {"id": "lemma-9-4-points-of-h-can-be-approximated-by-inj", "display": "Lemma 9.4: points of H can be approximated by injective homomorphisms joined by a path in H_inj", "status": "exact", "cluster": "deninger", "chunk": "deninger_s15", "kind": "result", "genre": "original", "note": "Lemma 9.4: for φ_0, φ_1 ∈ H and neighborhoods U_0, U_1 there are ψ_0 ∈ U_0, ψ_1 ∈ U_1 in H_inj joined by a continuous path in H_inj; proof via ψ'_t = (1−α(t))ψ'_0 + α(t)ψ'_1 where α avoids the countable set Ω, whose complement in C is path connected."}, {"id": "almost-path-connected-topological-space", "display": "almost path-connected topological space", "status": "exact", "cluster": "deninger", "chunk": "deninger_s16", "kind": "definition", "genre": "original", "note": "Definition 9.5: Z is almost path-connected if for any z_0, z_1 and neighborhoods U_0, U_1 there are z̃_0 ∈ U_0, z̃_1 ∈ U_1 joined by a continuous path in Z."}, {"id": "an-almost-path-connected-space-is-connected", "display": "an almost path connected space is connected", "status": "exact", "cluster": "deninger", "chunk": "deninger_s16", "kind": "claim", "genre": "original", "note": "Paper proves: an almost path connected space is connected; a decomposition into disjoint non-empty opens would lift to a disconnected cover of the path's image."}, {"id": "theorem-9-6-x-and-x-0-0-are-connected-x-0-0-is-t", "display": "Theorem 9.6: X_η and X_{0η_0} are connected; X_{0η_0} is the disjoint union of d_μ almost path connected subspaces", "status": "exact", "cluster": "deninger", "chunk": "deninger_s16", "kind": "result", "genre": "original", "note": "Theorem 9.6 assumes X_0 integral, normal, flat of finite type over spec Z and E ⊃ E_f: X_η and X_{0η_0} are connected, and X_{0η_0} is the disjoint union of d_μ almost path connected subspaces, d_μ = (K_0 ∩ Q(μ(K)) : Q)."}, {"id": "open-surjection-r-with-almost-path-connected-fib", "display": "open surjection r with almost path-connected fibres onto Y with the coarse topology", "status": "exact", "cluster": "deninger", "chunk": "deninger_s16", "kind": "method", "genre": "original", "note": "Restriction map r in (93), pr^{-1}_X(η) ↠ Q^{>0}_0 Ẑ^×, is continuous, open, N_0-equivariant with almost path-connected fibres via (90)-(99); Y = Q^{>0}_0 Ẑ^×/Q^{>0}_0 ≅ Ẑ^× carries the coarse topology by strong approximation for Q ((100)), forcing X_η connected."}, {"id": "corollary-9-7-x-and-x-0-are-connected", "display": "Corollary 9.7: X and X_0 are connected", "status": "exact", "cluster": "deninger", "chunk": "deninger_s16", "kind": "result", "genre": "original", "note": "Corollary 9.7: X and X_0 are connected, since X_η, X_{0η_0} are connected (Theorem 9.6) and dense (Theorem 9.2)."}, {"id": "e-tors-variant-same-connectedness-but-x-0-has-fa", "display": "E_tors variant: same connectedness, but X_0 has far too many periodic orbits", "status": "exact", "cluster": "deninger", "chunk": "deninger_s16", "kind": "result", "genre": "original", "note": "Remark: the same connectedness holds for E = E_tors without Lemma 9.4, but by Theorem 5.5 the space X_0 then has far too many periodic orbits."}, {"id": "theorem-9-8-kucharczyk-scholze-g-acts-freely-on-", "display": "Theorem 9.8 (Kucharczyk–Scholze): G acts freely on r^{-1}(Hom_inj(μ(K), C^×))", "status": "exact", "cluster": "deninger", "chunk": "deninger_s16", "kind": "result", "genre": "original", "note": "Theorem 9.8, due to Kucharczyk and Scholze: G acts freely on r^{-1}(Hom_inj(μ(K), C^×)) ⊂ pr^{-1}(η); from P = P^σ, the cyclotomic character gives κ(σ) = 1 and [KS18, Lemma 4.12] with char K_0 = 0."}, {"id": "leafwise-cohomology-h-f-x-h-x-r-x", "display": "leafwise cohomology H^•_F(X) := H^•(X, R_X)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s17", "kind": "definition", "genre": "original", "note": "Definition 10.1: the leafwise cohomology of X is the graded commutative unital cohomology R-algebra H^•_F(X) := H^•(X, R_X); modeled on leafwise/tangential cohomology of foliated spaces [ALK02], [MS06]."}, {"id": "the-sheaf-r-x-of-functions-locally-constant-alon", "display": "the sheaf R_X of functions locally constant along the leaves of F", "status": "exact", "cluster": "deninger", "chunk": "deninger_s17", "kind": "definition", "genre": "original", "note": "R_X̃ consists of continuous real-valued functions locally constant in the M-variable; R_X = (π_* R_X̃)^Q is viewed as the sheaf of continuous functions on X locally constant along the leaves of the 1-codimensional 'foliation' F by images of M × {u}."}, {"id": "theorem-10-2-the-0-th-leafwise-cohomology-consis", "display": "Theorem 10.2: the 0-th leafwise cohomology consists of constants only", "status": "exact", "cluster": "deninger", "chunk": "deninger_s17", "kind": "result", "genre": "original", "note": "Theorem 10.2: in the situation of Corollary 9.7 the spaces H^0_F(X_η), H^0_F(X), H^0_F(X_{0η_0}), H^0_F(X_0) consist of constant functions only, canonically ≅ R with trivial G×R^{>0} resp. R^{>0} action."}, {"id": "reduction-of-h-0-f-to-a-continuous-function-on-t", "display": "reduction of H^0_F to a continuous function on the quotient Y", "status": "exact", "cluster": "deninger", "chunk": "deninger_s17", "kind": "method", "genre": "original", "note": "Proof: H^0_F(X_0) = H^0_F(X)^G; restriction to the dense subspace X_η is injective by Theorem 9.2; a section f factors over a continuous Q^{>0}_0-invariant f̄ and hence over f̃ on Y, which is constant by Proposition 10.3."}, {"id": "proposition-10-3-the-quotient-space-y-is-irreduc", "display": "Proposition 10.3: the quotient space Y is irreducible", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s17", "kind": "result", "genre": "original", "note": "Proposition 10.3 (statement): if char N_0 contains almost all primes and Q^{>0}_0 Ẑ^× × R^{>0} carries the adele topology, then Y = Q^{>0}_0 Ẑ^× ×_{Q^{>0}_0} R^{>0} is irreducible."}, {"id": "irreducible-topological-space", "display": "irreducible topological space", "status": "exact", "cluster": "deninger", "chunk": "deninger_s17", "kind": "definition", "genre": "original", "note": "Paper recalls: a space Y is irreducible if any two non-empty opens meet; all continuous maps from an irreducible space to a Hausdorff space are constant."}, {"id": "proof-of-proposition-10-3-via-the-neighbourhood-", "display": "proof of Proposition 10.3 via the neighbourhood basis U_{S',ε} and strong approximation", "status": "exact", "cluster": "deninger", "chunk": "deninger_s18", "kind": "method", "genre": "original", "note": "Proof reduces to U ∩ (b,v)U ≠ ∅ for a neighbourhood basis U_{S',ε} of (1,1) in (Ẑ^× × R^{>0})^{adele}; builds ν = ν_0 + A∏p^{M_0} ∈ N_0 and ν' with A'_n/A_n → v so that |ν'_n b_p − 1|_p < ε and |ν'^{-1}_n ν_n v − 1|_∞ < ε for large n."}, {"id": "z-r-0-adele-is-irreducible-y-is-a-t-1-space", "display": "(Ẑ^× × R^{>0})^{adele} is irreducible; Y is a T_1-space", "status": "exact", "cluster": "deninger", "chunk": "deninger_s18", "kind": "result", "genre": "original", "note": "Proof concludes (Ẑ^× × R^{>0})^{adele} is irreducible; also, by [LR00, Lemma 3.1] on closed Q^{>0}-orbits, points of Y are closed (T_1)."}, {"id": "the-adele-topology-as-a-dense-leaf-foliation-top", "display": "the adele topology as a dense-leaf foliation topology", "status": "exact", "cluster": "deninger", "chunk": "deninger_s18", "kind": "claim", "genre": "original", "note": "Remark 1: the adele topology is reminiscent of the subspace topology on a dense leaf of a foliation, e.g. the foliation of the torus by lines of irrational slope; the ordinary topology on Ẑ^× × R^{>0} is the finer leaf topology."}, {"id": "h-0-x-r-r-gives-connectedness-of-x-again", "display": "H^0(X, R̲) = R gives connectedness of X again", "status": "exact", "cluster": "deninger", "chunk": "deninger_s18", "kind": "result", "genre": "original", "note": "Remark 2: R̲ ⊂ R_X gives H^0(X, R̲) ⊂ H^0_F(X) = R, hence H^0(X, R̲) = R, and similarly for X_η, X_{0η_0}, X_0 — another proof of connectedness, cf. Theorem 9.6."}, {"id": "theorem-10-2-for-e-e-tors-with-easier-fibre-conn", "display": "Theorem 10.2 for E = E_tors with easier fibre connectedness", "status": "exact", "cluster": "deninger", "chunk": "deninger_s18", "kind": "result", "genre": "original", "note": "Remark 3: Theorem 10.2 also holds for E = E_tors with the same proof, except the connectedness of the fibres of r in (93) is easier since Lemma 9.4 is not needed."}, {"id": "functions-on-x-c-via-the-convolution-algebra-c-c", "display": "functions on X̌(C) via the convolution algebra C_c(Γ←^×)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s19", "kind": "method", "genre": "original", "note": "Uses the topological group K←^× = lim←_N K^× with Tate module Tμ_K (104), Haar measure μ, and the convolution product (105) on C_c(K←^×); C_c(Γ←^×) embeds via extension by zero (107)."}, {"id": "lemma-11-1-c-c-is-a-non-unital-subalgebra-of-c-c", "display": "Lemma 11.1: C_c(Γ←^×) is a non-unital subalgebra of C_c(K←^×)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s19", "kind": "result", "genre": "original", "note": "Lemma 11.1: C_c(Γ←^×) is a non-unital subalgebra via (107); the induced product is (f∗g)(r) = ∫_{Γ←^×} f(s)g(s⁻¹r)χ(s⁻¹r) dμ(s) by (108)–(110)."}, {"id": "lemma-11-2-c-c-c-0-x-c-c-is-a-g-equivariant-c-al", "display": "Lemma 11.2: φ: C_c(Γ←^×) → C^0(X̌(C), C) is a G-equivariant C-algebra homomorphism", "status": "exact", "cluster": "deninger", "chunk": "deninger_s19", "kind": "result", "genre": "original", "note": "Lemma 11.2: the map φ in (111), φ(f) = ∫ f(r)r dμ(r) ((112)–(113)), is a G-equivariant C-algebra homomorphism; G-equivariance uses that G preserves μ."}, {"id": "the-induced-homomorphism-0-c-c-g-c-0-x-0-c-c", "display": "the induced homomorphism φ_0: C_c(Γ←^×)^G → C^0(X̌_0(C), C)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s19", "kind": "claim", "genre": "original", "note": "φ induces φ_0: C_c(Γ←^×)^G → C^0(X̌(C),C)^G = C^0(X̌_0(C),C) in (114), the analogue for X̌_0(C) of the map (102)."}, {"id": "intrinsic-description-of-c-c-g-in-terms-of-x-0", "display": "intrinsic description of C_c(Γ←^×)^G in terms of X_0", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s19", "kind": "question", "genre": "original", "note": "Paper states it 'would be worthwhile to find an intrinsic description of C_c(Γ←^×)^G in terms of the scheme X_0' just as C̲(Γ(X,O))^G was expressed as W_rat(Γ(X_0,O)) ⊗_Z C."}, {"id": "the-multiplicative-monoid-c-x-definition-11-3", "display": "the multiplicative monoid C(X̌) (Definition 11.3)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s19", "kind": "definition", "genre": "original", "note": "Definition 11.3: C(X̌) is the multiplicative monoid of f with supp f = X̌(C), F*_ν f = f^ν, finite G-orbit of f_n; π*: C(X̌_0) ≅ C(X̌)^G by (115)."}, {"id": "the-subgroup-t-x-and-the-monoid-e-x-0-definition", "display": "the subgroup T_κ(X̌) and the monoid E(X̌_0) (Definition 11.4)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s19", "kind": "definition", "genre": "original", "note": "T_κ(X̌) consists of locally constant f: X̌(C) → μ(C) with σ(f) = f^{κ(σ)}, pro-discrete via (118); T_κ(X̌)^G = 1 by (117); Definition 11.4 sets E(X̌_0) = (C(X̌)/T_κ(X̌))^G."}, {"id": "the-cocycle-map-e-x-0-0-h-1-cont-g-t-x", "display": "the cocycle map δ: E(X̌_0)\\{0} → H^1_cont(G, T_κ(X̌))", "status": "exact", "cluster": "deninger", "chunk": "deninger_s19", "kind": "method", "genre": "original", "note": "For ε = eT_κ(X̌) ∈ E(X̌_0), σ(e) = e c_σ with c_{στ} = c_σ σ(c_τ); finiteness of G-orbits makes σ ↦ c_σ continuous, giving δ(ε) ∈ H^1_cont(G, T_κ(X̌))."}, {"id": "proposition-11-5-image-of-is-characterized-by-0", "display": "Proposition 11.5: image of π* is characterized by δ(ε) = 0", "status": "exact", "cluster": "deninger", "chunk": "deninger_s19", "kind": "result", "genre": "original", "note": "Proposition 11.5: π*: C(X̌_0) → E(X̌_0) is injective, and ε is in the image of π* iff δ(ε) = 0 in H^1_cont(G, T_κ(X̌))."}, {"id": "the-ring-w-rat-a-of-rational-witt-vectors", "display": "the ring W_rat(A) of rational Witt vectors", "status": "exact", "cluster": "deninger", "chunk": "deninger_s2", "kind": "definition", "genre": "original", "note": "Paper defines W_rat(A) as subring of big Witt ring W(A)=1+tA[[t]] consisting of rational functions P/Q with P(0)=1=Q(0)."}, {"id": "the-teichmuller-map-a-w-rat-a-with-a-1-at", "display": "the Teichmüller map [ ]: A → W_rat(A) with [a] = 1 − at", "status": "exact", "cluster": "deninger", "chunk": "deninger_s2", "kind": "definition", "genre": "original", "note": "Teichmüller map [a]=1−at is multiplicative, unital, injective; splits the surjection f ↦ −f′(0); Frobenius/Verschiebung preserve W_rat(A) with F_ν([a])=[a^ν]."}, {"id": "the-reduced-monoid-ring-za-and-the-functorial-ma", "display": "the reduced monoid ring ZA̲ and the functorial map ω: ZA̲ → W_rat(A)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s2", "kind": "definition", "genre": "original", "note": "Reduced monoid ring ZA̲ = ZA/(Z(0)); homomorphisms ZA̲→R biject with multiplicative maps A→R sending 1↦1, 0↦0; Teichmüller induces ω: ZA̲→W_rat(A)."}, {"id": "proposition-1-1-on-injectivity-bijectivity-of", "display": "Proposition 1.1 on injectivity/bijectivity of ω", "status": "exact", "cluster": "deninger", "chunk": "deninger_s2", "kind": "result", "genre": "original", "note": "Prop 1.1: ω injective for integral domains; isomorphism for integrally closed domains with algebraically closed quotient field (UFD + splitting argument)."}, {"id": "remark-1-2-need-not-be-injective-nilpotent-count", "display": "Remark 1.2: ω need not be injective (nilpotent counterexample)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s2", "kind": "result", "genre": "original", "note": "Remark 1.2: ω not injective in general; for a²=0, a≠0, nonzero 2(a)−(2a) maps to (1−at)²/(1−2at)=1."}, {"id": "proposition-1-3-galois-descent-w-rat-a-g-w-rat-a", "display": "Proposition 1.3: Galois descent W_rat(A^G) ≅ W_rat(A)^G", "status": "exact", "cluster": "deninger", "chunk": "deninger_s2", "kind": "result", "genre": "original", "note": "Prop 1.3: W_rat(A^G)↪W_rat(A)^G is an isomorphism when G-orbits on A are finite or A is an integrally closed domain (α=P∏σQ / β=∏σQ trick; integrally-closed case via coprime P,Q)."}, {"id": "proposition-1-4-the-bv93-diagram-for-algebraic-c", "display": "Proposition 1.4: the [BV93] diagram for algebraic closures and perfect closures", "status": "exact", "cluster": "deninger", "chunk": "deninger_s2", "kind": "result", "genre": "original", "note": "Prop 1.4 restates [BV93 §2]: for κ=κ̅_0, diagram with horizontal isomorphisms via Z̲κ/κ_0; vertical arrows become isomorphisms after ⊗Z[1/p] in characteristic p."}, {"id": "the-subring-z-0-via-inseparability-degrees", "display": "the subring Z̲κ/κ_0 via inseparability degrees", "status": "exact", "cluster": "deninger", "chunk": "deninger_s2", "kind": "definition", "genre": "original", "note": "For algebraic κ/κ_0, Z̲κ/κ_0 defined via inseparability degrees d_r; equals Z̲κ for perfect κ_0."}, {"id": "proposition-11-6-the-map-lands-in-c-x-with-injec", "display": "Proposition 11.6: the map [·] lands in C(X̌) with injective cohomology map", "status": "exact", "cluster": "deninger", "chunk": "deninger_s20", "kind": "result", "genre": "original", "note": "Proposition 11.6: the map [·] in (119) lands in C(X̌); the induced map H^1_cont(G,Tμ_K) ↪ H^1_cont(G,T_κ(X̌)) is injective; if [α̌] ∈ T_κ(X̌) then α̌ ∈ Tμ_K. Uses density of the η-fibre (Theorem 9.3) and an injective character from Lemma 4.3."}, {"id": "injective-multiplicative-map-x-0-o-e-x-0", "display": "injective multiplicative map [·]: Γ(X_0,O) ↪ E(X̌_0)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s20", "kind": "result", "genre": "original", "note": "From Proposition 11.6, (123) gives an injective G-equivariant map of monoids, and passing to G-fixed submonoids yields the desired injective multiplicative map [·]: Γ(X_0,O) ↪ E(X̌_0) in (124)."}, {"id": "0-is-not-an-ordinary-function-0-c-x-0", "display": "[α_0] is not an ordinary function: [α_0] ∉ π*C(X̌_0)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s20", "kind": "claim", "genre": "original", "note": "Kummer sequence isomorphism K̂^×_0 ≅ H^1_cont(G,Tμ_K) in (125) (n prime to char K, K_0 finitely generated); a commutative diagram plus Proposition 11.5 gives [α_0] ∉ π*C(X̌_0) for all 0 ≠ α_0 ∈ Γ(X_0,O)."}, {"id": "the-divisor-div-0-of-a-generalized-function", "display": "the divisor div ε_0 of a generalized function", "status": "exact", "cluster": "deninger", "chunk": "deninger_s20", "kind": "definition", "genre": "original", "note": "Divisor of ε_0 = eT_κ(X̌) ∈ E(X̌_0) defined as div ε_0 = {P̌ ∈ X̌(C) | e(P̌) = 0}/G in (126); independent of the representative e since the zero set is G-invariant."}, {"id": "proposition-11-7-div-pr-1-x-0-div", "display": "Proposition 11.7: div [β] = pr^{-1}_{X_0}(div β)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s20", "kind": "result", "genre": "original", "note": "Proposition 11.7: for 0 ≠ β ∈ Γ(X_0,O), div [β] = pr^{-1}_{X_0}(div β) as sets; [β](P̌) = 0 iff α_n ∈ m_{X,x} iff α_1 ∈ m_{X,x}."}, {"id": "11-extends-to-n-0-and-admissible-e-e-f", "display": "§11 extends to N_0 and admissible E ⊃ E_f", "status": "exact", "cluster": "deninger", "chunk": "deninger_s20", "kind": "claim", "genre": "original", "note": "Remark: all assertions of §11 hold with N_0 in place of N (n ∈ N_0) and with X̌(C)_E for admissible E ⊃ E_f, since the fibre over η is dense by Theorem 9.2 (used in Proposition 11.6)."}, {"id": "g-sheaf-setup-c-sm-the-ring-q-0-and-the-twisted-", "display": "G-sheaf setup: C^sm, the ring Q_0 and the twisted modules Q_0(n), R(s), C(s)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s21", "kind": "definition", "genre": "original", "note": "§12 sets up G-sheaf machinery from [Sch94, Ch. 8]: C^sm_X is the maximal G-subsheaf of C_X; Q_0 = Z[p⁻¹ | p ∈ char N_0]; modules Q_0(n), R(s), C(s) with q ∈ Q^{>0}_0 acting by q^{-s}; G̃-bundle Q̲_0(n)_{X̃} in (129)."}, {"id": "the-sheaf-o-f-c-of-sections-locally-constant-in-", "display": "the sheaf O_{F c} of sections locally constant in the R^{>0}-variable", "status": "exact", "cluster": "deninger", "chunk": "deninger_s21", "kind": "definition", "genre": "original", "note": "O_{F c} is the G̃-subsheaf of C^sm_{X̃} of local sections which are locally constant in the R^{>0}-variable."}, {"id": "the-map-lim-n-0-x-o-x-o-f-c-with-f", "display": "the map [·]: lim←_{N_0} Γ(X,O^×) → Γ(X̃,O^×_{F c}) with F*_ν α = α^ν", "status": "exact", "cluster": "deninger", "chunk": "deninger_s21", "kind": "claim", "genre": "original", "note": "The map (103) induces by pullback [·]: lim←_{N_0} Γ(X,O^×) → {α ∈ Γ(X̃,O^×_{F c}) | F*_ν α = α^ν} in (130); in the affine case [f] lies in C^sm since the neighborhood V is invariant under the open stabilizer N of f_n in G."}, {"id": "invertible-regular-functions-as-twisted-invertib", "display": "invertible regular functions as twisted invertible functions up to N_0-torsion", "status": "exact", "cluster": "deninger", "chunk": "deninger_s21", "kind": "result", "genre": "original", "note": "Tensoring with Q̲_0(0) gives (131), rewritten as (132) with Q̲_0(1); (133) is [·]: Γ(X,O^×) → Γ(X̃,O^×_{F c} ⊗ Q̲_0(1))^{Q^{>0}_0} with kernel μ_{N_0}(K); passing to G̃-invariants gives the injective (134): Γ(X_0,O^×) ⊗ Q_0 → Γ(X̃,O^×_{F c} ⊗ Q̲_0(1))^{G̃} — up to roots of unity, invertible regular functions on X_0 are sections of π^{G̃}_*(O^×_{F c} ⊗ Q̲(1)) on X_0."}, {"id": "the-regulator-map-r-from-the-exponential-sequenc", "display": "the regulator map r from the exponential sequence", "status": "exact", "cluster": "deninger", "chunk": "deninger_s21", "kind": "method", "genre": "original", "note": "From the exponential sequence (135) with e(z) = exp(2πiz) one gets δ in (136) and the regulator map r: Γ(X_0,O^×) ⊗ Q_0 → H^1(X̃,Q̲_0(1))^{G̃} in (137); the target replaces the expected H^1(X_0,Q̲_0(1)) since the Q^{>0}_0-action need not be properly discontinuous; the map E in (138) has image in Ker δ, contrary to the image under r."}, {"id": "proposition-12-1-the-kernel-of-the-regulator-map", "display": "Proposition 12.1: the kernel of the regulator map lies in μ_{(N_0)}(K_0)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s21", "kind": "result", "genre": "original", "note": "Proposition 12.1: ker(r) ⊂ μ_{(N_0)}(K_0) = μ(K) ⊗ Q_0. Proof uses the pro-torus Y = Hom(K^×⊗Q, S^1) and [KS18, Proposition 3.8] identifying H^•(Y,Q̲_0) with Λ^•(K^×⊗Q), plus a direct argument via ω: S^1 ↪ Y showing δ(pr_1) ≠ 0 as the obstruction to a continuous logarithm."}, {"id": "expected-injectivity-of-r-for-x-0-of-finite-type", "display": "expected injectivity of r for X_0 of finite type over Z", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s21", "kind": "conjecture", "genre": "original", "note": "Remark: the author expects r to be injective if X_0 is of finite type over Z; it remains to show r(ζ) ≠ 0 for 1 ≠ ζ ∈ μ_{(N_0)}(K_0), which he thinks can be done working with suitable periodic orbits on X_0 = X̃/G̃."}, {"id": "future-analyticity-condition-along-the-leaves-fo", "display": "future analyticity condition along the leaves for O_{F c}", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s21", "kind": "claim", "genre": "original", "note": "Remark: the notation O_{F c} anticipates a notion of analytic function on X̌(C) so that O_{F c} could be redefined imposing analyticity along the leaves; the considerations should hold for the new O_{F c}."}, {"id": "proposition-13-1-description-of-w-rat-x-o-via-tu", "display": "Proposition 13.1: description of W_rat(X)(o) via tuples (x,y,f̃^♯_η)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s22", "kind": "result", "genre": "original", "note": "Proposition 13.1: for a scheme X and a rank one valuation ring o, W_rat(X)(o) is in bijection with tuples (x,y,f̃^♯_η), where x,y ∈ X with y ∈ closure{x} and f̃^♯_η fits into the commutative diagrams (139)–(140)."}, {"id": "the-set-x-o-of-triples-x-y-p-and-w-rat-x-o-x-o", "display": "the set X̲(o) of triples (x,y,P̄^×) and W_rat(X)(o) = X̲(o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s22", "kind": "definition", "genre": "original", "note": "Definition 13.2: X̲(o) is the set of triples (x,y,P̄^×) with y ∈ closure{x} whose extension by zero fits into (141); G and N act on it with commuting actions, F_ν injective, and (145) gives the G- and N-equivariant bijection W_rat(X)(o) = X̲(o)."}, {"id": "theorem-13-3-w-rat-x-o-g-w-rat-x-0-o", "display": "Theorem 13.3: W_rat(X)(o)/G ≅ W_rat(X_0)(o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s22", "kind": "result", "genre": "original", "note": "Theorem 13.3: for K_0 perfect and C, k algebraically closed, the map (147) W_rat(X)(o)/G = X̲_0(o) ↠ W_rat(X_0)(o) is an N-equivariant bijection; also for normal extensions K_1/K_0; proved in the paper via Proposition 13.9 and Theorem 13.10."}, {"id": "proposition-13-4-description-of-x-o-via-multipli", "display": "Proposition 13.4: description of X̲(o) via multiplicative maps P_y", "status": "exact", "cluster": "deninger", "chunk": "deninger_s22", "kind": "result", "genre": "original", "note": "Proposition 13.4: (x,y,P̄^×) ↦ (x,y,P_y) resp. (x,y,P'_y) identifies X̲(o) with triples satisfying conditions 1)–3) resp. 1'),3'); uses P_y^{-1}(0) = Ker(O_{X,y} → κ(x)) from (142) and P_y^{-1}(m) = m_{X,y} from (143)."}, {"id": "corollary-13-5-affine-description-of-x-o", "display": "Corollary 13.5: affine description of X̲(o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s22", "kind": "result", "genre": "original", "note": "Corollary 13.5: for X = spec R, X̲(o) is identified with multiplicative maps Q: R → o satisfying a) (p = Q^{-1}(0) is a prime ideal) and b) (q = Q^{-1}(m) is a prime ideal)."}, {"id": "the-variant-x-o-definition-13-6", "display": "the variant X̲̲(o) (Definition 13.6)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s22", "kind": "definition", "genre": "original", "note": "Definition 13.6: the variant X̲̲(o) of triples (x,y_0,P̄^×) with y_0 ∈ closure{x_0} ⊂ X_0; Supplement 13.7: the point y ∈ π^{-1}(y_0) and the diagram (148) are uniquely determined, and y ∈ closure{x}."}, {"id": "proposition-13-8-description-of-x-o-via-multipli", "display": "Proposition 13.8: description of X̲̲(o) via multiplicative maps P_{y_0}", "status": "exact", "cluster": "deninger", "chunk": "deninger_s22", "kind": "result", "genre": "original", "note": "Proposition 13.8: (x,y_0,P̄^×) ↦ (x,y_0,P_{y_0}) identifies X̲̲(o) with triples satisfying 1)–3); the converse extends P_{y_0} to P: O_{X,x_0} → C via localization."}, {"id": "proposition-13-9-the-bijections-between-x-o-and-", "display": "Proposition 13.9: the α/β bijections between X̲(o) and X̲̲(o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s22", "kind": "result", "genre": "original", "note": "Proposition 13.9: the maps α and β are mutually inverse G- and N-equivariant bijections between X̲(o) and X̲̲(o), inducing N-equivariant bijections of the quotients by G; proved in the paper via localization and unique multiplicative extension."}, {"id": "proof-of-proposition-13-9-via-localization-and-u", "display": "proof of Proposition 13.9 via localization and unique multiplicative extension", "status": "exact", "cluster": "deninger", "chunk": "deninger_s23", "kind": "method", "genre": "original", "note": "Proof of Proposition 13.9: β is well defined since P_{y_0} on O_{X,y_0} extends uniquely to P_y on O_{X,y} (localization at S = φ^{-1}(κ(y)^×)); conditions 1)–3) of Proposition 13.4 are checked; α and β are mutually inverse and G- and N-equivariant."}, {"id": "the-canonical-n-equivariant-map-x-0-o-w-rat-x-0-", "display": "the canonical N-equivariant map φ: X̲̲_0(o) → W_rat(X_0)(o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s23", "kind": "method", "genre": "original", "note": "The canonical N-equivariant map φ in (151): X̲̲_0(o) → W_rat(X_0)(o) sends (x,y_0,P̄^×) to the point of W_rat(X_0)(o) determined by x_0 = π(x), y_0 and the outer square of the diagram from (148), via Proposition 13.1."}, {"id": "the-map-w-rat-x-0-o-x-0-o-via-galois-lifts", "display": "the map ψ: W_rat(X_0)(o) → X̲̲_0(o) via Galois lifts", "status": "exact", "cluster": "deninger", "chunk": "deninger_s23", "kind": "method", "genre": "original", "note": "The map ψ in (152), constructed assuming K_0 perfect so that K/K_0 is Galois: uses (153) O_{X_0,z_0} = O^G_{X,z_0}, the identifications (154)–(155), Corollary 3.1 to lift P̄_0 to P̄ (156), Corollary 1.8 to get P_{y_0} with values in o, and Theorem 1.5 to adjust by σ ∈ G (161)–(162)."}, {"id": "theorem-13-10-and-are-mutually-inverse-n-equivar", "display": "Theorem 13.10: φ and ψ are mutually inverse N-equivariant bijections", "status": "exact", "cluster": "deninger", "chunk": "deninger_s23", "kind": "result", "genre": "original", "note": "Theorem 13.10: the maps φ and ψ are mutually inverse N-equivariant bijections between X̲̲_0(o) and W_rat(X_0)(o); hence Theorem 13.3 follows from Proposition 13.9 and Theorem 13.10."}, {"id": "expected-generality-of-and-theorems-13-10-13-3-b", "display": "expected generality of ψ and Theorems 13.10, 13.3 beyond the Galois case", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s23", "kind": "claim", "genre": "original", "note": "Remark: ψ used K/K_0 Galois (for (154) and Corollary 1.8); with more effort ψ, Theorem 13.10 and Theorem 13.3 should hold in general, since Corollaries 1.6 or 3.1 for fields do not assume κ/κ_0 Galois."}, {"id": "corollary-13-11-injectivity-of-w-rat-x-o-w-rat-x", "display": "Corollary 13.11: injectivity of W_rat(X)(o) → W_rat(X)(C)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s23", "kind": "result", "genre": "original", "note": "Corollary 13.11: a) for X = spec R the map W_rat(X)(o) → W_rat(X)(C) is injective (via Q ↦ ι∘Q with ι: o ↪ C); b) two o-points with the same C-image agree on y if y, y' lie in a common open affine, since every open containing y contains x (y ∈ closure{x})."}, {"id": "corollary-13-12-injectivity-of-o-valued-points-i", "display": "Corollary 13.12: injectivity of o-valued points into C-valued points", "status": "exact", "cluster": "deninger", "chunk": "deninger_s24", "kind": "result", "genre": "original", "note": "Corollary 13.12: if X_0 is affine or has an ample invertible sheaf, W_rat(X)(o) → W_rat(X)(C) is injective; if K_0 is perfect, so is W_rat(X_0)(o) → W_rat(X_0)(C). Proof: any two points of X_0 lie in a common open affine ([dJ, Lemma 28.29.5, (3)]), hence so do pairs of points of X since normalization is affine; Corollary 13.11 b) gives the first injectivity; Theorem 13.3 and Corollary 3.2 give the second."}, {"id": "14-setup-p-adic-continuity-conditions-and-comple", "display": "§14 setup: p-adic continuity conditions and completion of o-valued points", "status": "exact", "cluster": "deninger", "chunk": "deninger_s25", "kind": "claim", "genre": "original", "note": "§14 setup: o is a p-adically complete rank one valuation ring with char p residue field k; X_0 is an integral normal Z_p-scheme mapping onto spec Z_p; only N_0 generated by p (F_p = (·)^p) is considered; the o-valued points get p-adic continuity conditions imposed and are then completed."}, {"id": "definition-14-1-the-o-valued-points-and-the-map-", "display": "Definition 14.1: the o-valued points and the map [·]: Γ(X,O) → C(X̲(o),o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s25", "kind": "definition", "genre": "original", "note": "Definition 14.1 restates X̲(o) as triples (x,y,P_y) with P_y: O_{closure{x},y} → o multiplicative, conditions 1)–2); the multiplicative F_p- and G-equivariant map (163): [·]: Γ(X,O) → C(X̲(o),o) with [α] = P̄(α(x))."}, {"id": "definition-14-2-the-continuous-subspaces-x-c-o-a", "display": "Definition 14.2: the continuous subspaces X̲_c(o) and X̌_c(o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s25", "kind": "definition", "genre": "original", "note": "Definition 14.2: X̲_c(o) is the F_p- and G-invariant subspace where P_y factors over p-adically continuous P̂_y: Ô → o; X̌_c(o) = colim_{F_p} X̲_c(o); this forces 1 ≠ 0 in Ô, i.e. char κ(y) = p."}, {"id": "multiplicative-maps-are-continuous-at-0-but-not-", "display": "multiplicative maps are continuous at 0 but not necessarily elsewhere", "status": "exact", "cluster": "deninger", "chunk": "deninger_s25", "kind": "claim", "genre": "original", "note": "Author's remark: since ω = P_y(p) lies in the maximal ideal of o, P_y(p^n O) ⊂ ω^n o, so P_y is continuous at 0 for the p-adic topologies, but this does not imply continuity at other points since P_y is only multiplicative, not additive."}, {"id": "proposition-14-3-separatedness-of-the-p-adic-top", "display": "Proposition 14.3: separatedness of the p-adic topology on O_{closure{x},y}", "status": "exact", "cluster": "deninger", "chunk": "deninger_s25", "kind": "result", "genre": "original", "note": "Proposition 14.3: for X_0 of finite type over Z_p with char κ(y) = p, the p-adic topology on O_{closure{x},y} is separated; reduces to ∩_n p^n Õ_0 = 0 via minimal polynomials, using that Õ_0 is Noetherian (Z_p Nagata) and Krull's intersection theorem [AM69, Corollary 10.18]."}, {"id": "proposition-14-4-x-o-x-c-o-x-o", "display": "Proposition 14.4: X(o) ⊂ X̲_c(o) ⊂ X̲(o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s25", "kind": "result", "genre": "original", "note": "Proposition 14.4: X(o) ⊂ X̲_c(o) ⊂ X̲(o) under the natural inclusion; points of X(o) correspond to Z_p-linear ring homomorphisms P_y, which extend to continuous P̂_y: Ô → o by completeness of o."}, {"id": "p-adically-completed-functions-on-the-continuous", "display": "p-adically completed functions on the continuous subspaces", "status": "exact", "cluster": "deninger", "chunk": "deninger_s25", "kind": "claim", "genre": "original", "note": "The map (163) extends to [·]: Γ(X,O)^∧ → C(X̲_c(o),o) with [α̂] = P̂_y(α̂) in (165), and to lim←_{(·)^p} Γ(X,O)^∧ → C(X̌_c(o),o) in (167); points of X̌_c(o) are (x,y,F^{-i}_p P̂_y), and P̌_y: lim←_{(·)^p} Ô → o is given by P̌_y((f_n)) = P̂_y(f_i) in (168)."}, {"id": "fontaine-s-isomorphism-lim-p-a-a-b", "display": "Fontaine's isomorphism lim←_{(·)^p} A ≅ A^b", "status": "exact", "cluster": "deninger", "chunk": "deninger_s26", "kind": "claim", "genre": "original", "note": "Fontaine's multiplicative topological isomorphism (170): lim←_{(·)^p} A ≅ A^b := lim←_{(·)^p} A/p for p-adically complete A, with inverse via a_n = lim_{i→∞} ã_{n+i}^{p^i}; F_p on the monoid corresponds to Frobenius on the perfect F_p-algebra A^b."}, {"id": "a-inf-x-w-p-x-o-b", "display": "A_inf(X) = W_p(Γ(X,O)^{∧b})", "status": "exact", "cluster": "deninger", "chunk": "deninger_s26", "kind": "definition", "genre": "original", "note": "A_inf(X) := W_p(Γ(X,O)^{∧b}); the Teichmüller map gives ZΓ(X,O)^{∧b} → A_inf(X); using [CD14], W_p(R) ≅ lim←_n ZR/I^n with ZR/I^n ≅ W_p(R)/p^n W_p(R), I generated by [r+s]−[r]−[s]."}, {"id": "the-subsets-y-of-almost-additive-multiplicative-", "display": "the subsets Y̌_α of almost-additive multiplicative maps", "status": "exact", "cluster": "deninger", "chunk": "deninger_s26", "kind": "definition", "genre": "original", "note": "Definition 14.5: for 0 < α < 1, Y̌_α ⊂ X̌_c(o) consists of (x,y,P̌_y) with |P̌_y(r+s) − P̌_y(r) − P̌_y(s)| ≤ α for all r,s, i.e. |f(P̌_y)| ≤ α for all f ∈ I_y; Y̌ = Y̌_{1/p}."}, {"id": "x-o-y-x-c-o", "display": "X(o) ⊂ Y̌ ⊂ X̌_c(o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s26", "kind": "claim", "genre": "original", "note": "Remark 14.6: X(o) ⊂ Y̌ ⊂ X̌_c(o), so Y̌ contains the F^{Z}_p-orbits of the classical o-valued points; each (x,y,P̌_y) ∈ Y̌_α gives a ring homomorphism P̌_y: ZÔ^b → o with P̌_y(I_y) ⊂ ω_α o."}, {"id": "elements-of-a-inf-x-as-o-valued-functions-on-y", "display": "elements of A_inf(X) as o-valued functions on Y̌_α", "status": "exact", "cluster": "deninger", "chunk": "deninger_s26", "kind": "claim", "genre": "original", "note": "W_p(P̌_y): W_p(Ô^b) = lim←_n ZÔ^b/I^n_y → lim←_n o/ω^n_α = o in (172); restricting gives e: ZΓ(X,O)^{∧b} → C(Y̌_α,o) in (173), extending to e: A_inf(X) → C(Y̌_α,o) in (174) via W_p(P̌_y)(a)."}, {"id": "proposition-14-7-f-p-invariance-and-stabilizatio", "display": "Proposition 14.7: F_p-invariance and stabilization of Y̌_α", "status": "exact", "cluster": "deninger", "chunk": "deninger_s26", "kind": "result", "genre": "original", "note": "Proposition 14.7: F_p(Y̌_α) = Y̌_α and Y̌_α ⊂ Y̌, hence Y̌_α = Y̌ for α ≥ 1/p; uses |F^ν_p(P̌_y)(r+s) − ...| ≤ max(α^{p^ν}, 1/p) and an alternative diagram argument (175)–(176)."}, {"id": "completions-y-and-the-fargues-fontaine-curve", "display": "completions ◇Y and the Fargues–Fontaine curve", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s26", "kind": "claim", "genre": "original", "note": "Author's remark: the maps P̌_y used are 'lim←-locally constant' (factoring as χ∘pr_i); there are many more continuous maps; including them gives a space ◇Y ⊃ Y̌ whose quotient ◇Y_0 = ◇Y/G for X_0 = spec Z_p is in natural bijection with the points of the Fontaine–Fargues curve."}, {"id": "proposition-14-8-density-and-lifting-properties-", "display": "Proposition 14.8: density and lifting properties of lim←_{(·)^p}", "status": "conjectural", "cluster": "deninger", "chunk": "deninger_s26", "kind": "result", "genre": "original", "note": "Proposition 14.8 (statement, a): for an integral domain A in which every element is a p-th power and a multiplicative S with a ∈ S ⇔ a^p ∈ S, the image of lim←_{(·)^p} A → lim←_{(·)^p} Â is dense; b) and c) are stated (fraction representation, surjectivity onto A/p)."}, {"id": "the-completed-space-x-c-o-definition-14-9", "display": "the completed space ◇X_c(o) (Definition 14.9)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s27", "kind": "definition", "genre": "original", "note": "Definition 14.9: ◇X_c(o) consists of triples (x,y,P̄^×) with P̄^×: lim←_{(·)^p} κ(x)^× → C^× whose extension by zero fits into the commutative diagram (177) with continuous P̂_y; inclusions (178): X̲_c(o) ↪ X̌_c(o) ↪ ◇X_c(o)."}, {"id": "uniqueness-of-the-completed-diagram-supplement-1", "display": "uniqueness of the completed diagram (Supplement 14.10)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s27", "kind": "claim", "genre": "original", "note": "Supplement 14.10: the diagram (177) is uniquely determined by (x,y,P̄^×); uses density of im(i) from Proposition 14.8 a) and surjectivity of λ from 14.8 c); also (181): P_y^{-1}(m) = lim←_{(·)^p} m_{closure{x},y}."}, {"id": "proposition-14-11-description-of-x-c-o-via-conti", "display": "Proposition 14.11: description of ◇X_c(o) via continuous multiplicative maps P̂_y", "status": "exact", "cluster": "deninger", "chunk": "deninger_s27", "kind": "result", "genre": "original", "note": "Proposition 14.11: (x,y,P̄^×) ↦ (x,y,P̂_y) identifies ◇X_c(o) with triples where P̂_y: lim←_{(·)^p} Ô_{closure{x},y} → o is continuous multiplicative with conditions 1)–2); the inverse uses Proposition 14.8 to write elements of lim←_{(·)^p} κ(x) as fs^{-1}."}, {"id": "the-completed-almost-additive-subspaces-y", "display": "the completed almost-additive subspaces ◇Y_α", "status": "exact", "cluster": "deninger", "chunk": "deninger_s27", "kind": "definition", "genre": "original", "note": "Definition 14.12: ◇Y_α ⊂ ◇X_c(o) defined as in (183) via |P̂_y(r+s) − P̂_y(r) − P̂_y(s)| ≤ α; the map e extends to an F_p- and G-equivariant ring homomorphism e: A_inf(X) → C(◇Y_α,o) in (184); the author notes he does not know how to transport the α-condition to points of X̌(C) for X of finite type over spec Z."}, {"id": "proposition-14-13-stabilization-of-y", "display": "Proposition 14.13: stabilization of ◇Y_α", "status": "exact", "cluster": "deninger", "chunk": "deninger_s27", "kind": "result", "genre": "original", "note": "Proposition 14.13: F_p(◇Y_α) = ◇Y_α and ◇Y_α ⊂ ◇Y := ◇Y_{1/p}, hence ◇Y_α = ◇Y for α ≥ 1/p — the analogue of Proposition 14.7 with the same proofs."}, {"id": "proposition-14-14-almost-additive-multiplicative", "display": "Proposition 14.14: almost-additive multiplicative maps correspond to ring homomorphisms A^b → o^b", "status": "exact", "cluster": "deninger", "chunk": "deninger_s27", "kind": "result", "genre": "original", "note": "Proposition 14.14: for p-adically complete A there is a natural bijection between continuous multiplicative χ: lim←_{(·)^p} A → o with χ(1)=1, χ(0)=0 and χ̄^b additive, and continuous ring homomorphisms χ^b: A^b → o^b; via χ^b = (χ̄((a_{ν+n})_ν))_n and χ = ♯∘χ^b; moreover W_p(χ) = θ∘W_p(χ^b) ((190)), with χ factoring as lim← A ≅ A^b → W_p(A^b) → o ((189))."}, {"id": "factorization-of-multiplicative-maps-mod-p-over-", "display": "factorization of multiplicative maps mod p over pr_ν", "status": "exact", "cluster": "deninger", "chunk": "deninger_s28", "kind": "claim", "genre": "original", "note": "Remark: for a p-adically complete integral domain A with μ_{p^∞}(A) = μ_{p^∞}(K), any continuous multiplicative χ̄: lim←_{(·)^p} A → o/p factors over some pr_ν, but the lift χ: lim←_{(·)^p} A → o need not factor over pr_ν when char C = 0."}, {"id": "proposition-14-15-local-rings-completions-and-ti", "display": "Proposition 14.15: local rings, completions and tilts", "status": "exact", "cluster": "deninger", "chunk": "deninger_s28", "kind": "result", "genre": "original", "note": "Proposition 14.15: 1) the p-adic completion Â of a local ring A with p ∈ m is local with the same residue field; 2) the tilt A^b is local with maximal ideal m^b, (A^b,m^b) = (Â^b,m̂^b), and pr_0 induces A^b/m^b ≅ A/m when (·)^p is surjective on Ā."}, {"id": "o-and-its-tilt-are-local-with-algebraically-clos", "display": "Ô and its tilt are local with algebraically closed char p residue field", "status": "exact", "cluster": "deninger", "chunk": "deninger_s28", "kind": "claim", "genre": "original", "note": "Example: for the local rings O_{closure{x},y} in Definition 14.2, Ô and its tilt O^b are local with algebraically closed char p residue field κ(y)."}, {"id": "proposition-14-16-description-of-y-via-ring-homo", "display": "Proposition 14.16: description of ◇Y via ring homomorphisms Ô^b → o^b", "status": "exact", "cluster": "deninger", "chunk": "deninger_s28", "kind": "result", "genre": "original", "note": "Proposition 14.16: ◇Y = {(x,y,P̂_y) | P̂^b_y: O^b → o^b is a ring homomorphism}; identified with triples (x,y,P̂^b_y) where P̂^b_y: Ô^b → o^b is a continuous local homomorphism non-zero on lim←_{(·)^p} O \\ {0}; via (195) P̂_y = ♯∘P̂^b_y."}, {"id": "whether-the-non-vanishing-condition-for-p-b-y-ne", "display": "whether the non-vanishing condition for P̂^b_y needs amendment in higher dimensions", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s28", "kind": "question", "genre": "original", "note": "Author's remark: the condition that P̂^b_y vanish only on the zero element of the non-complete subring lim←_{(·)^p} O looks unnatural; it is fine for X_0 = spec o_{K_0} with K_0/Q_p finite, but may need amendment in higher dimensions; the guesswork in defining ◇X(o) and ◇Y may not be complete."}, {"id": "g-aut-o-acts-compatibly-on-all-the-spaces", "display": "G × Aut(o) acts compatibly on all the spaces", "status": "exact", "cluster": "deninger", "chunk": "deninger_s28", "kind": "claim", "genre": "original", "note": "Remark 14.17: G × Aut(o) acts F_p-equivariantly on X̲(o), X̌(o), and compatibly on X̲_c(o), X̌_c(o), ◇X_c(o), ◇Y, since automorphisms of o are p-adically continuous."}, {"id": "lubin-tate-setup-and-the-tate-module-character", "display": "Lubin–Tate setup and the Tate module character", "status": "exact", "cluster": "deninger", "chunk": "deninger_s29", "kind": "claim", "genre": "original", "note": "§15 works with K_0/Q_p finite, X_0 = spec o_{K_0}, X = spec o_K; Lubin–Tate formal group law F_φ for a prime element π_0; the Tate module T(F) = lim←_n F_n is free of rank one over o_{K_0} with character χ: Γ = Gal(K_∞/K_0) ≅ o^×_{K_0} in (197)."}, {"id": "tilting-correspondence-for-the-lubin-tate-tower", "display": "tilting correspondence for the Lubin–Tate tower", "status": "exact", "cluster": "deninger", "chunk": "deninger_s29", "kind": "claim", "genre": "original", "note": "Tilting review: K̂_∞ perfectoid; tilts ô^b_{K_∞}, ô^b_K; quotient fields K̂^b_∞ perfect of char p with rank-one valuation |·|_b; G_∞ = Gal(K/K_∞) acts trivially on K̂^b_∞; the field E_0 = im(κ_0((X)) ↪ K̂^b_∞) is a complete discretely valued field with residue κ_0, preserved by Γ."}, {"id": "gal-k-k-gal-e-sep-0-e-0", "display": "Gal(K/K_∞) ≅ Gal(E^{sep}_0/E_0)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s29", "kind": "result", "genre": "original", "note": "The main tilting result recalled: G_∞ = Gal(K/K_∞) → Gal(E^{sep}_0/E_0) is a topological isomorphism in (200), with E^{sep}_0 the separable closure of E_0 in K̂^b and K̂^b = completion of E^{sep}_0."}, {"id": "the-map-t-hom-cont-o-b-k-o-b-g-h-0-o-b", "display": "the map Ψ_t: Hom_cont(ô^b_K, o^b)/G_∞ → H_{κ_0}(o^b)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s29", "kind": "method", "genre": "original", "note": "The map Ψ_t in (203): Hom_cont(ô^b_K, o^b)/G_∞ → H_{κ_0}(o^b), Ψ_t(φ G_∞) = (φ(t^b), φ|_{κ_0}), using that K_∞/K_0 is totally ramified so G_∞ → Gal(κ/κ_0) is surjective."}, {"id": "theorem-15-1-t-is-a-bijection", "display": "Theorem 15.1: Ψ_t is a bijection", "status": "exact", "cluster": "deninger", "chunk": "deninger_s29", "kind": "result", "genre": "original", "note": "Theorem 15.1: for any o_{K_0}-generator t ∈ T(F), Ψ_t is a bijection Hom_cont(ô^b_K, o^b)/G_∞ ≅ H_{κ_0}(o^b) = m^b × Hom(κ_0,k) from (201); proved in the paper via the inverse map Φ_t (construction completed later in the same section)."}, {"id": "injective-vs-residue-factoring-homomorphisms-und", "display": "injective vs residue-factoring homomorphisms under Ψ_t", "status": "exact", "cluster": "deninger", "chunk": "deninger_s29", "kind": "claim", "genre": "original", "note": "Remark: since ô^b_K is a rank one valuation ring, φ: ô^b_K → o^b is either injective or factors over κ; these correspond to (m^b\\{0}) × Hom(κ_0,k) resp. {0} × Hom(κ_0,k) under Ψ_t."}, {"id": "theorem-1-5-ks18-hom-descent-for-profinite-group", "display": "Theorem 1.5 ([KS18]): Hom-descent for profinite group actions, and its W_rat version", "status": "exact", "cluster": "deninger", "chunk": "deninger_s3", "kind": "result", "genre": "reframed", "note": "Thm 1.5: first assertion is [KS18] Lemma 4.9 (cited); the W_rat version is proved here using Prop 1.3 a) and finite G-orbits on W_rat(A)."}, {"id": "corollary-1-6-hom-w-rat-0-c-as-multiplicative-ma", "display": "Corollary 1.6: Hom(W_rat(κ_0),C) as multiplicative maps modulo the Galois group", "status": "exact", "cluster": "deninger", "chunk": "deninger_s3", "kind": "result", "genre": "original", "note": "Cor 1.6: Hom(W_rat(κ_0),C) bijects with multiplicative maps κ→C (resp. κ_0^sep→C in equal char p) modulo H=Gal, via Prop 1.4 + Thm 1.5; φ(r)²=0 argument for inseparable r."}, {"id": "lemma-1-7-o-valued-points-lift-along-integral-mo", "display": "Lemma 1.7: o-valued points lift along integral morphisms; X(o)/G ≅ X_0(o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s3", "kind": "result", "genre": "original", "note": "Lemma 1.7: for rank-one valuation ring o with alg. closed fraction field, integral π gives surjectivity X(o)→X_0(o)×_{X_0(C)}X(C); and X(o)/G ≅ X_0(o) for X=spec B, X_0=spec B^G (uses integral closedness of o)."}, {"id": "corollary-1-8-hom-w-rat-a-o-g-hom-w-rat-a-g-o", "display": "Corollary 1.8: Hom(W_rat(A),o)/G ≅ Hom(W_rat(A^G),o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s3", "kind": "result", "genre": "original", "note": "Cor 1.8: Hom(W_rat(A),o)/G ≅ Hom(W_rat(A^G),o); extensions to C land in o; for integrally closed domains with alg. closed quotient field equals multiplicative maps A→o modulo G."}, {"id": "fatou-domain-and-fatou-scheme", "display": "Fatou domain and Fatou scheme", "status": "exact", "cluster": "deninger", "chunk": "deninger_s3", "kind": "definition", "genre": "original", "note": "Fatou domain defined by W_rat(K)∩W(A)=W_rat(A); Noetherian integral domains are Fatou [Haz83 §3]."}, {"id": "theorem-1-9-verschiebung-preserves-rationality-f", "display": "Theorem 1.9: Verschiebung preserves rationality for Fatou domains", "status": "exact", "cluster": "deninger", "chunk": "deninger_s3", "kind": "result", "genre": "original", "note": "Thm 1.9: for Fatou A, V_N(W(A))∩W_rat(A)=V_N(W_rat(A)); rationality detected by finite continued-fraction expansion, commuting with V_N."}, {"id": "completion-of-the-proof-of-theorem-15-1-via-t", "display": "completion of the proof of Theorem 15.1 via Φ_t", "status": "exact", "cluster": "deninger", "chunk": "deninger_s30", "kind": "method", "genre": "original", "note": "Completion of Theorem 15.1's proof: Φ_t(x,τ_0) is defined via the unique continuous embedding φ_{t,x,τ_0}: E_0 ↪ C^b extended to Ê^{sep}_0 = K̂^b (unique up to G_∞-conjugation by (200)); checked to be inverse to Ψ_t; alternative via E^{perf}_0 avoids distinguishing x = 0."}, {"id": "proposition-15-2-aut-o-f-p-equivariance-of-t", "display": "Proposition 15.2: Γ × Aut(o) × ⟨F_p⟩-equivariance of Ψ_t", "status": "exact", "cluster": "deninger", "chunk": "deninger_s30", "kind": "result", "genre": "original", "note": "Proposition 15.2: the bijections Ψ_t are Γ × Aut(o) × ⟨F_p⟩-equivariant, with Ψ_t∘γ = Ψ_{γ(t)} for γ ∈ Γ in (208); hence the induced bijection Ψ = Ψ_t/Γ: Hom_cont(ô^b_K,o^b)/G ≅ H_{κ_0}(o^b)/o^×_{K_0} in (209) is independent of t."}, {"id": "quotients-by-f-q-and-f-p-actions", "display": "quotients by F_q and F_p actions", "status": "exact", "cluster": "deninger", "chunk": "deninger_s30", "kind": "claim", "genre": "original", "note": "Remark: dividing out F_q resp. F_p in (209) gives Hom_cont(ô^b_K,o^b)/(G × ⟨F_q⟩) ≅ ∐_{τ_0} m^b_{τ_0}/K^×_0 in (210), and with τ_0: κ_0 ↪ k, Hom_cont(ô^b_K,o^b)/(G × ⟨F_p⟩) ←~ m^b_{τ_0}/K^×_0 in (211)."}, {"id": "example-15-3-the-cyclotomic-case-k-0-q-p", "display": "Example 15.3: the cyclotomic case K_0 = Q_p", "status": "exact", "cluster": "deninger", "chunk": "deninger_s30", "kind": "result", "genre": "original", "note": "Example 15.3: for K_0 = Q_p, φ(X) = (1+X)^p − 1, the Z_p-equivariant bijection α: m^b ≅ D^b := 1 + m^b sends the formal Z_p-module m^b to the 1-units; χ is the cyclotomic character; Ψ̃_ε: Hom_cont(o^b_p,o^b)/G_∞ ≅ D^b and Ψ̃: Hom_cont(o^b_p,o^b)/G ≅ D^b/Z^×_p in (212); dividing by F^{Z}_p gives (213)."}, {"id": "which-elements-correspond-to-automorphisms-of-c-", "display": "which elements correspond to automorphisms of C^b_p", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s30", "kind": "question", "genre": "original", "note": "Remark on (215): for o = o_p, End_cont(o^b_p)/(G × ⟨F_p⟩) ≅ D^b/Q^×_p, restricting to End_cont(C^b_p)/(G × ⟨F_p⟩) ≅ (D^b\\{0})/Q^×_p; by [KT18] there are continuous embeddings C^b_p ↪ C^b_p which are not isomorphisms; the author does not know which elements correspond to automorphisms."}, {"id": "ramified-witt-vectors-primitive-elements-and-k-0", "display": "ramified Witt vectors, primitive elements and K_0-untilts", "status": "exact", "cluster": "deninger", "chunk": "deninger_s30", "kind": "definition", "genre": "original", "note": "Ramified Witt vectors W_{o_{K_0}}(B) = W_p(B) ⊗_{W(κ_0)} o_{K_0}; primitive elements ξ of degree one; |Y_{τ_0}|^{deg=1} is the set of principal prime ideals (ξ); bijection with equivalence classes of K_0-untilts (C,ι) of C^b_{τ_0} via C = (W_{o_{K_0}}(o^b_{τ_0})/p)[π̄_0^{-1}], from [FF18, Ch. II, 3]."}, {"id": "theorem-15-4-canonical-bijection-h-to-primitive-", "display": "Theorem 15.4: canonical bijection h to primitive degree-one ideals", "status": "exact", "cluster": "deninger", "chunk": "deninger_s31", "kind": "result", "genre": "original", "note": "Theorem 15.4: the canonical bijection h: Hom_{cont,inj}(ô^b_K,o^b)/G ≅ ∐_{τ_0 ∈ Hom(κ_0,k)} |Y_{τ_0}|^{deg=1} in (216), sending φG to the ideal generated by W_{o_{K_0}}(φ)(ker θ_{K̂}); proof factors h = Λ∘Ψ as in (218), using that y_{t^b} = [t^b]_φ/[(t^b)^{1/q}]_φ generates ker θ_{K̂} ([Sch17, Prop 2.1.19, Lemma 1.4.19])."}, {"id": "corollary-15-5-quotient-by-frobenius-actions", "display": "Corollary 15.5: quotient by Frobenius actions", "status": "exact", "cluster": "deninger", "chunk": "deninger_s31", "kind": "result", "genre": "original", "note": "Corollary 15.5: for any τ_0: κ_0 → k, h induces an Aut(o)-equivariant bijection Hom_{cont,inj}(ô^b_K,o^b)/(G × ⟨F_p⟩) ≅ |Y_{τ_0}|^{deg=1}/⟨F_q⟩, using the F_q-equivariance of Λ in (217) and (211)."}, {"id": "the-q-p-example-with-explicit-generator-u-1-u-1-", "display": "the Q_p example with explicit generator ([u]−1)/([u^{1/p}]−1)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s31", "kind": "result", "genre": "original", "note": "Example (K_0 = Q_p): h: Hom_{cont,inj}(o^b_p,o^b)/G ≅ |Y|^{deg=1} equals Ψ̃ followed by Λ̃ with Λ̃(u^{Z^×_p}) = ([u]−1)/([u^{1/p}]−1) = 1 + [u^{1/p}] + ... + [u^{(p−1)/p}]; the untilt is C = (W_p(o^b)/(W_p(φ)(Ker θ_{C_p})))[p^{-1}]."}, {"id": "extension-of-h-to-non-injective-maps-via-general", "display": "extension of h to non-injective maps via generalized untilts", "status": "exact", "cluster": "deninger", "chunk": "deninger_s31", "kind": "claim", "genre": "original", "note": "Remark: h is only defined on injective φ; it extends to all of Hom_cont(ô^b_K,o^b)/G by generalizing untilts to pairs (C,ι) with C a perfectoid field with an o_{K_0}-algebra structure; char p untilts correspond to non-injective φ."}, {"id": "theorem-15-6-1-y-hom-cont-o-b-k-o-b-with-generic", "display": "Theorem 15.6(1): ◇Y = Hom_cont(ô^b_K,o^b) with generic and special fibres", "status": "exact", "cluster": "deninger", "chunk": "deninger_s31", "kind": "result", "genre": "original", "note": "Theorem 15.6 (1): the natural G × Aut(o) × ⟨F_p⟩-equivariant identification ◇Y = Hom_cont(ô^b_K,o^b) via (x,y,P̂_y) ↦ P̂^b_y; the generic fibre ◇Y_η = Hom_{cont,inj}(ô^b_K,o^b) and the special fibre ◇Y_s = Hom(κ,k); non-injectivity violates the non-vanishing condition via u−1 for 1 ≠ u ∈ lim← 1+m_K."}, {"id": "theorem-15-6-2-4-the-quotient-bijections-and-h", "display": "Theorem 15.6(2–4): the quotient bijections Ψ and h", "status": "exact", "cluster": "deninger", "chunk": "deninger_s31", "kind": "result", "genre": "original", "note": "Theorem 15.6 (2)–(4): Ψ_t: ◇Y/G_∞ ≅ ∐_{τ_0} m^b_{τ_0} in (221); dividing by Γ, Ψ: ◇Y_0 ≅ ∐_{τ_0} m^b_{τ_0}/o^×_{K_0} in (222), with fibres (223)–(224); h gives ◇Y_{0η_0} ≅ ∐_{τ_0} |Y_{τ_0}|^{deg=1} in (225)."}, {"id": "theorem-15-6-5-quotient-bijection-with-frobenius", "display": "Theorem 15.6(5): quotient bijection with Frobenius-equivalence classes of untilts", "status": "exact", "cluster": "deninger", "chunk": "deninger_s32", "kind": "result", "genre": "original", "note": "Theorem 15.6 (5): h induces h: ◇Y_{0η_0}/⟨F_p⟩ ≅ |Y_{τ_0}|^{deg=1}/⟨F_q⟩ in (226); the right side is the Frobenius-equivalence classes of untilts of C^b_{τ_0}."}, {"id": "theorem-15-6-6-the-only-finite-f-p-orbit-on-y-0-", "display": "Theorem 15.6(6): the only finite F_p-orbit on ◇Y_0 is ◇Y_{0s_0}", "status": "exact", "cluster": "deninger", "chunk": "deninger_s32", "kind": "result", "genre": "original", "note": "Theorem 15.6 (6): the only periodic (finite) orbit of the F_p-action on ◇Y_0 is ◇Y_{0s_0}, of order log_p N(π_0) = r for q = p^r; proof: F_q acts by Lubin–Tate multiplication by π_0, and F^n_q(x o^×_{K_0}) = x o^×_{K_0} would force π^n_0 ∈ o^×_{K_0}, a contradiction."}, {"id": "why-the-bijection-h-is-remarkable", "display": "why the bijection h is remarkable", "status": "exact", "cluster": "deninger", "chunk": "deninger_s32", "kind": "claim", "genre": "original", "note": "Author's remark: h is remarkable because (i) ◇Y_{0η_0} has a purely characteristic-zero definition (completion at p of a global construction), and (ii) A_inf(X) appears as a ring of functions on both sides, but valued in C_{τ_0} on the left vs the untilts of C^b_{τ_0}, which may not even be isomorphic to C_{τ_0}, on the right."}, {"id": "proposition-15-7-explicit-formula-for-e-a-inf-x-", "display": "Proposition 15.7: explicit formula for e: A_inf(X) → C(◇Y, o)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s32", "kind": "result", "genre": "original", "note": "Proposition 15.7: under ◇Y = Hom_cont(ô^b_K,o^b) the map e: A_inf(X) = W_p(ô^b_K) → C(◇Y,o) is e(f)(φ) = (θ∘W_p(φ))(f) in (228); proof uses χ ↔ χ^b from Proposition 14.14 and W_p(χ) = θ∘W_p(χ^b)."}, {"id": "proposition-15-8-y-0-for-spec-z-p-is-the-fixed-p", "display": "Proposition 15.8: Y̌_0 for spec Z_p is the fixed point plus the identity orbit", "status": "exact", "cluster": "deninger", "chunk": "deninger_s32", "kind": "result", "genre": "original", "note": "Proposition 15.8: for X_0 = spec Z_p and o = o_p, Y̌_0 ⊂ ◇Y_0 consists of the F_p-fixed point s_0 = (o^b_p → F̄_p → o^b_p)G and the infinite F^{Z}_p-orbit of η_0 = (id_{o^b_p})G; a point φ is in Y̌ iff the associated χ factors over pr_i, i.e. χ(ε^{p^i}) = 1."}, {"id": "the-program-number-theory-knot-theory-analogies-", "display": "the program: number theory–knot theory analogies and the dynamical refinement", "status": "exact", "cluster": "deninger", "chunk": "deninger_s33", "kind": "claim", "genre": "original", "note": "§1: sketches analogies between number theory and knot theory (Manin, Mazur [Maz], Mumford; developed by Kapranov, Morishita, Reznikov, Sikora), then a more structured analogy with knots from closed orbits of an R-dynamical system, and the author's construction realizing some aspects but not all."}, {"id": "spec-r-the-zariski-topology-numbers-as-functions", "display": "spec R, the Zariski topology, numbers as functions", "status": "exact", "cluster": "deninger", "chunk": "deninger_s33", "kind": "definition", "genre": "original", "note": "§2: spec R with the Zariski topology; 'numbers are functions' — f ∈ Z takes values f((p)) ∈ F_p and f((0)) ∈ Q; functoriality via ring homomorphisms inducing continuous maps spec R_2 → spec R_1."}, {"id": "the-etale-topology-with-etale-maps-as-open-sets", "display": "the étale topology with étale maps as open sets", "status": "exact", "cluster": "deninger", "chunk": "deninger_s33", "kind": "definition", "genre": "original", "note": "The étale topology: étale maps as 'open sets', so étale maps are locally invertible; motivated by x ↦ x² with local inverse √x near x = 1; spec L → spec K étale iff L/K finite separable; spec o_L → spec o_K étale iff unramified."}, {"id": "1-spec-f-p-z-as-an-analogue-of-1-s1-z", "display": "π̂_1(spec F_p) = Ẑ as an analogue of π_1(S¹) = Z", "status": "exact", "cluster": "deninger", "chunk": "deninger_s33", "kind": "claim", "genre": "original", "note": "π̂_1(spec F_p) = Aut(F̄_p) = Ẑ in (1), the procyclic group generated by Frobenius x ↦ x^p, as an analogue of π_1(S¹) = Z in (2); higher étale homotopy groups of spec F_p vanish, so it is a K(Ẑ,1) like S¹ is a K(Z,1)."}, {"id": "spec-z-has-etale-cohomological-dimension-3-and-t", "display": "spec Z has étale cohomological dimension 3 and the compactification spec̄ Z", "status": "exact", "cluster": "deninger", "chunk": "deninger_s33", "kind": "claim", "genre": "original", "note": "Heuristics: spec Z has Zariski dimension 1 so étale cohomological dimension should be 2·1+1 = 3 (proof via class field theory in [Maz73]); spec Z is not compact; the compactification spec̄ Z = spec Z ∪ {∞} adds the archimedean absolute value."}, {"id": "spec-z-resembles-s3-the-prime-p-as-a-knot-k-p", "display": "spec̄ Z resembles S³; the prime (p) as a knot K_p", "status": "exact", "cluster": "deninger", "chunk": "deninger_s33", "kind": "claim", "genre": "original", "note": "Artin–Verdier extended the étale topology to spec̄ Z; by Minkowski π̂_1(spec Z) = 1 hence π̂_1(spec̄ Z) = 1; spec̄ Z resembles a closed simply connected 3-manifold, i.e. S³; the embedding K_p: spec F_p ↪ spec̄ Z is viewed as a knot (observation first made by Mumford)."}, {"id": "knot-complement-vs-spec-z-k-p-abelianized-fundam", "display": "knot complement vs spec Z \\ K_p abelianized fundamental groups", "status": "exact", "cluster": "deninger", "chunk": "deninger_s34", "kind": "claim", "genre": "original", "note": "π^ab_1(S³\\K) ≅ Z for a knot complement, vs π̂^ab_1(spec Z \\ K_p) = Gal(Q(μ_{p^∞})/Q) = Ẑ^×_p (by Kronecker, the maximal abelian extension unramified away from p)."}, {"id": "alexander-polynomial-vs-iwasawa-zeta-function", "display": "Alexander polynomial vs Iwasawa zeta function", "status": "exact", "cluster": "deninger", "chunk": "deninger_s34", "kind": "claim", "genre": "original", "note": "The Alexander polynomial is the characteristic polynomial of a generator of Z acting on the homology of the Z-covering; correspondingly the action of Ẑ^×_p on the abelianized Galois group of the maximal abelian outside-p extension of Q(μ_{p^∞}) gives the Iwasawa zeta function; the knot analogy was observed by Mazur after Iwasawa's work."}, {"id": "mod-2-linking-numbers-vs-quadratic-reciprocity", "display": "mod 2 linking numbers vs quadratic reciprocity", "status": "exact", "cluster": "deninger", "chunk": "deninger_s34", "kind": "claim", "genre": "original", "note": "Mod 2 linking number l(K,L) = l(L,K) in Z/2 in (3); for odd p ≠ l with one ≡ 1 mod 4, Gauss reciprocity (p/l) = (l/p) in (4); viewing (p/l) as an analogue of (−1)^{l(K,L)}, a proof of (3) translates to a proof of (4)."}, {"id": "kapranov-smirnov-the-reciprocity-asymmetry-and-g", "display": "Kapranov–Smirnov: the reciprocity asymmetry and general 3-manifolds", "status": "exact", "cluster": "deninger", "chunk": "deninger_s34", "kind": "claim", "genre": "original", "note": "Kapranov–Smirnov [KS, §3]: if p, l ≢ 1 mod 4, then (p/l) = −(l/p); primes p ≢ 1 mod 4 should correspond to knots not homologous to zero; S³ is an oversimplification since all its knots are null-homologous; [KS] restores the analogy with general 3-manifolds M³."}, {"id": "redei-symbols-and-higher-milnor-invariants-as-bo", "display": "Rédei symbols and higher Milnor invariants as Borromean linking", "status": "exact", "cluster": "deninger", "chunk": "deninger_s34", "kind": "claim", "genre": "original", "note": "Rédei's 1938 symbol (p,l,q) for p,l,q ≡ 1 mod 4 with trivial quadratic symbols; Morishita interpreted its non-triviality as Borromean linking (e.g. 5,41,61); higher Milnor invariants for n-tuples of knots and of primes [Mor02]; relation to Massey products [Mor04]; application to class field towers [AC22]; overview in [Mor12] (arithmetic topology)."}, {"id": "the-product-formula-vs-the-divisor-of-a-meromorp", "display": "the product formula vs the divisor of a meromorphic function", "status": "exact", "cluster": "deninger", "chunk": "deninger_s35", "kind": "claim", "genre": "original", "note": "§3: the product formula ∏_{p≤∞} |f|_p = 1 gives Σ_{p≠∞} ord_p f · log p − log|f|_∞ = 0 in (5), compared with Σ_{x∈X} ord_x f = 0 in (6) for a meromorphic function on a Riemann surface X; the log p are Q-linearly independent transcendental numbers."}, {"id": "foliated-dynamical-systems-x-f-t", "display": "foliated dynamical systems (X̄,F,φ^t)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s35", "kind": "definition", "genre": "original", "note": "Triples (X̄,F,φ^t): closed smooth 3-manifold with 1-codimensional foliation F by Riemann surfaces and a flow mapping leaves to leaves; non-degenerate: finitely many fixed points, finitely many closed orbits of length ≤ C; fixed points lie in finitely many compact leaves; X is the complement of the compact leaves (Kopei [Kop06])."}, {"id": "kopei-s-formula-7-for-leafwise-holomorphic-funct", "display": "Kopei's formula (7) for leafwise holomorphic functions", "status": "exact", "cluster": "deninger", "chunk": "deninger_s35", "kind": "result", "genre": "original", "note": "Kopei's formula (7): Σ_γ ord_γ f · l(γ) − Σ_x (1/2πi) ∫_{∂U_ε(K_x)} f^{−1} d_F f ∧ ω_φ = 0, obtained by Stokes' theorem on X̄ minus tubular neighborhoods of the periodic orbits and ε-neighborhoods of the compact leaves; ord_γ f is independent of the leaf and point."}, {"id": "primes-as-periodic-orbits-log-p-l-archimedean-pl", "display": "primes as periodic orbits: log p ↔ l(γ), archimedean places as fixed points", "status": "exact", "cluster": "deninger", "chunk": "deninger_s35", "kind": "claim", "genre": "original", "note": "Comparing (5) and (7): primes p correspond to periodic orbits γ with log p ↔ l(γ); the archimedean absolute value corresponds to a fixed point x; for number fields K, prime ideals p ↔ γ with log Np ↔ l(γ) and archimedean absolute values ↔ fixed points."}, {"id": "does-a-dynamical-system-with-as-a-ruelle-zeta-fu", "display": "does a dynamical system with ζ as a Ruelle zeta function exist", "status": "heuristic", "cluster": "deninger", "chunk": "deninger_s35", "kind": "question", "genre": "original", "note": "If a bijection p ↔ γ with log p = l(γ) existed, the Riemann zeta would be the Ruelle zeta ζ(s) = ∏_γ (1 − e^{−sl(γ)})^{−1} for Re s > 1; the question whether a natural dynamical system with this property exists is quite old."}, {"id": "periodic-orbits-define-knots-refining-the-primes", "display": "periodic orbits define knots, refining the primes-as-knots analogy", "status": "exact", "cluster": "deninger", "chunk": "deninger_s35", "kind": "claim", "genre": "original", "note": "Each periodic orbit γ comes with embeddings R/l(γ)Z ↪ X, isotopic for different choices of x ∈ γ, hence defining the same knot in X̄; the primes-as-periodic-orbits analogy refines the primes-as-knots analogy."}, {"id": "dynamical-analogues-of-hilbert-reciprocity-and-l", "display": "dynamical analogues of Hilbert reciprocity and Lichtenbaum's conjectures", "status": "exact", "cluster": "deninger", "chunk": "deninger_s35", "kind": "claim", "genre": "original", "note": "Hilbert reciprocity has a dynamical analogue [KMNT21]; Lichtenbaum's conjectures on Hasse–Weil zeta functions translate almost verbally to the dynamical context and can be proved under conditions [Den08], [Den06], using Álvarez-Lopez–Kordyukov and the Cheeger–Müller theorem."}, {"id": "the-explicit-formulas-of-analytic-number-theory-", "display": "the explicit formulas of analytic number theory as a distribution identity", "status": "exact", "cluster": "deninger", "chunk": "deninger_s36", "kind": "claim", "genre": "original", "note": "The explicit formulas of analytic number theory: 1 − Σ_ρ e^{tρ} + e^t = Σ_p log p Σ_{k≥1} δ_{k log p} + (1 − e^{−2t})^{−1} in D'(R^{>0}) in (8); ρ runs over the zeros of ζ(s) in 0 < Re s < 1; evaluated on a test function gives Φ(0) − Σ_ρ Φ(ρ) + Φ(1) = ... ."}, {"id": "the-dynamical-transversal-index-formula-9", "display": "the dynamical transversal index formula (9)", "status": "exact", "cluster": "deninger", "chunk": "deninger_s36", "kind":
