# c12 operator-audit probes — written 2026-10-03 from chunk prose, BEFORE any extraction.
# Why/how probes over the argumentative content: why verdicts were reached, how
# mechanisms work, what evidence supports what, how candidates relate.
probes:
- id: P1
  probe: "Why does the audit give Connes's 1999 adele-class candidate the split verdict 'LIVE as framework / KILLED as proof'?"
  answer_prose: "It is live as the deepest existing reformulation and the gold-standard template any future operator must reproduce, but killed as a proof because the semilocal trace formula is exactly derived while the full adelic derivation is conditional on the thing sought: Weil proved RH is equivalent to positivity of W, so Connes rehouses the equivalence in a noncommutative space without deriving the positivity from counting. The missing piece (Weil positivity) is exactly RH — a D10 move at the highest level of sophistication."
- id: P2
  probe: "In candidate A, why are the zeros an 'absorption spectrum' rather than eigenvalues, and what two things does that mechanism explain?"
  answer_prose: "The zeros appear as missing lines cut out of a continuum rather than discrete eigenvalues of the scaling-flow generator; off-critical zeros would be resonances. This absorption picture explains the minus sign in the explicit formula. Its guardrail is D12: 'deleting' lines from a continuum requires the continuum regularization to be audited, though Connes is explicit about it."
- id: P3
  probe: "Why is candidate B (zeta spectral triples) the top computational target even though its eigenvalue-to-zero link is only numerical?"
  answer_prose: "It is the only candidate attempting the literal Hilbert-Polya statement with self-adjointness proved (D_log^{(lambda,N)} self-adjoint via Caratheodory-Fejer/Toeplitz theory), built forward from prime Euler products alone, numerically matching zeros 'with striking accuracy,' and fully computable as finite matrices from primes at p <= x. But self-adjointness buys 'spectrum is real,' not 'spectrum is the zeros' — the identification remains conjectural, so the assigned work is: reimplement from primes alone, verify spectral coincidence, audit the perturbation for zero-fitting, and quantify convergence error bars."
- id: P4
  probe: "Why is the D12 guardrail on candidate B — auditing the rank-one perturbation direction as prime-derived versus zero-fitted — THE question for replication?"
  answer_prose: "Because the perturbation vector is taken from small eigenvectors of the Weil quadratic form restricted to test functions of support <= S, which is principled (prime-derived), but the claimed spectral coincidence could equally be produced by tuning the perturbation toward the zeros themselves. Since the eigenvalue-to-zero identification is numerical, not derived, a zero-fitted perturbation would make B an inverse tautology like candidate H; only a prime-derived perturbation passes the forward-direction test (primes in, spectrum out)."
- id: P5
  probe: "Why is Bost-Connes killed as a zero-operator yet kept alive as 'the canonical zeta-from-counting machine'?"
  answer_prose: "It fails at the gate because its spectrum is {log n} with H|n> = (log n)|n> — there are no zeros in the machine, no eigenvalues and no resonances. But it genuinely derives Z(beta) = zeta(beta) from counting: Gibbs weights n^{-beta}/zeta(beta) over integers, with the pole at beta = 1 appearing as the KMS phase transition. Its positivity is real thermodynamic positivity, but it is unrelated to RH. Keeping it sharpens the real question: what counting-born machine gets the zeros rather than the pole?"
- id: P6
  probe: "Why does candidate E (Ruelle transfer operator) get no independent evaluation, and what is the type-error firewall behind its verdict?"
  answer_prose: "It reduces to D: transfer operators like Mayer's L_s exist where a hyperbolic dynamical system exists, and 'the dynamical system with prime periodic orbits' IS Deninger's missing space. The type error is equivocating between 'prime orbit' (primitive periodic orbit) and 'rational prime' — sliding between the senses. Its verdict is killed as an independent candidate, and the Selberg/Mayer case stands instead as the control: the one world where the full dream works, already closed as the D10d function-field template."
- id: P7
  probe: "Why is genuine quantum-mechanical positivity not enough to save Sierra's xp regularizations?"
  answer_prose: "The positivity (Landau levels) is real and independent, but it counts Landau states, which reproduce only the smooth counting function N-bar(E) — the same smooth-count ceiling as the 11a Berry-Keating formulation. The zeros are never in the spectrum; higher Landau levels are only 'suggested' for the fluctuations, heuristically. And the 2025 Rindler/Majorana zero-eigenvalue variants tune the quantization condition to zeta — a D10-flavored move. The Landau-limit unification of Berry-Keating and Connes regularizations is elegant physics, but background only."
- id: P8
  probe: "Why is Wu-Sprung called the purest D10 violation on the list, and how did its kill become self-explaining?"
  answer_prose: "The potential V is reconstructed numerically from the first 500 zeros, so the zeros are eigenvalues by construction — the zeros are the input, making it a textbook 'answer inserted by hand' case. As an inverse problem it always succeeds and teaches nothing. The kill became self-explaining when Jaksch (2025) showed the famous fractal dimension D~1.5 of the potential is an artifact of the Riemann-von Mangoldt approximation error — the 'fractal' was error signal. It stands as the canonical warning: any 'operator from zeros' fit must pass the forward-direction test (primes in, spectrum out)."
- id: P9
  probe: "Why is Deninger's program verdict 'CONJECTURAL-ONLY as theory' yet still granted a bounded computation — and with what labeling requirement?"
  answer_prose: "It is conjectural-only because the foliated space does not exist — the space is the whole problem — so the explicit formula as Lefschetz trace formula, the conjectural eigenvalues of Theta, and the would-be Hodge positivity on the conjectural cohomology are all aspiration, with positivity imported from Weil's function-field template (D10-shaped) rather than derived from counting. The only derived piece is the 2024 theorem proving the regularized-determinant formula in the dynamical world, which is the template, not Spec Z. A bounded heuristic is allowed — prototype prime-orbit flow plus numerical Ruelle zeta — but it must be labeled model-of-template from the start and never presented as evidence about zeta."
- id: P10
  probe: "Why is the Selberg zeta via the Mayer transfer operator placed on the shortlist as a control rather than a candidate, and what does it establish?"
  answer_prose: "It is not a candidate for RH because it belongs to a different world — the hyperbolic world where a genuine dynamical system exists. There the full Hilbert-Polya dream actually works: the trace formula is derived, the zeros are genuine Laplacian eigenvalues, and positivity is geometric. Its role is as an existence proof that the dream is coherent in principle, and as the standard against which literature candidates are judged; the audit notes it as already closed as the D10d function-field template."
