he-euler-product-s-p-1-p-s-1-for-re-s-1": {"display": "(I) the Euler product \u03b6(s) = \u220f_p (1-p^{-s})^{-1} for Re(s) > 1", "status": "exact", "facets": [{"chunk": "foreign_pnt_p1", "cid": "c3", "label": "(I) the Euler product \u03b6(s) = \u220f_p (1-p^{-s})^{-1} for Re(s) > 1", "kind": "claim", "status": "exact", "genre": "original", "note": "For Re(s) > 1, \u03b6(s) = \u220f_p (1-p^{-s})^{-1}, proved from unique factorization together with absolute convergence of \u03b6(s); hence \u03b6(s) \u2260 0 for Re(s) > 1.", "subjects": []}], "status_note": null, "chunks": ["foreign_pnt_p1"], "killed_facets": 0}, "foreign:pnt:ii-s-1-extends-holomorphically-to-re-s-0": {"display": "(II) \u03b6(s) - 1 extends holomorphically to Re(s) > 0", "status": "exact", "facets": [{"chunk": "foreign_pnt_p1", "cid": "c4", "label": "(II) \u03b6(s) - 1 extends holomorphically to Re(s) > 0", "kind": "result", "status": "exact", "genre": "original", "note": "\u03b6(s)-1 extends holomorphically to Re(s) > 0 via the series \u03a3_n \u222b_n^{n+1}(n^{-s}-x^{-s})dx, absolutely convergent for Re(s) > 0 by the mean-value estimate |\u222b_n^{n+1}(n^{-s}-x^{-s})dx| \u2264 |s| n^{-Re(s)-1}; called 'nearly trivial' in the historical remarks.", "subjects": []}], "status_note": null, "chunks": ["foreign_pnt_p1"], "killed_facets": 0}, "foreign:pnt:iii-x-o-x-via-the-chebyshev-binomial-coefficient-est": {"display": "(III) \u03c8(x) = O(x), via the Chebyshev binomial-coefficient estimate", "status": "exact", "facets": [{"chunk": "foreign_pnt_p1", "cid": "c5", "label": "(III) \u03c8(x) = O(x), via the Chebyshev binomial-coefficient estimate", "kind": "claim", "status": "exact", "genre": "original", "note": "From the binomial estimate giving \u03c8(2n)-\u03c8(n) = O(n), and \u03c8 changing by O(log x) under O(1) changes of x: \u03c8(x)-\u03c8(x/2) < Cx for any C > log 2 and all x \u2265 x_0(C); summing over x, x/2, ..., x/2^r gives \u03c8(x) < 2Cx + O(1).", "subjects": []}], "status_note": null, "chunks": ["foreign_pnt_p1"], "killed_facets": 0}, "foreign:pnt:iv-s-0-and-s-1-s-1-is-holomorphic-for-re-s-1": {"display": "(IV) \u03b6(s) \u2260 0 and \u03c6(s) - 1/(s-1) is holomorphic for Re(s) \u2265 1", "status": "exact", "facets": [{"chunk": "foreign_pnt_p1", "cid": "c6", "label": "(IV) \u03b6(s) \u2260 0 and \u03c6(s) - 1/(s-1) is holomorphic for Re(s) \u2265 1", "kind": "result", "status": "exact", "genre": "original", "note": "For Re(s) > 1, -\u03b6'/\u03b6(s) = \u03c6(s) + \u03a3_p (log p)/(p^s(p^s-1)) with tail convergent for Re(s) > 1/2; if \u03b6 has a zero of order \u03bc at 1+i\u03c4 and \u03bd at 1+2i\u03c4 then lim \u03b5\u03c6(1+\u03b5) = 1, lim \u03b5\u03c6(1+\u03b5\u00b1i\u03c4) = -\u03bc, -\u03bd, and 3+4cos\u03b8+cos2\u03b8 \u2265 0 gives 6-8\u03bc-2\u03bd \u2265 0, so \u03bc = 0: no zero on Re(s) = 1 and \u03c6(s)-1/(s-1) holomorphic for Re(s) \u2265 1. Attribution: proof in essence due to Hadamard, refined by de la Vall\u00e9e Poussin and Mertens.", "subjects": []}], "status_note": null, "chunks": ["foreign_pnt_p1"], "killed_facets": 0}, "foreign:pnt:newman-s-analytic-theorem-laplace-transform-extends-": {"display": "Newman's analytic theorem: Laplace transform extends holomorphically to Re(z) \u2265 0 implies \u222b_0^\u221e f(t) dt exists", "status": "exact", "facets": [{"chunk": "foreign_pnt_p1", "cid": "c7", "label": "Newman's analytic theorem: Laplace transform extends holomorphically to Re(z) \u2265 0 implies \u222b_0^\u221e f(t) dt exists", "kind": "method", "status": "exact", "genre": "original", "note": "Let f(t) (t \u2265 0) be bounded and locally integrable, with Laplace transform g(z) = \u222b_0^\u221e f(t)e^{-zt}dt (Re(z) > 0) extending holomorphically to Re(z) \u2265 0; then \u222b_0^\u221e f(t)dt exists and equals g(0). Proved with g_T(z) = \u222b_0^T f(t)e^{-zt}dt and Cauchy's theorem on C = boundary of {|z| < R, Re(z) \u2265 -\u03b4} with weight e^{zT}(1+z^2/R^2)/z: the C+ contribution is bounded by B/R (B = max|f|), the g_T part on   Object.keys(COLORS).map(k=>`<span class="li"><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}</span>`).join('')
  + `<span class="li"><span class="dot" style="background:#ffd700"></span>verified crack</span>`+ `<span class="li"><span class="dot" style="background:#8a7a2a"></span>split_link</span>`+ `<span class="li hint">node size ∝ facet count</span>`;
(function(){
  const st = GRAPH.stats;
  const el = document.querySelector('#topbar .sub');
  el.textContent += ` · ${st.subjects} subjects · ${st.cross_edges} gold cross-sky links · ${GRAPH.loops.length} open loops · ${st.concepts} concepts`;
})();
document.getElementById('looplo').innerHTML = GRAPH.loops.map(l=>
  `<div class="loop"><b>${esc(l.chunk)}</b> — ${esc(l.label)}</div>`).join('');
setInterval(tick, 30);
draw();
</script>
</body>
</html>
