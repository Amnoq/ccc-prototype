probes:
- id: P1
  probe: "Figueiredo's recipe has four steps, but the derivations only claim analogues of steps 2-4. Why is step 1 missing, and what does that gap imply about what D1-D5 can and cannot prove?"
  answer_prose: "Step 1 is finding a positive geometric region, and the sieve has no known positive region — that gap stands throughout. So D1-D5 express the sieve's output in the shape of her steps 2-4 (observable read off geometry, zeros/factorizations from geometry) without a canonical form or positive region. Consequence: they are classical results in new clothes that prove the shape fits, not that her machinery transfers — no new consequence for prime densities follows."
- id: P2
  probe: "How does the D1 proof turn the Chebyshev function psi(x) into a signed sum over faces of the sieve's incidence complex?"
  answer_prose: "floor(x/d) counts integers <= x divisible by d. Grouping by n, the inner sum over squarefree divisors d|n of (-1)^{omega(d)+1} log d equals -sum mu(d) log d = Lambda(n) by classical Mobius inversion; summing over n <= x gives psi(x). The signs (-1)^{|S|} are the face-dimension signs — the Euler-characteristic weighting of the complex (classically: mu(1,n) is the reduced Euler characteristic of the divisor lattice's order complex). Verified exact at x = 30, 100, 500."
- id: P3
  probe: "Why does the chunk claim Lehmer's prime-counting recursion was 'the link recursion all along' — what exact bijection makes the identification hold?"
  answer_prose: "Lehmer's phi(x,a) = phi(x,a-1) - phi(x/p_a, a-1) has the deletion and link of the complex as its two terms: the integers newly shared when territory p_a is added are exactly {p_a*m : m <= x/p_a unshared by the first a-1 territories}, in exact bijection with the cone S -> S union {p_a} over link({p_a}) = Delta_{floor(x/p_a)}. Verified: link-face counts match Delta_{floor(x/p_a)} face counts, and the integer bijection holds exactly."
- id: P4
  probe: "How is the sieve's D3 formulation an inversion of Figueiredo's 'hidden zeros' picture rather than a copy of it?"
  answer_prose: "Her binary geometries obey u_C + prod u_D^{n(C,D)} = 1 with the amplitude vanishing at special kinematics; the sieve's analogue is 1_{prime}(n) + 1_{shared}(n) = 1 with shared(n) = OR_{p<n}(p|n), and F(n) = prod_{p<n} dist(n, pZ) >= 0. The composites are the zero locus (F(n) = 0) and the primes are where the function lives — the background (composites), not the observable, is the zero locus. Labeled an analogy with no new prime information; its value is architectural, a prerequisite for asking whether her algebraic machinery can be ported."
- id: P5
  probe: "What role does the empty face play in the D1 sum, and how does the chunk connect it to the 'every prime relates back to zero' claim?"
  answer_prose: "The empty face (d = 1, log 1 = 0) contributes no weight yet anchors the whole alternating sum — it is the multiplicative identity structuring every term, described as the formal shadow of 'every prime relates back to zero' via its spanning circle."
- id: P6
  probe: "Why does the bare x -> infinity limit trivialize the incidence complex, and what replaces the bare complex as the limit object?"
  answer_prose: "As x -> infinity every finite set of primes eventually satisfies prod S <= x, so Delta_infinity is the infinite simplex on the primes — contractible, no topology; the growing Betti numbers of Delta_x are a filtration phenomenon, not a limit phenomenon. A positive-geometry analogue therefore cannot live in the bare complex — the geometry must be in the weights. The limit object is the weighted complex with x-independent face-weights w(S) = (-1)^{|S|+1} log(prod S)/prod S, for which sum_{prod S <= X} w(S) -> 1 as X -> infinity — an identity equivalent to the Prime Number Theorem psi(x) ~ x, verified numerically to 2*10^6 converging cleanly to 1."
- id: P7
  probe: "How do the zeros of zeta enter D4, and in what sense is the architecture 'complete in her shape' but inverted?"
  answer_prose: "The Dirichlet generating function of the face-weights is sum_S w(S)/prod S^{s-1} = -zeta'(s)/zeta(s)^2, verified numerically against zeta'/zeta^2 to ~4 digits at s = 1.01..1.20. The rate at which the face-sum S(X) -> 1 — the error in the sum — is governed by the zeros of zeta via the explicit formula. The architecture matches her shape: the observable (total weight 1, i.e. PNT) is read off the weighted complex (her step 3), and the zeros regulate the infinite sum (her step 4) — but inverted, because here the zeros are needed as regulators and deriving them from the geometry remains the open problem (beachhead #2)."
- id: P8
  probe: "The D4 weights are described as resonating with a canonical form but not being one. Why the failure, and what is the resulting sharpest question of the program?"
  answer_prose: "The weights are signed, alternating with face dimension — not positive — so they cannot be the residues of a canonical form of a positive region, though the alternation resonates with how canonical-form residues alternate across boundary strata. The gap stands as the single sharpest question of the program: is there a positive region whose canonical form has these weights as its stratum residues?"
- id: P9
  probe: "How does D5 translate Figueiredo's soft-limit splitting into sieve language, and what does iterating the operation recover?"
  answer_prose: "'Taking prime p_a soft' means removing its territory (stop sieving by p_a), and the unshared-count splits exactly as phi(x,a) = phi(x,a-1) - phi(x/p_a, a-1): the full count equals the count with p_a removed minus the removed stratum. The removed stratum phi(x/p_a, a-1) plays the role of her 'soft factor times lower-point amplitude' — the same kind of object at a smaller scale. Iterating the removal over all a recovers the full inclusion-exclusion, the face-sum of D1 — which is her 'all-order' in sieve language."
- id: P10
  probe: "The chunk calls one methodological principle 'the deepest such insight' of D1-D5. State it, and explain why the chunk insists D1-D5 are not copying her implementation."
  answer_prose: "The principle is: never put the answer in by hand — primality is never tested by a primality predicate; it emerges from the shared/unshared rule, and everything downstream is derived. The chunk insists we are not copying her implementation because the sieve was already doing splits before we knew her name for them: we take her generative insights on process (remove one generator, read the exact split, iterate to all orders), which are the sieve's native operations, rather than her algebraic machinery."
