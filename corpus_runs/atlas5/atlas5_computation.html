imed heights of Gourdon, Wedeniwski, and Franke et al., so their results are subsumed by this run."}], "chunks": ["comp_platttrudgian2021_p1"], "killed_facets": 0}}, "standalone": [{"id": "optimization-of-the-odlyzko-schonhage-algorithm-", "display": "Optimization of the Odlyzko-Schonhage algorithm that computes efficiently the Zeta function at large height on the critical line, together with an implementation of this technique", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p1", "kind": "method", "genre": "original", "note": "Abstract: the paper presents an optimization of the Odlyzko-Schonhage algorithm for efficient large-height zeta evaluation, implemented and used for the zero computations reported; interpolation bounds proved in Props 1-2 of section 2.3.1."}, {"id": "verification-of-the-riemann-hypothesis-on-all-th", "display": "Verification of the Riemann Hypothesis on all the first 10^13 non-trivial zeros", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p1", "kind": "result", "genre": "original", "note": "Abstract: first family of computations - RH verification on all first 10^13 non-trivial zeros; extends the previous record (Wedeniwski, 2.5 x 10^11 zeros) by a factor of 40."}, {"id": "verifying-the-riemann-hypothesis-at-very-large-h", "display": "Verifying the Riemann Hypothesis at very large height for different heights, while collecting statistics in these zones", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p1", "kind": "result", "genre": "original", "note": "Abstract: second family of computations - RH verification at very large heights for different heights, with statistics collected in these zones."}, {"id": "computation-of-two-billion-zeros-from-the-10-24-", "display": "Computation of two billion zeros from the 10^24-th zero of the Riemann Zeta function", (t)} zeta(1/2+it), real-valued; zeros of Z(t) are the imaginary parts of critical-line zeros", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p1", "kind": "definition", "genre": "original", "note": "Section 1.3: paper defines theta(t) (eq. 1) and Z(t) = e^{i theta(t)} zeta(1/2+it), states as a consequence of the functional equation that Z(t) is real-valued, and that its zeros are the imaginary parts of critical-line zeros."}, {"id": "s-t-1-pi-arg-zeta-1-2-it-by-continuous-variation", "display": "S(t) = (1/pi) arg zeta(1/2+it) by continuous variation; N(t) = number of zeros rho with 0 < Im(rho) < t; N(t) = 1 + theta(t)/pi + S(t) (eq. 3)", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p1", "kind": "definition", "genre": "original", "note": "Section 1.3: paper defines S(t) = (1/pi) arg zeta(1/2+it) by continuous variation and N(t) the zero-counting function, and states N(t) = 1 + theta(t)/pi + S(t) (eq. 3)."}, {"id": "s-t-o-log-t-unconditionally-n-t-t-2pi-log-t-2pi-", "display": "S(t) = O(log t) unconditionally; N(t) = (t/2pi) log(t/2pi) - t/2pi + O(log t); hence gamma_n ~ 2 pi n / log n", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p1", "kind": "claim", "genre": "original", "note": "Section 1.3: paper states as known (unconditional) that S(t) = O(log t) and the N(t) asymptotic with gamma_n ~ 2 pi n / log n; all results in this section classical, cited to [31] or [7], not proved here."}, {"id": "mean-value-of-s-t-is-zero-mean-value-of-s-t-2-is", "display": "Mean value of S(t) is zero; mean value of S(t)^2 is (1/2pi^2) log log T; S(t) is small and very slowly increasing on average", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p1", "kind": "claim", "genre": "original", "note": "Section 1.3: paper states mean of S(t) is zero and mean of S(t)^2 is (1/2pi^2) log log T as known results; motivates statistics on S(t) because unexpected behavior of zeta(1/2+it) is likely when S(t) is large."}, {"id": "validity-of-the-rh-verification-until-the-10-13-", "display": "Validity of the RH verification until the 10^13-th zero as a 'proof' (stated as the object of section 3.3.1)", "status": "heuristic", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p1", "kind": "question", "genre": "original", "note": "Section 1.1: paper defers discussion of the validity of its RH verification until the 10^13-th zero to section 3.3.1, leaving it open within this chunk."}, {"id": "rh-verified-until-the-10-13-th-zero-no-exception", "display": "RH verified until the 10^13-th zero (no exception found)", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "result", "genre": "original", "note": "Paper reports all zeros through the 10^13-th zero lie on Re(s)=1/2; no exception to RH found in the run."}, {"id": "rh-verification-by-counting-sign-changes-of-z-t-", "display": "RH verification by counting sign changes of Z(t) only", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "method", "genre": "original", "note": "Verifying RH needs only sign changes of Z(t), not precise abscissas; <1.2 evaluations/zero versus 5-6x more for abscissas; run took ~1.5 years of a single modern computer."}, {"id": "nth-gram-point-gn-theta-gn-n-pi-unique-solution-", "display": "nth Gram point gn: theta(gn)=n pi, unique solution >7", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "definition", "genre": "original", "note": "Definition stated in paper: gn (n >= -1) is the unique solution >7 of theta(gn)=n pi; theta monotonic for t >= 7; asymptotic gn ~ 2n pi / log n from (5)."}, {"id": "good-gram-point-1-n-z-gn-0-versus-bad-gram-point", "display": "good Gram point ((-1)^n Z(gn) > 0) versus bad Gram point", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "definition", "genre": "original", "note": "Definition stated in paper: gn good if (-1)^n Z(gn) > 0, bad otherwise."}, {"id": "gram-block-gn-gn-k-length-k-zero-pattern-notatio", "display": "Gram block [gn, gn+k), length k, zero-pattern notation a1...ak", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "definition", "genre": "original", "note": "Definition stated in paper: [gn, gn+k) with gn and gn+k good, intermediate points bad; length k; notation a1...ak counts zeros per Gram interval; no interval with >5 zeros found, so notation unambiguous."}, {"id": "regular-gram-block-exactly-k-zeros-patterns-21-1", "display": "regular Gram block (exactly k zeros); patterns 21...10, 01...12, 01...131...10", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "definition", "genre": "original", "note": "Definition stated in paper: regular Gram block contains exactly k zeros; admissible patterns 21...10, 01...12, 01...131...10 (1...1 = any string of 1s, possibly empty)."}, {"id": "gram-s-law-z-t-usually-changes-sign-in-each-gram", "display": "Gram's law: Z(t) usually changes sign in each Gram interval", "status": "heuristic", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "claim", "genre": "original", "note": "Empirical rule from Gram's computations [8]: Z(t) usually changes sign in each Gram interval; >70% at moderate height, >66% at larger height; known to fail infinitely often."}, {"id": "rosser-rule-gram-block-of-length-k-contains-at-l", "display": "Rosser rule: Gram block of length k contains at least k zeros", "status": "heuristic", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "claim", "genre": "original", "note": "Empirical rule: length-k Gram block contains at least k zeros; if true it would imply RH (hence exactly k zeros); known to fail infinitely often; first violation at n=13,999,825."}, {"id": "rosser-rule-violation-statistics-320-624-341-tot", "display": "Rosser-rule violation statistics: 320,624,341 total, ~32.06 per million, 225 types", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "result", "genre": "original", "note": "320,624,341 Rosser violations found (~32.06 per million zeros); 225 distinct types; most frequent 2L3 (77,146,526; 24.061%) and 2R3 (77,119,629; 24.053%); rare: 7R410 once at index 2,194,048,230,633, 2L011111114 twice; 17 types seen once, 11 twice."}, {"id": "violation-type-notation-kxa1-am-x-l-r-with-exces", "display": "violation type notation kXa1...am (X=L/R) with excess block", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "definition", "genre": "original", "note": "Notation kXa1...am (X=L/R), eq. (26): violation on length-k block, missing zeros left/right; a1...am is the smallest adjacent union of Gram blocks containing them; e.g. 3L04 denotes global pattern 04010; notation not fully unambiguous."}, {"id": "m-notation-for-overlapping-contiguous-rosser-vio", "display": "M-notation for overlapping/contiguous Rosser violations", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "definition", "genre": "original", "note": "M-notation for contiguous/overlapping violations: minimal contiguous Gram blocks containing all violations and missing zeros; e.g. M00500 at n=3,680,295,786,518 (two '00' violations, one interval holding pattern '5')."}, {"id": "turing-s-method-certify-regular-gram-points-usin", "display": "Turing's method: certify regular Gram points using Z(t) only", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "method", "genre": "original", "note": "Turing's method ([7] for full description) proves Gram points regular using only evaluations of Z(t), unlike Backlund's method which needs zeta evaluated off the critical line."}, {"id": "regular-gram-point-s-gn-0-equivalent-to-n-gn-n-1", "display": "regular Gram point: S(gn)=0, equivalent to N(gn)=n+1", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "definition", "genre": "original", "note": "N(T)=1+theta(T)/pi+S(T) with S(t)=(1/pi)arg zeta(1/2+it); von Mangoldt S(T)=O(log T); Littlewood integral of S = O(log T); regular Gram point: S(gn)=0, equivalent to N(gn)=n+1; regular implies good."}, {"id": "turing-s-quantitative-littlewood-estimate-2-s-gm", "display": "Turing's quantitative Littlewood estimate: -2 < S(gm) < 2 implies S(gm)=0", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "result", "genre": "original", "note": "Turing's quantitative Littlewood estimate: integral of S over [t1,t2] bounded by (2.30+0.128 log t2)/(2pi); yields bounds -2 < S(gm) < 2 for suitable k; S(gm) is an even integer by parity, hence S(gm)=0 and gm is regular."}, {"id": "heuristic-zero-locating-via-gram-blocks-and-z-mi", "display": "heuristic zero-locating via Gram blocks and |Z| minima search", "status": "heuristic", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "method", "genre": "original", "note": "Heuristic locator: sign of Z at Gram points gives Gram blocks; missing sign changes searched in statistically most frequent places; RH-conditional lemma ([7]): |Z(t)| has no relative minima between consecutive zeros, so a<b<c with same sign and |Z(b)| minimal implies >=2 zeros in (a,c); 1.193 evaluations/zero (1.174 through zero 2x10^9); nearly optimal."}, {"id": "particular-situations-5-zero-gram-interval-longe", "display": "particular situations: 5-zero Gram interval, longest block 13, merged violations, smallest delta_n", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "result", "genre": "original", "note": "Particular situations: one Gram interval with 5 zeros (index 3,680,295,786,520); longest Gram block length 13 (first length-11 at 50,366,441,415; 12 at 166,939,438,596; 13 at 1,114,119,412,264); three merged close violations M00500 (3,680,295,786,518), M002400 (4,345,960,047,912), M004200 (6,745,120,481,067); smallest normalized spacing delta_n ~ 0.00007025 at gamma_n=1034741742903.35376 (n=4,088,664,936,217), raw gap 0.00001709."}, {"id": "close-zero-pair-statistics-versus-gue-expectatio", "display": "close-zero pair statistics versus GUE expectation E(delta,N)", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "result", "genre": "original", "note": "GUE expectation E(delta,N)=(pi^2/9) N delta^3 + O(N delta^5) from [22 p.30]; N=10^13: E(0.0001)~10.96, found 13 pairs; E(0.0002)~87.73, found 86; for delta_n<0.0005 found 1240 versus E~1370.78, so the heuristic missed some pairs; 13 pairs with delta_n<0.0001 tabulated with error upper bounds."}, {"id": "normalized-spacing-delta-n-gamma-n-1-gamma-n-log", "display": "normalized spacing delta_n = (gamma_{n+1}-gamma_n) log(gamma_n/(2pi))/(2pi)", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "definition", "genre": "original", "note": "Definition stated in paper: delta_n = (gamma_{n+1}-gamma_n) * log(gamma_n/(2pi)) / (2pi); gamma_n is the abscissa of the nth zero."}, {"id": "gram-block-distribution-table-types-i-ii-iii-by-", "display": "Gram-block distribution table, types I/II/III by length", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "result", "genre": "original", "note": "Table of Gram-block counts between zero #10,002 and #10^13+1; types I (21...10), II (01...12), III (01...131...10) by length 1-13 (e.g. length 1: 6,495,700,874,143 type I; length 13: 122 type III); paper notes the statistics are not fully rigorous because Gram points were slightly perturbed when the sign of Z was undecidable."}, {"id": "largest-z-t-found-368-085-at-t-2381374874120-455", "display": "largest |Z(t)| found: ~368.085 at t=2381374874120.45508", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "result", "genre": "original", "note": "Largest |Z(t)|=|zeta(1/2+it)| found ~368.085 at t=2381374874120.45508; no special search was made, so larger values were probably missed."}, {"id": "computation-information-525-days-pentium-4-2-4-g", "display": "computation information: 525 days Pentium 4 2.4 GHz, distributed 2003", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "result", "genre": "original", "note": "525 days of a 2003 Pentium 4 2.4 GHz (220,000 zeros checked/sec; 256 MB); distributed April-Sept 2003 via spare machine time; two checks: Odlyzko-Schoenhage versus direct Riemann-Siegel spot comparisons, and a full relaunch with different parameters (extra ~1.5 years equivalent)."}, {"id": "two-billion-zeros-at-each-height-10-n-13-n-24-10", "display": "two billion zeros at each height 10^n, 13<=n<=24; 10^24 exceeds Odlyzko's 10^23", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "claim", "genre": "original", "note": "Second family: two billion zeros computed at each height 10^n for 13<=n<=24; largest height 10^24 exceeds Odlyzko's unpublished 50 billion zeros at 10^23."}, {"id": "large-height-approach-greengard-rokhlin-locate-t", "display": "large-height approach: Greengard-Rokhlin, locate then iterate to ~10^-9", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "method", "genre": "original", "note": "Greengard-Rokhlin algorithm for Z(t) at large height; zeros located as in 3.2 then iterated to ~10^-9 precision; ~7.5 evaluations/zero versus ~1.2 in the RH verification."}, {"id": "statistical-error-bound-for-double-precision-sum", "display": "statistical error bound for double-precision sums (security factor 10)", "status": "heuristic", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "method", "genre": "original", "note": "Double precision only (~15 digits): naive bound |E| <= sum |eps_k| k^-1/2 ~ 2k1^1/2 gives |E| < 0.73x10^-6 at k1 ~ 1.3x10^11 (10^24), too large; treating eps_k as independent uniform in [-eps,eps] gives typical |E| <= (sum eps_k^2)^1/2 ~ eps (log k1)^1/2 ~ 5x10^-12 with eps=10^-12; times security factor 10; same device as Odlyzko [22 sec. 4.6]; results 'thought to be accurate' rather than rigorously bounded."}, {"id": "computational-correctness-checks-spot-riemann-si", "display": "computational correctness checks (spot Riemann-Siegel, parameter relaunch, RH as check)", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "method", "genre": "original", "note": "Checks: after each Odlyzko-Schoenhage application one abscissa compared with direct Riemann-Siegel evaluation; some ranges relaunched with different parameters and twice-computed zeros compared; RH verification itself is a check since an evaluation error may produce RH violations (Odlyzko [22])."}, {"id": "montgomery-pair-correlation-conjecture-density-1", "display": "Montgomery pair correlation conjecture (density 1-(sin pi u / pi u)^2)", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "conjecture", "genre": "conjecture", "note": "Montgomery pair correlation conjecture, eq. (29): density of normalized spacings between not-necessarily-consecutive zeros is 1-(sin(pi u)/(pi u))^2."}, {"id": "gue-hypothesis-normalized-zero-spacings-asymptot", "display": "GUE hypothesis: normalized zero spacings asymptotically equal GUE eigenvalue spacings", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "conjecture", "genre": "conjecture", "note": "GUE hypothesis: the distribution of normalized spacings between zeta zeros is asymptotically equal to that of GUE eigenvalues; motivated by Dyson's observation that Montgomery's pair correlation is precisely the pair correlation of random hermitian matrices with independent normal coefficients."}, {"id": "stronger-gue-forms-30-31-small-delta-proportion-", "display": "stronger GUE forms (30)(31); small-delta proportion ~(pi^2/9) delta^3", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "conjecture", "genre": "conjecture", "note": "Stronger GUE forms: (30) for N+1..N+M with M >= N^nu; (31) for the delta_n distribution itself with density p(0,u); its Taylor expansion gives proportion of delta_n < delta ~ (pi^2/9) delta^3, so very close pairs are rare."}, {"id": "computations-show-good-gue-agreement-convergence", "display": "computations show good GUE agreement; convergence speed observed empirically", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "claim", "genre": "original", "note": "Paper reports the computations show good agreement with the GUE conjecture and that the speed of convergence toward the conjectured distribution was observed empirically."}, {"id": "odlyzko-s-prior-gue-computations-up-to-10-23-cit", "display": "Odlyzko's prior GUE computations up to 10^23 (cited)", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p2", "kind": "result", "genre": "reframed", "note": "Cited result: Odlyzko's earlier computations [20,21,22,23], culminating at height 10^23, gave very good GUE agreement; cited from Odlyzko, not reproduced in this chunk."}, {"id": "majorant-estimate-completing-the-point-interpola", "display": "Majorant estimate completing the point-interpolation error bound proof", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "claim", "genre": "original", "note": "For real |x|>1 the paper uses |T_N(x)|=cosh(N arccosh|x|) > K(|x|)^N/sqrt(x^2-1) with K(x)=x+sqrt(x^2-1) and K(k*lambda)>k*K(lambda); after choosing beta_k mod 2pi so that |beta_k-theta0+2n*pi|/L > |2n+1|*lambda, the pole sum is majorized by (4+2^{1-N})/((lambda-1)L K(lambda)^N) times sum |a_k|, completing the point-interpolation error bound proof."}, {"id": "point-and-derivative-evaluation-is-cheaper-than-", "display": "Point-and-derivative evaluation is cheaper than two-point evaluation", "status": "heuristic", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "claim", "genre": "original", "note": "The paper states it is cheaper in performance to compute G and G' at one point than to compute G at two different points, which motivates generalizing the point-only interpolant of Proposition 1 to a point-and-derivative interpolant."}, {"id": "proposition-2-point-and-derivative-chebyshev-int", "display": "Proposition 2: point-and-derivative Chebyshev interpolation error bound", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "claim", "genre": "original", "note": "Proposition 2, proved via the residue theorem from the contour integral of G(t)/(R_N(t)^2 (t-theta)) over |t-theta0|=R with R->infinity: under Proposition 1's hypotheses, |G(theta)-Q_{N,theta0,L}(theta)| < (8+2^{2-N})/((lambda-1)L K(lambda)^{2N}) * sum |a_k| for |theta-theta0|<=L, where Q is the degree-2N point-and-derivative Chebyshev interpolant on the nodes alpha_j."}, {"id": "non-expanded-form-implementation-of-the-point-an", "display": "Non-expanded-form implementation of the point-and-derivative Chebyshev interpolant", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "method", "genre": "original", "note": "The interpolant is kept in non-expanded form Q_N(t)=sum_j [G(theta0+L gamma_j) V_j(t) + L G'(theta0+L gamma_j) W_j(t)] with degree-(2N-1) base polynomials V_j, W_j, because expanded coefficients are large relative to the values on [-1,1] and cause cancellation errors; for even N a symmetric factorization through linear A_j, B_j, linear L_j(t), and cubic C_j(t) gives Q_N(t)=sum_{j<N/2} C_j(t) * prod_{k!=j}(t^2-gamma_k^2), suited to fast precise evaluation of Q_N(t) and Q_N(-t)."}, {"id": "parameter-choice-lambda-2-n-8-sufficient-for-z-t", "display": "Parameter choice lambda=2, N=8 sufficient for Z(t) evaluation up to the 10^13-th zero", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "result", "genre": "original", "note": "Implementation choice lambda=2, N=8, stated to provide enough precision for the Z(t) evaluation in the context of RH verification until the 10^13-th zero (reconstructed from '1013-th zero' in the fetched text, which loses superscripts)."}, {"id": "recursive-fast-computation-process-for-f-omega-j", "display": "Recursive fast-computation process for f(omega^j) with separation subset and halving recursion", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "method", "genre": "original", "note": "To approximate f(omega^j), omega=exp(2i pi/R), for consecutive j0..j1: set j_c=(j0+j1)/2 and L=(j1-j0)pi/R, isolate the k-indices separated by more than lambda*L from the angular center into a subset I, approximate f_I(e^{i theta}) on [2j0 pi/R, 2j1 pi/R] by the point-and-derivative Chebyshev interpolant (error via Proposition 2), and recurse on the two j-halves with the remaining k-indices K-I; small j-sets are evaluated directly. Per-step retuning of lambda,N was not used; the recursion is seeded with four quarter j-sets."}, {"id": "stable-formula-12-for-direct-evaluation-when-ome", "display": "Stable formula (12) for direct evaluation when omega^j is near a pole b_k", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "method", "genre": "original", "note": "Formula (12): when omega^j is very close to a pole b_k, the direct evaluation of a_k e^{i T0 log k}/(omega^j - b_k) is replaced by the stable form -exp(-i((R+1)x + delta log k)) * sin(Rx)/(sqrt(k) sin x), avoiding cancellation (identity; numerical motivation)."}, {"id": "greengard-rokhlin-is-much-more-efficient-than-th", "display": "Greengard-Rokhlin is much more efficient than the Chebyshev-interpolation technique for huge height", "status": "heuristic", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "claim", "genre": "original", "note": "When the number of k-indices is much bigger than the number of j-indices in the evaluations of f(omega^j), the Greengard-Rokhlin algorithm is 'much more efficient than the Chebychev interpolation based technique'; it was designed for Coulomb and gravitational potential evaluations, has since been improved and extended to other areas, needs only few memory accesses (suited to disk memory), and was presented by Odlyzko in [22] as a possible improvement but not implemented by him."}, {"id": "greengard-rokhlin-pole-shifted-truncated-expansi", "display": "Greengard-Rokhlin pole-shifted truncated expansion of f_K(z)", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "method", "genre": "original", "note": "Instead of a Taylor series of a_k/(z-b_k), Greengard-Rokhlin expands in 1/(z-c) outside a pole c, keeping the V most significant terms: f_K(z) ~= sum_{n=0}^{V-1} A_n(K,c)/(z-c)^{n+1} with A_n(K,c)=sum_{k in K} a_k (b_k-c)^n (equation 13); the value of V is deferred to later in the paper."}, {"id": "coefficient-shift-formula-14-with-o-n-pole-movin", "display": "Coefficient shift formula (14) with O(n) pole-moving cost", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "claim", "genre": "original", "note": "Shift formula (14): A_n(K,d)=sum_{j=0}^n binom(n,j)(c-d)^{n-j} A_j(K,c), so moving the pole costs only O(n) operations per coefficient; with n<V<100 in practice this is far cheaper than recomputing (13) directly when K is very large."}, {"id": "greengard-rokhlin-recursive-procedure-gr-j-k", "display": "Greengard-Rokhlin recursive procedure GR(J,K)", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p3", "kind": "definition", "genre": "original", "note": "GR(J,K) is the recursive Greengard-Rokhlin procedure: for K subset of {k0,...,k1} and J subset of {0,...,R-1} it computes approximations of the contributions f_K(omega^j), j in J, with f_K(z)=sum_{k in K} a_k/(z-b_k), b_k=e^{i beta_k}, and returns the pole c plus the coefficients A_n(K,c), 0<=n<V. The assigned chunk ends mid-definition of f_K."}, {"id": "greengard-rokhlin-far-field-approximation-error-", "display": "Greengard-Rokhlin far-field approximation error bound", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "result", "genre": "original", "note": "Paper bounds the multipole coefficients |An(K,c)| by a sum of |ak||1-e^{iL}|^n and derives a geometric error bound on the truncated Taylor approximation (15) for j in J minus J', using the lambda > 1 separation."}, {"id": "complexity-comparison-chebyshev-interpolation-mu", "display": "Complexity comparison: Chebyshev-interpolation multievaluation vs Greengard-Rokhlin", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "claim", "genre": "original", "note": "Chebyshev-interpolation multievaluation costs n*k1*log R (n=16) versus k1*V + V^2*R for Greengard-Rokhlin (V=30); GR wins when k1 significantly exceeds R, i.e. at very large height where k1 is huge and R is bounded by memory/time."}, {"id": "figure-1-timing-table-multievaluation-of-f-omega", "display": "Figure 1 timing table: multievaluation of f(omega^j) near the 10^13-th zero", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "result", "genre": "original", "note": "Near the 10^13-th zero (k1 approx 6.2*10^5), GR beats the first approach for small R (e.g. 1.73 s vs 8.56 s at R=65,536) but loses at large R (151 s vs 25.4 s at R=8,388,608), confirming the complexity analysis."}, {"id": "on-demand-computation-of-ak-and-bk-in-the-greeng", "display": "On-demand computation of ak and bk in the Greengard-Rokhlin approach", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "method", "genre": "original", "note": "In the GR approach ak and bk are needed only once, so they can be computed on demand with no storage; the Chebyshev approach accesses them about log R times on average, so they must be stored, which is a limiting memory factor at huge heights."}, {"id": "double-precision-evaluation-of-uk-u-log-k-mod-2p", "display": "Double-precision evaluation of uk = U log k (mod 2pi) via multiprecision seed and incremental formula", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "method", "genre": "original", "note": "A small 40-decimal-digit multiprecision module seeds one uK; successive values u_{K+h} follow the closed formula with 32-bit integers A,B and residuals rA,rB, valid for h < min(2^16, K(3/U)^{1/3}) with U up to order 10^20."}, {"id": "four-step-fft-retrieval-of-f-t0-j-delta-costing-", "display": "Four-step FFT retrieval of F(T0 + j*delta), costing 5-10% of multievaluation time", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "method", "genre": "original", "note": "F(T0 + j*delta) is recovered from the f multievaluation by two recursive levels of the four-step FFT of [2], which is disk-memory friendly; FFT time is only 5-10% of total F(t) multievaluation time."}, {"id": "band-limited-function-g-x-and-its-cardinal-serie", "display": "Band-limited function G(x) and its cardinal series", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "definition", "genre": "original", "note": "A band-limited G(x) = integral of g(t)e^{ixt} over [-tau,tau] is determined by its samples at n*pi/tau through the cardinal series; the paper notes this formula converges too slowly for its purposes."}, {"id": "oversampled-interpolation-with-kernel-function-h", "display": "Oversampled interpolation with kernel function h(z) at dense points n*pi/beta", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "method", "genre": "original", "note": "The paper samples at denser points n*pi/beta with beta > tau, weighting the series by a kernel h with h(0)=1 and |h(z)| = o(e^{gamma|y|}), tau+gamma <= beta, which yields much better convergence."}, {"id": "proposition-3-kernel-weighted-interpolation-form", "display": "Proposition 3: kernel-weighted interpolation formula for band-limited G", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "claim", "genre": "original", "note": "Proposition 3: for G entire with |G(z)| = O(e^{tau|y|}), formula (19) expresses G(x) as the kernel-weighted sinc series over the dense samples G(n*pi/beta) h(x - n*pi/beta)."}, {"id": "residue-proof-of-proposition-3-via-contour-integ", "display": "Residue proof of Proposition 3 via contour integral of h(x-z)G(z)/(sin(beta*z)(x-z))", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "method", "genre": "original", "note": "Proof evaluates the contour integral of h(x-z)G(z)/(sin(beta*z)(x-z)) over |z| = (n+1/2)*pi/beta, lets n go to infinity to get zero, and equates the sum of residues to the interpolation formula."}, {"id": "paper-s-band-limited-approach-differs-from-odlyz", "display": "Paper's band-limited approach differs from Odlyzko's in [22]", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p4", "kind": "claim", "genre": "original", "note": "Paper states its complex-analysis approach differs from Odlyzko's in [22] and restates the band-limited interpolation results in a slightly different form."}, {"id": "key-interpolation-formula-21-for-g-on-the-regula", "display": "Key interpolation formula (21) for G on the regular grid nπ/β", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "method", "genre": "original", "note": "The paper's key formula (21) computes Gb(x) as a truncated sum over samples at grid points nπ/β with |x − nπ/β| < Mu0/γ, u0 = 2.55, using approximate samples Gb(nπ/β) from the earlier multievaluation algorithm."}, {"id": "g-t-e-i-t-f-t-lower-growth-intermediate-function", "display": "G(t) = e^(−iαt)F(t), lower-growth intermediate function with α = (log k0 + log k1)/2", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "definition", "genre": "original", "note": "G(t) = e^(−iαt)F(t) with α = (log k0 + log k1)/2 has lower complex-plane growth |G(z)| = O(e^(τ|y|)), τ = (log k1 − log k0)/2, so the interpolation is applied to G rather than F directly."}, {"id": "kernel-hm-t-parameters", "display": "Kernel hM(t), parameters β = λτ, γ = β − τ", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "definition", "genre": "original", "note": "Kernel hM(t) built from the sinc power (sin(γt/M)/(γt/M))^M; parameters β = λτ (λ > 1, e.g. λ = 2), γ = β − τ, integer M chosen later. Proposition 3's conditions are then satisfied."}, {"id": "proposition-4-error-bound-for-formula-21-with-co", "display": "Proposition 4: error bound for formula (21) with constants CM, DM, EM, FM", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "claim", "genre": "original", "note": "Proved bound: if sample errors are controlled within |x − nπ/β| < Mu1/γ (u1 = 5.5) and M ≥ 2, then |Gb(x) − G(x)| ≤ AM,β,γ·(γ/β)(CM + DM) + Bx,β,γ·(γ/β)(CM + DM) + 2√k1(γ/β)(EM + FM); proof uses Euler-Maclaurin identity (22) on f(t) = ℓM(tπγ/β − γx) for the tail Y and a parity/maximum argument for X."}, {"id": "numerical-values-of-cm-dm-em-fm-and-typical-gb-x", "display": "Numerical values of CM, DM, EM, FM and typical |Gb(x) − G(x)| bounds near the 10^12-th zero", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "result", "genre": "verified", "note": "Tabulated upper bounds CM, DM, EM, FM for M = 2…16 (e.g. M = 16: CM ≈ 2.37×10^−12, EM ≈ 3.08×10^−16). Around the 10^12-th zero (β = 10, γ = 5, k1 ~ 2×10^5, Bx < 10): e.g. |Gb − G| ≤ 2.307 + 6.5×10^−11 at M = 16, vs 1.922 + 0.135 at M = 4."}, {"id": "adaptive-m-strategy-for-z-t-sign-evaluation-star", "display": "Adaptive M strategy for Z(t) sign evaluation (start M = 2, raise until Prop-4 bound met)", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "method", "genre": "original", "note": "Each Z(t) sign evaluation starts at M = 2 and raises M until the Proposition 4 bound suffices; estimated factor 3–4 saved vs fixed M = 16. Around the 10^13-th zero, interpolation took about half of total time, motivating the saving."}, {"id": "iterative-sin-cos-recurrence-for-kernel-evaluati", "display": "Iterative sin/cos recurrence for kernel evaluation", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "method", "genre": "original", "note": "sin/cos recurrence sin(x − (n+1)π/β) = sin(x − nπ/β)c − cos(x − nπ/β)s (c = cos(nπ/β), s = sin(nπ/β)) evaluates successive kernel terms faster than direct evaluation — the reason hM was chosen over Odlyzko's kernel ([22], c = 30), which converges slightly better but evaluates slower."}, {"id": "discretization-density-and-cutoff-k0-choices-2-6", "display": "Discretization density λ and cutoff k0 choices (λ = 2 / 6/5; k0 = 6 / 30)", "status": "heuristic", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "method", "genre": "original", "note": "Discretization step δ = π/β = 2π/(λ log(k1/k0)); interpolation cost ∝ λ/(λ − 1). Chose λ = 2 until the 10^13-th zero, λ = 6/5 around the 10^22-th zero; k0 = 6 then 30. Values chosen from rough timing experiments, acknowledged as probably not optimal."}, {"id": "direct-riemann-siegel-formula-6-fallback-for-hig", "display": "Direct Riemann-Siegel formula (6) fallback for high-accuracy Z(t)", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "method", "genre": "original", "note": "When Z(t) needs more precision than bandlimited interpolation affords (e.g. between very close zeros), the paper computes Z(t) directly with the classical Riemann-Siegel formula (6) instead of high-precision multievaluation of F(t), keeping total timing under control."}, {"id": "euler-product-form-25-of-f-t-with-primorial-p-an", "display": "Euler-product form (25) of F(t) with primorial P and smooth-part sums s(a)", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "method", "genre": "original", "note": "With P the product of the first h primes (h ≤ 4) and Q the p_h-smooth integers, formula (25) F(t) = Σ_{(k,P)=1} k^(−1/2+it) s(m/k) reduces summation to integers coprime to P; asymptotic gain factor φ(P)/P. Implemented: ~3× savings vs direct summation (24) at large height."}, {"id": "figure-2-single-z-t-evaluation-timings-classic-v", "display": "Figure 2: single-Z(t) evaluation timings, classic vs Euler product, heights 10^14–10^24", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "result", "genre": "verified", "note": "Figure 2 timings (seconds, Pentium M 1.6 GHz) for one Z(t) evaluation near Gram point gn at zero-index heights 10^14–10^24: e.g. at 10^24, classic 36909.16 s vs 13584.88 s with ph = 7 (powers of ten reconstructed; source renders superscripts lost)."}, {"id": "at-least-one-very-accurate-z-t-evaluation-per-od", "display": "At least one very accurate Z(t) evaluation per Odlyzko-Schönhage range as correctness check", "status": "exact", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "method", "genre": "original", "note": "At least one very accurate Z(t) evaluation per range where the Odlyzko-Schönhage algorithm was used, to check correctness of the computation; further such evaluations were rare (a few per billion zeros on average)."}, {"id": "3-goal-all-zeros-until-the-10-13-th-lie-on-the-c", "display": "§3 goal: all zeros until the 10^13-th lie on the critical line ℜ(s) = 1/2", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_gourdon2004_p5", "kind": "claim", "genre": "original", "note": "Statement of the paper's first computation family: verify that all zeros of ζ up to the 10^13-th lie on the critical line ℜ(s) = 1/2. This chunk contains only the section-3 transition; the verification evidence lies beyond it."}, {"id": "sign-change-counting-of-the-completed-zeta-funct", "display": "sign-change counting of the completed zeta function on the half line", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "method", "genre": "original", "note": "FFT-based Riemann-Siegel-style algorithm computes values of the completed zeta function on the half line; each sign change marks a zero on the half line."}, {"id": "variation-of-turing-s-method-to-certify-no-zeroe", "display": "variation of Turing's method to certify no zeroes off the half line", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "method", "genre": "reframed", "note": "A variation of Turing's method (Trudgian [34,35]) certifies all expected zeroes are accounted for, so none lie off the half line in the range."}, {"id": "arb-ball-arithmetic-in-place-of-mpfi-interval-ar", "display": "Arb ball arithmetic in place of MPFI interval arithmetic", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "method", "genre": "original", "note": "Code switched from MPFI to Arb (Johansson [13]): ball arithmetic gives ~50% space saving over full interval arithmetic, more cache friendly; Arb is actively maintained."}, {"id": "wedeniwski-zetagrid-computation-h-2-41e11", "display": "Wedeniwski ZetaGrid computation, H=2.41e11", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "claim", "genre": "reframed", "note": "Wedeniwski ZetaGrid (2003 slides): claims drifted from 200B zeroes (H=5.72e10) to 900B zeroes (H=2.41e11); unpublished, unclear rounding/truncation error control (concern noted by Tao [32], Helfgott [12]). Isolation of 561B zeroes took 2,304 years on 2GHz Pentium 4, ~3,800 of the half line per GHz-hour, vanilla Riemann-Siegel."}, {"id": "gourdon-2004-computation-h-2-44e12", "display": "Gourdon 2004 computation, H=2.44e12", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "claim", "genre": "reframed", "note": "Gourdon (2004, unpublished): H=2.44e12; 525 days on a single 2.4GHz Pentium 4, ~80,000,000 of the half line per GHz-hour; used hardware floating point at ~1.2 samples per zero vs this paper's 25 per zero, which explains the 725x speed gap along with multi-precision rigorous numerics."}, {"id": "platt-2017-rigorous-computation-h-3-06e10", "display": "Platt 2017 rigorous computation, H=3.06e10", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "claim", "genre": "reframed", "note": "Platt 2017 [21]: H=3.06e10 using interval arithmetic and rigorously derived truncation bounds; built a high-precision database of isolated zeroes using Shannon-Whittaker-Nyquist zoom. The present paper reuses its algorithm but drops the zoom (default lattice sampling ~0.01 isolates 999,997.5 of every 1,000,000 zeroes) and had nowhere to store that many zeroes."}, {"id": "franke-et-al-computation-h-1e11", "display": "Franke et al. computation, H=1e11", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "claim", "genre": "reframed", "note": "Franke et al. [9]: H=1e11 claimed, but few computational details given."}, {"id": "corollary-1-explicit-psi-theta-pi-bounds-to-x-2-", "display": "Corollary 1: explicit psi/theta/pi bounds to x = 2.169e25", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "result", "genre": "original", "note": "Corollary 1: |psi(x)-x|, |theta(x)-x|, |pi(x)-li(x)| all <= sqrt(x)/(8 pi) log^2 x for 59 < x <= 2.169e25 (59, 599, 2657 lower limits resp.), obtained from Schoenfeld's inequality via Buthe's criterion applied to H=3e12."}, {"id": "zero-free-constant-r-and-vinogradov-korobov-regi", "display": "zero-free constant R and Vinogradov-Korobov region improvable with Theorem 1", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "claim", "genre": "reframed", "note": "Current best zero-free constant R=5.573412 (Mossinghoff-Trudgian [18]); paper states it 'can be improved slightly with Theorem 1' and will be tackled in a future paper of Mossinghoff and Trudgian, along with the explicit Vinogradov-Korobov region proved by Ford [10]."}, {"id": "explicit-zero-density-estimates-n-sigma-t-improv", "display": "explicit zero-density estimates N(sigma,T) improvable with Theorem 1", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "claim", "genre": "reframed", "note": "Explicit zero-density estimates N(sigma,T) by Kadiri [14], Kadiri-Lumley-Ng [16], and Simonic [30] could all be improved with Theorem 1."}, {"id": "first-sign-changes-of-pi-x-li-x-and-theta-x-x-im", "display": "first sign changes of pi(x)-li(x) and theta(x)-x improvable with Theorem 1", "status": "conjectural", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "claim", "genre": "reframed", "note": "First sign changes of pi(x)-li(x) (Demichel-Saouter-Trudgian [6], Smith [31]) and theta(x)-x (Platt-Trudgian [22]) could potentially improve with Theorem 1, but only meagrely. Buthe [4] showed theta(x)<x and pi(x)<li(x) for 2<=x<=1e19, relying on Franke et al.'s H=1e11, so those bounds could also improve with Theorem 1."}, {"id": "corollary-2-de-bruijn-newman-constant-lambda-0-2", "display": "Corollary 2: de Bruijn-Newman constant Lambda <= 0.2", "status": "computationally_verified", "cluster": "computation", "status_note": null, "chunk": "comp_platttrudgian2021_p1", "kind": "result", "genre": "original", "note": "Corollary 2: Lambda <= 0.2, since the Polymath 15 table [24, Table 1 p.65] permits Lambda <= 0.2 given H > 2.51e12, which Theorem 1 exceeds. The next entry (Lambda < 0.19) needs H a little higher than 1e13 and   nodes.push({ id:sid, label:s.display, status:st, facets:s.facets,
    note:s.status_note, chunks:s.chunks, killedFacets:s.killed_facets,
    r: 7 + Math.min(13, Math.sqrt(s.facets.length) * 4), subject:true, cluster:s.cluster||'misc', note:s.status_note||null });
}
for (const s of GRAPH.standalone) {
  const st = s.status || 'open';
  nodes.push({ id:s.id, label:s.display, status:st,
    facets:[{chunk:s.chunk, cid:'', label:s.display, kind:s.kind,
              status:s.status, genre:s.genre, note:s.note, subjects:[]}],
    note:null, chunks:[s.chunk], killedFacets:0, r:4.5, subject:false, cluster:s.cluster||'misc', note:s.status_note||null });
}
nodes.forEach(n => nodeById[n.id] = n);
let edges = GRAPH.edges.map(e => ({ a:e.a, b:e.b, rel:e.rel, w:e.count }))
  .filter(e => nodeById[e.a] && nodeById[e.b]);

const stage = document.getElementById('stage');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W=0, H=0;
function resize(){
  const r = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
// deterministic circle init once we know the size
let inited = false;
const clusterC = {};
function maybeInit(){
  if (inited || W < 50 || H < 50) return;
  inited = true;
  const clusters = [...new Set(nodes.map(n => n.cluster||'misc'))].sort();
  const R = Math.min(W,H) * 0.30;
  clusters.forEach((c, ci) => {
    const a = (ci / clusters.length) * Math.PI * 2 - Math.PI/2;
    clusterC[c] = { x: Math.cos(a)*R, y: Math.sin(a)*R };
  });
  const per = {};
  nodes.forEach((n) => {
    const c = n.cluster || 'misc';
    const cc = clusterC[c];
    const k = (per[c] = (per[c]||0) + 1);
    const a = k * 2.39996, r = 16 * Math.sqrt(k);
    n.x = cc.x + Math.cos(a)*r; n.y = cc.y + Math.sin(a)*r;
    n.vx = 0; n.vy = 0;
  });
}
if (window.ResizeObserver) new ResizeObserver(()=>{ resize(); maybeInit(); }).observe(stage);
window.addEventListener('resize', ()=>{ resize(); maybeInit(); });
resize(); maybeInit();

let selected = null, hover = null;
let cam = { x:0, y:0, z:1 };
function tick(){
  if (W < 50) return;
  for (let i=0;i<nodes.length;i++){ const a=nodes[i];
    for (let j=i+1;j<nodes.length;j++){ const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+60, d=Math.sqrt(d2);
      const f = Math.min(8000/d2, 5);
      dx/=d; dy/=d; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
    a.vx += -a.x*0.004; a.vy += -a.y*0.004;
    const cc = clusterC[a.cluster||'misc'];
    if (cc){ a.vx += (cc.x-a.x)*0.03; a.vy += (cc.y-a.y)*0.03; }
  }
  for (const e of edges){ const a=nodeById[e.a], b=nodeById[e.b]; if(!a||!b) continue;
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const want = 80 + Math.min(70, a.r+b.r);
    const f = (d-want)*0.018*Math.min(3, e.w);
    dx/=d; dy/=d; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
  for (const n of nodes){ n.vx*=0.86; n.vy*=0.86;
    n.x+=Math.max(-9,Math.min(9,n.vx)); n.y+=Math.max(-9,Math.min(9,n.vy)); }
}
function visible(n){
  if (!n.subject && !document.getElementById('f-detail').checked) return false;
  if (n.status==='killed' && !document.getElementById('f-killed').checked) return false;
  if (n.status==='heuristic' && !document.getElementById('f-heur').checked) return false;
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (q && !(n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q))) return false;
  return true;
}
function draw(){
  if (W >= 50){
    ctx.clearRect(0,0,W,H);
    const cx = W/2 + cam.x, cy = H/2 + cam.y, z = cam.z;
    const showAll = document.getElementById('f-edges').checked;
    const vis = nodes.filter(visible);
    const visSet = new Set(vis.map(n=>n.id));
    document.getElementById('empty').hidden = vis.length > 0;
    for (const e of edges){
      if (!visSet.has(e.a) || !visSet.has(e.b)) continue;
      const sel = selected && (e.a===selected.id || e.b===selected.id);
      if (!showAll && !sel) continue;
      const a=nodeById[e.a], b=nodeById[e.b];
      ctx.strokeStyle = sel ? 'rgba(230,237,243,.5)' : (e.rel.indexOf('cross:')===0 ? 'rgba(255,215,0,.6)' : 'rgba(139,148,158,.16)');
      ctx.lineWidth = sel ? Math.min(3, .6+e.w*.5) : 1;
      ctx.beginPath(); ctx.moveTo(cx+a.x*z, cy+a.y*z); ctx.lineTo(cx+b.x*z, cy+b.y*z); ctx.stroke();
    }
    for (const n of vis){
      const x=cx+n.x*z, y=cy+n.y*z, r=n.r*Math.sqrt(z);
      if (x<-50||y<-50||x>W+50||y>H+50) continue;
      ctx.beginPath(); ctx.arc(x,y,Math.max(1.5,r),0,6.2832);
      ctx.globalAlpha = n.subject ? .92 : .5;
      ctx.fillStyle = COLORS[n.status] || '#8b949e';
      ctx.fill(); ctx.globalAlpha = 1;
      if (n===selected || n===hover){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
      if (n===hover || n.r>10 || z>1.7){
        ctx.fillStyle='#e6edf3'; ctx.font='11px sans-serif'; ctx.textAlign='center';
        const t = n.label.length>36 ? n.label.slice(0,35)+'…' : n.label;
        ctx.fillText(t, x, y - r - 6);
      }
    }
  }
  requestAnimationFrame(draw);
}
// pointer: mouse + touch
let drag=null, pinch=null;
function pos(e){ const r=cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x:t.clientX-r.left, y:t.clientY-r.top }; }
function nodeAt(mx,my){
  const cx=W/2+cam.x, cy=H/2+cam.y, z=cam.z;
  for (const n of nodes){ if(!visible(n)) continue;
    const x=cx+n.x*z, y=cy+n.y*z;
    if (Math.hypot(mx-x,my-y) < n.r*Math.sqrt(z)+6) return n; }
  return null;
}
cv.addEventListener('mousedown', e=>{ drag={x:e.clientX,y:e.clientY,moved:false}; });
window.addEventListener('mousemove', e=>{
  if (drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
    cam.x+=dx; cam.y+=dy; drag.x=e.clientX; drag.y=e.clientY; }
});
window.addEventListener('mouseup', e=>{
  if (drag && !drag.moved && e.target===cv){
    const p=pos(e); select(nodeAt(p.x,p.y));
  }
  drag=null;
});
cv.addEventListener('wheel', e=>{ e.preventDefault();
  cam.z = Math.max(.3, Math.min(4, cam.z * (e.deltaY<0? 1.12 : .9))); }, {passive:false});
cv.addEventListener('touchstart', e=>{
  if (e.touches.length===1){ const p=pos(e); drag={x:p.x,y:p.y,moved:false,id:e.touches[0].identifier}; }
  else if (e.touches.length===2){ const a=e.touches[0], b=e.touches[1];
    pinch={ d:Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z:cam.z }; drag=null; }
}, {passive:true});
cv.addEventListener('touchmove', e=>{
  if (e.touches.length===1 && drag){
    const p=pos(e); const dx=p.x-drag.x, dy=p.y-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>6) drag.moved=true;
    cam.x+=dx; cam.y+=dy; drag.x=p.x; drag.y=p.y;
  } else if (e.touches.length===2 && pinch){
    const a=e.touches[0], b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (d>0) cam.z = Math.max(.3, Math.min(4, pinch.z * d/pinch.d));
  }
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchend', e=>{
  if (drag && !drag.moved && e.changedTouches.length){
    const t=e.changedTouches[0], r=cv.getBoundingClientRect();
    select(nodeAt(t.clientX-r.left, t.clientY-r.top));
  }
  drag=null; pinch=null;
});
function pill(st){ return `<span class="pill st-${st}">${NAMES[st]||st}</span>`; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function select(n){
  selected = n;
  const d = document.getElementById('detail');
  if (!n){ d.innerHTML = '<p class="hint">Select a node to inspect its facets, notes and provenance.</p>'; return; }
  let h = `<h2 style="word-break:break-word">${esc(n.label)}</h2>`;
  h += `<div style="margin-bottom:6px">${pill(n.status)} <span class="hint">${esc(n.id)}</span></div>`;
  if (n.note) h += `<p style="font-size:12px;color:#c9d1d9"><i>merge note:</i> ${esc(n.note)}</p>`;
  if (n.killedFacets) h += `<p style="font-size:12px;color:#f85149">${n.killedFacets} killed facet(s) — see below</p>`;
  const nb = edges.filter(e=>e.a===n.id||e.b===n.id);
  if (nb.length){ h += `<p class="hint">${nb.length} relation(s):</p>`;
    nb.slice(0,24).forEach(e=>{ const o = e.a===n.id? e.b : e.a;
      const on = nodeById[o];
      h += `<div style="font-size:12px;margin:3px 0"><a href="#" data-n="${esc(o)}" style="color:#58a6ff">${esc(on?on.label:o)}</a> <span class="hint">— ${e.a===n.id? esc(e.rel)+' →' : '← '+esc(e.rel)} (×${e.w})</span></div>`; });
  }
  h += `<p class="hint" style="margin-top:10px">${n.facets.length} facet(s) · chunks: ${esc(n.chunks.join(', '))}</p>`;
  n.facets.forEach(f=>{
    h += `<div class="facet"><div class="lbl">${esc(f.label)}</div>`
      + `<div class="meta">${pill(f.status||'open')}<span class="hint">${esc(f.kind)}${f.genre?' · '+esc(f.genre):''} · ${esc(f.chunk)}${f.cid?' / '+esc(f.cid):''}</span></div>`
      + (f.note? `<div class="note">${esc(f.note)}</div>` : '') + `</div>`;
  });
  d.innerHTML = h;
  d.querySelectorAll('a[data-n]').forEach(a=>a.addEventListener('click', ev=>{
    ev.preventDefault(); const t=nodeById[a.getAttribute('data-n')]; if(t) select(t); }));
}
document.getElementById('legend').innerHTML =
  Object.keys(COLORS).map(k=>`<span class="li"><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}</span>`).join('')
  + `<span class="li hint">node size ∝ facet count</span>`;
(function(){
  const st = GRAPH.stats;
  const el = document.querySelector('#topbar .sub');
  el.textContent += ` · ${st.subjects} subjects · ${st.cross_edges} relations · ${GRAPH.loops.length} open loops · ${st.concepts} concepts`;
})();
document.getElementById('looplo').innerHTML = GRAPH.loops.map(l=>
  `<div class="loop"${l.node?` data-node="${esc(l.node)}" title="trace this constellation" style="cursor:pointer"`:''}><b>${esc(l.chunk)}</b> — ${esc(l.label)}</div>`).join('');
document.getElementById('looplo').addEventListener('click', e=>{
  const t = e.target.closest('[data-node]');
  if (t){ const n = nodeById[t.getAttribute('data-node')]; if (n) select(n); }
});
setInterval(tick, 30);
draw();
</script>
</body>
</html>
