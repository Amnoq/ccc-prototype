: "dens_guthmaynard_p2", "kind": "result", "genre": "original", "note": "Lemma 4.3 proves two non-stationary-phase decay bounds for hat{h}_t: decay in the frequency variable at rate governed by (1+|t|), and decay in |t| governed by (1+|xi|); proof by repeated integration by parts using smoothness and compact support of w."}, {"id": "lemma-4-4-hilbert-schmidt-norm-estimate-tr-m-w-m", "display": "Lemma 4.4 (Hilbert-Schmidt norm estimate): tr(M_W M_W^*) = N|W| ||w||_{L^2}^2 + O(N^{-100})", "status": "exact", "cluster": "density", "status_note": null, "chunk": "dens_guthmaynard_p2", "kind": "result", "genre": "original", "note": "Lemma 4.4: the Hilbert-Schmidt norm equals N|W| ||w||_{L^2}^2 up to O(N^{-100}); the main term comes from m=0 in Poisson summation and the tails are killed by Lemma 4.3."}, {"id": "lemma-4-5-expansion-of-the-cubic-trace-tr-m-w-m-", "display": "Lemma 4.5 (Expansion of the cubic trace): tr((M_W M_W^*)^3) = N^3|W| ||w||_{L^2}^6 + sum_{m != 0} I_m + O_epsilon(T^{-100})", "status": "exact", "cluster": "density", "status_note": null, "chunk": "dens_guthmaynard_p2", "kind": "result", "genre": "original", "note": "Lemma 4.5: expanding tr((M_W M_W^*)^3) and applying Poisson summation in n1,n2,n3 separates the diagonal m=0 term N^3|W| ||w||_{L^2}^6 (off-diagonal t-tuples negligible by Lemma 4.3 since W is T^epsilon-separated) from the off-diagonal sum over m != 0 of I_m."}, {"id": "i-m-n-3-sum-t1-t2-t3-in-w-hat-h-t1-t2-m1-n-hat-h", "display": "I_m := N^3 sum_{t1,t2,t3 in W} hat{h}_{t1-t2}(m1 N) hat{h}_{t2-t3}(m2 N) hat{h}_{t3-t1}(m3 N)", "status": "exact", "cluster": "density", "status_note": null, "chunk": "dens_guthmaynard_p2", "kind": "definition", "genre": "original", "note": "I_m := N^3 sum_{t1,t2,t3 in W} hat{h}_{t1-t2}(m1 N) hat{h}_{t2-t3}(m2 N) hat{h}_{t3-t1}(m3 N) (Lemma 4.5); the nonzero-frequency piece of the cubic trace."}, {"id": "proposition-4-6-w-lesssim-n-2-2-sigma-n-1-2-sigm", "display": "Proposition 4.6: |W| lesssim N^{2-2 sigma} + N^{1-2 sigma} (sum_{m != 0} I_m)^{1/3}", "status": "exact", "cluster": "density", "status_note": null, "chunk": "dens_guthmaynard_p2", "kind": "result", "genre": "original", "note": "Proposition 4.6 combines Lemmas 4.1-4.5 to give |W| lesssim N^{2-2 sigma} + N^{1-2 sigma}(sum_{m != 0} I_m)^{1/3}; the paper notes the first term is exactly Conjecture 1.5's optimal N^{2-2 sigma}, so the proof reduces to bounding the sum of I_m."}, {"id": "splitting-sum-m-0-i-m-s1-s2-s3-by-the-number-of-", "display": "Splitting sum_{m != 0} I_m = S1 + S2 + S3 by the number of nonzero components m_i ((5.5))", "status": "exact", "cluster": "density", "status_note": null, "chunk": "dens_guthmaynard_p2", "kind": "method", "genre": "original", "note": "Equation (5.5) divides the I_m sum into S1 (exactly one m_i nonzero), S2 (exactly two nonzero), S3 (all three nonzero); the paper announces S1 negligible, S2 handled by Heath-Brown's theorem, and S3 the difficult main term."}, {"id": "proposition-5-1-s1-bound-s1-o-epsilon-t-10-s1-is", "display": "Proposition 5.1 (S1 bound): S1 = O_epsilon(T^{-10}); S1 is negligible", "status": "exact", "cluster": "density", "status_note": null, "chunk": "dens_guthmaynard_p2", "kind": "result", "genre": "original", "note": "Proposition 5.1 proves S1 = O_epsilon(T^{-10}) by checking each diagonal case (t1=t2=t3 and exactly two t's equal) with the tail estimates (5.1)-(5.4)."}, {"id": "proposition-6-1-s2-bound-s2-lessapprox-n-2-w-2-t", "display": "Proposition 6.1 (S2 bound): S2 lessapprox N^2|W|^2 + TN|W|^{2-1/k} + N^2|W|^2 (T^{1/2}/|W|^{3/4})^{1/k} for any k in N", "status": "exact", "cluster": "density", "status_note": null, "chunk": "dens_guthmaynard_p2", "kind": "result", "genre": "original", "note": "Proposition 6.1 proves S2 lessapprox N^2|W|^2 + TN|W|^{2-1/k} + N^2|W|^2(T^{1/2}/|W|^{3/4})^{1/k} for any positive integer k; the proof applies Lemma 6.2 to replace each Fourier factor by a short Dirichlet polynomial, then uses Holder's inequality (raising to the 2k-th power) and Heath-Brown's theorem."}, {"id": "lemma-6-2-approximate-functional-equation-reflec", "display": "Lemma 6.2 (Approximate functional equation / reflection principle): a Dirichlet polynomial of length N at t ~ T0 is controlled by one of length T0/N", "status": "exact", "cluster": "density", "status_note": null, "chunk": "dens_guthmaynard_p2", "kind": "method", "genre": "original", "note": "Lemma 6.2 states the reflection principle: values of a Dirichlet polynomial of length N at |t| ~ T0 are determined by values of a Dirichlet polynomial of length T0/N; proved via Mellin inversion of w^2 and the functional equation of the zeta function."}, {"id": "r-v-sum-t-in-w-v-it-hat-w-log-v-7-2", "display": "R(v) := sum_{t in W} v^{it} = hat{W}(log v) ((7.2))", "status": "exact", "cluster": "density", "status_note": null, "chunk": "dens_guthmaynard_p2", "kind": "definition", "genre": "original", "note": "Definition (7.2): R(v) := sum_{t in W} v^{it} = hat{W}(log v), introduced to factor the t1,t2,t3 dependence in the I_m integrals when analyzing S3."}, {"id": "proposition-7-1-cancellation-within-the-i-m-inte", "display": "Proposition 7.1 (Cancellation within the I_m integrals): |I_m| bounded by an integral of |R(v1) R(v2/v1) R(v2)| over the thin region |m1 v1 + m2 v2 + m3| lessapprox 1/N", "status": "exact", "cluster": "density", "status_note": null, "chunk": "dens_guthmaynard_p2", "kind": "result", "genre": "original", "note": "Proposition 7.1: expanding each hat{h} as an integral and changing variables to v1=u1/u3, v2=u2/u3 writes |I_m| as an integral of |R(v1) R(v2/v1) R(v2)| over the thin region |m1 v1 + m2 v2 + m3| lessapprox 1/N; moreover if |m1| <= |m2| <= |m3| then I_m is negligible unless |m2| ~= |m3|. (The proof continues past the end of this chunk's assigned range.)"}, {"id": "heath-brown-s-theorem-restated-in-section-6-sum-", "display": "Heath-Brown's theorem restated in section 6: sum_{t1,t2} |sum a_n n^{i(t1-t2)}|^2 bound", "status": "conjectural", "cl const COLORS = { exact:'#3fb950', computationally_verified:'#58a6ff',

const NAMES = { exact:'exact', computationally_verified:'computationally verified',
  conjectural:'conjectural', heuristic:'heuristic', killed:'killed', open:'open (unanchored)' };

let nodes = [], nodeById = {};
for (const [sid, s] of Object.entries(GRAPH.subjects)) {

  nodes.push({ id:sid, label:s.display, status:st, facets:s.facets,

    r: 7 + Math.min(13, Math.sqrt(s.facets.length) * 4), subject:true, cluster:s.cluster||'misc', note:s.status_note||null });
}
for (const s of GRAPH.standalone) {
  const st = s.status || 'open';

    facets:[{chunk:s.chunk, cid:'', label:s.display, kind:s.kind,

    note:null, chunks:[s.chunk], killedFacets:0, r:4.5, subject:false, cluster:s.cluster||'misc', note:s.status_note||null });
}
nodes.forEach(n => nodeById[n.id] = n);
let edges = GRAPH.edges.map(e => ({ a:e.a, b:e.b, rel:e.rel, w:e.count }))
  .filter(e => nodeById[e.a] && nodeById[e.b]);

const stage = document.getElementById('stage');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W=0, H=0;
function resize(){
  const r = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
// deterministic circle init once we know the size
let inited = false;
const clusterC = {};
function maybeInit(){
  if (inited || W < 50 || H < 50) return;
  inited = true;
  const clusters = [...new Set(nodes.map(n => n.cluster||'misc'))].sort();
  const R = Math.min(W,H) * 0.30;
  clusters.forEach((c, ci) => {
    const a = (ci / clusters.length) * Math.PI * 2 - Math.PI/2;
    clusterC[c] = { x: Math.cos(a)*R, y: Math.sin(a)*R };
  });
  const per = {};
  nodes.forEach((n) => {
    const c = n.cluster || 'misc';
    const cc = clusterC[c];
    const k = (per[c] = (per[c]||0) + 1);
    const a = k * 2.39996, r = 16 * Math.sqrt(k);
    n.x = cc.x + Math.cos(a)*r; n.y = cc.y + Math.sin(a)*r;
    n.vx = 0; n.vy = 0;
  });
}
if (window.ResizeObserver) new ResizeObserver(()=>{ resize(); maybeInit(); }).observe(stage);
window.addEventListener('resize', ()=>{ resize(); maybeInit(); });
resize(); maybeInit();

let selected = null, hover = null;
let cam = { x:0, y:0, z:1 };
function tick(){
  if (W < 50) return;
  for (let i=0;i<nodes.length;i++){ const a=nodes[i];
    for (let j=i+1;j<nodes.length;j++){ const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+60, d=Math.sqrt(d2);
      const f = Math.min(8000/d2, 5);
      dx/=d; dy/=d; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
    a.vx += -a.x*0.004; a.vy += -a.y*0.004;
    const cc = clusterC[a.cluster||'misc'];
    if (cc){ a.vx += (cc.x-a.x)*0.03; a.vy += (cc.y-a.y)*0.03; }
  }
  for (const e of edges){ const a=nodeById[e.a], b=nodeById[e.b]; if(!a||!b) continue;
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const want = 80 + Math.min(70, a.r+b.r);
    const f = (d-want)*0.018*Math.min(3, e.w);
    dx/=d; dy/=d; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
  for (const n of nodes){ n.vx*=0.86; n.vy*=0.86;
    n.x+=Math.max(-9,Math.min(9,n.vx)); n.y+=Math.max(-9,Math.min(9,n.vy)); }
}
function visible(n){
  if (!n.subject && !document.getElementById('f-detail').checked) return false;
  if (n.status==='killed' && !document.getElementById('f-killed').checked) return false;
  if (n.status==='heuristic' && !document.getElementById('f-heur').checked) return false;
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (q && !(n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q))) return false;
  return true;
}
function draw(){
  if (W >= 50){
    ctx.clearRect(0,0,W,H);
    const cx = W/2 + cam.x, cy = H/2 + cam.y, z = cam.z;
    const showAll = document.getElementById('f-edges').checked;
    const vis = nodes.filter(visible);
    const visSet = new Set(vis.map(n=>n.id));
    document.getElementById('empty').hidden = vis.length > 0;
    for (const e of edges){
      if (!visSet.has(e.a) || !visSet.has(e.b)) continue;
      const sel = selected && (e.a===selected.id || e.b===selected.id);
      if (!showAll && !sel) continue;
      const a=nodeById[e.a], b=nodeById[e.b];
      ctx.strokeStyle = sel ? 'rgba(230,237,243,.5)' : (e.rel.indexOf('cross:')===0 ? 'rgba(255,215,0,.6)' : 'rgba(139,148,158,.16)');
      ctx.lineWidth = sel ? Math.min(3, .6+e.w*.5) : 1;
      ctx.beginPath(); ctx.moveTo(cx+a.x*z, cy+a.y*z); ctx.lineTo(cx+b.x*z, cy+b.y*z); ctx.stroke();
    }
    for (const n of vis){
      const x=cx+n.x*z, y=cy+n.y*z, r=n.r*Math.sqrt(z);
      if (x<-50||y<-50||x>W+50||y>H+50) continue;
      ctx.beginPath(); ctx.arc(x,y,Math.max(1.5,r),0,6.2832);
      ctx.globalAlpha = n.subject ? .92 : .5;
      ctx.fillStyle = COLORS[n.status] || '#8b949e';
      ctx.fill(); ctx.globalAlpha = 1;
      if (n===selected || n===hover){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
      if (n===hover || n.r>10 || z>1.7){
        ctx.fillStyle='#e6edf3'; ctx.font='11px sans-serif'; ctx.textAlign='center';
        const t = n.label.length>36 ? n.label.slice(0,35)+'…' : n.label;
        ctx.fillText(t, x, y - r - 6);

}
// pointer: mouse + touch

function pos(e){ const r=cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x:t.clientX-r.left, y:t.clientY-r.top }; }

  const cx=W/2+cam.x, cy=H/2+cam.y, z=cam.z;
  for (const n of nodes){ if(!visible(n)) continue;
    const x=cx+n.x*z, y=cy+n.y*z;
    if (Math.hypot(mx-x,my-y) < n.r*Math.sqrt(z)+6) return n; }
  return null;
}
cv.addEventListener('mousedown', e=>{ drag={x:e.clientX,y:e.clientY,moved:false}; });
window.addEventListener('mousemove', e=>{
  if (drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
    cam.x+=dx; cam.y+=dy; drag.x=e.clientX; drag.y=e.clientY; }
});
window.addEventListener('mouseup', e=>{
  if (drag && !drag.moved && e.target===cv){
    const p=pos(e); select(nodeAt(p.x,p.y));
  }
  drag=null;
});
cv.addEventListener('wheel', e=>{ e.preventDefault();
  cam.z = Math.max(.3, Math.min(4, cam.z * (e.deltaY<0? 1.12 : .9))); }, {passive:false});
cv.addEventListener('touchstart', e=>{
  if (e.touches.length===1){ const p=pos(e); drag={x:p.x,y:p.y,moved:false,id:e.touches[0].identifier}; }
  else if (e.touches.length===2){ const a=e.touches[0], b=e.touches[1];
    pinch={ d:Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z:cam.z }; drag=null; }
}, {passive:true});
cv.addEventListener('touchmove', e=>{
  if (e.touches.length===1 && drag){
    const p=pos(e); const dx=p.x-drag.x, dy=p.y-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>6) drag.moved=true;
    cam.x+=dx; cam.y+=dy; drag.x=p.x; drag.y=p.y;
  } else if (e.touches.length===2 && pinch){
    const a=e.touches[0], b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (d>0) cam.z = Math.max(.3, Math.min(4, pinch.z * d/pinch.d));
  }
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchend', e=>{
  if (drag && !drag.moved && e.changedTouches.length){
    const t=e.changedTouches[0], r=cv.getBoundingClientRect();
    select(nodeAt(t.clientX-r.left, t.clientY-r.top));
  }

});
function pill(st){ return `<span class="pill st-${st}">${NAMES[st]||st}</span>`; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function select(n){
  selected = n;
  const d = document.getElementById('detail');
  if (!n){ d.innerHTML = '<p class="hint">Select a node to inspect its facets, notes and provenance.</p>'; return; }
  let h = `<h2 style="word-break:break-word">${esc(n.label)}</h2>`;
  h += `<div style="margin-bottom:6px">${pill(n.status)} <span class="hint">${esc(n.id)}</span></div>`;
  if (n.note) h += `<p style="font-size:12px;color:#c9d1d9"><i>merge note:</i> ${esc(n.note)}</p>`;
  if (n.killedFacets) h += `<p style="font-size:12px;color:#f85149">${n.killedFacets} killed facet(s) — see below</p>`;
  const nb = edges.filter(e=>e.a===n.id||e.b===n.id);
  if (nb.length){ h += `<p class="hint">${nb.length} relation(s):</p>`;
    nb.slice(0,24).forEach(e=>{ const o = e.a===n.id? e.b : e.a;
      const on = nodeById[o];
      h += `<div style="font-size:12px;margin:3px 0"><a href="#" data-n="${esc(o)}" style="color:#58a6ff">${esc(on?on.label:o)}</a> <span class="hint">— ${e.a===n.id? esc(e.rel)+' →' : '← '+esc(e.rel)} (×${e.w})</span></div>`; });
  }
  h += `<p class="hint" style="margin-top:10px">${n.facets.length} facet(s) · chunks: ${esc(n.chunks.join(', '))}</p>`;
  n.facets.forEach(f=>{
    h += `<div class="facet"><div class="lbl">${esc(f.label)}</div>`
      + `<div class="meta">${pill(f.status||'open')}<span class="hint">${esc(f.kind)}${f.genre?' · '+esc(f.genre):''} · ${esc(f.chunk)}${f.cid?' / '+esc(f.cid):''}</span></div>`
      + (f.note? `<div class="note">${esc(f.note)}</div>` : '') + `</div>`;
  });
  d.innerHTML = h;
  d.querySelectorAll('a[data-n]').forEach(a=>a.addEventListener('click', ev=>{
    ev.preventDefault(); const t=nodeById[a.getAttribute('data-n')]; if(t) select(t); }));
}
document.getElementById('legend').innerHTML =
  Object.keys(COLORS).map(k=>`<span class="li"><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}</span>`).join('')
  + `<span class="li hint">node size ∝ facet count</span>`;
(function(){
  const st = GRAPH.stats;
  const el = document.querySelector('#topbar .sub');
  el.textContent += ` · ${st.subjects} subjects · ${st.cross_edges} relations · ${GRAPH.loops.length} open loops · ${st.concepts} concepts`;
})();
document.getElementById('looplo').innerHTML = GRAPH.loops.map(l=>
  `<div class="loop"${l.node?` data-node="${esc(l.node)}" title="trace this constellation" style="cursor:pointer"`:''}><b>${esc(l.chunk)}</b> — ${esc(l.label)}</div>`).join('');
document.getElementById('looplo').addEventListener('click', e=>{
  const t = e.target.closest('[data-node]');
  if (t){ const n = nodeById[t.getAttribute('data-node')]; if (n) select(n); }
