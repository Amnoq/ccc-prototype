tem 1 tracks its fate", "chunk": "prop_alpogefurman_p2", "kind": "result", "genre": "original", "note": "Observes the C² smoothing of φ is necessary: for a sharp cut-off the tail sum is ≫ X^{1/2}L log(T/D₀), which is not o(N) for any D₀ = T^{1−ε}."}, {"id": "corollary-4-5-tr-p-2n-q-n-i-o-t-log-t", "display": "Corollary 4.5: tr P + 2n₊(Q) ≤ N(I) + O(√T log T)", "status": "exact", "cluster": "proportion", "status_note": "preprint — unrefereed as of 2026-10-07; ledger item 1 tracks its fate", "chunk": "prop_alpogefurman_p2", "kind": "result", "genre": "original", "note": "Deduces tr P + 2n₊(Q) ≤ N(I) + O(√T log T) and N₀*(I) ≥ rank P − O(√T log T) from Proposition 4.1 and the short-interval bound N(I′)−N(I) ≪ √T log T."}, {"id": "lemma-5-1-chebyshev-mertens-auxiliary-estimates", "display": "Lemma 5.1: Chebyshev–Mertens auxiliary estimates", "status": "conjectural", "cluster": "proportion", "status_note": "preprint — unrefereed as of 2026-10-07; ledger item 1 tracks its fate", "chunk": "prop_alpogefurman_p2", "kind": "result", "genre": "reframed", "note": "Chebyshev–Mertens estimates (5.5)–(5.6): Σ Λ(n)² ≪ x log x, Σ Λ(n)²/n = ½(log x)² + O(log x), etc. — standard estimates cited from [MV07, §2.2] and [IK04, Thm 2.7], not proved here."}, {"id": "montgomery-vaughan-inequality-applied-to-the-off", "display": "Montgomery–Vaughan inequality applied to the off-diagonal sum O₁", "status": "conjectural", "cluster": "proportion", "status_note": "preprint — unrefereed as of 2026-10-07; ledger item 1 tracks its fate", "chunk": "prop_alpogefurman_p2", "kind": "method", "genre": "reframed", "note": "The Montgomery–Vaughan inequality (Lemma 2.2) applied to the off-diagonal sum O₁ in Proposition 5.4, bounding four Hilbert-form sums Σ_{n≠m} x_n z̄_m/(y_n−y_m) by ≪ L²X; cited, not proved."}, {"id": "proposition-5-2-reduction-to-the-double-integral", "display": "Proposition 5.2 (Reduction to the double integral)", "status": "exact", "cluster": "proportion", "status_note": "preprint — unrefereed as of 2026-10-07; ledger item 1 tracks its fate", "chunk": "prop_alpogefurman_p2", "kind": "result", "genre": "original", "note": "Proves ‖G̃+Ẽ‖_HS² = (a²L²)^{−1} ∬_{I×I} Φ̂²(τ−τ′)² ν_X(τ)ν_X(τ′) dτdτ′ + O_χ(N log L/L²), by splitting off the outside-grid error E₁ and the off-window error E₂, both bounded via ϑ."}, {"id": "proposition-5-3-archimedean-term-m", "display": "Proposition 5.3 (Archimedean term M[μ,μ])", "status": "exact", "cluster": "proportion", "status_note": "preprint — unrefereed as of 2026-10-07; ledger item 1 tracks its fate", "chunk": "prop_alpogefurman_p2", "kind": "result", "genre": "original", "note": "Proves M[μ,μ] = 2πbL ∫_T^{2T} μ² + O(l² log L) = bLTℓ₁²/(2π)(1+O(l^{−2})) + O(l² log L), using μ's smoothness (2.3) and the Φ² integral tails."}, {"id": "proposition-5-4-prime-term-m-p-x-p-x", "display": "Proposition 5.4 (Prime term M[P_X,P_X])", "status": "exact", "cluster": "proportion", "status_note": "preprint — unrefereed as of 2026-10-07; ledger item 1 tracks its fate", "chunk": "prop_alpogefurman_p2", "kind": "result", "genre": "original", "note": "Proves M[P_X,P_X] = (T/π) Σ_{n≤X} Λ(n)²/n · g(log n) + O_χ(L²X): the diagonal D gives (T/π) Σ a_n² g(y_n); O₁ ≪ L²X by Montgomery–Vaughan (Lemma 2.2); O₂ ≪ XL trivially."}, {"id": "proposition-5-5-cross-terms-l2-x", "display": "Proposition 5.5 (Cross terms ≪ L²√X)", "status": "exact", "cluster": "proportion", "status_note": "preprint — unrefereed as of 2026-10-07; ledger item 1 tracks its fate", "chunk": "prop_alpogefurman_p2", "kind": "result", "genre": "original", "note": "Proves the four cross terms M[μ,P_X], M[μ,Π_X], M[P_X,Π_X], M[Π_X,Π_X] are all ≪_χ L²√X, via integration by parts in τ′ and the sup bounds (2.4), (5.5), (5.7)."}, {"id": "lemma-5-6-window-constant-r-0-4-3-r-mt-c-mt-1", "display": "Lemma 5.6 (Window constant): R(ψ₀) = 4/3, R(ψ_MT) = c_MT^{−1}", "status": "exact", "cluster": "proportion", "status_note": "preprint — unrefereed as of 2026-10-07; ledger item 1 tracks its f lewood's lemma, and AM-GM."}, {"id": "mollifier-psi-s-sum-n-y-b-n-y-n-s-y-t-theta-0-th", "display": "Mollifier psi(s)=sum_{n<=y} b(n,y)/n^s, y=T^theta, 0<theta<1: a regular function designed to dampen the large values of zeta(s)", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "definition", "genre": "original", "note": "Mollifier defined as the Dirichlet polynomial psi(s) of length y=T^theta, 0<theta<1."}, {"id": "levinson-1974-b-n-y-mu-n-n-sigma-0-1-2-log-y-n-l", "display": "Levinson (1974): b(n,y)=mu(n)n^{sigma_0-1/2} log(y/n)/log y, theta=1/2-epsilon, Q(x)=1-x gives kappa > 1/3", "status": "conjectural", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "result", "genre": "reframed", "note": "Cited from Levinson [50]; mu-coefficient mollifier with theta=1/2-epsilon and Q(x)=1-x."}, {"id": "conrey-mollifier-b-c-n-y-mu-n-n-sigma-0-1-2-p-lo", "display": "Conrey mollifier b_C(n,y)=mu(n)n^{sigma_0-1/2}P(log(y/n)/log y) with P(0)=0, P(1)=1; theta=4/7-epsilon (Deshouillers-Iwaniec) gives kappa > 0.4088 (first 0.36581)", "status": "conjectural", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "result", "genre": "reframed", "note": "Cited from Conrey [15,16]; Deshouillers-Iwaniec [26,27] exponential sums give theta=4/7-epsilon and kappa>0.4088."}, {"id": "balasubramanian-conrey-heath-brown-vaughan-s-ide", "display": "Balasubramanian-Conrey-Heath-Brown: Vaughan's identity on 1/zeta plus Weil's bound for Kloosterman sums pushes the mollifier length past the 1/2 barrier to theta=9/17", "status": "conjectural", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "result", "genre": "reframed", "note": "Cited from Balasubramanian-Conrey-Heath-Brown [2]; Vaughan's identity plus Weil's bound for Kloosterman sums."}, {"id": "feng-s-two-piece-mollifier-psi-with-b-c-b-f-thet", "display": "Feng's two-piece mollifier psi with b_C+b_F (theta_C=4/7-epsilon, theta_F=3/7-epsilon) gives kappa > 0.4107; Pratt-Robles [58] raise theta_F to 6/11-epsilon, validating Feng's kappa > 0.4128", "status": "conjectural", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "result", "genre": "reframed", "note": "Cited from Feng [33] and Pratt-Robles [58]; Type I/II decomposition of incomplete Kloosterman sums in [58]."}, {"id": "feng-s-original-theta-f-1-2-epsilon-argument-as-", "display": "Feng's original theta_F=1/2-epsilon argument, as first written, has a gap (found in [8,48,58,60]) reducing it to 3/7 without exponential-sum work", "status": "killed", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "claim", "genre": "reframed", "note": "Paper reports the gap found in Feng's argument in [8,48,58,60], reducing admissible theta_F to 3/7 absent exponential-sum work."}, {"id": "conjecture-1-1-conrey-farmer-zirnbauer-2006-asym", "display": "Conjecture 1.1 (Conrey-Farmer-Zirnbauer 2006): asymptotics of R(alpha,beta,gamma,delta)=integral of zeta(s+alpha)zeta(1-s+beta)/(zeta(s+gamma)zeta(1-s+delta)) dt, assuming RH", "status": "conjectural", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "conjecture", "genre": "reframed", "note": "Stated as Conjecture 1.1 (Conrey-Farmer-Zirnbauer 2006); assumes RH and gives R(alpha,beta,gamma,delta) asymptotics with O(T^{1/2+epsilon}) error."}, {"id": "theorem-1-1-conrey-snaith-2007-if-conjecture-1-1", "display": "Theorem 1.1 (Conrey-Snaith 2007): if Conjecture 1.1 is true, the integral of (zeta'/zeta)(s+alpha)(zeta'/zeta)(1-s+beta) equals the stated main terms with error O(T^{1/2+epsilon})", "status": "conjectural", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "result", "genre": "reframed", "note": "Stated as Theorem 1.1 (Conrey-Snaith 2007), conditional on Conjecture 1.1; differentiation in alpha,beta of the ratios conjecture."}, {"id": "conjecture-1-2-cfkrs-2005-the-2k-th-moment-integ", "display": "Conjecture 1.2 (CFKRS 2005): the 2k-th moment integral |zeta(1/2+it)|^{2k} g(t) dt ~ integral P_k(log(t/2pi)) g(t) dt, P_k degree k^2 via 2k-fold residue with squared Vandermonde", "status": "conjectural", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "conjecture", "genre": "reframed", "note": "Stated as Conjecture 1.2 (CFKRS 2005); the paper's Theorem 7.1 is written to parallel its structure."}, {"id": "unconditional-approach-use-the-underlying-techni", "display": "Unconditional approach: use the underlying techniques and ideas behind the autocorrelation of ratios of zeta but not the conjectures themselves, since RH cannot be assumed for the kappa application", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "method", "genre": "original", "note": "Intro section 1.1 states the paper gives unconditional results by using the ideas behind the autocorrelation of ratios without assuming the conjectures themselves."}, {"id": "keating-snaith-moments-formula-integral-0-t-zeta", "display": "Keating-Snaith moments formula: integral_0^T |zeta(1/2+it)|^{2k} dt ~ a_k g_k/Gamma(k^2+1) T log^{k^2} T, with closed g_k=k^2! prod_j j!/(k+j)! and Euler product a_k", "status": "conjectural", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "conjecture", "genre": "reframed", "note": "Keating-Snaith [41,42] formula; Conrey-Ghosh [23] first conjectured g_3=42 and g_4=24024 (with Gonek)."}, {"id": "arithmetical-factor-a-alpha-beta-alpha-beta-1-th", "display": "Arithmetical factor A(alpha,beta,alpha,beta)=1; the factors A and their derivatives (prime sums) conspire to vanish or be absorbed in error, leaving only terms with arithmetical factor one", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "claim", "genre": "original", "note": "Intro section 1.2 describes the arithmetical factors and their derivatives vanishing or being absorbed in error within the paper's own combinatorial process."}, {"id": "no-random-matrix-analogue-of-mollifying-exists-n", "display": "No random matrix analogue of mollifying exists — 'nothing that naturally corresponds to a partial Dirichlet series' [25, p. 596]", "status": "heuristic", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p1", "kind": "claim", "genre": "reframed", "note": "Quoted from Conrey-Snaith [25, p. 596]; suggestive discussion, not a proved statement."}, {"id": "mollifier-s-dirichlet-polynomial-n-y-b-n-y-n-s-o", "display": "mollifier ψ(s): Dirichlet polynomial Σ_{n≤y} b(n,y)/n^s of length y=T^θ (0<θ<1) dampening large values of ζ(s) so Vψ is smaller than V", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "definition", "genre": "original", "note": "Paper's defining setup for its whole program: mollifier as a regular function damping large values of ζ(s) so Vψ is smaller than V; Dirichlet polynomial of length y=T^θ with 0<θ<1."}, {"id": "levinson-s-mollifier-1974-1-3-with-1-2-and-q-x-1", "display": "Levinson's mollifier (1974): κ>1/3 with θ=1/2-ε and Q(x)=1-x", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "result", "genre": "reframed", "note": "Literature background cited from Levinson [50]: coefficients μ(n)n^(σ0-1/2) log(y/n)/log y with θ=1/2-ε and Q(x)=1-x give κ>1/3 (1974)."}, {"id": "selberg-s-and-levinson-s-methods-are-diametrical", "display": "Selberg's and Levinson's methods are 'diametrically opposed': sign-change counting (safe, weak κ) vs Levinson's gamble (possibly negative bounds, possibly ~100% κ)", "status": "heuristic", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "claim", "genre": "reframed", "note": "Cites the Selberg-vs-Levinson comparison from [19, p.7]: Selberg counts sign changes (safe, never worse than trivial, but zeros not evenly spaced so no significant κ); Levinson is a gamble (wasteful estimates could yield negative bounds) that near-perfect mollification could open up to 100% κ."}, {"id": "conrey-s-mollifier-b-c-with-polynomial-p-p-0-0-p", "display": "Conrey's mollifier b_C with polynomial P (P(0)=0, P(1)=1), d=5, θ=1/2-ε: κ>0.36581", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "result", "genre": "reframed", "note": "Literature background from Conrey [15]: b_C(n,y)=μ(n)n^(σ0-1/2) P(log(y/n)/log y) with real polynomial P, P(0)=0, P(1)=1; with d=5 and θ=1/2-ε gives κ>0.36581 plus results on zeros of derivatives of ζ on Re(s)=1/2."}, {"id": "balasubramanian-conrey-heath-brown-vaughan-s-ide-2", "display": "Balasubramanian-Conrey-Heath-Brown: Vaughan's identity plus Weil's Kloosterman bound push θ past 1/2 to 9/17", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "result", "genre": "reframed", "note": "Literature background from Balasubramanian-Conrey-Heath-Brown [2]: Vaughan's identity on 1/ζ(s) plus Weil's bound for Kloosterman sums push θ past 1/2 to 9/17; consequences of Hooley's conjecture R* ([38]) also discussed."}, {"id": "conrey-16-deshouillers-iwaniec-exponential-sums-", "display": "Conrey [16]: Deshouillers-Iwaniec exponential sums give θ=4/7-ε and κ>0.4088", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "result", "genre": "reframed", "note": "Literature background from Conrey [16]: Deshouillers-Iwaniec [26,27] exponential-sum results give θ=4/7-ε unconditionally, yielding κ>0.4088."}, {"id": "feng-s-two-piece-mollifier-conrey-piece-b-f-with", "display": "Feng's two-piece mollifier (Conrey piece + b_F with distinct primes): θ_C=4/7-ε, θ_F=3/7-ε, κ>0.4107", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "result", "genre": "reframed", "note": "Literature background from Feng [33] (following Luo-Yao [52]): b_F built from distinct primes p_1...p_k with polynomials P_k; two-piece mollifier with θ_C=4/7-ε, θ_F=3/7-ε gives κ>0.4107."}, {"id": "bettin-chandee-radziwi-4-best-bound-for-arbitrar", "display": "Bettin-Chandee-Radziwiłł [4]: best bound for arbitrary coefficient a_n of a generic Dirichlet series is θ=17/33-ε", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "result", "genre": "reframed", "note": "Bettin-Chandee-Radziwiłł [4]: best bound for an arbitrary coefficient a_n of a generic Dirichlet series Σ_{n≤T^θ} a_n n^{-s} is θ=17/33-ε, via Bettin-Chandee [3] improvement of the Duke-Friedlander-Iwaniec [29] trilinear Kloosterman sums; Robles-Zaharescu-Roy [61] obtained θ=48/95-ε from the bilinear sums shortly after [4]."}, {"id": "bui-conrey-young-10-second-mollifier-piece-with-", "display": "Bui-Conrey-Young [10] second mollifier piece with μ_2=(μ⋆μ) and y_2=T^{1/2-ε}: κ>0.4105", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "result", "genre": "reframed", "note": "Bui-Conrey-Young [10] second mollifier piece with μ_2=(μ⋆μ), the χ(s+1/s-σ0) factor, y_2=T^{1/2-ε}: gives κ>0.4105."}, {"id": "crossing-all-mollifiers-remarked-as-technically-", "display": "crossing all mollifiers — remarked as 'technically difficult' in [33] and [10], accomplished in [60]", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "claim", "genre": "reframed", "note": "Paper notes the crossing-all-mollifiers idea was remarked in [33, p.515] and [10, p.36] as 'technically difficult' and was accomplished in [60]."}, {"id": "farmer-s-conjecture-mollifiers-of-size-1-should-", "display": "Farmer's 'θ=∞ conjecture': mollifiers of size 1-ε should produce 100% of zeros on the critical line", "status": "conjectural", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "conjecture", "genre": "reframed", "note": "Farmer's 'θ=∞ conjecture' (from [30] and [5, p.1]): mollifiers of size 1-ε should be optimal, producing 100% of zeros on the critical line."}, {"id": "bettin-gonek-5-would-imply-rh-not-just-100-via-m", "display": "Bettin-Gonek [5]: θ=∞ would imply RH (not just 100%), via Mellin transforms and Parseval", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "result", "genre": "reframed", "note": "Bettin-Gonek [5]: a very short argument with Mellin transforms and Parseval's formula shows θ=∞ would imply RH itself (not just 100%); paper notes current mollifier lengths are very far from this."}, {"id": "r-s-d-1-v-s-1-5-compute-the-mean-value-integral-", "display": "ℜ(s,d)=1/V(s) (1.5): compute the mean value integral (1.2) to any desired accuracy in the degree d", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "method", "genre": "original", "note": "The vehicle is ℜ(s,d)=1/V(s) as in (1.5); the paper states it can compute the mean-value integral (1.2) to any desired degree of accuracy in d (main target is Theorem 7.1)."}, {"id": "study-r-s-d-v-s-1-6-instead-of-1-s-v-s-leading-t", "display": "study ℜ(s,d)·V(s) (1.6) instead of (1/ζ(s))·V(s), leading to integrals of ratios of products of shifted zeta functions (G(z_1,...,z_2k))", "status": "heuristic", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "method", "genre": "original", "note": "Stated roadmap: studying ℜ(s,d)·V(s) (1.6) rather than (1/ζ(s))·V(s) leads to integrals of ratios of several products of shifted zeta functions such as G(z_1,...,z_2k) in Conjecture 1.2 (see (6.1), (7))."}, {"id": "interim-optimization-0-417293-and-0-407511-propo", "display": "interim optimization: κ>0.417293 and κ^*≥0.407511 (κ^* = proportion of simple zeros)", "status": "computationally_verified", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "result", "genre": "original", "note": "Interim optimization of the available parameters yields κ>0.417293 and κ^*≥0.407511, where κ^* denotes the proportion of simple zeros on the critical line."}, {"id": "theorem-1-2-more-than-five-twelfths-of-the-non-t", "display": "Theorem 1.2: more than five-twelfths of the non-trivial zeros of ζ are on the critical line", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "result", "genre": "original", "note": "Theorem 1.2 (the paper's headline result): more than five-twelfths (5/12≈0.4167) of the non-trivial zeros of ζ are on the critical line."}, {"id": "generalized-von-mangoldt-function-k-n-log-k-n-wi", "display": "generalized von Mangoldt function Λ_k(n)=(μ⋆log^k)(n) with ζ^{(k)}/ζ(s)=(-1)^k Σ Λ_k(n)/n^s", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "definition", "genre": "reframed", "note": "Generalized von Mangoldt function Λ_k(n):=(μ⋆log^k)(n) (see [39,59] and [13]); ζ^{(k)}/ζ(s)=(-1)^k Σ Λ_k(n)/n^s for Re(s)>1; Λ_1 is the usual von Mangoldt function."}, {"id": "2-1-k-1-n-k-n-log-n-k-n", "display": "(2.1): Λ_{k+1}(n)=Λ_k(n)log(n)+(Λ⋆Λ_k)(n)", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "claim", "genre": "original", "note": "Identity (2.1): Λ_{k+1}(n)=Λ_k(n)log(n)+(Λ⋆Λ_k)(n), derived from differentiating ζ^{(k)}/ζ(s)."}, {"id": "l-k-n-n-log-k-n-supported-on-prime-powers-n-p-l-", "display": "Λ_{L,k}(n)=Λ(n)log^k n, supported on prime powers n=p^ℓ (0 otherwise)", "status": "exact", "cluster": "proportion", "status_note": null, "chunk": "prop_przz_p2", "kind": "definition", "genre": "original", "note": "Λ_{L,k}(n):=Λ(n)log^k n, equal to ℓ^k log^{k+1}p for n=p^ℓ and 0 otherwise; vanishes off prime powers, unlike the combinatorially complicated Λ_k."}, {"id": "partition-sets-k-c-k-n-c-n-m-and-multinomial-coe", "display": "partition sets ℘(k), ℂ(k,n), ℂ^*(n,m) and multinomial coefficients", "status": "exact", "cluster": "p   for (let i=0;i<nodes.length;i++){ const a=nodes[i];
    for (let j=i+1;j<nodes.length;j++){ const b=nodes[j];
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+60, d=Math.sqrt(d2);
      const f = Math.min(8000/d2, 5);
      dx/=d; dy/=d; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
    a.vx += -a.x*0.004; a.vy += -a.y*0.004;
    const cc = clusterC[a.cluster||'misc'];
    if (cc){ a.vx += (cc.x-a.x)*0.03; a.vy += (cc.y-a.y)*0.03; }
  }
  for (const e of edges){ const a=nodeById[e.a], b=nodeById[e.b]; if(!a||!b) continue;
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
    const want = 80 + Math.min(70, a.r+b.r);
    const f = (d-want)*0.018*Math.min(3, e.w);
    dx/=d; dy/=d; a.vx+=dx*f; a.vy+=dy*f; b.vx-=dx*f; b.vy-=dy*f; }
  for (const n of nodes){ n.vx*=0.86; n.vy*=0.86;
    n.x+=Math.max(-9,Math.min(9,n.vx)); n.y+=Math.max(-9,Math.min(9,n.vy)); }
}
function visible(n){
  if (!n.subject && !document.getElementById('f-detail').checked) return false;
  if (n.status==='killed' && !document.getElementById('f-killed').checked) return false;
  if (n.status==='heuristic' && !document.getElementById('f-heur').checked) return false;
  const q = document.getElementById('q').value.trim().toLowerCase();
  if (q && !(n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q))) return false;
  return true;
}
function draw(){
  if (W >= 50){
    ctx.clearRect(0,0,W,H);
    const cx = W/2 + cam.x, cy = H/2 + cam.y, z = cam.z;
    const showAll = document.getElementById('f-edges').checked;
    const vis = nodes.filter(visible);
    const visSet = new Set(vis.map(n=>n.id));
    document.getElementById('empty').hidden = vis.length > 0;
    for (const e of edges){
      if (!visSet.has(e.a) || !visSet.has(e.b)) continue;
      const sel = selected && (e.a===selected.id || e.b===selected.id);
      if (!showAll && !sel) continue;
      const a=nodeById[e.a], b=nodeById[e.b];
      ctx.strokeStyle = sel ? 'rgba(230,237,243,.5)' : (e.rel.indexOf('cross:')===0 ? 'rgba(255,215,0,.6)' : 'rgba(139,148,158,.16)');
      ctx.lineWidth = sel ? Math.min(3, .6+e.w*.5) : 1;
      ctx.beginPath(); ctx.moveTo(cx+a.x*z, cy+a.y*z); ctx.lineTo(cx+b.x*z, cy+b.y*z); ctx.stroke();
    }
    for (const n of vis){
      const x=cx+n.x*z, y=cy+n.y*z, r=n.r*Math.sqrt(z);
      if (x<-50||y<-50||x>W+50||y>H+50) continue;
      ctx.beginPath(); ctx.arc(x,y,Math.max(1.5,r),0,6.2832);
      ctx.globalAlpha = n.subject ? .92 : .5;
      ctx.fillStyle = COLORS[n.status] || '#8b949e';
      ctx.fill(); ctx.globalAlpha = 1;
      if (n===selected || n===hover){ ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
      if (n===hover || n.r>10 || z>1.7){
        ctx.fillStyle='#e6edf3'; ctx.font='11px sans-serif'; ctx.textAlign='center';
        const t = n.label.length>36 ? n.label.slice(0,35)+'…' : n.label;
        ctx.fillText(t, x, y - r - 6);
      }
    }
  }
  requestAnimationFrame(draw);
}
// pointer: mouse + touch
let drag=null, pinch=null;
function pos(e){ const r=cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x:t.clientX-r.left, y:t.clientY-r.top }; }
function nodeAt(mx,my){
  const cx=W/2+cam.x, cy=H/2+cam.y, z=cam.z;
  for (const n of nodes){ if(!visible(n)) continue;
    const x=cx+n.x*z, y=cy+n.y*z;
    if (Math.hypot(mx-x,my-y) < n.r*Math.sqrt(z)+6) return n; }
  return null;
}
cv.addEventListener('mousedown', e=>{ drag={x:e.clientX,y:e.clientY,moved:false}; });
window.addEventListener('mousemove', e=>{
  if (drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
    cam.x+=dx; cam.y+=dy; drag.x=e.clientX; drag.y=e.clientY; }
});
window.addEventListener('mouseup', e=>{
  if (drag && !drag.moved && e.target===cv){
    const p=pos(e); select(nodeAt(p.x,p.y));
  }
  drag=null;
});
cv.addEventListener('wheel', e=>{ e.preventDefault();
  cam.z = Math.max(.3, Math.min(4, cam.z * (e.deltaY<0? 1.12 : .9))); }, {passive:false});
cv.addEventListener('touchstart', e=>{
  if (e.touches.length===1){ const p=pos(e); drag={x:p.x,y:p.y,moved:false,id:e.touches[0].identifier}; }
  else if (e.touches.length===2){ const a=e.touches[0], b=e.touches[1];
    pinch={ d:Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z:cam.z }; drag=null; }
}, {passive:true});
cv.addEventListener('touchmove', e=>{
  if (e.touches.length===1 && drag){
    const p=pos(e); const dx=p.x-drag.x, dy=p.y-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>6) drag.moved=true;
    cam.x+=dx; cam.y+=dy; drag.x=p.x; drag.y=p.y;
  } else if (e.touches.length===2 && pinch){
    const a=e.touches[0], b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if (d>0) cam.z = Math.max(.3, Math.min(4, pinch.z * d/pinch.d));
  }
  e.preventDefault();
}, {passive:false});
cv.addEventListener('touchend', e=>{
  if (drag && !drag.moved && e.changedTouches.length){
    const t=e.changedTouches[0], r=cv.getBoundingClientRect();
    select(nodeAt(t.clientX-r.left, t.clientY-r.top));
  }
  drag=null; pinch=null;
});
function pill(st){ return `<span class="pill st-${st}">${NAMES[st]||st}</span>`; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function select(n){
  selected = n;
  const d = document.getElementById('detail');
  if (!n){ d.innerHTML = '<p class="hint">Select a node to inspect its facets, notes and provenance.</p>'; return; }
  let h = `<h2 style="word-break:break-word">${esc(n.label)}</h2>`;
  h += `<div style="margin-bottom:6px">${pill(n.status)} <span class="hint">${esc(n.id)}</span></div>`;
  if (n.note) h += `<p style="font-size:12px;color:#c9d1d9"><i>merge note:</i> ${esc(n.note)}</p>`;
  if (n.killedFacets) h += `<p style="font-size:12px;color:#f85149">${n.killedFacets} killed facet(s) — see below</p>`;
  const nb = edges.filter(e=>e.a===n.id||e.b===n.id);
  if (nb.length){ h += `<p class="hint">${nb.length} relation(s):</p>`;
    nb.slice(0,24).forEach(e=>{ const o = e.a===n.id? e.b : e.a;
      const on = nodeById[o];
      h += `<div style="font-size:12px;margin:3px 0"><a href="#" data-n="${esc(o)}" style="color:#58a6ff">${esc(on?on.label:o)}</a> <span class="hint">— ${e.a===n.id? esc(e.rel)+' →' : '← '+esc(e.rel)} (×${e.w})</span></div>`; });
  }
  h += `<p class="hint" style="margin-top:10px">${n.facets.length} facet(s) · chunks: ${esc(n.chunks.join(', '))}</p>`;
  n.facets.forEach(f=>{
    h += `<div class="facet"><div class="lbl">${esc(f.label)}</div>`
      + `<div class="meta">${pill(f.status||'open')}<span class="hint">${esc(f.kind)}${f.genre?' · '+esc(f.genre):''} · ${esc(f.chunk)}${f.cid?' / '+esc(f.cid):''}</span></div>`
      + (f.note? `<div class="note">${esc(f.note)}</div>` : '') + `</div>`;
  });
  d.innerHTML = h;
  d.querySelectorAll('a[data-n]').forEach(a=>a.addEventListener('click', ev=>{
    ev.preventDefault(); const t=nodeById[a.getAttribute('data-n')]; if(t) select(t); }));
}
document.getElementById('legend').innerHTML =
  Object.keys(COLORS).map(k=>`<span class="li"><span class="dot" style="background:${COLORS[k]}"></span>${NAMES[k]}</span>`).join('')
  + `<span class="li hint">node size ∝ facet count</span>`;
(function(){
  const st = GRAPH.stats;
  const el = document.querySelector('#topbar .sub');
  el.textContent += ` · ${st.subjects} subjects · ${st.cross_edges} relations · ${GRAPH.loops.length} open loops · ${st.concepts} concepts`;
})();
document.getElementById('looplo').innerHTML = GRAPH.loops.map(l=>
  `<div class="loop"${l.node?` data-node="${esc(l.node)}" title="trace this constellation" style="cursor:pointer"`:''}><b>${esc(l.chunk)}</b> — ${esc(l.label)}</div>`).join('');
document.getElementById('looplo').addEventListener('click', e=>{
  const t = e.target.closest('[data-node]');
  if (t){ const n = nodeById[t.getAttribute('data-node')]; if (n) select(n); }
});
setInterval(tick, 30);
draw();
</script>
</body>
</html>
